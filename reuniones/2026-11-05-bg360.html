<!doctype html><html lang="es"><head><meta charset="utf-8"><title>BG360 · Maestro de proveedores</title><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0d12;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.deck{height:100%;display:flex;align-items:center;justify-content:center}
.slide{display:none;width:min(98vw,calc(98vh*16/9));aspect-ratio:16/9;background:radial-gradient(circle at 75% 45%,#123049,#0a121c 62%);border-radius:14px;overflow:hidden;position:relative;font-size:clamp(9px,1.15vw,19px);color:#fff}
.slide.activa{display:block}
.txt{position:absolute;left:6%;top:50%;transform:translateY(-50%);max-width:40%;z-index:3}
.etq{font-size:.8em;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#7dd3fc}
h1{font-size:3.8em;line-height:1.02;letter-spacing:-.02em;margin:.25em 0 .4em}
h1 span{color:#7dd3fc}
p{font-size:1.2em;color:#cfe3f1;line-height:1.4}
.pasos{display:flex;flex-wrap:wrap;gap:.45em;margin-top:1.4em;align-items:center}
.pasos span{border:1px solid rgba(255,255,255,.35);border-radius:.4em;padding:.3em .7em;font-size:.9em;background:rgba(255,255,255,.06)}
.pasos b{color:#7dd3fc}
.fase{display:inline-block;margin-top:1.5em;background:#7dd3fc;color:#082032;font-weight:800;border-radius:.35em;padding:.45em 1em;text-transform:uppercase;letter-spacing:.06em;font-size:.85em}
.fotos{position:absolute;left:46%;right:3%;top:8%;bottom:8%}
.fotos img{position:absolute;border-radius:.6em;box-shadow:0 30px 60px -18px rgba(0,0,0,.85);border:1px solid #1f3a52}
.f1{left:0;top:0;width:74%}
.f2{right:0;top:34%;width:56%}
.f3{left:8%;bottom:0;width:52%}
.navx{position:fixed;bottom:10px;right:14px;color:#64748b;font-size:12px}
</style></head><body><div class="deck">
<section class="slide activa">
  <div class="txt">
    <div class="etq">Próximo proyecto · BG360</div>
    <h1>Maestro de <span>proveedores</span></h1>
    <p>El proveedor se inscribe solo con un enlace, sube sus documentos y firma el Sagrilaft. La solicitud pasa por cuatro aprobaciones hasta crear el tercero en BG360.</p>
    <div class="pasos"><span>Responsable</span><b>→</b><span>Auditoría</span><b>→</b><span>Financiera</span><b>→</b><span>Contabilidad</span></div>
    <div class="fase">Maqueta lista para aprobar</div>
  </div>
  <div class="fotos">
    <img class="f1" src="img-bg360/bg_panel.jpg">
    <img class="f3" src="img-bg360/bg_ficha.jpg">
    <img class="f2" src="img-bg360/bg_portal.jpg">
  </div>
</section>
</div><div class="navx"></div></body></html>
