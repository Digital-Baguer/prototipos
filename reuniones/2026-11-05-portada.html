<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Revisión de proyectos</title><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0d12;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.deck{height:100%;display:flex;align-items:center;justify-content:center}
.slide{display:none;width:min(98vw,calc(98vh*16/9));aspect-ratio:16/9;background:#0b0d12;border-radius:14px;overflow:hidden;position:relative;font-size:clamp(9px,1.15vw,19px);color:#fff}
.slide.activa{display:block}
.mosaico{position:absolute;inset:-6%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:.6em;transform:rotate(-6deg) scale(1.12);opacity:.5}
.mosaico img{width:100%;height:100%;object-fit:cover;object-position:top left;border-radius:.6em}
.velo{position:absolute;inset:0;background:linear-gradient(90deg,#0b0d12 30%,rgba(11,13,18,.75) 58%,rgba(11,13,18,.2))}
.txt{position:absolute;left:6%;top:50%;transform:translateY(-50%);max-width:52%}
.etq{font-size:.8em;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#a5b4fc}
h1{font-size:4.6em;line-height:1;letter-spacing:-.03em;margin:.25em 0 .35em}
p{font-size:1.3em;color:#cbd5e1}
.lista{display:flex;flex-wrap:wrap;gap:.5em;margin-top:1.6em}
.lista span{border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:.3em .9em;font-size:.95em;background:rgba(255,255,255,.06)}
.autor{margin-top:2em;color:#94a3b8;font-size:1em}
.navx{position:fixed;bottom:10px;right:14px;color:#64748b;font-size:12px}
</style></head><body><div class="deck">
<section class="slide portada activa">
  <div class="mosaico">
    <img src="img-app-quac/IMG_1300.jpg"><img src="img-get/portada_1.jpg"><img src="img-sireq/s_1_57_14.jpg"><img src="img-groggy/g_index_m.jpg">
    <img src="img-sireq/s_1_56_24.jpg"><img src="img-app-quac/IMG_1309.jpg"><img src="img-get/portada_2.jpg"><img src="img-sireq/s_1_59_55.jpg">
    <img src="img-get/erp_1.jpg"><img src="img-groggy/g_index_d.jpg"><img src="img-sireq/tr_lista.jpg"><img src="img-bg360/bg_panel.jpg">
  </div>
  <div class="velo"></div>
  <div class="txt">
    <div class="etq">Revisión de proyectos · noviembre 2026</div>
    <h1>Proyectos en curso</h1>
    <p>Qué estamos construyendo, en qué va cada proyecto y qué sigue</p>
    <div class="lista"><span>App Quac 4.0</span><span>Groggy</span><span>Chatbot de ventas</span><span>GET</span><span>SIREQ</span><span>Jurídico</span><span>BG360</span><span>Marco IA</span></div>
    <div class="autor">Francisco Lizcano</div>
  </div>
</section>
</div><div class="navx"></div></body></html>
