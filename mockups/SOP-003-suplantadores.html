function ic(n, c) { return '<svg class="' + (c || 'h-4 w-4') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (ICONOS[n] || '') + '</svg>'; }
function pintarIconos(raiz) { (raiz || document).querySelectorAll('i[data-i]').forEach(function (el) { el.outerHTML = ic(el.dataset.i, el.className); }); }

/* Paleta de chips: gris neutro, esmeralda positivo, negro en curso, rosa bloqueante (sin ámbar). */
const CHIP = {
  gris: 'bg-gray-100 text-gray-700',
  grisSuave: 'bg-gray-100 text-gray-500',
  esmeralda: 'bg-emerald-100 text-emerald-700',
  negro: 'bg-gray-900 text-white',
  rosa: 'bg-rose-100 text-rose-700',
};
function chip(texto, color, icono) {
  return '<span class="inline-flex items-center gap-1 whitespace-nowrap rounded px-2 py-0.5 text-xs font-medium ' + CHIP[color] + '">' + (icono ? ic(icono, 'h-3 w-3') : '') + texto + '</span>';
}
function uuid(semilla) {
  let t = (semilla * 2654435761) >>> 0, s = '';
  for (let i = 0; i < 32; i++) { t = (t + 0x6D2B79F5) >>> 0; let r = Math.imul(t ^ (t >>> 15), 1 | t); r ^= r + Math.imul(r ^ (r >>> 7), 61 | r); s += (((r ^ (r >>> 14)) >>> 0) % 16).toString(16); }
  return s.slice(0, 8) + '-' + s.slice(8, 12) + '-4' + s.slice(13, 16) + '-a' + s.slice(17, 20) + '-' + s.slice(20, 32);
}
function formatearCedula(n) {
  const s = String(n);
  let out = '';
  for (let i = 0; i < s.length; i++) { if (i > 0 && (s.length - i) % 3 === 0) out += '.'; out += s[i]; }
  return out;
}
function dosDig(n) { return String(n).padStart(2, '0'); }
function formatearFecha(d) { return dosDig(d.getDate()) + '/' + dosDig(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + dosDig(d.getHours()) + ':' + dosDig(d.getMinutes()); }

/* ───────────── Silueta de rostro (sin imágenes externas: degradado + SVG) ───────────── */
function colorFondo(semilla) {
  const hue = (semilla * 47) % 360;
  return 'background:linear-gradient(135deg, hsl(' + hue + ' 70% 55%), hsl(' + ((hue + 40) % 360) + ' 65% 38%));';
}
function siluetaRostro(clase) {
  return '<svg class="' + (clase || 'h-14 w-14') + ' text-white/85" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8.3" r="4.3"/><path d="M3.5 21c0-4.7 3.8-7.4 8.5-7.4s8.5 2.7 8.5 7.4"/></svg>';
}
function avatarRostro(semilla, alto) {
  return '<div class="relative flex w-full items-center justify-center overflow-hidden rounded-md ' + (alto || 'h-36') + '" style="' + colorFondo(semilla) + '">' + siluetaRostro('h-14 w-14') + '</div>';
}

/* ───────────── Datos de ejemplo (inventados; formato de fraud_identity_photos / fraud_identity_customers) ───────────── */
const HOY = new Date(2026, 10, 4, 16, 19); // 4-nov-2026 16:19
function fechaDemo(offsetHoras) { return new Date(HOY.getTime() - offsetHoras * 3600000); }

function generarGrupos() {
  const total = 529, lista = [];
  for (let i = 0; i < total; i++) {
    const id = uuid(i * 3 + 11);
    const esMultiFoto = i < 109; // D13: 109 grupos con 2-5 fotos
    const numFotos = esMultiFoto ? 2 + (i % 4) : 1;
    const origen = (i % 7 === 0) ? 'activacion' : 'manual';
    const numCedulas = origen === 'activacion' ? 1 : (esMultiFoto ? 1 + (i % 3) : 1);
    const cedulas = [];
    for (let c = 0; c < numCedulas; c++) {
      const h = ((((i + 1) * 2654435761) >>> 0) ^ (((c + 1) * 40503719) >>> 0)) >>> 0;
      cedulas.push(1000000000 + (h % 900000000));
    }
    const fotos = [];
    for (let f = 0; f < numFotos; f++) {
      const foOrigen = (origen === 'activacion' && f === 0) ? 'activacion' : (origen === 'activacion' ? 'manual' : 'manual');
      fotos.push({
        fecha: fechaDemo(i * 6 + f * 30 + 2),
        origen: foOrigen,
        sesionRef: foOrigen === 'activacion' ? uuid(i * 13 + f) : null,
      });
    }
    const ultimaFecha = fotos.reduce((m, x) => x.fecha > m ? x.fecha : m, fotos[0].fecha);
    lista.push({ id, numFotos, cedulas, origen, ultimaFecha, fotos, semilla: i });
  }
  return lista.sort((a, b) => b.ultimaFecha - a.ultimaFecha);
}
let GRUPOS = generarGrupos();

/* ───────────── Pantalla 1: Listado ───────────── */
function grupoFiltrado(g, texto, origen) {
  if (origen !== 'todos' && g.origen !== origen) return false;
  if (!texto) return true;
  const t = texto.replace(/\./g, '').toLowerCase();
  if (g.id.slice(0, 8).toLowerCase().includes(texto.toLowerCase().replace('#', ''))) return true;
  return g.cedulas.some(c => String(c).includes(t));
}
function listaFiltrada() {
  return GRUPOS.filter(g => grupoFiltrado(g, S.busqueda.trim(), S.origenFiltro));
}

function tarjetaGrupo(g) {
  const chipOrigen = g.origen === 'activacion'
    ? chip('Activación', 'negro')
    : chip('Manual', 'gris');
  let h = '<div class="flex h-full flex-col rounded-lg border border-gray-200 bg-white p-3">';
  h += '<button type="button" data-ver-grupo="' + g.id + '" class="block">' + avatarRostro(g.semilla) + '</button>';
  h += '<div class="mt-2.5 flex items-center justify-between gap-2"><span class="text-sm font-medium text-gray-900">' + g.numFotos + ' foto' + (g.numFotos > 1 ? 's' : '') + '</span>' + chipOrigen + '</div>';
  h += '<div class="mt-2 flex flex-wrap gap-1">' + g.cedulas.map(c => chip(formatearCedula(c), 'gris')).join('') + '</div>';
  h += '<div class="mt-2 mb-3 text-xs text-gray-500">Último registro: <span class="tabular-nums">' + formatearFecha(g.ultimaFecha) + '</span></div>';
  if (g.origen === 'activacion') h += '<button type="button" data-ver-sesion class="-mt-2 mb-3 self-start text-xs text-gray-700 underline underline-offset-2">Ver sesión</button>';
  h += '<button type="button" data-ver-grupo="' + g.id + '" class="mt-auto inline-flex h-8 w-full items-center justify-center rounded-md border bg-white text-sm font-medium shadow-sm hover:bg-accent">Ver</button>';
  h += '</div>';
  return h;
}

function esqueletoGrupo() {
  return '<div class="flex flex-col rounded-lg border border-gray-200 bg-white p-3">' +
    '<div class="esqueleto h-36 w-full rounded-md bg-gray-200"></div>' +

function vistaListado() {
  let h = notasMockup();
  h += '<div class="flex items-start justify-between gap-4"><div><h1 class="!mb-0 text-xl font-semibold text-gray-900">Suplantadores</h1>' +
    '<p class="mt-1 text-sm text-gray-500">529 rostros registrados · 670 fotos · 109 rostros con más de una foto</p></div>' +
    '<div class="flex items-center gap-3">' + interruptor() + botonesAcciones() + '</div></div>';

  h += '<div class="flex flex-wrap items-center gap-3 rounded-lg border border-gray-200 bg-white p-3">' +
    '<label class="relative w-[360px]">' + ic('search', 'pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-gray-400') +

    ['todos', 'manual', 'activacion'].map(v => '<option value="' + v + '" ' + (S.origenFiltro === v ? 'selected' : '') + '>' + (v === 'todos' ? 'Todos' : v === 'manual' ? 'Manual' : 'Activación') + '</option>').join('') +
    '</select></div></div>';

  if (S.estadoListado === 'cargando') {
    h += '<div class="grid grid-cols-5 gap-4">' + Array.from({ length: 10 }).map(esqueletoGrupo).join('') + '</div>';
    return h;
  }

  const filtrados = listaFiltrada();
  if (S.estadoListado === 'vacio' || filtrados.length === 0) {
    h += '<div class="flex flex-col items-center gap-2 rounded-lg border border-dashed border-gray-300 bg-white py-16 text-center">' +
      ic('search', 'h-8 w-8 text-gray-300') + '<p class="text-sm font-medium text-gray-700">No hay rostros con esa cédula</p>' +
      '<p class="text-sm text-gray-500">Revisa el número o quita el filtro de origen.</p></div>';
    return h;
  }

  const porPagina = 20, totalPaginas = Math.max(1, Math.ceil(filtrados.length / porPagina));
  const pagina = Math.min(S.pagina, totalPaginas);
  const desde = (pagina - 1) * porPagina, pageItems = filtrados.slice(desde, desde + porPagina);

  h += '<div class="grid grid-cols-5 gap-4">' + pageItems.map(tarjetaGrupo).join('') + '</div>';
  h += '<div class="flex items-center justify-between text-sm text-gray-500">' +
    '<span>Mostrando ' + (desde + 1) + '–' + Math.min(desde + porPagina, filtrados.length) + ' de ' + filtrados.length + '</span>' +
    '<div class="flex items-center gap-1">' +
    '<button type="button" data-pagina="anterior" ' + (pagina <= 1 ? 'disabled' : '') + ' class="inline-flex h-8 items-center rounded-md border bg-white px-3 disabled:opacity-40">Anterior</button>' +
    '<span class="px-2 tabular-nums">' + pagina + ' / ' + totalPaginas + '</span>' +
    '<button type="button" data-pagina="siguiente" ' + (pagina >= totalPaginas ? 'disabled' : '') + ' class="inline-flex h-8 items-center rounded-md border bg-white px-3 disabled:opacity-40">Siguiente</button>' +
    '</div></div>';
  return h;

      '<span class="text-gray-800">¿Quitar la cédula ' + formatearCedula(cedula) + ' de este rostro?</span>' +

      '<button type="button" data-cancelar-desligar class="inline-flex h-8 items-center rounded-md border bg-white px-3 text-xs text-gray-700 hover:bg-gray-50">Cancelar</button>' +
      '</div></div>';
  }
  return '<div class="flex items-center justify-between gap-3 rounded-md border border-gray-200 bg-white px-3 py-2 text-sm">' +
    '<span class="tabular-nums text-gray-800">' + formatearCedula(cedula) + '</span>' +
    (S.permisoGestionar ? '<button type="button" data-desligar="' + cedula + '" class="inline-flex items-center gap-1 text-xs font-medium text-gray-600 underline underline-offset-2 hover:text-gray-900">' + ic('user-x', 'h-3.5 w-3.5') + 'Desligar</button>' : '') +
    '</div>';
}

function tarjetaFoto(g, foto, idx) {

  h += avatarRostro(g.semilla * 13 + idx, 'h-32');
  h += '<div class="flex items-center justify-between gap-2">' + origenTxt + '<span class="text-xs tabular-nums text-gray-500">' + formatearFecha(foto.fecha) + '</span></div>';
  if (foto.origen === 'activacion') h += '<button type="button" data-ver-sesion class="self-start text-xs text-gray-700 underline underline-offset-2">Ver sesión</button>';
  if (S.confirmarBorrarFoto === idx) {
    h += '<div class="rounded-md border border-rose-200 bg-rose-50 p-2 text-xs text-rose-700">Se quita de la colección de reconocimiento y se borra con sus cédulas. La imagen guardada se conserva.' +
      '<div class="mt-2 flex gap-2"><button type="button" data-confirmar-borrar-foto="' + idx + '" class="inline-flex h-7 items-center rounded-md bg-rose-600 px-2.5 text-xs font-medium text-white hover:bg-rose-700">Confirmar</button>' +

  } else if (S.permisoGestionar) {
    h += '<button type="button" data-borrar-foto="' + idx + '" class="inline-flex items-center justify-center gap-1.5 self-start text-xs font-medium text-rose-600 underline underline-offset-2 hover:text-rose-700">' + ic('trash-2', 'h-3.5 w-3.5') + 'Borrar foto</button>';
  }
  h += '</div>';
  return h;

    '<button type="button" data-ir-listado class="inline-flex h-8 items-center gap-1.5 rounded-md px-2 text-sm font-medium hover:bg-accent">' + ic('arrow-left', 'h-4 w-4') + 'Volver</button>' +
    '<h1 class="!mb-0 text-xl font-semibold text-gray-900">Rostro #' + g.id.slice(0, 8) + '</h1>' +

  h += '<div class="rounded-lg border border-gray-200 bg-white p-4"><h2 class="!mb-3 text-base font-semibold text-gray-900">Fotos (' + g.fotos.length + ')</h2>' +
    '<div class="grid grid-cols-5 gap-3">' + g.fotos.map((f, i) => tarjetaFoto(g, f, i)).join('') + '</div></div>';

  h += '<div class="rounded-lg border border-gray-200 bg-white p-4"><h2 class="!mb-3 text-base font-semibold text-gray-900">Cédulas ligadas (' + g.cedulas.length + ')</h2>' +
    (g.cedulas.length ? '<div class="flex flex-col gap-2">' + g.cedulas.map(c => filaCedula(g, c)).join('') + '</div>' : '<p class="text-sm text-gray-500">Sin cédulas ligadas.</p>') + '</div>';

  h += '<div class="rounded-lg border border-gray-200 bg-white p-4"><h2 class="!mb-3 flex items-center gap-2 text-base font-semibold text-gray-900">' + ic('clock', 'h-4 w-4 text-gray-400') + 'Historial</h2>' +

  return h;

  h += '<div><label class="mb-1 block text-sm font-medium text-gray-700">Cédula</label>' +
    '<input id="r-cedula" type="text" inputmode="numeric" placeholder="Ej: 1098765432" value="' + r.cedula + '" class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm' + (r.errorCedula ? ' border-rose-400' : '') + '">' +
    (r.errorCedula ? '<p class="mt-1 text-sm text-rose-600">La cédula debe tener entre 6 y 15 números.</p>' : '') + '</div>';

  h += '<div><label class="mb-1 block text-sm font-medium text-gray-700">Foto</label>';
  if (r.previewUrl) {
    h += '<div class="flex items-center gap-3"><img src="' + r.previewUrl + '" class="h-24 w-24 rounded-md border border-gray-200 object-cover" alt="Vista previa">' +
      '<div class="text-sm text-gray-600"><p class="font-medium text-gray-800">' + r.archivo.name + '</p><p>' + (r.archivo.size / 1024 / 1024).toFixed(1) + ' MB</p>' +
      '<button type="button" data-quitar-foto-registrar class="mt-1 text-xs text-gray-600 underline underline-offset-2">Quitar</button></div></div>';
  } else {
    h += '<label class="flex h-28 cursor-pointer flex-col items-center justify-center gap-1.5 rounded-md border border-dashed border-gray-300 bg-gray-50 text-sm text-gray-500 hover:bg-gray-100">' +
      ic('upload', 'h-5 w-5 text-gray-400') + '<span>Subir foto (jpg, png o webp, hasta 5 MB)</span>' +
      '<input id="r-foto" type="file" accept="image/jpeg,image/png,image/webp" class="hidden"></label>';
  }
  if (r.errorArchivo) h += '<p class="mt-1 text-sm text-rose-600">' + r.errorArchivo + '</p>';
  h += '</div>';

  if (r.resultado) {
    const res = r.resultado;
    if (res.tipo === 'nueva') h += '<div class="flex items-center gap-2 rounded-lg border border-emerald-200 bg-emerald-50 p-3 text-sm text-emerald-800">' + ic('check', 'h-4 w-4 shrink-0') + 'Rostro registrado y cédula ligada.</div>';
    if (res.tipo === 'existe') h += '<div class="flex items-start gap-2 rounded-lg border border-emerald-200 bg-emerald-50 p-3 text-sm text-emerald-800">' + ic('check', 'mt-0.5 h-4 w-4 shrink-0') +
      '<span>Este rostro ya está registrado (grupo #' + GRUPO_COINCIDENCIA_ID.slice(0, 8) + '). Se ligó la cédula ' + formatearCedula(res.cedula) + '. <button type="button" data-ver-grupo="' + GRUPO_COINCIDENCIA_ID + '" class="font-medium underline underline-offset-2">Ver el grupo</button></span></div>';
    if (res.tipo === 'ya_ligada') h += '<div class="flex items-center gap-2 rounded-lg border border-gray-200 bg-gray-50 p-3 text-sm text-gray-700">' + ic('info', 'h-4 w-4 shrink-0 text-gray-400') + 'Nada que hacer: esa cédula ya estaba ligada a este rostro.</div>';
    if (res.tipo === 'error') h += '<div class="flex items-center gap-2 rounded-lg border border-rose-200 bg-rose-50 p-3 text-sm text-rose-700">' + ic('triangle-alert', 'h-4 w-4 shrink-0') + 'El servicio de reconocimiento no respondió. No se registró nada.</div>';
  }

  h += '<button id="btn-registrar" type="button" class="inline-flex h-11 w-full items-center justify-center gap-2 rounded-md bg-primary px-4 text-sm font-medium text-primary-foreground shadow-sm hover:bg-primary/90 disabled:opacity-50" ' + (r.estado === 'buscando' ? 'disabled' : '') + '>' +
    (r.estado === 'buscando' ? ic('loader', 'girar h-4 w-4') + 'Buscando el rostro…' : 'Registrar') + '</button>';
  h += '</div>';
  return h;
}
/* ───────────── Pantalla 4: Validar foto ───────────── */
function cuerpoValidar() {
  const v = S.validar;
  let h = '<div><h2 class="text-lg font-semibold text-gray-900">Validar foto</h2>' +
    '<p class="mt-1 text-sm text-gray-500">Solo consulta la base de rostros; validar no registra nada.</p></div>';

  h += '<div class="mt-4 space-y-4">';
  h += '<div><label class="mb-1 block text-sm font-medium text-gray-700">Foto</label>';
  if (v.previewUrl) {
    h += '<div class="flex items-center gap-3"><img src="' + v.previewUrl + '" class="h-24 w-24 rounded-md border border-gray-200 object-cover" alt="Vista previa">' +
      '<div class="text-sm text-gray-600"><p class="font-medium text-gray-800">' + v.archivo.name + '</p>' +
      '<button type="button" data-quitar-foto-validar class="mt-1 text-xs text-gray-600 underline underline-offset-2">Quitar</button></div></div>';
  } else {
    h += '<label class="flex h-28 cursor-pointer flex-col items-center justify-center gap-1.5 rounded-md border border-dashed border-gray-300 bg-gray-50 text-sm text-gray-500 hover:bg-gray-100">' +
      ic('upload', 'h-5 w-5 text-gray-400') + '<span>Subir foto (jpg, png o webp, hasta 5 MB)</span>' +
      '<input id="v-foto" type="file" accept="image/jpeg,image/png,image/webp" class="hidden"></label>';
  }
  h += '</div>';

  h += '<div class="max-w-[220px]"><label class="mb-1 block text-sm font-medium text-gray-700">Parecido mínimo</label>' +
    '<input id="v-umbral" type="number" min="50" max="99" value="' + v.umbral + '" class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm">' +
    '<p class="mt-1 text-xs text-gray-500">A mayor valor, más exigente.</p></div>';

  h += '<button id="btn-validar" type="button" class="inline-flex h-11 w-full items-center justify-center gap-2 rounded-md bg-primary px-4 text-sm font-medium text-primary-foreground shadow-sm hover:bg-primary/90 disabled:opacity-50" ' + (v.estado === 'validando' ? 'disabled' : '') + '>' +
    (v.estado === 'validando' ? ic('loader', 'girar h-4 w-4') + 'Buscando coincidencias…' : 'Validar') + '</button>';
  h += '</div>';

  if (v.resultado) {
    const g = GRUPO_OBJ();
    if (v.resultado.tipo === 'coincide') {
      h += '<div class="mt-5 rounded-lg border border-rose-200 bg-rose-50/40 p-4">' +
        '<div class="mb-3 flex items-center justify-between"><h3 class="text-sm font-semibold text-gray-900">Resultado</h3>' + chip('Suplantador detectado · ' + v.resultado.porcentaje + '% de parecido', 'rosa') + '</div>' +
        '<div class="grid grid-cols-2 gap-4">' +
        '<div><p class="mb-1 text-xs font-medium text-gray-500">Foto cargada</p><img src="' + v.previewUrl + '" class="h-40 w-full rounded-md border border-gray-200 object-cover" alt="Foto cargada"></div>' +
        '<div><p class="mb-1 text-xs font-medium text-gray-500">Rostro registrado</p>' + avatarRostro(g.semilla, 'h-40') + '</div>' +
        '</div>' +
        '<div class="mt-3 flex items-center justify-between gap-3"><div class="flex flex-wrap gap-1">' + g.cedulas.map(c => chip(formatearCedula(c), 'gris')).join('') + '</div>' +
        '<button type="button" data-ver-grupo="' + g.id + '" class="inline-flex h-9 shrink-0 items-center rounded-md border bg-white px-3 text-sm font-medium shadow-sm hover:bg-accent">Ver grupo</button></div>' +
        '</div>';
    } else {
      h += '<div class="mt-5 rounded-lg border border-emerald-200 bg-emerald-50 p-4 text-sm text-emerald-800">' +
        'No hay coincidencias por encima de ' + v.umbral + '% de parecido.</div>';
    }
  }
  return h;
}
function GRUPO_OBJ() { return GRUPOS.find(g => g.id === GRUPO_COINCIDENCIA_ID); }

/* ───────────── Panel de estados del mockup ───────────── */
function panelEstados() {
  const b = (attr, val, txt, on) => '<button data-' + attr + '="' + val + '" class="p-btn ' + (on ? 'on' : '') + '">' + txt + '</button>';
  let h = '<div><p class="mb-1 text-[10px] uppercase tracking-wide text-neutral-500">Ambiente</p><div class="flex flex-wrap gap-1">' +
    b('ambiente', 'prod', 'Producción', S.ambiente === 'prod') + b('ambiente', 'pruebas', 'Pruebas', S.ambiente === 'pruebas') + '</div></div>';
  if (S.ambiente === 'pruebas') {
    h += '<div><p class="mb-1 text-[10px] uppercase tracking-wide text-neutral-500">Servicio de rostros en Pruebas</p><div class="flex flex-wrap gap-1">' +
      b('servicio-pruebas', 'si', 'Configurado', S.servicioPruebasConfigurado) + b('servicio-pruebas', 'no', 'Sin configurar', !S.servicioPruebasConfigurado) + '</div></div>';
  }
  h += '<div><p class="mb-1 text-[10px] uppercase tracking-wide text-neutral-500">Permiso «gestionar»</p><div class="flex flex-wrap gap-1">' +
    b('permiso', 'si', 'Lo tiene', S.permisoGestionar) + b('permiso', 'no', 'Solo «ver»', !S.permisoGestionar) + '</div></div>';
  h += '<div><p class="mb-1 text-[10px] uppercase tracking-wide text-neutral-500">Permiso «cambiar ambiente»</p><div class="flex flex-wrap gap-1">' +
    b('permiso-ambiente', 'si', 'Lo tiene', S.permisoCambiarAmbiente) + b('permiso-ambiente', 'no', 'No lo tiene', !S.permisoCambiarAmbiente) + '</div></div>';

  if (S.tab === 'listado') {
    h += '<div><p class="mb-1 text-[10px] uppercase tracking-wide text-neutral-500">Listado</p><div class="flex flex-wrap gap-1">' +
      b('estado-listado', 'resultados', 'Con resultados', S.estadoListado === 'resultados') + b('estado-listado', 'cargando', 'Cargando', S.estadoListado === 'cargando') + b('estado-listado', 'vacio', 'Vacío', S.estadoListado === 'vacio') + '</div></div>';
  }
  if (S.tab === 'registrar') {
    h += '<div><p class="mb-1 text-[10px] uppercase tracking-wide text-neutral-500">Al registrar, resultado</p><div class="flex flex-wrap gap-1">' +
      b('resultado-registrar', 'nueva', 'Cara nueva', S.registrarResultadoSiguiente === 'nueva') +
      b('resultado-registrar', 'existe', 'Ya existe', S.registrarResultadoSiguiente === 'existe') +
      b('resultado-registrar', 'ya_ligada', 'Cédula ya ligada', S.registrarResultadoSiguiente === 'ya_ligada') +
      b('resultado-registrar', 'error', 'Error del servicio', S.registrarResultadoSiguiente === 'error') + '</div></div>';
  }
  if (S.tab === 'validar') {
    h += '<div><p class="mb-1 text-[10px] uppercase tracking-wide text-neutral-500">Al validar, resultado</p><div class="flex flex-wrap gap-1">' +
      b('resultado-validar', 'coincide', 'Coincide', S.validarResultadoSiguiente === 'coincide') + b('resultado-validar', 'sin_coincidencia', 'Sin coincidencia', S.validarResultadoSiguiente === 'sin_coincidencia') + '</div></div>';
  }
  return h;
}

/* ───────────── Toast ───────────── */
function toast(titulo, texto, tipo) {
  const c = tipo === 'rosa' ? 'border-rose-200 bg-rose-50 text-rose-900' : 'border-emerald-200 bg-emerald-50 text-emerald-900';
  const el = document.createElement('div');
  el.className = 'toast-in rounded-md border p-3 text-sm shadow-md ' + c;
  el.innerHTML = '<div class="font-semibold">' + titulo + '</div><div class="mt-0.5">' + texto + '</div>';
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3400);
}

/* ───────────── Render ───────────── */
function irTab(t) {
  S.tab = t;
  if (t === 'detalle' && !S.grupoActivoId) S.grupoActivoId = (typeof GRUPOS !== 'undefined' && GRUPOS.length) ? String(GRUPOS[0].id) : S.grupoActivoId;
  if (t === 'detalle' && !S.grupoActivoId) S.tab = 'listado';
  render();
}
function render() {
  const t = TABS.find(x => x[0] === S.tab);
  document.getElementById('titulo-flujo').textContent = t[1];
  document.getElementById('nota-flujo').textContent = t[2];
  document.getElementById('tabs').innerHTML = TABS.map(([k, txt]) => '<button data-tab="' + k + '" class="rounded-t-md px-3 py-1.5 ' + (S.tab === k ? 'bg-white font-semibold text-slate-900' : 'text-slate-300 hover:bg-slate-800') + '">' + txt + '</button>').join('');
  document.getElementById('franja').innerHTML = franja();
  document.getElementById('lateral').innerHTML = lateral();
  document.getElementById('panel-grupo-lateral').innerHTML = panelGrupoLateral();
  document.getElementById('migas').innerHTML = migas();
  // El fondo siempre es el listado o el detalle; registrar/validar se abren como modal encima.
  document.getElementById('pagina').innerHTML = S.tab === 'detalle' ? vistaDetalle() : vistaListado();
  const modal = document.getElementById('modal');
  if (S.tab === 'registrar' || S.tab === 'validar') {
    document.getElementById('modal-cuerpo').innerHTML = S.tab === 'registrar' ? cuerpoRegistrar() : cuerpoValidar();
    modal.classList.remove('hidden'); modal.classList.add('flex');
  } else {
    modal.classList.add('hidden'); modal.classList.remove('flex');
  }
  document.getElementById('panel-cuerpo').innerHTML = panelEstados();
  history.replaceState(null, '', '#/quac/validacion-fotos/suplantadores/' + S.tab);
  pintarIconos(document);
}

/* ───────────── Acciones ───────────── */
function registrarSuplantador() {
  const r = S.registrar;
  r.estado = 'buscando'; r.resultado = null; render();
  setTimeout(() => {
    r.estado = 'idle';
    const tipo = S.registrarResultadoSiguiente;
    if (tipo === 'error') { r.resultado = { tipo: 'error' }; return render(); }
    if (tipo === 'existe') {
      const g = GRUPO_OBJ();
      if (!g.cedulas.includes(+r.cedula)) g.cedulas.push(+r.cedula);
      r.resultado = { tipo: 'existe', cedula: r.cedula };
      return render();
    }
    if (tipo === 'ya_ligada') { r.resultado = { tipo: 'ya_ligada' }; return render(); }
    // nueva
    const nuevoId = uuid(Date.now() % 100000);
    GRUPOS.unshift({ id: nuevoId, numFotos: 1, cedulas: [+r.cedula], origen: 'manual', ultimaFecha: new Date(), fotos: [{ fecha: new Date(), origen: 'manual', sesionRef: null }], semilla: GRUPOS.length + 7 });
    r.resultado = { tipo: 'nueva' };
    render();
  }, 900);
}
function validarFoto() {
  const v = S.validar;
  v.estado = 'validando'; v.resultado = null; render();
  setTimeout(() => {
    v.estado = 'idle';
    if (S.validarResultadoSiguiente === 'sin_coincidencia') v.resultado = { tipo: 'sin_coincidencia' };
    else v.resultado = { tipo: 'coincide', porcentaje: 91 };
    render();
  }, 900);
}

/* ───────────── Eventos ───────────── */
document.addEventListener('click', e => {
  const el = sel => e.target.closest(sel);
  let x;
  if ((x = el('[data-tab]'))) return irTab(x.dataset.tab);
  if ((x = el('[data-cerrar-modal]')) || e.target.id === 'modal') { S.tab = S.grupoActivoId ? 'detalle' : 'listado'; return render(); }
  if ((x = el('[data-grupo-lateral]'))) { S.panelGrupoLateral = !S.panelGrupoLateral; return render(); }
  if ((x = el('[data-cerrar-grupo-lateral]'))) { S.panelGrupoLateral = false; return render(); }
  if ((x = el('[data-ir-listado]'))) { S.panelGrupoLateral = false; S.tab = 'listado'; return render(); }
  if ((x = el('[data-ir-registrar]'))) { S.tab = 'registrar'; return render(); }
  if ((x = el('[data-ir-validar]'))) { S.tab = 'validar'; return render(); }
  if ((x = el('[data-ver-grupo]'))) { S.grupoActivoId = x.dataset.verGrupo; S.tab = 'detalle'; S.confirmarDesligar = null; S.confirmarBorrarFoto = null; return render(); }
  if ((x = el('[data-ver-sesion]'))) { return toast('Fuera de este mockup', 'Esto abriría el detalle de la sesión en Gestión de fotos (D12: no se registra suplantador desde ahí en este REQ).'); }

  if ((x = el('[data-ambiente]'))) {
    const v = x.dataset.ambiente; if (v === S.ambiente) return;
    S.ambiente = v;
    render();
    return v === 'pruebas' ? toast('Cambiaste a Pruebas', 'El listado, registrar y validar leen la base y el servicio de Pruebas hasta que cierres sesión.', 'rosa') : toast('Volviste a Producción', 'Ves de nuevo los rostros reales.');
  }

  // Listado
  if ((x = el('[data-pagina]'))) {
    const filtrados = listaFiltrada(), totalPaginas = Math.max(1, Math.ceil(filtrados.length / 20));
    if (x.dataset.pagina === 'siguiente') S.pagina = Math.min(totalPaginas, S.pagina + 1);
    else S.pagina = Math.max(1, S.pagina - 1);
    return render();
  }

  // Detalle: desligar
  if ((x = el('[data-desligar]'))) { S.confirmarDesligar = +x.dataset.desligar; return render(); }
  if ((x = el('[data-cancelar-desligar]'))) { S.confirmarDesligar = null; return render(); }
  if ((x = el('[data-confirmar-desligar]'))) {
    const ced = +x.dataset.confirmarDesligar, g = GRUPOS.find(z => z.id === S.grupoActivoId);
    g.cedulas = g.cedulas.filter(c => c !== ced); S.confirmarDesligar = null;
    render();
    return toast('Cédula desligada', 'La cédula ' + formatearCedula(ced) + ' ya no está ligada a este rostro.');
  }

  // Detalle: borrar foto
  if ((x = el('[data-borrar-foto]'))) { S.confirmarBorrarFoto = +x.dataset.borrarFoto; return render(); }
  if ((x = el('[data-cancelar-borrar-foto]'))) { S.confirmarBorrarFoto = null; return render(); }
  if ((x = el('[data-confirmar-borrar-foto]'))) {
    const idx = +x.dataset.confirmarBorrarFoto, g = GRUPOS.find(z => z.id === S.grupoActivoId);
    g.fotos.splice(idx, 1); g.numFotos = g.fotos.length; S.confirmarBorrarFoto = null;
    if (g.fotos.length === 0) {
      GRUPOS = GRUPOS.filter(z => z.id !== g.id);
      S.grupoActivoId = null; S.tab = 'listado';
      render();
      return toast('Rostro borrado', 'El grupo ya no tiene fotos.');
    }
    render();
    return toast('Foto borrada', 'Se quitó de la colección y se borró con sus cédulas.');
  }

  // Modal registrar
  if ((x = el('#r-foto-trigger'))) { /* el input real dispara change */ }
  if ((x = el('[data-quitar-foto-registrar]'))) { S.registrar.archivo = null; S.registrar.previewUrl = null; return render(); }
  if ((x = el('#btn-registrar'))) {
    if (S.registrar.estado === 'buscando') return;
    const cedulaInput = document.getElementById('r-cedula');
    const cedula = cedulaInput ? cedulaInput.value.trim() : S.registrar.cedula;
    S.registrar.cedula = cedula;
    S.registrar.errorCedula = !/^\d{6,15}$/.test(cedula);
    S.registrar.errorArchivo = !S.registrar.archivo ? 'Sube una foto para continuar.' : null;
    if (S.registrar.errorCedula || S.registrar.errorArchivo) return render();
    return registrarSuplantador();
  }

  // Modal validar
  if ((x = el('[data-quitar-foto-validar]'))) { S.validar.archivo = null; S.validar.previewUrl = null; return render(); }
  if ((x = el('#btn-validar'))) {
    if (S.validar.estado === 'validando') return;
    if (!S.validar.archivo) { toast('Falta la foto', 'Sube una foto para validar.', 'rosa'); return; }
    return validarFoto();
  }

  if ((x = el('#panel-plegar'))) { document.getElementById('panel-cuerpo').classList.toggle('hidden'); }

  // Panel del mockup
  if ((x = el('[data-servicio-pruebas]'))) { S.servicioPruebasConfigurado = x.dataset.servicioPruebas === 'si'; return render(); }
  if ((x = el('[data-permiso]'))) { S.permisoGestionar = x.dataset.permiso === 'si'; return render(); }
  if ((x = el('[data-permiso-ambiente]'))) { S.permisoCambiarAmbiente = x.dataset.permisoAmbiente === 'si'; if (!S.permisoCambiarAmbiente) S.ambiente = 'prod'; return render(); }
  if ((x = el('[data-estado-listado]'))) { S.estadoListado = x.dataset.estadoListado; return render(); }
  if ((x = el('[data-resultado-registrar]'))) { S.registrarResultadoSiguiente = x.dataset.resultadoRegistrar; return render(); }
  if ((x = el('[data-resultado-validar]'))) { S.validarResultadoSiguiente = x.dataset.resultadoValidar; return render(); }
});

document.addEventListener('input', e => {
  if (e.target.id === 'f-busqueda') { S.busqueda = e.target.value; S.pagina = 1; return render2ConFoco('f-busqueda'); }
  if (e.target.id === 'r-cedula') { S.registrar.cedula = e.target.value; }
  if (e.target.id === 'v-umbral') { let n = +e.target.value; if (n < 50) n = 50; if (n > 99) n = 99; S.validar.umbral = n || 70; }
});
document.addEventListener('change', e => {
  if (e.target.id === 'f-origen') { S.origenFiltro = e.target.value; S.pagina = 1; return render(); }
  if (e.target.id === 'r-foto') {
    const f = e.target.files[0]; if (!f) return;
    if (f.size > 5 * 1024 * 1024) { S.registrar.errorArchivo = 'La foto debe pesar menos de 5 MB.'; return render(); }
    S.registrar.errorArchivo = null; S.registrar.archivo = f; S.registrar.previewUrl = URL.createObjectURL(f);
    return render();
  }
  if (e.target.id === 'v-foto') {
    const f = e.target.files[0]; if (!f) return;
    if (f.size > 5 * 1024 * 1024) { toast('La foto debe pesar menos de 5 MB', 'Elige un archivo más liviano.', 'rosa'); return; }
    S.validar.archivo = f; S.validar.previewUrl = URL.createObjectURL(f); S.validar.resultado = null;
    return render();
  }
});
// Re-render que conserva el foco y el cursor del input de búsqueda (se repinta en cada tecla).
function render2ConFoco(id) {
  const pos = document.getElementById(id) ? document.getElementById(id).selectionStart : null;
  render();
  const el = document.getElementById(id);
  if (el) { el.focus(); if (pos != null) el.setSelectionRange(pos, pos); }
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.panelGrupoLateral) { S.panelGrupoLateral = false; return render(); }
  if (e.key === 'Escape' && (S.tab === 'registrar' || S.tab === 'validar')) { S.tab = S.grupoActivoId ? 'detalle' : 'listado'; return render(); }
});
render();
</script>
</body>
