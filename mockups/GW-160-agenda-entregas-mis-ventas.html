const I = {

const st = { pantalla: 'misventas', bloque: 'datos', modal: 'cerrado', chip: 'fila', centro: HOY, ventana: 'movil', expandidas: new Set() };
const $ = id => document.getElementById(id);
['pantalla','bloque','modal','chip'].forEach(k => {
  const p = new URLSearchParams(location.search).get(k);
  if (p) { st[k] = p; $(k).value = p; }
  $(k).addEventListener('change', e => { st[k] = e.target.value; render(); });
});

// Chip de tienda: sin ícono, color de marca por tienda (D11). Stirpe negro, Derek aguamarina; el resto gris neutro.
const COLOR_TIENDA = {
  Stirpe: 'bg-gray-900 text-white border-gray-900',
  Derek: 'bg-teal-300 text-teal-950 border-teal-300',
};
const chip = t => `<span class="inline-flex max-w-full shrink-0 items-center rounded border px-1.5 py-px text-[10px] font-semibold leading-4 ${COLOR_TIENDA[t] ?? 'bg-white/80 text-gray-600 border-gray-200'}" title="Tienda ${t}"><span class="truncate">${t}</span></span>`;
// Nombre del cliente en formato «Yenny Paola» (D12): la BD lo guarda en minúsculas o mayúsculas sostenidas.
const nombrePropio = n => n.toLocaleLowerCase('es-CO').split(/\s+/).filter(Boolean).map(w => w.charAt(0).toLocaleUpperCase('es-CO') + w.slice(1)).join(' ');

const DIAS_L = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DIAS = ['dom','lun','mar','mié','jue','vie','sáb'];
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const pf = iso => new Date(iso + 'T12:00:00');
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const corto = d => `${DIAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]}`;

function tarjetaBloque(e) {
  const est = ESTILO_BLOQUE[e.estado] ?? ESTILO_BLOQUE.entregada;
  const filaSup = st.chip === 'fila'
    ? `<div class="flex items-center justify-between gap-1.5"><div class="text-[9px] font-bold tracking-wider uppercase ${est.texto}">${est.label}</div>${chip(e.tienda)}</div>`
    : `<div class="text-[9px] font-bold tracking-wider uppercase ${est.texto}">${est.label}</div>`;
  return `<div class="rounded-md border px-2.5 py-2 ${est.tarjeta}">
    ${filaSup}
    <p class="mt-0.5 truncate text-[13px] font-medium text-gray-800">${nombrePropio(e.cliente.split(' ').slice(0,2).join(' '))}</p>
    ${st.chip === 'nombre' ? `<div class="mt-0.5 mb-0.5">${chip(e.tienda)}</div>` : ''}
    <p class="text-[11px] tabular-nums text-gray-500">Carrito #${e.carrito_id}</p>
  </div>`;
}

function bloque(modo) {
  // modo: 'misventas' (botón abre modal) | 'gestionventas' (enlace al módulo, sin cambios)
  const d = new Date(HOY + 'T18:05:00');
  const hoyTexto = `${DIAS_L[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]}`;
  const fuera = st.bloque === 'fuera';
  let entregas = ENTREGAS.filter(e => e.fecha === HOY && (e.franja === 9 || e.franja === 12) && e.estado !== 'sin_asignar');
  if (fuera) entregas = ENTREGAS.filter(e => e.fecha === '2026-09-17' && e.estado !== 'sin_asignar');
  const porEntregar = ENTREGAS.filter(e => e.fecha === HOY && !['entregada','sin_asignar'].includes(e.estado)).length;
  const accion = modo === 'misventas'
    ? `<button type="button" data-abrir-modal class="inline-flex h-[26px] items-center gap-1.5 rounded-lg border border-gray-200 bg-white px-2.5 text-xs font-medium text-emerald-700 hover:bg-gray-50">${I.cal} Ver calendario de entregas</button>`
    : `<a href="#" class="text-xs font-medium text-emerald-700 hover:underline">Ir a Gestión de Entregas</a>`;
  const header = `<div class="flex flex-wrap items-center gap-2 border-b bg-gray-50 px-4 py-2.5">
      ${I.truck}
      <h2 class="text-[13px] font-bold tracking-wide text-gray-500 uppercase">Mensajería interna · hoy ${hoyTexto}</h2>
      ${['datos','fuera','vacio'].includes(st.bloque) ? `<span class="ml-2 text-[11px] text-gray-500"><span class="font-semibold text-gray-700">${st.bloque==='vacio'?0:porEntregar}</span> por entregar</span>` : ''}
      ${modo === 'misventas' && st.bloque !== 'cargando' && st.bloque !== 'error' ? `<span class="text-[11px] text-gray-400">· Stirpe y Derek</span>` : ''}
      <div class="ml-auto flex items-center gap-2">
        <button type="button" class="inline-flex h-[26px] w-[26px] items-center justify-center rounded-lg border border-gray-200 bg-white text-gray-500 hover:bg-gray-50 hover:text-gray-900 ${st.bloque==='cargando'?'opacity-60':''}" title="Actualizar entregas">${I.rotate(st.bloque==='cargando'?'h-3.5 w-3.5 animate-spin':'h-3.5 w-3.5')}</button>
        ${accion}
      </div>
    </div>`;
  let cuerpo = '';
  if (st.bloque === 'cargando') {
    cuerpo = `<div class="flex gap-3 overflow-x-auto p-4">${Array.from({length:6}).map(()=>`<div class="w-44 shrink-0"><div class="skeleton mb-2 h-3 w-16 rounded"></div><div class="skeleton h-16 rounded-md"></div></div>`).join('')}</div>`;
  } else if (st.bloque === 'error') {
    cuerpo = `<div class="p-4"><div class="flex items-center justify-between gap-3 rounded-lg border border-rose-200 bg-rose-50 px-3 py-2.5 text-xs text-rose-800"><span>No se pudo cargar este bloque.</span><button class="rounded-md border border-rose-300 bg-white px-2.5 py-1 font-medium hover:bg-rose-100">Reintentar</button></div></div>`;
  } else if (st.bloque === 'vacio') {
    cuerpo = `<div class="flex items-center justify-center px-4 py-8 text-center text-xs text-gray-400">Sin entregas de mensajería agendadas.</div>`;
  } else {
    const sub = fuera ? `<p class="border-b bg-gray-50/60 px-4 py-1.5 text-[11px] tracking-wide text-gray-500 uppercase">Sin entregas en curso hoy · mostrando las próximas programadas para mañana</p>` : '';
    const cols = FRANJAS.map(f => {
      const hs = entregas.filter(e => e.franja === f.id);
      const ahora = !fuera && f.id === 12;
      return `<div class="w-44 shrink-0 border-l border-gray-100 px-2 first:border-l-0">
        <div class="mb-2 border-b-2 pb-1.5 text-[11px] font-bold tabular-nums ${ahora?'border-gray-900 text-gray-900':'border-gray-100 text-gray-400'}">${f.ini}${ahora?' · ahora':''}</div>
        <div class="min-h-[64px] space-y-2">${hs.length ? hs.map(tarjetaBloque).join('') : '<div class="h-[64px] rounded-md border border-dashed border-gray-100"></div>'}</div>
      </div>`;
    }).join('');
    cuerpo = `${sub}<div data-timeline class="flex gap-0 overflow-x-auto p-4" style="scrollbar-width: thin">${cols}</div>`;
  }
  return `<div class="mb-4 overflow-hidden rounded-2xl border bg-white shadow-sm">${header}${cuerpo}</div>`;
}

function diasVentana() {
  const c = pf(st.centro); let ini, fin;
  if (st.ventana === 'semana') { ini = new Date(c); const dw = (c.getDay()+6)%7; ini.setDate(c.getDate()-dw); fin = new Date(ini); fin.setDate(ini.getDate()+6); }
  else { ini = new Date(c); ini.setDate(c.getDate()-2); fin = new Date(c); fin.setDate(c.getDate()+4); }
  const out = []; const cur = new Date(ini); while (cur <= fin) { out.push(iso(cur)); cur.setDate(cur.getDate()+1); } return out;
}

function tarjetaAgenda(e, soloLectura) {
  const cfg = ESTILO_AGENDA[e.estado];
  const accion = !soloLectura && ['sin_asignar','asignada','recogida'].includes(e.estado)
    ? `<span role="button" class="-mr-1 -mt-0.5 inline-flex h-6 w-6 shrink-0 items-center justify-center rounded text-gray-500 hover:bg-white/70 hover:text-gray-900" title="${e.estado==='sin_asignar'?'Asignar mensajero':'Reasignar mensajero'}">${e.estado==='sin_asignar'?I.userplus:I.reasignar}</span>` : '';
  const filaSup = st.chip === 'fila'
    ? `<div class="flex items-start justify-between gap-1"><div class="flex min-w-0 items-center gap-1.5"><div class="tabular-nums text-[13px] font-bold leading-tight text-blue-900">#${e.carrito_id}</div>${chip(e.tienda)}</div>${accion}</div>`
    : `<div class="flex items-start justify-between gap-1"><div class="tabular-nums text-[13px] font-bold leading-tight text-blue-900">#${e.carrito_id}</div>${accion}</div>`;
  const Tag = soloLectura ? 'div' : 'button';
  return `<${Tag} ${soloLectura?'':'type="button"'} class="block w-full rounded-md border px-2.5 py-1.5 text-left ${soloLectura?'cursor-default':'transition hover:shadow-sm'} ${cfg.card}" style="border-right-color:${cfg.accent};border-right-width:3px" title="${cfg.label}">
    ${filaSup}
    <div class="truncate text-xs leading-snug text-gray-800">${nombrePropio(e.cliente)}</div>
    ${st.chip === 'nombre' ? `<div class="my-0.5">${chip(e.tienda)}</div>` : ''}
    <div class="flex items-center gap-1 truncate text-[11px] text-gray-600">${I.pin}<span class="truncate">${e.barrio}</span></div>
    ${e.mensajero ? `<div class="flex items-center gap-1 truncate text-[11px] text-gray-600">${I.bike}<span class="truncate">${e.mensajero}</span></div>` : `<div class="truncate text-[11px] text-gray-500">— sin asignar</div>`}
  </${Tag}>`;
}

function controlesAgenda() {
  const dias = diasVentana();
  const rango = `${corto(pf(dias[0]))}  —  ${corto(pf(dias[dias.length-1]))}`;
  const on = v => st.ventana === v ? 'bg-indigo-600 text-white' : 'font-medium text-gray-600 hover:bg-gray-50';
  return `<div class="flex flex-wrap items-center gap-2">
    <button data-nav="-1" class="inline-flex h-9 w-9 items-center justify-center rounded-md border border-gray-200 bg-white shadow-sm hover:bg-gray-50" title="Ventana anterior">${I.left}</button>
    <div class="min-w-[210px] rounded-lg border border-gray-200 bg-white px-4 py-1.5 text-center text-sm font-medium text-gray-800 shadow-sm tabular-nums whitespace-pre">${rango}</div>
    <button data-nav="1" class="inline-flex h-9 w-9 items-center justify-center rounded-md border border-gray-200 bg-white shadow-sm hover:bg-gray-50" title="Ventana siguiente">${I.right}</button>
    <button data-hoy class="rounded-lg border border-gray-200 bg-white px-4 py-1.5 text-sm font-semibold text-gray-800 shadow-sm hover:bg-gray-50">Hoy</button>
    <div class="ml-2 flex items-center gap-2"><span class="text-sm text-gray-500">Ventana:</span>
      <div class="inline-flex gap-1 rounded-lg border border-gray-200 bg-white p-1 shadow-sm">
        <button data-ventana="movil" class="rounded-md px-3 py-1 text-xs font-semibold transition-colors ${on('movil')}">Móvil (7 días)</button>
        <button data-ventana="semana" class="rounded-md px-3 py-1 text-xs font-semibold transition-colors ${on('semana')}">Semana fija (Lun–Dom)</button>
      </div></div>
  </div>`;
}

function grillaAgenda(soloLectura, estado) {
  if (estado === 'error') return `<div class="flex items-start gap-3 rounded-lg border border-red-200 bg-red-50 p-4"><span class="mt-0.5 text-red-600">${I.alert()}</span><div class="flex-1"><p class="text-sm font-medium text-red-800">No se pudo cargar la agenda</p><p class="mt-0.5 text-sm text-red-700">Ocurrió un error al consultar las entregas. Verifica la conexión e intenta de nuevo.</p></div><button class="rounded-md border border-red-300 bg-white px-3 py-1.5 text-sm font-medium text-red-700 hover:bg-red-100">Reintentar</button></div>`;
  if (estado === 'cargando') return `<div class="rounded-lg border border-gray-200 bg-white p-4 shadow-sm"><div class="space-y-2"><div class="flex gap-2"><div class="skeleton h-9 w-[122px] shrink-0 rounded"></div>${'<div class="skeleton h-9 flex-1 rounded"></div>'.repeat(7)}</div>${('<div class="flex gap-2"><div class="skeleton h-24 w-[122px] shrink-0 rounded"></div>' + '<div class="skeleton h-24 flex-1 rounded"></div>'.repeat(7) + '</div>').repeat(5)}</div></div>`;
  const dias = diasVentana();
  const leyendaEstados = (soloLectura ? ['sin_asignar','asignada','recogida','en_ruta','entregada','devuelta'] : Object.keys(ESTILO_AGENDA))
    .map(k => `<span class="inline-flex items-center gap-1.5 text-gray-700"><span class="h-3.5 w-3.5 rounded border ${ESTILO_AGENDA[k].card}"></span>${ESTILO_AGENDA[k].label}</span>`).join('');
  const thead = `<tr><th class="sticky left-0 z-10 w-[122px] border-b border-r border-gray-200 bg-gray-50 px-3 py-2.5 text-left text-sm font-medium text-gray-500">Franja</th>${dias.map(d => {
    const h = d === HOY, x = pf(d);
    return `<th class="min-w-[168px] border-b border-gray-200 px-2 py-2.5 text-center ${h?'bg-indigo-50':'bg-white'}"><span class="text-sm font-semibold ${h?'text-indigo-700':'text-gray-800'}">${DIAS[x.getDay()]} ${x.getDate()} ${MESES[x.getMonth()]}</span>${h?'<span class="ml-1.5 rounded-full bg-indigo-600 px-2 py-0.5 text-[10px] font-semibold text-white">hoy</span>':''}</th>`;
  }).join('')}</tr>`;
  const tbody = FRANJAS.map(f => `<tr><td class="sticky left-0 z-10 border-t border-r border-gray-200 bg-white px-3 py-2.5 align-top"><div class="tabular-nums whitespace-nowrap text-sm font-semibold text-gray-800">${f.ini} – ${f.fin}</div><div class="tabular-nums text-xs text-gray-400">cap. ${f.cap}</div></td>${dias.map(d => {
    const t = ENTREGAS.filter(e => e.fecha === d && e.franja === f.id);
    const n = t.length, clave = d + '|' + f.id, exp = st.expandidas.has(clave);
    const chipOcup = n === 0 ? `<span class="tabular-nums rounded-md border border-gray-100 bg-white px-1.5 py-0.5 text-[11px] text-gray-300">0/${f.cap}</span>`
      : n > f.cap ? `<span class="tabular-nums inline-flex items-center gap-1 rounded-md border border-red-200 bg-red-100 px-1.5 py-0.5 text-[11px] font-semibold text-red-700">${I.alert(11)}${n}/${f.cap}</span>`
      : `<span class="tabular-nums rounded-md border border-gray-200 bg-white px-1.5 py-0.5 text-[11px] font-medium text-gray-500">${n}/${f.cap}</span>`;
    return `<td class="border-t border-l border-gray-200 border-l-gray-100 p-2 align-top ${n > f.cap ? 'bg-red-50/60' : ''}"><div class="mb-1.5 flex justify-end">${chipOcup}</div><div class="min-h-[104px] space-y-1.5">${t.filter((_, i) => i < 4 || exp).map(e => tarjetaAgenda(e, soloLectura)).join('')}${n > 4 ? `<button data-exp="${clave}" class="block w-full py-1 text-center text-xs font-medium text-indigo-600 hover:underline">${exp ? 'Mostrar menos' : `+${n-4} más`}</button>` : ''}</div></td>`;
  }).join('')}</tr>`).join('');
  return `<div class="mb-3 flex flex-wrap items-center gap-x-4 gap-y-1.5 text-sm"><span class="font-medium text-gray-600">Estado:</span>${leyendaEstados}<span class="ml-3 font-medium text-gray-600">Ocupación:</span><span class="inline-flex items-center gap-1.5 text-gray-700"><span class="tabular-nums rounded-md border border-gray-200 bg-white px-1.5 py-0.5 text-[11px] font-medium text-gray-500">3/4</span>normal</span><span class="inline-flex items-center gap-1.5 text-gray-700"><span class="tabular-nums rounded-md border border-red-200 bg-red-100 px-1.5 py-0.5 text-[11px] font-semibold text-red-700">5/4</span>sobre-agendada</span></div>
  <div class="overflow-hidden rounded-lg border border-gray-200 bg-white shadow-sm"><div class="overflow-x-auto"><table class="w-full border-collapse"><thead>${thead}</thead><tbody>${tbody}</tbody></table></div></div>`;
}

function modalCalendario() {
  if (st.pantalla !== 'misventas' || st.modal === 'cerrado') return '';
  return `<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/40 p-4 pt-24" data-cerrar-fondo>
    <div class="flex max-h-[90vh] w-full max-w-[min(96vw,1500px)] flex-col overflow-hidden rounded-2xl bg-white shadow-2xl" role="dialog" aria-labelledby="modal-cal-titulo">
      <header class="flex items-start justify-between border-b border-slate-100 px-5 py-4">
        <div>
          <h2 id="modal-cal-titulo" class="text-base font-bold text-slate-900">Calendario de entregas</h2>
          <p class="mt-0.5 text-xs text-slate-500">Mensajería interna de tus tiendas: <span class="font-medium text-slate-700">Stirpe</span> y <span class="font-medium text-slate-700">Derek</span> · solo consulta</p>
        </div>
        <button type="button" data-cerrar aria-label="Cerrar" class="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-600">${I.x}</button>
      </header>
      <div class="border-b border-slate-100 bg-gray-50 px-5 py-3">${controlesAgenda()}</div>
      <div class="flex-1 overflow-y-auto px-5 py-4">${grillaAgenda(true, st.modal)}</div>
    </div>
  </div>`;
}

function nota(html) { return `<div class="nota mb-4 rounded-md bg-white px-3 py-2 text-[12px] leading-relaxed text-gray-600 shadow-sm">${html}</div>`; }

function pantallaMisVentas() {
  return `
  <div class="mb-4 flex items-end justify-between"><div><h1 class="text-2xl font-bold text-gray-900">Mis Ventas</h1><p class="text-sm text-gray-500">Gestiona tus ventas asistidas</p></div><button class="inline-flex items-center gap-2 rounded-md bg-gray-900 px-4 py-2 text-sm font-medium text-white">+ Nueva venta</button></div>
  <nav class="mb-4 flex gap-6 border-b border-slate-200 text-sm font-medium"><button class="border-b-2 border-slate-900 px-1 pb-3 text-slate-900">Dashboard</button><button class="border-b-2 border-transparent px-1 pb-3 text-slate-500">Consultar ventas</button></nav>
  ${nota('<b>A · Mis Ventas.</b> El bloque va al final de la pestaña Dashboard, después de «Detalle diario» (misma posición que en Gestión de Ventas). Muestra las entregas de <b>todas las tiendas del asesor</b> (D2), no solo la seleccionada arriba. «Ver calendario de entregas» abre la modal y no sale de Mis Ventas.')}
  <div class="mb-4 space-y-3 opacity-60">
    <div class="rounded-2xl border border-dashed border-gray-300 bg-white px-4 py-6 text-center text-xs text-gray-400">Cabecera de período · Cola de asignados · Tablero del asesor · Comisión proyectada — sin cambios</div>
    <div class="rounded-2xl border border-dashed border-gray-300 bg-white px-4 py-6 text-center text-xs text-gray-400">Detalle diario — sin cambios</div>
  </div>
  ${bloque('misventas')}`;
}
function pantallaGestionVentas() {
  return `<div class="mb-4"><h1 class="text-2xl font-bold text-gray-900">Gestión de Ventas</h1><p class="text-sm text-gray-500">Dashboard</p></div>
  ${nota('<b>B · Gestión de Ventas.</b> El mismo componente, ahora compartido. Solo cambian el chip de tienda (D4) y el número de la tarjeta, que pasa a ser el carrito real (D7). La coordinación <b>conserva</b> «Ir a Gestión de Entregas», porque sí opera ese módulo.')}
  <div class="mb-4 rounded-2xl border border-dashed border-gray-300 bg-white px-4 py-6 text-center text-xs text-gray-400 opacity-60">Tablero de cumplimiento y tabla de asesores — sin cambios</div>
  ${bloque('gestionventas')}`;
}
function pantallaGestionEntregas() {
  return `<div class="mb-4"><h1 class="text-2xl font-bold text-gray-900">Gestión de Entregas</h1><p class="text-sm text-gray-500">Venta asistida</p></div>
  ${nota('<b>C · Gestión de Entregas, vista Agenda.</b> Es la misma tarjeta con el chip de tienda (D6). Conserva asignar/reasignar mensajero y el clic que abre el detalle. Los controles se siguen viendo en la fila del interruptor Tabla/Agenda, pero ahora llegan por slot en lugar de Teleport. No debe haber regresión visual.')}
  <div class="mb-3 flex flex-wrap items-center justify-between gap-3"><div class="inline-flex gap-1 rounded-lg border border-gray-200 bg-white p-1 text-sm shadow-sm"><button class="rounded-md px-3 py-1 text-gray-600">Tabla</button><button class="rounded-md bg-gray-900 px-3 py-1 font-semibold text-white">Agenda</button><button class="rounded-md px-3 py-1 text-gray-600">Alistamiento</button><button class="rounded-md px-3 py-1 text-gray-600">Dashboard</button></div>${controlesAgenda()}</div>
  ${grillaAgenda(false, 'datos')}`;
}

function render() {
  $('bloque-wrap').style.display = st.pantalla === 'gestionentregas' ? 'none' : '';
  $('modal-wrap').style.display = st.pantalla === 'misventas' ? '' : 'none';
  $('app').innerHTML = st.pantalla === 'misventas' ? pantallaMisVentas() : st.pantalla === 'gestionventas' ? pantallaGestionVentas() : pantallaGestionEntregas();
  $('capas').innerHTML = modalCalendario();
  // Mockup: llevar la línea de tiempo hasta la columna «ahora» (al final del rango).
  setTimeout(() => document.querySelectorAll('[data-timeline]').forEach(el => { el.scrollLeft = el.scrollWidth; }), 400);
  document.body.style.overflow = st.pantalla === 'misventas' && st.modal !== 'cerrado' ? 'hidden' : '';
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-abrir-modal],[data-cerrar],[data-nav],[data-hoy],[data-ventana],[data-exp],[data-cerrar-fondo]');
  if (!t) return;
  if (t.hasAttribute('data-cerrar-fondo') && ev.target !== t) return;
  if (t.hasAttribute('data-abrir-modal')) { st.modal = 'datos'; $('modal').value = 'datos'; }
  else if (t.hasAttribute('data-cerrar') || t.hasAttribute('data-cerrar-fondo')) { st.modal = 'cerrado'; $('modal').value = 'cerrado'; }
  else if (t.dataset.nav) { const c = pf(st.centro); c.setDate(c.getDate() + Number(t.dataset.nav) * (st.ventana === 'semana' ? 7 : 1)); st.centro = iso(c); }
  else if (t.hasAttribute('data-hoy')) st.centro = HOY;
  else if (t.dataset.ventana) st.ventana = t.dataset.ventana;
  else if (t.dataset.exp) { const k = t.dataset.exp; st.expandidas.has(k) ? st.expandidas.delete(k) : st.expandidas.add(k); }
  render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && st.modal !== 'cerrado') { st.modal = 'cerrado'; $('modal').value = 'cerrado'; render(); } });
render();
</script>
</body>
</html>
