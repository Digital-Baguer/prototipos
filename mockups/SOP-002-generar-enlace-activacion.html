      '<div class="px-4 pb-3 text-xs text-[#71717a]">QUAC › Validación de fotos</div>' +
      '<div class="flex-1 overflow-y-auto border-t border-[#27272a]">' +
        fila('file-text', 'Gestión de fotos', 'Sesiones de activación de crédito y sus fotos', false) +
        fila('link', 'Generar link crédito', 'Crea el enlace de activación para un cliente', true) +
      '</div>' +
    '</aside>';
}

function migas() {
  const sep = '<li><i data-i="chevron-right" class="h-3.5 w-3.5"></i></li>';
  let h = '<li><i data-i="house" class="h-4 w-4"></i></li>' + sep + '<li>QUAC</li>' + sep + '<li>Validación de fotos</li>' + sep;
  if (S.vista === 'formulario') h += '<li class="font-normal text-foreground">Generar link crédito</li>';
  else h += '<li class="cursor-pointer hover:text-foreground" data-ir-form>Gestión de fotos</li>' + sep + '<li class="font-normal text-foreground">Sesión ' + S.sesion.ref.slice(0, 8) + '…</li>';
  return h;
}

function franja() {
  if (S.ambiente !== 'pruebas') return '';
  return '<div class="sticky top-0 z-30 flex h-10 items-center gap-3 bg-rose-600 px-6 text-sm text-white shadow">' + ic('flask', 'h-5 w-5 shrink-0') +
    '<span class="min-w-0 truncate"><strong>Modo Pruebas.</strong> Estás viendo datos de Pruebas: estas activaciones no son de clientes reales.</span>' +
    (S.permiso ? '<button data-ambiente="prod" class="ml-auto flex shrink-0 items-center gap-1.5 rounded-lg bg-white px-3 py-1 text-xs font-medium text-rose-700 hover:bg-rose-50">' + ic('arrow-left', 'h-3.5 w-3.5') + 'Volver a Producción</button>' : '') +
    '</div>';
}
function interruptor() {
  if (!S.permiso) return '';
  const op = (v, txt, icono) => '<button type="button" data-ambiente="' + v + '" class="inline-flex items-center gap-1.5 rounded-md px-3 py-1.5 text-sm font-medium transition-colors ' +
    (S.ambiente === v ? (v === 'pruebas' ? 'bg-rose-600 text-white shadow-sm' : 'bg-white text-gray-900 shadow-sm') : 'text-gray-600 hover:text-gray-900') + '">' + ic(icono, 'h-[15px] w-[15px]') + txt + '</button>';
  return '<div class="flex items-center gap-2"><span class="text-sm text-gray-500">Ambiente</span><div class="inline-flex gap-1 rounded-lg bg-gray-100 p-1">' +
    op('prod', 'Producción', 'circle-check') + op('pruebas', 'Pruebas', 'flask') + '</div></div>';
}

/* ───────────── Pantalla 1: formulario ───────────── */
function comerciosActivos() { return S.ambiente === 'pruebas' ? COMERCIOS_PRUEBAS : COMERCIOS; }
function bodegasActivas() { return S.ambiente === 'pruebas' ? BODEGAS_PRUEBAS : BODEGAS; }
function campo(et, val) { return '<div><div class="text-xs text-gray-500">' + et + '</div><div class="mt-0.5 text-sm text-gray-900">' + val + '</div></div>'; }

function buscadorBodega() {
  const f = S.form, label = '<label class="mb-1 block text-sm font-medium text-gray-700">Bodega</label>';
  if (f.bodegaElegida) {
    const b = f.bodegaElegida;
    return label + '<div class="flex items-center justify-between gap-3 rounded-md border border-gray-300 bg-white px-3 py-2 text-sm">' +
      (b.fuera
        ? '<span class="text-gray-800">Bodega <span class="tabular-nums font-medium">' + b.code + '</span> <span class="text-gray-400">· no está en el catálogo</span></span>'
        : '<span class="text-gray-800"><span class="tabular-nums font-medium">' + b.code + '</span> · ' + b.nombre + ' · ' + b.ciudad + '</span>') +
      '<button type="button" data-bodega-cambiar class="shrink-0 text-xs text-gray-700 underline underline-offset-2">Cambiar</button></div>';
  }
  const texto = f.bodegaTexto.trim();
  const catalogo = bodegasActivas();
  const resultados = texto.length ? catalogo.filter(b => (b[0] + ' ' + b[1] + ' ' + b[2]).toLowerCase().includes(texto.toLowerCase())) : [];
  const esCodigoPosible = /^\d{2,4}$/.test(texto);
  let h = label + '<label class="relative block">' + ic('search', 'pointer-events-none absolute left-3 top-1/2 h-3.5 w-3.5 -translate-y-1/2 text-gray-400') +
    '<input id="f-bodega" type="search" autocomplete="off" placeholder="Buscar por código, nombre o ciudad..." value="' + texto + '" class="w-full rounded-md border border-gray-300 bg-white py-2 pl-8 pr-3 text-sm text-gray-800 focus:border-neutral-400 focus:outline-none"></label>';
  if (texto.length === 0) {
    h += '<p class="mt-1 text-xs text-gray-500">Escribe el código, el nombre o la ciudad de la bodega del ERP.</p>';
  } else if (resultados.length) {
    h += '<ul class="mt-1 max-h-48 divide-y divide-gray-100 overflow-y-auto rounded-md border border-gray-200 bg-white">' +
      resultados.map(b => '<li><button type="button" data-bodega-elegir="' + b[0] + '" class="flex w-full items-center gap-2 px-3 py-2 text-left text-sm hover:bg-gray-50">' +
        '<span class="tabular-nums font-medium text-gray-900">' + b[0] + '</span><span class="text-gray-600">· ' + b[1] + ' · ' + b[2] + '</span></button></li>').join('') + '</ul>';
  } else if (esCodigoPosible) {
    h += '<div class="mt-1.5 flex items-start gap-2 rounded-md border border-rose-100 bg-rose-50/60 px-3 py-2 text-xs text-gray-600">' + ic('info', 'mt-0.5 h-3.5 w-3.5 shrink-0 text-rose-400') +
      '<span class="flex-1">La bodega ' + texto + ' no está en el catálogo; se enviará tal cual.</span>' +
      '<button type="button" data-bodega-usar-tal-cual="' + texto + '" class="shrink-0 font-medium text-gray-700 underline underline-offset-2">Usar este código</button></div>';
  } else {
    h += '<p class="mt-1 text-xs text-gray-500">Nada con «' + texto + '».</p>';
  }
  return h;
}

function vistaFormulario() {
  const f = S.form, input = 'w-full rounded-md border border-gray-300 px-3 py-2 text-sm';
  let h = '<div class="flex items-start justify-between gap-4"><h1 class="!mb-0 text-xl font-semibold text-gray-900">Generar link crédito</h1>' + interruptor() + '</div>';

  if (S.ambiente === 'pruebas') {
    h += '<div class="flex items-center gap-2 rounded-lg border border-gray-200 bg-gray-50 p-3 text-sm text-gray-600">' + ic('info', 'h-4 w-4 shrink-0 text-gray-400') +
      'En Pruebas, el enlace se crea contra la API de pruebas de Activación, no contra la real.</div>';
    if (!S.credencialesPruebas) {
      h += '<div role="alert" class="flex items-center gap-2 rounded-lg border border-rose-200 bg-rose-50 p-3 text-sm text-rose-700">' + ic('triangle-alert', 'h-4 w-4 shrink-0') +
        'Pruebas no tiene credenciales de la API de Activación configuradas. No se pueden crear enlaces desde aquí.</div>';
    }
  }

  const deshabilitado = S.envio === 'enviando' || (S.ambiente === 'pruebas' && !S.credencialesPruebas);
  h += '<div class="max-w-xl rounded-lg border border-gray-200 bg-white p-5"><div class="space-y-4">';

  // Documento
  h += '<div><label class="mb-1 block text-sm font-medium text-gray-700">Documento del cliente</label>' +
    '<input id="f-doc" type="text" inputmode="numeric" placeholder="Ej: 1019847213" value="' + f.doc + '" class="' + input + (S.errorDoc ? ' border-rose-400' : '') + '">' +
    (S.errorDoc ? '<p class="mt-1 text-sm text-rose-600">' + (S.errorDoc === 'vacio' ? 'Escribe el documento del cliente.' : 'El documento solo puede tener números.') + '</p>' : '') + '</div>';

  // Comercio
  h += '<div><label class="mb-1 block text-sm font-medium text-gray-700">Comercio</label>' +
    '<select id="f-comercio" class="sel-nativo ' + input + ' pr-8 bg-white">' +
    comerciosActivos().map((c, i) => '<option value="' + i + '" ' + (f.comercioIdx === i ? 'selected' : '') + '>' + c[0] + ' - ' + c[1] + '</option>').join('') + '</select></div>';

  // Bodega
  h += '<div id="bodega-campo">' + buscadorBodega() + '</div>';

  // Notificación
  h += '<div><p class="mb-1 text-sm font-medium text-gray-700">Notificación</p><div class="flex flex-wrap items-center gap-5 text-sm">' +
    '<label class="inline-flex cursor-pointer items-center gap-2"><input type="radio" name="notificar" value="no" ' + (f.notificar === 'no' ? 'checked' : '') + ' class="h-4 w-4"><span class="text-gray-700">No enviar</span></label>' +
    '<label class="inline-flex cursor-pointer items-center gap-2"><input type="radio" name="notificar" value="si" ' + (f.notificar === 'si' ? 'checked' : '') + ' class="h-4 w-4"><span class="text-gray-700">Enviar por WhatsApp</span></label>' +
    '</div>' + (S.errorNotificar ? '<p class="mt-1 text-sm text-rose-600">Elige si se envía el enlace al cliente.</p>' : '<p class="mt-1 text-xs text-gray-500">Con «No enviar», el enlace queda en la sesión para pasarlo tú mismo al cliente.</p>') + '</div>';

  // Aviso de enlace en curso (D8, D9)
  if (S.avisoEnCurso) {
    h += '<div role="alert" class="rounded-lg border border-gray-300 bg-gray-50 p-4 text-sm text-gray-700">' +
      '<div class="flex items-start gap-2">' + ic('info', 'mt-0.5 h-4 w-4 shrink-0 text-gray-500') + '<div class="flex-1">' +
      '<p class="font-medium text-gray-900">La cédula ' + f.doc + ' ya tiene un enlace en curso</p>' +
      '<p class="mt-1">Creado el 25-oct-2026 09:14 · ' + chip('Pendiente', 'negro') + ' · <a href="#" class="font-medium underline underline-offset-2">Ver su detalle</a></p>' +
      '<p class="mt-1 text-xs text-gray-500">Si creas otro, el cliente tendrá dos enlaces.</p>' +
      '<div class="mt-3 flex gap-2"><button id="btn-crear-igual" type="button" class="inline-flex h-9 items-center rounded-md bg-primary px-3 text-sm font-medium text-primary-foreground hover:bg-primary/90">Crear otro de todos modos</button>' +
      '<button id="btn-cancelar-aviso" type="button" class="inline-flex h-9 items-center rounded-md border border-gray-300 bg-white px-3 text-sm text-gray-700 hover:bg-gray-50">Cancelar</button></div>' +
      '</div></div></div>';
  }

  if (S.errorApi) {
    h += '<div role="alert" class="flex items-center gap-2 rounded-lg border border-rose-200 bg-rose-50 p-3 text-sm text-rose-700">' + ic('triangle-alert', 'h-4 w-4 shrink-0') +
      (S.errorApi === 'cupo' ? 'El cliente no tiene cupo activo.' : 'No se generó enlace de activación.') + '</div>';
  }

  h += '<button id="btn-crear" type="button" class="inline-flex h-11 w-full items-center justify-center gap-2 whitespace-nowrap rounded-md bg-primary px-4 text-sm font-medium text-primary-foreground shadow-sm hover:bg-primary/90 disabled:opacity-50" ' + (deshabilitado ? 'disabled' : '') + '>' +
    (S.envio === 'enviando' ? ic('loader', 'girar h-4 w-4') + 'Creando…' : 'Crear enlace') + '</button>';

  h += '</div></div>';
  return h;
}

/* ───────────── Pantalla 2: detalle de la sesión creada ───────────── */
function tarjetaEnlace() {
  const s = S.sesion, recien = S.detalleEstado === 'recienCreado';
  const url = 'https://link.quac.co/' + s.ref.slice(0, 8);
  const borde = recien ? 'border-emerald-200 bg-emerald-50/40' : 'border-gray-200 bg-white';
  let h = '<div class="rounded-lg border p-4 ' + borde + '">' +
    '<div class="flex flex-wrap items-center justify-between gap-3">' +
    '<div class="min-w-0"><p class="text-sm font-medium text-gray-900">' + (recien ? 'Enlace de activación generado' : 'Enlace de activación') + '</p>' +
    '<p class="mt-0.5 truncate font-mono text-base text-gray-800">' + url + '</p></div>' +
    '<div class="flex shrink-0 items-center gap-2">' +
    (recien && s.notificar ? chip('Enviado por WhatsApp', 'esmeralda', 'message-circle') : '') +
    '<button data-copiar-enlace class="inline-flex h-9 items-center gap-1.5 rounded-md border bg-white px-3 text-sm font-medium shadow-sm hover:bg-accent">' +
    (S.copiado ? ic('check', 'h-3.5 w-3.5 text-emerald-600') : ic('copy', 'h-3.5 w-3.5')) + (S.copiado ? 'Copiado' : 'Copiar') + '</button></div></div>';
  if (!recien) h += '<p class="mt-2 text-xs text-gray-500">Notificación al crearlo: ' + (s.notificar ? 'enviado por WhatsApp' : 'no se envió') + '.</p>';
  return h + '</div>';
}

function vistaDetalle() {
  const s = S.sesion, com = comerciosActivos()[s.comercioIdx] || COMERCIOS[s.comercioIdx];
  let h = '<div class="flex items-start justify-between gap-4"><div class="flex items-center gap-3">' +
    '<button data-ir-form class="inline-flex h-8 items-center gap-1.5 rounded-md px-2 text-sm font-medium hover:bg-accent">' + ic('arrow-left', 'h-4 w-4') + 'Volver</button>' +
    '<h1 class="!mb-0 text-xl font-semibold text-gray-900">Sesión de activación</h1></div>' + interruptor() + '</div>';

  h += tarjetaEnlace();

  h += '<div class="rounded-lg border border-gray-200 bg-white p-4">' +
    '<div class="mb-4 flex items-center justify-between gap-3 border-b border-gray-100 pb-3"><div class="flex items-center gap-2 text-sm text-gray-500">Referencia <span class="font-mono text-gray-900">' + s.ref + '</span></div>' + chip('Pendiente', 'gris') + '</div>' +
    '<div class="grid grid-cols-4 gap-x-6 gap-y-4">' +
      campo('Documento', '<span class="tabular-nums">' + s.doc + '</span>') +
      campo('Nombre', '<span class="text-gray-400">Cliente no creado</span>') +
      campo('Comercio', '<span class="tabular-nums">' + com[0] + '</span> – ' + com[1]) +
      campo('Bodega', s.bodega.fuera ? s.bodega.code + ' (fuera del catálogo)' : s.bodega.code + ' · ' + s.bodega.nombre) +
      campo('Paso actual', '<span class="text-gray-400">—</span>') +
      campo('Estado de la sesión', 'Pendiente') +
      campo('Creada', '<span class="tabular-nums">' + fecha(s.f) + '</span>') +
      campo('Última actualización', '<span class="tabular-nums">' + fecha(s.f) + '</span>') +
    '</div></div>';

  h += '<div class="grid grid-cols-3 gap-6">' +
    '<div class="col-span-2 rounded-lg border border-gray-200 bg-white p-4"><div class="mb-3 flex items-center justify-between"><h2 class="!mb-0 text-base font-semibold text-gray-900">Validación de identidad</h2>' + chip('Sin validar aún', 'gris') + '</div>' +
    '<p class="text-sm text-gray-500">Aún no hay validación de identidad: el cliente no ha terminado de subir la cédula.</p></div>' +
    '<div class="rounded-lg border border-gray-200 bg-white p-4"><h2 class="!mb-3 text-base font-semibold text-gray-900">Crédito</h2><div class="space-y-3">' +
      campo('Estado del crédito', chip('Pendiente', 'gris')) + campo('Cupo aprobado', '<span class="text-gray-400">Sin cupo aprobado</span>') + '</div></div></div>';

  h += '<div class="rounded-lg border border-gray-200 bg-white"><div class="flex items-center justify-between px-4 pt-4"><h2 class="!mb-0 text-base font-semibold text-gray-900">Fotos</h2><span class="text-sm text-gray-500">0 de 0 cargadas</span></div>' +
    '<div class="p-8 text-center text-gray-500">El cliente todavía no ha subido fotos</div></div>';
  return h;
}

/* ───────────── Panel de estados (no es parte de la UI) ───────────── */
function panelEstados() {
  const b = (attr, val, txt, on) => '<button data-' + attr + '="' + val + '" class="p-btn ' + (on ? 'on' : '') + '">' + txt + '</button>';
  let h = '';
  if (S.vista === 'formulario') {
    h += '<div><p class="mb-1 text-[10px] uppercase tracking-wide text-neutral-500">Ambiente</p><div class="flex flex-wrap gap-1">' +
      b('ambiente', 'prod', 'Producción', S.ambiente === 'prod') + b('ambiente', 'pruebas', 'Pruebas', S.ambiente === 'pruebas') + '</div></div>';
    if (S.ambiente === 'pruebas') {
      h += '<div><p class="mb-1 text-[10px] uppercase tracking-wide text-neutral-500">Pruebas: credenciales</p><div class="flex flex-wrap gap-1">' +
        b('credenciales', 'si', 'Configuradas', S.credencialesPruebas) + b('credenciales', 'no', 'Sin configurar', !S.credencialesPruebas) + '</div></div>';
    }
    h += '<div><p class="mb-1 text-[10px] uppercase tracking-wide text-neutral-500">Documento</p><div class="flex flex-wrap gap-1">' +
      b('doc', 'ok', 'Válido', !S.errorDoc) + b('doc', 'vacio', 'Vacío', S.errorDoc === 'vacio') + b('doc', 'letras', 'Con letras', S.errorDoc === 'letras') + '</div></div>';
    h += '<div><p class="mb-1 text-[10px] uppercase tracking-wide text-neutral-500">Bodega</p><div class="flex flex-wrap gap-1">' +
      b('bodega-demo', 'catalogo', 'Del catálogo (310)', S.form.bodegaElegida && !S.form.bodegaElegida.fuera) + b('bodega-demo', 'fuera', 'Fuera de catálogo (413)', S.form.bodegaElegida && S.form.bodegaElegida.fuera) + b('bodega-demo', 'ninguna', 'Sin elegir', !S.form.bodegaElegida) + '</div></div>';
    h += '<div><p class="mb-1 text-[10px] uppercase tracking-wide text-neutral-500">Enlace en curso de la cédula</p><div class="flex flex-wrap gap-1">' +
      b('en-curso', 'no', 'No tiene', !S.enCurso) + b('en-curso', 'si', 'Pendiente de hace 2 días', S.enCurso) + '</div></div>';
    h += '<div><p class="mb-1 text-[10px] uppercase tracking-wide text-neutral-500">Al crear, resultado</p><div class="flex flex-wrap gap-1">' +
      b('resultado', 'exito', 'Éxito', S.resultadoSiguiente === 'exito') + b('resultado', 'cupo', 'Sin cupo', S.resultadoSiguiente === 'cupo') + b('resultado', 'generico', 'Genérico', S.resultadoSiguiente === 'generico') + '</div></div>';
  } else {
    h += '<div><p class="mb-1 text-[10px] uppercase tracking-wide text-neutral-500">Detalle</p><div class="flex flex-wrap gap-1">' +
      b('detalle-estado', 'recienCreado', 'Recién creado', S.detalleEstado === 'recienCreado') + b('detalle-estado', 'vistoDespues', 'Visto después', S.detalleEstado === 'vistoDespues') + '</div></div>';
    h += '<p class="text-[11px] text-neutral-400">Para cambiar notificación o ambiente, crea de nuevo desde la pestaña 1.</p>';
  }
  return h;
}

/* ───────────── Toast ───────────── */
function toast(titulo, texto, tipo) {
  const c = tipo === 'pruebas' ? 'border-rose-200 bg-rose-50 text-rose-900' : 'border-emerald-200 bg-emerald-50 text-emerald-900';
  const el = document.createElement('div');
  el.className = 'toast-in rounded-md border p-3 text-sm shadow-md ' + c;
  el.innerHTML = '<div class="font-semibold">' + titulo + '</div><div class="mt-0.5">' + texto + '</div>';
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

/* ───────────── Render ───────────── */
function irTab(t) { S.tab = t; S.vista = t === 'detalle' && !S.sesion ? 'formulario' : t; if (t === 'detalle' && !S.sesion) S.tab = 'formulario'; render(); }
function render() {
  const t = TABS.find(x => x[0] === S.tab);
  document.getElementById('titulo-flujo').textContent = t[1];
  document.getElementById('nota-flujo').textContent = t[2];
  document.getElementById('tabs').innerHTML = TABS.map(([k, txt]) => '<button data-tab="' + k + '" class="rounded-t-md px-3 py-1.5 ' + (S.tab === k ? 'bg-white font-semibold text-slate-900' : 'text-slate-300 hover:bg-slate-800') + '">' + txt + '</button>').join('');
  document.getElementById('franja').innerHTML = franja();
  document.getElementById('lateral').innerHTML = lateral();
  document.getElementById('panel-grupo').innerHTML = panelGrupo();
  document.getElementById('migas').innerHTML = migas();
  document.getElementById('pagina').innerHTML = S.vista === 'detalle' && S.sesion ? vistaDetalle() : vistaFormulario();
  document.getElementById('panel-cuerpo').innerHTML = panelEstados();
  history.replaceState(null, '', S.vista === 'detalle' && S.sesion ? '#/quac/validacion-fotos/gestion/' + S.sesion.ref : '#/quac/validacion-fotos/generar-link');
  pintarIconos(document);
}

function crearEnlace() {
  S.errorApi = null; S.envio = 'enviando'; render();
  return setTimeout(() => {
    S.envio = 'normal';
    if (S.resultadoSiguiente !== 'exito') { S.errorApi = S.resultadoSiguiente; return render(); }
    const ref = uuid(Date.now() % 100000);
    S.sesion = { ref, doc: S.form.doc, comercioIdx: S.form.comercioIdx, bodega: S.form.bodegaElegida || { code: '—', nombre: '', ciudad: '', fuera: true }, notificar: S.form.notificar === 'si', f: '2026-10-27 11:42' };
    S.detalleEstado = 'recienCreado'; S.copiado = false; S.vista = 'detalle'; S.tab = 'detalle';
    render();
    toast('Enlace creado', S.form.notificar === 'si' ? 'Se envió por WhatsApp y queda visible en la sesión.' : 'Queda visible en la sesión para pasarlo al cliente.');
  }, 700);
}

/* ───────────── Eventos ───────────── */
document.addEventListener('click', e => {
  const el = sel => e.target.closest(sel);
  let x;
  if ((x = el('[data-tab]'))) return irTab(x.dataset.tab);
  if ((x = el('[data-grupo]'))) { S.panelGrupo = !S.panelGrupo; return render(); }
  if ((x = el('[data-cerrar-grupo]'))) { S.panelGrupo = false; return render(); }
  if ((x = el('[data-ir-form]'))) { S.panelGrupo = false; S.vista = 'formulario'; S.tab = 'formulario'; return render(); }
  if ((x = el('[data-ambiente]'))) {
    const v = x.dataset.ambiente; if (v === S.ambiente) return;
    S.ambiente = v; S.form.comercioIdx = 0; S.form.bodegaElegida = null; S.form.bodegaTexto = ''; S.errorApi = null;
    render();
    return v === 'pruebas' ? toast('Cambiaste a Pruebas', 'El formulario crea enlaces contra la API de pruebas hasta que cierres sesión.', 'pruebas') : toast('Volviste a Producción', 'Los enlaces se crean contra la API real.');
  }
  if ((x = el('[data-bodega-elegir]'))) {
    const b = bodegasActivas().find(z => z[0] === x.dataset.bodegaElegir);
    S.form.bodegaElegida = { code: b[0], nombre: b[1], ciudad: b[2], fuera: false }; S.form.bodegaTexto = '';
    return render();
  }
  if ((x = el('[data-bodega-usar-tal-cual]'))) {
    S.form.bodegaElegida = { code: x.dataset.bodegaUsarTalCual, fuera: true }; S.form.bodegaTexto = '';
    return render();
  }
  if ((x = el('[data-bodega-cambiar]'))) { S.form.bodegaElegida = null; S.form.bodegaTexto = ''; return render(); }
  if ((x = el('[data-copiar-enlace]'))) {
    S.copiado = true; render();
    toast('Copiado', 'El enlace quedó en el portapapeles.');
    setTimeout(() => { S.copiado = false; render(); }, 1800);
    return;
  }
  if ((x = el('#btn-crear'))) {
    if (S.envio === 'enviando') return; // evita doble clic
    const doc = document.getElementById('f-doc').value.trim();
    S.form.doc = doc;
    if (!doc) { S.errorDoc = 'vacio'; return render(); }
    if (!/^\d+$/.test(doc)) { S.errorDoc = 'letras'; return render(); }
    S.errorDoc = null;
    if (!S.form.notificar) { S.errorNotificar = true; return render(); }
    if (S.enCurso) { S.avisoEnCurso = true; return render(); }
    return crearEnlace();
  }
  if ((x = el('#btn-cancelar-aviso'))) { S.avisoEnCurso = false; return render(); }
  if ((x = el('#btn-crear-igual'))) { S.avisoEnCurso = false; return crearEnlace(); }
  // Panel del mockup
  if ((x = el('[data-en-curso]'))) { S.enCurso = x.dataset.enCurso === 'si'; S.avisoEnCurso = false; return render(); }
  if ((x = el('[data-credenciales]'))) { S.credencialesPruebas = x.dataset.credenciales === 'si'; return render(); }
  if ((x = el('[data-doc]'))) { S.errorDoc = x.dataset.doc === 'ok' ? null : x.dataset.doc; return render(); }
  if ((x = el('[data-bodega-demo]'))) {
    const v = x.dataset.bodegaDemo;
    S.form.bodegaElegida = v === 'ninguna' ? null : v === 'catalogo' ? { code: '310', nombre: 'Stirpe Unicentro', ciudad: 'Pereira', fuera: false } : { code: '413', fuera: true };
    S.form.bodegaTexto = ''; return render();
  }
  if ((x = el('[data-resultado]'))) { S.resultadoSiguiente = x.dataset.resultado; return render(); }
  if ((x = el('[data-detalle-estado]'))) { S.detalleEstado = x.dataset.detalleEstado; S.copiado = false; return render(); }
  if ((x = el('#panel-plegar'))) { document.getElementById('panel-cuerpo').classList.toggle('hidden'); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'f-bodega') { S.form.bodegaTexto = e.target.value; return render2ConFoco('f-bodega'); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'f-comercio') { S.form.comercioIdx = +e.target.value; render(); }
  if (e.target.name === 'notificar') { S.form.notificar = e.target.value; S.errorNotificar = false; render(); }
});
// Re-render que conserva el foco y el cursor del input de bodega (se repinta en cada tecla).
function render2ConFoco(id) {
  const pos = document.getElementById(id) ? document.getElementById(id).selectionStart : null;
  render();
  const el = document.getElementById(id);
  if (el) { el.focus(); if (pos != null) el.setSelectionRange(pos, pos); }
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.panelGrupo) { S.panelGrupo = false; render(); }
  if (e.key === 'Enter' && e.target.id === 'f-doc') document.getElementById('btn-crear').click();
});
render();
</script>
</body>
</html>
