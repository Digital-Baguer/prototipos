<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GW-153 · Mis Ventas — la venta recaudada como dato principal</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* Pila real de get-web verificada contra el CSS de produccion: Tailwind v4 compila
     `.font-sans` con el stack literal. (El override --font-sans de app.css es codigo muerto.) */
  html, body { font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"; }
  .cifra { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .skeleton { background: linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 37%,#f1f5f9 63%); background-size: 400% 100%; animation: sk 1.4s ease infinite; }
  @keyframes sk { 0%{background-position:100% 50%} 100%{background-position:0 50%} }
</style>
</head>
<body class="overflow-x-hidden bg-slate-100 text-slate-900 antialiased">

<!-- ══ Barra del mockup (no es UI del producto) ══ -->
<div class="sticky top-0 z-50 border-b border-indigo-200 bg-indigo-50/95 px-4 py-2 backdrop-blur">
  <div class="mx-auto flex max-w-[1180px] flex-wrap items-center gap-x-6 gap-y-2 text-[11px]">
    <span class="font-bold text-indigo-900">GW-153 · mockup</span>
    <label class="flex items-center gap-1.5">
      <span class="text-indigo-800">Vista:</span>
      <select id="vista" class="rounded border border-indigo-300 bg-white px-1.5 py-0.5">
        <option value="despues">DESPUÉS (propuesto)</option>
        <option value="antes">ANTES (hoy en producción)</option>
        <option value="lado">Los dos, lado a lado</option>
      </select>
    </label>
    <label class="flex items-center gap-1.5">
      <span class="text-indigo-800">Caso:</span>
      <select id="caso" class="rounded border border-indigo-300 bg-white px-1.5 py-0.5">
        <option value="pendiente">Con pagos pendientes (real)</option>
        <option value="cobrado">Todo cobrado</option>
        <option value="cumplido">Meta ya superada</option>
        <option value="sinmeta">Sin presupuesto</option>
        <option value="cargando">Cargando</option>
        <option value="error">Error</option>
      </select>
    </label>
    <span class="text-indigo-700 sm:ml-auto">Jhon A. Rodríguez · STIRPE · Q1 sep 2026 · datos de PROD</span>
  </div>
</div>

<div class="mx-auto max-w-[1180px] px-4 py-5">
  <nav class="mb-2 text-xs text-slate-500">Dashboard <span class="mx-1">›</span> <span class="text-slate-800">Venta Asistida</span></nav>
  <h1 class="text-2xl font-bold">Mis Ventas</h1>
  <p class="mb-4 text-sm text-slate-500">Gestiona tus ventas asistidas</p>

  <div class="mb-4 inline-flex items-center gap-2 rounded-lg border border-slate-200 bg-white px-2 py-1 text-xs">
    <span class="text-slate-400">PERÍODO</span>
    <span class="rounded bg-slate-900 px-2 py-0.5 text-white">Quincena</span>
    <span class="px-2 py-0.5 text-slate-500">Mes</span>
    <span class="px-2 py-0.5 text-slate-500">Día</span>
    <span class="mx-1 h-4 w-px bg-slate-200"></span>
    <span class="font-medium">Q1 · Sep 2026</span>
  </div>

  <div id="lienzo" class="space-y-5"></div>
</div>

<template id="tpl-nota">
  <p class="text-[11px] text-slate-500"></p>
</template>

<script>
// ── Datos reales de PROD (Jhon A. Rodríguez P., cod 7374400, STIRPE, 2026-09-01→15) ──
const BASE = { meta: 28797373, recaudada: 23407456, confirmada: 27661814, pendiente: 4254358, pctConf: 96.10, pctRec: 81.30 };
const CASOS = {
  pendiente: BASE,
  cobrado:   { ...BASE, recaudada: 27661814, pendiente: 0, pctRec: 96.10 },
  cumplido:  { ...BASE, recaudada: 30500000, confirmada: 31200000, pendiente: 700000, pctRec: 105.9, pctConf: 108.3 },
  sinmeta:   { ...BASE, meta: 0, pctConf: null, pctRec: null },
};
// Detalle diario real del mismo asesor
const DIAS = [
  { f:'1 sep',  meta:4729418, conf:5805806, rec:5805806, pc:121.0, pr:121.0 },
  { f:'2 sep',  meta:5089692, conf:3625463, rec:3625463, pc:54.4,  pr:54.4  },
  { f:'3 sep',  meta:4231584, conf:3483486, rec:3483486, pc:82.3,  pr:82.3  },
  { f:'4 sep',  meta:4665551, conf:3892511, rec:3892511, pc:80.6,  pr:80.6  },
  { f:'7 sep',  meta:4978335, conf:7024253, rec:5977903, pc:141.3, pr:120.3 },
  { f:'8 sep',  meta:5102793, conf:4893848, rec:1685840, pc:95.9,  pr:33.0  },
];

const pesos = n => n === null ? '—' : '$ ' + Math.round(n).toLocaleString('es-CO');
// pctCumplimiento.ts (fix-GW-127 A4): el 100 % se reserva para el 100 % real
const pct = n => n === null ? '—' : ((n < 100 && Math.round(n) >= 100) ? 99 : Math.round(n)) + '%';
const pct1 = n => n === null ? '—' : n.toFixed(1).replace('.', ',') + '%';
// gauge.ts::semaforoGauge — escala unica del modulo
const banda = p => p === null ? null : p >= 95 ? 'verde' : p >= 80 ? 'ambar' : 'rojo';
const HEX = { verde:'#059669', ambar:'#f59e0b', rojo:'#ef4444' };
const BADGE = { verde:'bg-emerald-600', ambar:'bg-amber-500', rojo:'bg-red-500' };

function arco(p) {
  const ang = Math.min(Math.max(p ?? 0, 0), 150) / 100 * 180;
  const r = 52, cx = 70, cy = 62, a = Math.PI * (1 - ang / 180);
  const x = cx + r * Math.cos(a), y = cy - r * Math.sin(a);
  return `M ${cx - r} ${cy} A ${r} ${r} 0 ${ang > 180 ? 1 : 0} 1 ${x.toFixed(2)} ${y.toFixed(2)}`;
}

function franja(d, modo) {
  const nuevo = modo === 'despues';
  const c = banda(d.pctRec) ?? 'rojo', hex = HEX[c];
  // El gauge NO cambia: ya destaca lo recaudado desde GW-142
  const gauge = `
    <div class="mx-auto shrink-0 text-center">
      <svg viewBox="0 0 140 74" class="mx-auto w-[190px] max-w-full">
        <path d="${arco(150)}" fill="none" stroke="#f1f5f9" stroke-width="11" stroke-linecap="round"/>
        <path d="${arco(d.pctConf)}" fill="none" stroke="${hex}55" stroke-width="11" stroke-linecap="round"/>
        <path d="${arco(d.pctRec)}" fill="none" stroke="${hex}" stroke-width="11" stroke-linecap="round"/>
        <text x="70" y="58" text-anchor="middle" class="cifra" style="font-size:21px;font-weight:800;fill:#0f172a">${pct1(d.pctRec)}</text>
      </svg>
      <p class="text-center text-[11px] text-slate-600">(${pct1(d.pctConf)}) proyectado con confirmados</p>
      <p class="mt-0.5 text-center text-[11px] text-slate-600">Meta ${pesos(d.meta || null)}</p>
    </div>`;

  // La tarjeta de venta: ESTO es lo que cambia
  const tarjetaVenta = nuevo ? `
    <div class="rounded-md border border-l-4 border-slate-200 border-l-emerald-600 px-3 py-2">
      <p class="text-[10px] font-semibold tracking-wide text-slate-500 uppercase">Venta recaudada</p>
      <p class="cifra text-xl leading-tight font-extrabold">${pesos(d.recaudada)}</p>
      ${d.pendiente > 0 ? `<p class="cifra text-[10px] text-slate-500">(${pesos(d.pendiente)} confirmada por recaudar)</p>` : ''}
    </div>` : `
    <div class="rounded-md border border-l-4 border-slate-200 border-l-amber-500 px-3 py-2">
      <p class="text-[10px] font-semibold tracking-wide text-slate-500 uppercase">Venta confirmada</p>
      <p class="cifra text-xl leading-tight font-extrabold">${pesos(d.confirmada)}</p>
      <p class="cifra text-[10px] text-slate-600">(${pesos(d.recaudada)}) recaudada</p>
    </div>`;

  // "Por vender": cambia de base y de nombre
  const faltaNuevo = d.meta > 0 ? d.meta - d.recaudada : null;
  const faltaViejo = d.meta > 0 ? Math.max(0, d.meta - d.confirmada) : null;
  const cumplidoNuevo = faltaNuevo !== null && faltaNuevo <= 0;
  const tarjetaFalta = nuevo ? `
    <div class="rounded-md border border-l-4 border-slate-200 ${faltaNuevo === null ? 'border-l-slate-300' : cumplidoNuevo ? 'border-l-emerald-600' : 'border-l-red-500'} px-3 py-2">
      <p class="text-[10px] font-semibold tracking-wide text-slate-500 uppercase">Por vender y recaudar</p>
      <p class="cifra text-xl leading-tight font-extrabold ${faltaNuevo === null ? 'text-slate-400' : cumplidoNuevo ? 'text-emerald-700' : 'text-red-600'}">
        ${faltaNuevo === null ? 'Sin presupuesto' : cumplidoNuevo ? '+' + pesos(-faltaNuevo) : pesos(faltaNuevo)}
      </p>
      ${cumplidoNuevo ? '<p class="text-[10px] text-emerald-700">meta superada sobre lo recaudado</p>' : ''}
    </div>` : `
    <div class="rounded-md border border-l-4 border-slate-200 border-l-red-500 px-3 py-2">
      <p class="text-[10px] font-semibold tracking-wide text-slate-500 uppercase">Por vender</p>
      <p class="cifra text-xl leading-tight font-extrabold ${faltaViejo > 0 ? 'text-red-600' : 'text-emerald-700'}">${faltaViejo === null ? '—' : pesos(faltaViejo)}</p>
    </div>`;

  // La linea "Por recaudar" se retira en el nuevo (D3)
  const pie = nuevo ? '' : `<p class="cifra mt-2 px-1 text-[11px] text-slate-500">Por recaudar: <span class="font-semibold text-amber-700">${pesos(d.pendiente)}</span></p>`;

  return `
    <article class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
      <p class="mb-2 text-[10px] font-semibold tracking-wide text-slate-500 uppercase">% Cump. presupuesto neto</p>
      <div class="flex flex-wrap items-start gap-4">
        ${gauge}
        <div class="w-full space-y-2 sm:w-auto sm:min-w-[240px] sm:flex-1">${tarjetaVenta}${tarjetaFalta}</div>
      </div>
      ${pie}
    </article>`;
}

function detalle(modo) {
  const nuevo = modo === 'despues';
  const filas = DIAS.map(d => {
    const p1 = nuevo ? d.pr : d.pc, p2 = nuevo ? d.pc : d.pr;
    const dif = Math.round(p1) !== Math.round(p2);
    const b = banda(p1);
    return `<tr class="border-b border-slate-50">
      <th scope="row" class="px-4 py-2.5 text-left font-medium text-slate-900">${d.f}</th>
      <td class="cifra px-4 py-2.5 text-right">${pesos(d.meta)}</td>
      <td class="cifra px-4 py-2.5 text-right">${pesos(d.conf)}</td>
      <td class="cifra px-4 py-2.5 text-right">${pesos(d.rec)}</td>
      <td class="px-4 py-2.5 text-right">
        <span class="cifra inline-flex items-center rounded px-2 py-0.5 text-xs font-bold text-white ${BADGE[b]}">${pct(p1)}</span>
        ${dif ? `<span class="cifra ml-1 text-[10px] text-slate-400">(${pct(p2)})</span>` : ''}
      </td>
    </tr>`;
  }).join('');
  return `
    <section class="rounded-2xl border border-slate-200 bg-white shadow-sm">
      <header class="border-b border-slate-100 px-4 py-3">
        <h2 class="text-[11px] font-bold tracking-wide text-slate-500 uppercase">Detalle diario</h2>
      </header>
      <div class="max-w-full overflow-x-auto">
      <table class="w-full min-w-[560px] text-sm">
        <thead><tr class="text-[11px] tracking-wide text-slate-400 uppercase">
          <th class="px-4 py-2 text-left font-medium">Fecha</th>
          <th class="px-4 py-2 text-right font-medium">Meta del día</th>
          <th class="px-4 py-2 text-right font-medium">Carritos confirmados</th>
          <th class="px-4 py-2 text-right font-medium">Recaudado</th>
          <th class="px-4 py-2 text-right font-medium">Cumplimiento</th>
        </tr></thead>
        <tbody>${filas}</tbody>
      </table>
      </div>
      <p class="border-t border-slate-100 px-4 py-2 text-[10px] text-slate-400">
        Las columnas de plata no cambian (D4). Solo el badge invierte cuál cifra manda.
      </p>
    </section>`;
}

function render() {
  const vista = document.getElementById('vista').value;
  const caso = document.getElementById('caso').value;
  const lienzo = document.getElementById('lienzo');

  if (caso === 'cargando') {
    lienzo.innerHTML = `<div class="skeleton h-[190px] rounded-2xl"></div><div class="skeleton h-[260px] rounded-2xl"></div>`;
    return;
  }
  if (caso === 'error') {
    lienzo.innerHTML = `<div class="rounded-2xl border border-red-200 bg-red-50 p-8 text-center text-sm text-red-800">
      No pudimos cargar tu tablero. <button class="ml-2 rounded-lg border border-red-300 bg-white px-3 py-1 text-xs font-medium text-red-700">Reintentar</button></div>`;
    return;
  }

  const d = CASOS[caso];
  if (vista === 'lado') {
    lienzo.innerHTML = `
      <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
        <div><p class="mb-2 text-[11px] font-bold tracking-wide text-slate-400 uppercase">Antes · hoy en producción</p>${franja(d,'antes')}</div>
        <div><p class="mb-2 text-[11px] font-bold tracking-wide text-emerald-700 uppercase">Después · propuesto</p>${franja(d,'despues')}</div>
      </div>
      <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
        <div>${detalle('antes')}</div><div>${detalle('despues')}</div>
      </div>`;
  } else {
    lienzo.innerHTML = franja(d, vista) + detalle(vista);
  }
}
['vista','caso'].forEach(id => document.getElementById(id).addEventListener('change', render));
render();
</script>
</body>
</html>
