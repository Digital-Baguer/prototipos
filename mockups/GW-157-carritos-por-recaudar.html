        <td class="cifra px-3 py-2.5 text-right">${x.ppt === null ? '<span class="text-gray-300">—</span>' : pesos(x.ppt)}</td></tr>`).join('')}</tbody>
      <tfoot><tr class="border-t-2 border-gray-200 bg-gray-50 font-semibold">
        <td class="col-fija left-0 bg-gray-50 px-3 py-2.5 text-gray-800">Total</td><td class="cifra px-3 py-2.5 text-right">${pesos(T.meta)}</td><td class="cifra px-3 py-2.5 text-right">${pesos(T.total)}</td><td class="px-3 py-2.5 text-center">${pill(T.total / T.meta * 100)}</td>
        <td class="cifra px-3 py-2.5 text-right">${entero(T.nped)}</td><td class="cifra px-3 py-2.5 text-right bg-emerald-50/60">${entero(T.unid)}</td><td class="cifra px-3 py-2.5 text-right">${pesos(TIENDA.vpt)}</td><td class="cifra px-3 py-2.5 text-right">${entero(T.itemsUpt)}</td><td class="cifra px-3 py-2.5 text-right">${dec2(TIENDA.upt)}</td><td class="cifra px-3 py-2.5 text-right">${pesos(TIENDA.ppt)}</td>
      </tr></tfoot>
    </table></div>
    <p class="mt-3 text-[11px] text-gray-400">D7: «Unidades» entre «Nro pedidos» y «VPT», ocultable como las demás, con total en el pie. El sombreado verde solo señala la columna nueva en el mockup. Con estas tres columnas la coordinadora verifica UPT = unidades ÷ pedidos y PPT = (Pedidos web + Facturado) ÷ unidades.</p>
  </section>
  ${consolidadoHtml(META_TIENDA, pendTienda())}`;
}

// ═══ MODAL «Carritos por recaudar» (ModalCarritosPorRecaudar.vue · primitivas de reka, clases de ModalDia) ═══
const PAGO_CHIP = 'bg-slate-400 text-white';
function filaHtml(f, puedeArchivar) {
  return `
  <tr class="align-top hover:bg-slate-50/70" data-fila="${f.id}">
    <td class="whitespace-nowrap px-4 py-3"><a class="text-xs font-medium text-blue-600 hover:underline" title="Abrir para editar">#${f.id}</a><p class="mt-0.5 text-[11px] text-slate-400">${f.fecha}</p></td>
    <td class="max-w-56 px-4 py-3 text-xs"><p class="font-medium text-slate-800">${f.cliente}</p><p class="mt-0.5 text-[11px] text-slate-400">${f.cel} · ${f.ciudad}</p></td>
    <td class="whitespace-nowrap px-4 py-3"><span class="rounded px-2 py-1 text-[11px] font-semibold ${f.origen === 'WhatsApp' ? 'bg-slate-100 text-slate-600' : 'bg-slate-900 text-white'}">${f.origen}</span></td>
    <td class="px-4 py-3 text-xs"><p class="text-slate-700">${f.msj}</p>${f.cobro ? `<p class="mt-0.5 text-[11px] text-slate-400">${f.cobro}</p>` : ''}</td>
    <td class="min-w-40 px-4 py-3 text-xs"><p class="text-slate-400">Pendiente</p></td>
    <td class="whitespace-nowrap px-4 py-3 text-center"><span class="rounded px-2 py-1 text-[11px] font-bold ${PAGO_CHIP}">Pendiente</span></td>
    <td class="whitespace-nowrap px-4 py-3 text-xs">${f.pedido ? `<p class="font-medium text-slate-700">#${f.pedido}</p><p class="mt-0.5 text-[11px] text-slate-400">Pendiente</p>` : '<span class="text-slate-300">—</span>'}</td>
    <td class="whitespace-nowrap px-4 py-3 text-xs"><span class="text-slate-300">—</span></td>
    <td class="px-4 py-3 text-right text-xs tabular-nums text-slate-700">${f.items}</td>
    <td class="whitespace-nowrap px-4 py-3 text-right text-xs font-semibold tabular-nums text-slate-800">${pesos(f.total)}</td>
    <td class="whitespace-nowrap px-4 py-3 text-right"><div class="flex justify-end gap-1.5">
      <a class="inline-flex items-center rounded-lg border border-slate-200 p-1.5 text-slate-600 hover:bg-slate-50" title="Abrir para editar" aria-label="Abrir para editar">${ICO.link}</a>
      ${puedeArchivar ? `<button type="button" title="Archivar" class="inline-flex items-center gap-1.5 rounded-lg border border-slate-200 px-2.5 py-1.5 text-xs font-medium text-slate-700 hover:bg-slate-50" data-archivar="${f.id}">${ICO.archive} Archivar</button>` : ''}
    </div></td>
  </tr>`;
}
function tablaHtml(filas, puedeArchivar) {
  return `
  <div class="overflow-x-auto"><table class="min-w-[1320px] w-full text-left text-sm">
    <thead class="border-b bg-slate-50 text-[11px] font-semibold tracking-wide text-slate-500 uppercase"><tr>
      <th class="px-4 py-3">Carrito ID</th><th class="px-4 py-3">Cliente</th><th class="px-4 py-3">Origen</th><th class="px-4 py-3">Mensajería</th><th class="px-4 py-3">Logística</th><th class="px-4 py-3 text-center">Pago</th><th class="px-4 py-3">Pedido</th><th class="px-4 py-3">Factura</th><th class="px-4 py-3 text-right">Ítems</th><th class="px-4 py-3 text-right">Total</th><th class="px-4 py-3 text-right">Acciones</th>
    </tr></thead>
    <tbody class="divide-y divide-slate-100">${filas.map(f => filaHtml(f, puedeArchivar)).join('')}</tbody>
  </table></div>`;
}
function cuerpoModal(estado, ambito, puedeArchivar) {
  if (estado === 'cargando') return `<div class="space-y-3" aria-label="Cargando carritos por recaudar">${[1,2,3].map(() => '<div class="skeleton h-16 rounded-xl"></div>').join('')}</div>`;
  if (estado === 'error') return `<div class="rounded-xl border border-red-200 bg-red-50 p-8 text-center text-sm text-red-800" role="alert"><p>No pudimos cargar los carritos por recaudar.</p><button type="button" class="mt-3 rounded-lg border border-red-300 bg-white px-3 py-1.5 text-xs font-medium text-red-700">Reintentar</button></div>`;
  const b = bloque(ambito === 'tienda' ? null : FAB.cod);
  if (estado === 'vacio' || b.cantidad === 0) return `<div class="rounded-xl border border-dashed border-slate-300 bg-slate-50 p-10 text-center text-sm text-slate-500">No hay carritos por recaudar en este período.</div>`;
  const factor = estado === 'siniva' ? 1 / 1.19 : 1;
  const aviso = '';
  if (ambito !== 'tienda') return aviso + `<section class="overflow-hidden rounded-2xl border bg-white shadow-sm">${tablaHtml(b.grupos[0].filas, puedeArchivar)}</section>`;
  return aviso + b.grupos.map(g => `
  <section class="overflow-hidden rounded-2xl border bg-white shadow-sm" data-grupo="${g.cod}">
    <header class="flex flex-wrap items-center gap-3 border-b bg-slate-50/70 px-4 py-2.5">
      <span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full text-[10px] font-bold text-white ${AVATAR[g.cod] || 'bg-slate-500'}">${iniciales(g.nombre)}</span>
      <div class="min-w-0"><p class="text-sm font-semibold capitalize text-slate-900">${g.nombre.toLowerCase()}</p><p class="text-[11px] text-slate-500">código ${g.cod}</p></div>
      <p class="cifra ml-auto text-xs text-slate-600">${g.filas.length} ${g.filas.length === 1 ? 'carrito' : 'carritos'} · <span class="text-sm font-bold text-slate-900">${pesos(subtotal(g) * factor)}</span></p>
    </header>
    ${tablaHtml(g.filas, puedeArchivar)}
  </section>`).join('<div class="h-3"></div>');
}
function modalHtml(estado, ambito, puedeArchivar, encima) {
  const b = bloque(ambito === 'tienda' ? null : FAB.cod);
  const sub = ambito === 'tienda' ? 'STIRPE · 1 – 15 sep 2026' : `<span class="capitalize">${FAB.nombre.toLowerCase()}</span> · código ${FAB.cod} · 1 – 15 sep 2026`;
  // C1: en un mes con base «sin IVA» la cifra de la tarjeta (y la cabecera y los subtotales del modal) es el bruto ÷ 1,19; las filas conservan el bruto.
  const factor = estado === 'siniva' ? 1 / 1.19 : 1;
  const cifra = estado === 'cargando' ? '<div class="skeleton h-7 w-40 rounded"></div>' : estado === 'error' ? '<p class="cifra text-xl font-extrabold text-slate-300">—</p>' : `<p class="cifra text-xl leading-tight font-extrabold text-slate-900">${pesos(estado === 'vacio' ? 0 : b.total * factor)}</p><p class="cifra text-[11px] text-slate-500">${estado === 'vacio' ? 0 : b.cantidad} carritos confirmados sin pagar</p>`;
  const notaBase = estado === 'siniva' ? `<p class="mt-1 text-[11px] text-slate-500">Total y subtotales en la base del mes (<span class="font-semibold">sin IVA</span>); cada fila muestra el valor del carrito.</p>` : '';
  return `
  <div class="fixed inset-0 z-${encima ? '50' : '40'} flex items-start justify-center bg-slate-950/40 p-4 pt-20 sm:items-center sm:pt-20" data-backdrop-recaudar>
    <section role="dialog" aria-modal="true" aria-labelledby="titulo-recaudar" class="flex max-h-[calc(90vh-3rem)] w-full max-w-[min(96vw,1500px)] flex-col overflow-hidden rounded-2xl bg-white shadow-2xl">
      <header class="flex items-start justify-between gap-4 border-b border-slate-100 px-5 py-4">
        <div class="min-w-0">
          <h2 id="titulo-recaudar" class="text-base font-bold text-slate-900">Carritos por recaudar</h2>
          <p class="mt-0.5 text-xs text-slate-500">${sub}</p>
          <p class="mt-1 text-[11px] text-slate-400">Confirmados que el cliente aún no paga. Al archivar uno, sale de esta lista y de la cifra de la tarjeta.</p>${notaBase}
        </div>
        <div class="flex items-start gap-4">
          <div class="text-right">${cifra}</div>
          <button type="button" aria-label="Cerrar" class="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-600" data-cerrar-recaudar>${ICO.x}</button>
        </div>
      </header>
      <div class="min-h-0 overflow-auto p-4" id="cuerpo-recaudar">${cuerpoModal(estado, ambito, puedeArchivar)}</div>
    </section>
  </div>`;
}

// ═══ Modal de motivo (ModalArchivar.vue, GW-143) — se abre encima del modal de carritos ═══
const MOTIVOS = { 1:'Desiste de la compra', 2:'No responde', 3:'No pagó a tiempo', 4:'Carrito repetido', 5:'Pruebas de desarrollo' };
function modalArchivarHtml(f, asesorNombre) {
  return `
  <div class="fixed inset-0 z-[70] flex items-center justify-center bg-black/40 p-4" data-backdrop-archivar>
    <div class="w-full max-w-md rounded-2xl bg-white shadow-xl">
      <div class="border-b px-5 py-4"><h3 class="text-base font-bold text-gray-900">Archivar <span class="cifra">#${f.id}</span></h3><p class="mt-0.5 text-xs text-slate-500">Venta de <span class="font-medium capitalize text-slate-700">${asesorNombre.toLowerCase()}</span></p></div>
      <div class="space-y-3 px-5 py-4">
        <div class="flex items-center justify-between rounded-xl bg-gray-50 px-4 py-3"><div><p class="text-sm font-medium text-gray-800">${f.cliente}</p><p class="cifra text-[11px] text-gray-500">${f.fecha}</p></div><span class="cifra text-lg font-bold text-gray-900">${pesos(f.total)}</span></div>
        <div><select id="arch-motivo" class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm text-gray-700 focus:ring-1 focus:ring-gray-900 focus:outline-none"><option value="">Motivo…</option>${Object.entries(MOTIVOS).map(([k,v]) => `<option value="${k}">${v}</option>`).join('')}</select><p id="arch-error" class="mt-1.5 hidden text-xs font-medium text-rose-600">Elige un motivo.</p></div>
        <input id="arch-nota" type="text" maxlength="255" class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm text-gray-700 placeholder:text-gray-400 focus:ring-1 focus:ring-gray-900 focus:outline-none" placeholder="Nota (opcional)">
        <p class="rounded-lg bg-slate-50 px-3 py-2 text-xs text-slate-600">Sale de la venta y de la comisión. El link de pago del cliente seguirá activo: si paga, el carrito vuelve solo a sus ventas.</p>
      </div>
      <div class="flex justify-end gap-2 border-t px-5 py-3.5"><button type="button" class="rounded-lg border border-gray-200 px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-50" data-cancelar-archivar>Cancelar</button><button type="button" class="rounded-lg bg-gray-900 px-4 py-2 text-sm font-medium text-white hover:bg-gray-800" data-confirmar-archivar="${f.id}">Archivar</button></div>
    </div>
  </div>`;
}
function toast(texto) { const t = document.createElement('div'); t.className = 'fixed bottom-5 right-5 z-[90] rounded-lg bg-gray-900 px-4 py-2.5 text-sm text-white shadow-lg'; t.textContent = texto; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

// ═══ Render ═══
let filaEnArchivo = null;
const $ = id => document.getElementById(id);
function render() {
  const pantalla = $('pantalla').value, modal = $('modal').value, tarjeta = $('tarjeta').value, permiso = $('permiso').value === 'si';
  $('tarjeta-wrap').style.visibility = pantalla === 'tienda' ? '' : 'hidden';
  $('permiso-wrap').style.visibility = (pantalla === 'misventas' || pantalla === 'tabla') ? 'hidden' : '';
  document.getElementById('modal').parentElement.style.visibility = pantalla === 'tabla' ? 'hidden' : '';
  let fondo = '', capas = '';
  FACTOR_CIFRA = modal === 'siniva' ? 1 / 1.19 : 1;
  if (pantalla === 'tienda') { fondo = pantallaTienda(tarjeta); if (modal !== 'cerrado') capas += modalHtml(modal, 'tienda', permiso, false); }
  if (pantalla === 'asesor') { const p = pantallaAsesor(); fondo = p.fondo; capas += p.modal; if (modal !== 'cerrado') capas += modalHtml(modal, 'asesor', permiso, true); }
  if (pantalla === 'misventas') { fondo = pantallaMisVentas(); if (modal !== 'cerrado') capas += modalHtml(modal, 'asesor', true, false); }
  if (pantalla === 'tabla') { fondo = pantallaTabla(); }
  if (filaEnArchivo) { const g = GRUPOS.find(g => g.filas.some(f => f.id === filaEnArchivo)); const f = g && g.filas.find(f => f.id === filaEnArchivo); if (f) capas += modalArchivarHtml(f, g.nombre); }
  $('app').innerHTML = fondo; $('capas').innerHTML = capas;
  document.body.style.overflow = capas ? 'hidden' : '';
}
['pantalla','modal','tarjeta','permiso'].forEach(id => $(id).addEventListener('change', render));
$('reiniciar').addEventListener('click', () => { GRUPOS = JSON.parse(JSON.stringify(GRUPOS_BASE)); render(); });
document.addEventListener('click', e => {
  const t = e.target.closest('[data-abrir],[data-cerrar-recaudar],[data-cerrar-asesor],[data-archivar],[data-cancelar-archivar],[data-confirmar-archivar],[data-backdrop-recaudar],[data-backdrop-archivar]');
  if (!t) return;
  if (t.dataset.abrir !== undefined) { $('modal').value = 'normal'; render(); return; }
  if (t.dataset.cerrarRecaudar !== undefined || (t.dataset.backdropRecaudar !== undefined && e.target === t)) { $('modal').value = 'cerrado'; render(); return; }
  if (t.dataset.cerrarAsesor !== undefined) { $('pantalla').value = 'tienda'; $('modal').value = 'cerrado'; render(); return; }
  if (t.dataset.archivar !== undefined) { filaEnArchivo = t.dataset.archivar; render(); return; }
  if (t.dataset.cancelarArchivar !== undefined || (t.dataset.backdropArchivar !== undefined && e.target === t)) { filaEnArchivo = null; render(); return; }
  if (t.dataset.confirmarArchivar !== undefined) {
    if (!$('arch-motivo').value) { $('arch-error').classList.remove('hidden'); return; }
    // D5: el servidor archiva; el front recarga el bloque y la cifra: la fila desaparece y la cifra baja el mismo aporte (en la base del mes).
    GRUPOS.forEach(g => { g.filas = g.filas.filter(f => f.id !== filaEnArchivo); });
    filaEnArchivo = null; render(); toast('Carrito archivado correctamente.'); return;
  }
});
const qs = new URLSearchParams(location.search);
['pantalla','modal','tarjeta','permiso'].forEach(id => { if (qs.get(id)) $(id).value = qs.get(id); });
render();
</script>
</body>
</html>
