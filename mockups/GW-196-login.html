<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GW-196 · Login de GET · propuestas y temas de Halloween</title>
<link rel="preconnect" href="https://fonts.bunny.net">
<link href="https://fonts.bunny.net/css?family=instrument-sans:400,500,600,700" rel="stylesheet">
<style>
/* Tokens tomados de get-web resources/css/app.css + paleta ADR-006 */
:root{
  --negro:#18181b;          /* --gw-sidebar-background: el login se ve como el menú del panel */
  --menta:#34d399;          /* --gw-sidebar-accent */
  --menta-marca:#31f8c7;    /* verde del panel de login actual */
  --esmeralda:#059669;      /* --secondary: foco de inputs */
  --rosa:#db2777;           /* error: rosa bloqueante (ADR-006) */
  --rosa-texto:#be185d;
  --rosa-luz:#f472b6;
  --gris-50:#f8fafc;
  --gris-txt:#737373;       /* --muted-foreground */
  --borde:#e5e5e5;          /* --input */
  --fg:#0a0a0a;
  --primario:#171717;       /* --primary: botón */
  --radio:6px;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;color:var(--fg);background:#d4d4d8;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}

/* ───────── Barra del mockup (no es parte del producto) ───────── */
.mk{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:8px 16px;background:#27272a;color:#d4d4d8;font-size:12px;font-family:ui-sans-serif,system-ui,sans-serif}
.mk b{color:#fff;font-weight:600;margin-right:6px}
.mk .g{display:flex;align-items:center;gap:4px}
.mk .g>span{color:#a1a1aa;margin-right:4px}
.mk button{border:1px solid #3f3f46;background:#18181b;color:#d4d4d8;border-radius:6px;padding:4px 9px;font-size:12px}
.mk button[aria-pressed="true"]{background:#fafafa;color:#18181b;border-color:#fafafa}
.mk .pista{color:#a1a1aa;margin-left:auto}
.mk .pista code{color:#34d399}

/* ───────── Escenario ───────── */
.escenario{height:calc(100vh - var(--mk-h,46px));display:flex;align-items:center;justify-content:center}
.marco{width:100%;height:100%;container-type:inline-size;position:relative;overflow:hidden;background:var(--gris-50)}
.escenario.movil .marco{width:390px;height:min(844px,calc(100% - 32px));border-radius:28px;box-shadow:0 0 0 10px #18181b,0 30px 60px rgba(0,0,0,.35)}
.marco>.app{position:absolute;inset:0;overflow:auto}

/* ───────── Formulario compartido (contrato: username, password, remember) ───────── */
.form{width:100%;max-width:400px;display:flex;flex-direction:column;gap:28px}
.encabezado h1{font-size:30px;line-height:1.15;font-weight:600;letter-spacing:-.02em;color:#0f172a}
.encabezado p{margin-top:8px;font-size:14px;color:var(--gris-txt)}
.ayuda{text-align:center;font-size:13px;line-height:1.5;color:#52525b;max-width:46ch;margin:-4px auto 0}
form{display:flex;flex-direction:column;gap:20px}
.campo{display:flex;flex-direction:column;gap:8px}
.campo label{font-size:14px;font-weight:500;line-height:1}
.inp{position:relative}
.inp input{width:100%;height:48px;padding:0 12px;border:1px solid var(--borde);border-radius:var(--radio);background:#fff;font:inherit;font-size:14px;color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.05);transition:border-color .15s,box-shadow .15s}
.inp input::placeholder{color:var(--gris-txt)}
.inp input:focus-visible{outline:none;border-color:var(--esmeralda);box-shadow:0 0 0 3px rgba(5,150,105,.22)}
.inp input[readonly]{background:#f4f4f5;color:#52525b}
.inp.clave input{padding-right:48px}
.inp.mal input{border-color:var(--rosa)}
.inp.mal input:focus-visible{box-shadow:0 0 0 3px rgba(219,39,119,.18)}
.ojo{position:absolute;right:0;top:0;width:48px;height:48px;display:grid;place-items:center;border:0;background:none;color:var(--gris-txt);border-radius:var(--radio)}
.ojo:focus-visible{outline:2px solid var(--esmeralda);outline-offset:-4px}
.error{font-size:13px;color:var(--rosa-texto);line-height:1.35}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;cursor:pointer;user-select:none;width:max-content}
.chk input{position:absolute;opacity:0;pointer-events:none}
.chk .caja{width:16px;height:16px;border:1px solid #d4d4d8;border-radius:4px;display:grid;place-items:center;background:#fff;color:#fafafa;transition:background .12s}
.chk input:checked+.caja{background:var(--primario);border-color:var(--primario)}
.chk input:not(:checked)+.caja svg{visibility:hidden}
.chk input:focus-visible+.caja{box-shadow:0 0 0 3px rgba(10,10,10,.25)}
.btn{margin-top:8px;height:48px;width:100%;border:0;border-radius:var(--radio);background:var(--primario);color:#fafafa;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .2s,transform .1s}
.btn:hover{background:#262626}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(5,150,105,.35)}
.btn[disabled]{opacity:.6;pointer-events:none}
.btn.entra{background:var(--esmeralda);opacity:1}
.gira{animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.pie{text-align:center;font-size:12px;color:var(--gris-txt);line-height:1.6}
.pie svg{vertical-align:-2px;color:var(--rosa-luz)}

/* ───────── Propuesta A · Panel vivo ───────── */
.a{display:grid;grid-template-columns:1.12fr 1fr;min-height:100%}
.a-panel{position:relative;background:var(--negro);color:#fafafa;overflow:hidden;min-height:100%}
.a-panel canvas{position:absolute;inset:0;display:block}
.a-cont{position:relative;pointer-events:none;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:48px 56px}
.marca{display:flex;align-items:center;gap:12px}
.marca .iso{width:40px;height:34px}
/* Logo que guiña: el ojo derecho se cierra en «^» cada 4 s (el primero al segundo de cargar) */
.iso{overflow:visible;transform-origin:50% 90%;animation:iso-ladea 4s ease-in-out 1s infinite}
.iso .ojo-d{transform-box:fill-box;transform-origin:center;animation:iso-ojo 4s ease-in-out 1s infinite}
.iso .guino{opacity:0;animation:iso-guino 4s ease-in-out 1s infinite}
@keyframes iso-ojo{0%,45%,100%{transform:scaleY(1);opacity:1}4%{transform:scaleY(.15);opacity:1}6%,40%{transform:scaleY(.15);opacity:0}}
@keyframes iso-guino{0%,5%,42%,100%{opacity:0}7%,39%{opacity:1}}
@keyframes iso-ladea{0%,50%,100%{transform:rotate(0) scale(1)}8%{transform:rotate(-10deg) scale(1.08)}36%{transform:rotate(-8deg) scale(1.06)}}
@media (prefers-reduced-motion:reduce){.iso,.iso .ojo-d,.iso .guino{animation:none}}
.marca .txt{height:30px;width:auto}
.a-titulo h2{font-size:clamp(44px,4.6cqi,64px);line-height:1;font-weight:600;letter-spacing:-.035em;max-width:10ch}
.a-titulo p{margin-top:20px;font-size:19px;color:#a1a1aa;max-width:32ch}
.a-tiendas{display:flex;gap:22px;font-size:14px;color:#71717a}
/* C · Verde GET: misma estructura de A, con el verde del login actual como protagonista */
.a.verde .a-panel{background:linear-gradient(135deg,#31f8c7 0%,rgb(32,227,178) 100%);color:var(--negro)}
.a.verde .a-titulo p{color:rgba(24,24,27,.72)}
.a.verde .a-tiendas{color:rgba(6,78,59,.8)}
/* A · Halloween: tema de temporada sobre el Panel vivo (D17–D19); solo cambia el panel */
.a.halloween .a-panel{background:#141216}
.a-titulo .temporada{display:none;margin-top:14px;font-size:15px;font-weight:500;color:#fb923c}
.a.halloween .a-titulo .temporada{display:block;max-width:34ch;line-height:1.45}
.sonido{position:absolute;top:44px;right:44px;z-index:3;display:none;align-items:center;gap:8px;height:36px;padding:0 14px 0 11px;border-radius:18px;border:1px solid #3f3f46;background:rgba(24,24,27,.7);color:#e4e4e7;font-size:13px;font-weight:500}
.sonido:hover{border-color:#fb923c;color:#fff}
.sonido:focus-visible{outline:2px solid #fb923c;outline-offset:2px}
.sonido[aria-pressed="true"]{border-color:#fb923c;color:#fdba74}
.a.halloween3 .sonido{display:inline-flex}
@container (max-width:1023px){.sonido{top:22px;right:20px;height:32px;padding:0 11px 0 9px;font-size:12px}}
.a-titulo .canto{display:none;font-size:clamp(34px,3.5cqi,50px);line-height:1.06;font-weight:600;letter-spacing:-.03em;color:#fafafa;max-width:15ch}
.a.halloween2 .a-titulo .canto{display:block}
.a.halloween2 .a-titulo h2,.a.halloween2 .a-titulo .temporada{display:none}
.a.halloween2 .a-titulo .canto+p{margin-top:22px}
@container (max-width:1023px){.a.halloween .a-titulo h2{font-size:24px}.a.halloween .a-titulo .temporada{font-size:12.5px;margin-top:8px}.a.halloween2 .a-titulo .canto{display:none}.a.halloween2 .a-titulo h2{display:block}.a.halloween2 .a-titulo .temporada{display:block}}
.a-form{display:flex;flex-direction:column;align-items:center;padding:48px 48px 46px;background:var(--gris-50)}
.a-centro{flex:1;width:100%;display:flex;align-items:center;justify-content:center}
.pie-fijo{flex:none;padding-top:24px}
@container (max-width:1023px){
  .a{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .a-panel{height:232px;min-height:0}
  .a-cont{padding:28px 24px 44px;justify-content:space-between}
  .marca .iso{width:32px;height:27px}.marca .txt{height:24px}
  .a-titulo h2{font-size:28px;max-width:none;letter-spacing:-.025em}
  .a-titulo p,.a-tiendas{display:none}
  .a-form{position:relative;margin-top:-20px;border-radius:20px 20px 0 0;padding:28px 20px 20px}
  .a-centro{align-items:flex-start}
  .encabezado h1{font-size:26px}
}

/* ───────── Propuesta B · Inmersiva ───────── */
.b{position:relative;min-height:100%;display:flex;flex-direction:column;background:
  radial-gradient(1100px 560px at 12% -10%,rgba(52,211,153,.13),transparent 60%),
  radial-gradient(900px 520px at 105% 110%,rgba(244,114,182,.10),transparent 60%),var(--gris-50)}
.b canvas{position:absolute;inset:0;display:block}
.b-marca{position:absolute;top:32px;left:40px;display:flex;flex-direction:column;gap:10px;color:var(--negro);pointer-events:none}
.b-marca p{font-size:14px;color:#52525b}
.b-centro{position:relative;flex:1;display:flex;align-items:center;justify-content:center;padding:96px 16px 24px;pointer-events:none}
.b .pie-fijo{position:relative;padding:0 16px 28px;pointer-events:none}
.tarjeta{pointer-events:auto;width:440px;max-width:100%;padding:36px 36px 28px;border-radius:20px;background:rgba(255,255,255,.62);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border:1px solid rgba(255,255,255,.95);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 34px 70px -28px rgba(6,78,59,.32),0 14px 28px -16px rgba(24,24,27,.18);transition:box-shadow .4s,border-color .4s}
.tarjeta .form{max-width:none}
.tarjeta .inp input{background:rgba(255,255,255,.85)}
.tarjeta.cargando{animation:respira 1.2s ease-in-out infinite}
@keyframes respira{50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 0 0 4px rgba(52,211,153,.28),0 34px 70px -28px rgba(6,78,59,.4)}}
.tarjeta.fallo{border-color:rgba(219,39,119,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 0 0 4px rgba(244,114,182,.18),0 34px 70px -28px rgba(131,24,67,.28)}
.tarjeta.exito{border-color:rgba(52,211,153,.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 0 0 6px rgba(52,211,153,.3),0 34px 70px -28px rgba(6,78,59,.45)}
@container (max-width:1023px){
  .b-marca{top:24px;left:20px}
  .b-marca .txt{height:24px}.b-marca .iso{width:32px;height:27px}
  .b-marca p{display:none}
  .b-centro{align-items:flex-start;padding:92px 14px 20px}
  .b .pie-fijo{padding-bottom:20px}
  .tarjeta{padding:26px 20px 20px;border-radius:18px}
  .encabezado h1{font-size:26px}
}
/* ───────── Propuesta D · Abre la tienda: toldo, perchero con etiquetas y letrero de neón ───────── */
.d{position:relative;min-height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(49,248,199,.10) 0,rgba(49,248,199,0) 420px),var(--gris-50)}
.d>canvas{position:absolute;inset:0;display:block;z-index:1;pointer-events:none}
.d-cenefa{position:relative;z-index:2;height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 40px;background:var(--negro);color:#fafafa}
.d-cenefa .iso{width:30px;height:26px}.d-cenefa .txt{height:22px}
.d-cenefa span{font-size:15px;font-weight:500;color:#d4d4d8}
.d-toldo{flex:none;height:136px}
.d-cuerpo{position:relative;z-index:2;flex:1;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:40px;padding:8px 72px 16px;pointer-events:none}
.d-izq h2{font-size:clamp(40px,3.9cqi,56px);line-height:1.02;font-weight:600;letter-spacing:-.035em;max-width:13ch;color:var(--negro)}
.d-perchero{height:200px;max-width:560px;margin-top:28px}
.d-der{display:flex;justify-content:center;min-width:0}
.d-tarjeta{position:relative;pointer-events:auto;width:420px;max-width:100%;padding:34px 32px 28px;border-radius:16px;background:#fff;border:1px solid #e4e4e7;box-shadow:0 24px 48px -28px rgba(6,78,59,.35)}
.d-tarjeta .form{max-width:none}
.d .pie-fijo{position:relative;z-index:2;margin-left:auto;width:48%;padding:0 72px 28px}
.letrero{position:absolute;top:-24px;right:24px;z-index:3;padding:7px 16px 8px;border-radius:10px;background:var(--negro);transform:rotate(-4deg);box-shadow:0 10px 18px -8px rgba(0,0,0,.45),inset 0 0 0 1px #27272a;pointer-events:none}
.letrero span{display:block;font-size:20px;font-weight:600;letter-spacing:.01em;color:#3f3f46;transition:color .35s,text-shadow .35s}
.letrero.medio span{color:#7ee8cf;text-shadow:0 0 4px rgba(49,248,199,.45);animation:titila 2.4s infinite}
.letrero.on span{color:#31f8c7;text-shadow:0 0 4px #31f8c7,0 0 14px rgba(49,248,199,.8),0 0 30px rgba(49,248,199,.45)}
.letrero.carga span{animation:late 1s ease-in-out infinite}
.letrero.rosa span{color:#f472b6;text-shadow:0 0 4px #f472b6,0 0 14px rgba(244,114,182,.75),0 0 28px rgba(244,114,182,.4);animation:falla .9s 1}
@keyframes titila{0%,100%{opacity:1}46%{opacity:1}48%{opacity:.35}50%{opacity:1}53%{opacity:.5}55%{opacity:1}}
@keyframes late{50%{opacity:.55}}
@keyframes falla{0%{opacity:1}12%{opacity:.2}24%{opacity:1}36%{opacity:.3}48%{opacity:1}}
.d-luz{position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(1200px 700px at 50% 0%,rgba(49,248,199,.55),rgba(49,248,199,0) 70%);opacity:0;transition:opacity .7s}
.d.abriendo .d-luz{opacity:1}
@container (max-width:1023px){
  .d-cenefa{height:48px;padding:0 20px}.d-cenefa span{display:none}
  .d-toldo{height:84px}
  .d-cuerpo{grid-template-columns:minmax(0,1fr);padding:16px 14px 16px;align-items:start}
  .d-tarjeta{width:100%}
  .d-izq{display:none}
  .d-tarjeta{padding:30px 20px 20px}
  .d .pie-fijo{width:100%;padding:0 16px 20px}
  .encabezado h1{font-size:26px}
}
@media (prefers-reduced-motion:reduce){.letrero span{animation:none!important}}
@media (prefers-reduced-motion:reduce){.tarjeta.cargando{animation:none}.gira{animation-duration:2.4s}}
</style>
</head>
<body>

<div class="mk" id="mk">
  <b>GW-196 · Login de GET</b>
  <div class="g"><span>Propuesta</span><button data-k="v" data-v="A">A · Panel vivo</button><button data-k="v" data-v="H">A · Halloween 1</button><button data-k="v" data-v="H2">A · Halloween 2</button><button data-k="v" data-v="H3">A · Halloween 3</button><button data-k="v" data-v="H4">A · Halloween 4</button><button data-k="v" data-v="R" title="Simula una recarga en temporada: 1, 3 o 4 sin repetir la anterior">Halloween al azar</button><button data-k="v" data-v="B">B · Inmersiva</button><button data-k="v" data-v="C">C · Verde GET</button><button data-k="v" data-v="D">D · Abre la tienda</button></div>
  <div class="g"><span>Estado</span><button data-k="e" data-v="normal">Normal</button><button data-k="e" data-v="enviando">Enviando</button><button data-k="e" data-v="credenciales">Credenciales incorrectas</button><button data-k="e" data-v="bloqueo">Bloqueo por intentos</button></div>
  <div class="g"><span>Ancho</span><button data-k="w" data-v="1440">1440</button><button data-k="w" data-v="390">390</button></div>
  <div class="g"><span>Movimiento</span><button data-k="m" data-v="si">Completo</button><button data-k="m" data-v="no">Reducido</button></div>
  <span class="pista">Prueba enviar: con la clave <code>get2026</code> entra; con otra, falla.</span>
</div>

<div class="escenario" id="esc"><div class="marco" id="marco"></div></div>

 ojo:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>',

/* ───────── B · La red: tiendas conectadas, pedidos que viajan hacia el centro ───────── */
function Red(cv,anfitrion,tarjeta){

  const cur={x:-999,y:-999};const t0=performance.now();
  function armarNodos(){const n=Math.min(110,Math.round(L.w*L.h/14000));nodos=Array.from({length:n},()=>({x:Math.random()*L.w,y:Math.random()*L.h,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:1.2+Math.random()*1.4}));if(reducido())cuadro(performance.now());}
  anfitrion.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();cur.x=e.clientX-r.left;cur.y=e.clientY-r.top;});
  anfitrion.addEventListener('pointerleave',()=>{cur.x=cur.y=-999;});
  const movil=()=>L.w<600;
  function centro(){const r=tarjeta.getBoundingClientRect(),c=cv.getBoundingClientRect();return{x:r.left-c.left+r.width/2,y:r.top-c.top+r.height/2};}

  function origen(t){if(!movil()){const i=Math.floor(Math.random()*marcas.length);return posMarca(marcas[i],i,t);}const n=nodos[Math.floor(Math.random()*nodos.length)];return{x:n.x,y:n.y};}
  function chip(x,y,m){ctx.font='600 12px "Instrument Sans",system-ui';const w=ctx.measureText(m.n).width+20,h=24,px=x+10,py=y-h/2;ctx.beginPath();ctx.roundRect(px,py,w,h,12);ctx.fillStyle=m.f;ctx.fill();ctx.strokeStyle=m.b;ctx.lineWidth=1;ctx.stroke();ctx.fillStyle=m.t;ctx.textBaseline='middle';ctx.fillText(m.n,px+10,y+.5);}

    cargando(v){if(v)modo='carga';else if(modo==='carga')modo='normal';},
    falla(){modo='normal';hastaRosa=performance.now()+1400;},
    exito(){modo='exito';setTimeout(()=>{if(modo==='exito')modo='normal'},1200);}};

/* ───────── A · Halloween 2: caen dulces (ventas), la calabaza los atrapa; si la clave falla, sale un sapo ───────── */
function Dulces(cv,anfitrion,snd,op={}){
  const L=lienzo(cv,armarD);const ctx=L.ctx;let raf,vivo=true,carga=false,dulces=[],textos=[],pts=[],ventas=0,ultDulce=0,ultT=performance.now(),sapo=null;

    ctx.fillStyle='rgba(194,65,12,.55)';ctx.beginPath();ctx.ellipse(0,20,16,32,0,0,6.2832);ctx.fill();
    ctx.fillStyle='#0c0a09';ctx.beginPath();ctx.ellipse(0,-10,34,7,0,0,6.2832);ctx.fill();
    ctx.fillStyle='#fde047';[[-15,12],[15,12]].forEach(([ex,ey])=>{ctx.beginPath();ctx.moveTo(ex,ey-7);ctx.lineTo(ex+7,ey+5);ctx.lineTo(ex-7,ey+5);ctx.closePath();ctx.fill();});

  let bruja=null,proxBruja=performance.now()+1500;
  function lunaPos(m){return m?{x:L.w*.84,y:L.h*.3,r:30}:{x:L.w*.76,y:L.h*.2,r:72};}

    ctx.fillStyle='#fef3c7';ctx.beginPath();ctx.arc(l.x,l.y,l.r,0,6.2832);ctx.fill();ctx.fillStyle='rgba(214,200,160,.45)';[[-.3,-.2,.18],[.25,.15,.12],[-.05,.35,.09]].forEach(([dx,dy,r])=>{ctx.beginPath();ctx.arc(l.x+dx*l.r,l.y+dy*l.r,r*l.r,0,6.2832);ctx.fill();});}

  function dibujarBruja(ahora,m){

    balde.obj=Math.max(bmin,Math.min(bmax,balde.obj));balde.x+=(balde.obj-balde.x)*(reducido()?1:.09);

    franjas.forEach((f,i)=>{
      const cx=i*sw+sw/2;let viento=0;
      if(cur.y>y0&&cur.y<y1+radio+160){const kx=Math.max(0,1-Math.abs(cx-cur.x)/150),ky=Math.max(0,1-Math.max(0,cur.y-y1)/170);viento=cur.vx*kx*ky*.0035;}
      f.v+=-f.a*.06+Math.sin(t*.9+i*.55)*.0035*brisa+viento;f.v*=.9;f.a=Math.max(-.7,Math.min(.7,f.a+f.v));
      const x=i*sw,dx=Math.sin(f.a)*16,dy=-Math.abs(Math.sin(f.a))*5;
      ctx.beginPath();ctx.moveTo(x,y0);ctx.lineTo(x+sw,y0);ctx.lineTo(x+sw/2+radio+dx,y1+dy);ctx.arc(x+sw/2+dx,y1+dy,Math.max(1,radio),0,Math.PI);ctx.closePath();
      ctx.fillStyle=i%2?'#ffffff':'#31f8c7';ctx.fill();ctx.strokeStyle='rgba(6,78,59,.14)';ctx.lineWidth=1;ctx.stroke();
    });
    ctx.globalCompositeOperation='source-atop';const gt=ctx.createLinearGradient(0,y0,0,y0+H*.6+1);gt.addColorStop(0,'rgba(6,78,59,.20)');gt.addColorStop(1,'rgba(6,78,59,0)');ctx.fillStyle=gt;ctx.fillRect(0,y0,L.w,H*.6+1);ctx.globalCompositeOperation='source-over';
    // perchero con las etiquetas de las tiendas
    const p=m?null:rel('.d-perchero');
    if(p&&p.w>0){
      const ry=p.y+8;ctx.strokeStyle='#18181b';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p.x,ry);ctx.lineTo(p.x+p.w,ry);ctx.stroke();
      ctx.fillStyle='#18181b';[p.x,p.x+p.w].forEach(xx=>{ctx.beginPath();ctx.arc(xx,ry,5,0,6.2832);ctx.fill();});
      ctx.font='600 13px "Instrument Sans",system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
      etiquetas.forEach((e,k)=>{
        const px=p.x+(k+.5)*(p.w/etiquetas.length),tw=78,th=40;
        const tx=px-Math.sin(e.a)*(e.largo+th/2),ty=ry+Math.cos(e.a)*(e.largo+th/2),d=Math.hypot(cur.x-tx,cur.y-ty);
        if(d<64)e.v+=cur.vx*.0028*(1-d/64);
        e.v+=-Math.sin(e.a)*.012+Math.sin(t*.7+k)*.0006*brisa;e.v*=.975;e.a+=e.v;
        ctx.save();ctx.translate(px,ry);ctx.rotate(e.a);
        ctx.strokeStyle='#52525b';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,e.largo+8);ctx.stroke();
        ctx.beginPath();ctx.roundRect(-tw/2,e.largo,tw,th,8);ctx.fillStyle=e.f;ctx.shadowColor='rgba(24,24,27,.14)';ctx.shadowBlur=10;ctx.shadowOffsetY=4;ctx.fill();ctx.shadowColor='transparent';
        ctx.strokeStyle=e.b;ctx.stroke();
        ctx.fillStyle='#f8fafc';ctx.beginPath();ctx.arc(0,e.largo+8,3,0,6.2832);ctx.fill();
        ctx.fillStyle=e.t;ctx.fillText(e.n,0,e.largo+25);
        ctx.restore();
      });
    }
    cur.vx*=.85;
  }
  function bucle(ahora){if(!vivo)return;cuadro(ahora);raf=requestAnimationFrame(bucle);}
  document.fonts.ready.then(()=>{if(vivo){if(reducido())cuadro(performance.now());else raf=requestAnimationFrame(bucle);}});
  return{parar(){vivo=false;cancelAnimationFrame(raf);L.ro.disconnect();},
    cargando(v){carga=v;},
    falla(){franjas.forEach(f=>f.v+=(Math.random()-.5)*.3);etiquetas.forEach(e=>e.v+=(Math.random()-.5)*.08);},
    exito(){objEnrolla=1;setTimeout(()=>{objEnrolla=0},2400);}};
}

const ajustarBarra=()=>document.documentElement.style.setProperty('--mk-h',document.getElementById('mk').offsetHeight+'px');
new ResizeObserver(ajustarBarra).observe(document.getElementById('mk'));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&motor)motor.parar();else if(!document.hidden)armar();});
armar();
</script>
