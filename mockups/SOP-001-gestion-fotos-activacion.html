function migas() {

function franja() {
  if (S.ambiente !== 'pruebas') return '';
  return '<div class="sticky top-0 z-30 flex h-10 items-center gap-3 bg-rose-600 px-6 text-sm text-white shadow">' + ic('flask', 'h-5 w-5 shrink-0') +

/* Interruptor de ambiente: mismo control segmentado que las vistas de Gestión de Entregas (bg-gray-100 p-1). */
function interruptor() {

/* ───────────── Pantalla 1: listado ───────────── */
function filasFiltradas() {
  const a = S.aplicados;
  return DATOS[S.ambiente].filter(r => {
    const d = r.f.slice(0, 10);
    if (a.doc && r.doc !== a.doc.trim()) return false;
    if (a.estado && r.e !== a.estado) return false;
    if (S.ambiente === 'prod' && (d < a.desde || d > a.hasta)) return false;
    return true;
  });
}
function vistaListado() {
  const f = S.filtros;
  const input = 'w-full rounded-md border border-gray-300 px-3 py-2 text-sm';
  let h = '<div class="flex items-start justify-between gap-4"><h1 class="!mb-0 text-xl font-semibold text-gray-900">Gestión de fotos</h1>' + interruptor() + '</div>';

  h += '<div class="rounded-lg border border-gray-200 bg-white p-4"><div class="grid grid-cols-5 items-end gap-3">' +
    '<div><label class="mb-1 block text-sm font-medium text-gray-700">Nro. Documento</label><input id="f-doc" type="text" inputmode="numeric" placeholder="Ej: 1094882301" value="' + f.doc + '" class="' + input + '"></div>' +

      Object.entries(ESTADOS).map(([k, v]) => '<option value="' + k + '" ' + (f.estado === k ? 'selected' : '') + '>' + v + '</option>').join('') + '</select></div>' +
    '<div><button id="btn-buscar" type="button" class="inline-flex h-12 w-full items-center justify-center gap-2 whitespace-nowrap rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground shadow-sm hover:bg-primary/90 disabled:opacity-50" ' + (S.carga === 'cargando' ? 'disabled' : '') + '>' + (S.carga === 'cargando' ? 'Buscando...' : 'Buscar') + '</button></div>' +

/* ───────────── Pantalla 2: detalle ───────────── */

      campo('Estado de la sesión', ESTADOS[r.e]) +

  // Validación de identidad + Crédito
  let iden;

  else if (d.identidad === 'error') iden = '<p class="text-sm text-rose-700">La validación de identidad no respondió. Se ve de nuevo cuando el cliente reintente la foto.</p>';
  else {

    });

/* Visor JSON plegable (lectura) */
function jsonColor(v, sang) {
  sang = sang || '';
  if (v === null) return '<span class="json-z">null</span>';
  if (Array.isArray(v)) return v.length ? '[\n' + v.map(x => sang + '  ' + jsonColor(x, sang + '  ')).join(',\n') + '\n' + sang + ']' : '[]';
  if (typeof v === 'object') { const k = Object.keys(v); return k.length ? '{\n' + k.map(x => sang + '  <span class="json-k">"' + x + '"</span>: ' + jsonColor(v[x], sang + '  ')).join(',\n') + '\n' + sang + '}' : '{}'; }
  if (typeof v === 'string') return '<span class="json-s">"' + v.replace(/</g, '&lt;') + '"</span>';
  if (typeof v === 'boolean') return '<span class="json-b">' + v + '</span>';
  return '<span class="json-n">' + v + '</span>';
}
function visor(titulo, dato, abierto) {
  return '<details class="rounded-md border border-gray-200" ' + (abierto ? 'open' : '') + '><summary class="flex cursor-pointer items-center gap-2 px-3 py-2 text-sm font-medium text-gray-900 hover:bg-gray-50">' +
    ic('chevron-right', 'rot h-4 w-4 text-gray-400 transition-transform') + titulo + '</summary>' +
    (dato == null ? '<div class="border-t border-gray-200 px-3 py-3 text-sm text-gray-500">Sin datos para esta foto</div>'
      : '<pre class="max-h-60 overflow-auto border-t border-gray-200 bg-gray-50 px-3 py-2 font-mono text-xs leading-5">' + jsonColor(dato) + '</pre>') + '</details>';
}
function abrirFoto(i) {
  const r = filaPorRef(S.ref, S.ambiente), p = detalleDe(r).fotos[i];
  document.getElementById('modal-cuerpo').innerHTML =
    '<div class="mb-4 flex flex-col gap-2 pr-6"><h2 class="!mb-0 flex items-center gap-2 text-lg font-semibold leading-none">' + TIPOS_FOTO[p.tipo] + ' ' + chip(ESTADOS_FOTO[p.estado], COLOR_FOTO[p.estado]) + (p.fake ? chip('Posible suplantador', 'rosa', 'shield-alert') : '') + '</h2>' +
    '<p class="text-sm text-muted-foreground">Documento ' + r.doc + ' · ' + (r.nom || 'Cliente no creado') + '</p></div>' +
    '<div class="grid grid-cols-5 gap-5"><div class="col-span-3"><img src="' + placeholder(p.tipo, 520, 360) + '" class="w-full rounded-md border border-gray-200" alt="' + TIPOS_FOTO[p.tipo] + '">' +
      '<p class="mt-1.5 text-xs text-gray-500">Foto original, sin marca de agua.</p></div>' +
    '<div class="col-span-2 space-y-3">' +
      (p.fake ? '<div class="flex gap-2 rounded-md border border-rose-200 bg-rose-50 p-3 text-sm text-rose-800">' + ic('shield-alert', 'mt-0.5 h-4 w-4 shrink-0') + '<span>La validación marcó esta foto como posible suplantador. Compárala con las otras fotos antes de responder al cliente.</span></div>' : '') +
      campo('Carga', p.carga ? 'Cargada' : 'Pendiente de cargar') + campo('Mensaje de la validación', p.msg || '<span class="text-gray-400">—</span>') +
      visor('Respuesta de la validación', p.resp, false) + visor('Seguimiento', p.track, false) +
    '</div></div>';
  const m = document.getElementById('modal'); m.classList.remove('hidden'); m.classList.add('flex'); pintarIconos(m);

function cerrarModal() { const m = document.getElementById('modal'); m.classList.add('hidden'); m.classList.remove('flex'); }

/* ───────────── Toast ───────────── */
function toast(titulo, texto, tipo) {
  const c = tipo === 'pruebas' ? 'border-rose-200 bg-rose-50 text-rose-900' : 'border-emerald-200 bg-emerald-50 text-emerald-900';
  const el = document.createElement('div');
  el.className = 'toast-in rounded-md border p-3 text-sm shadow-md ' + c;
  el.innerHTML = '<div class="font-semibold">' + titulo + '</div><div class="mt-0.5">' + texto + '</div>';
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

/* ───────────── Render ───────────── */
function render() {
  const t = TABS.find(x => x[0] === S.tab);
  document.getElementById('titulo-flujo').textContent = t[1];
  document.getElementById('nota-flujo').textContent = t[2] + (S.permiso ? '' : ' · Ahora: usuario SIN permiso de cambiar ambiente, no ve el interruptor y siempre ve Producción.');
  document.getElementById('tabs').innerHTML = TABS.map(([k, txt]) => '<button data-tab="' + k + '" class="rounded-t-md px-3 py-1.5 ' + (S.tab === k ? 'bg-white font-semibold text-slate-900' : 'text-slate-300 hover:bg-slate-800') + '">' + txt + '</button>').join('');
  document.getElementById('franja').innerHTML = franja();
  document.getElementById('lateral').innerHTML = lateral();
  document.getElementById('panel-grupo').innerHTML = panelGrupo();
  document.getElementById('migas').innerHTML = migas();
  document.getElementById('pagina').innerHTML = S.vista === 'listado' ? vistaListado() : vistaDetalle();
  document.getElementById('panel-cuerpo').innerHTML = panelEstados();
  document.title = S.vista === 'detalle' ? 'Sesión ' + S.ref.slice(0, 8) + ' · Gestión de fotos - get' : 'Gestión de fotos - get';
  // Dirección propia del detalle: se refleja en el hash (en get será /quac/validacion-fotos/gestion/{referencia})
  history.replaceState(null, '', S.vista === 'detalle' ? '#/quac/validacion-fotos/gestion/' + S.ref : '#/quac/validacion-fotos/gestion');
  pintarIconos(document);
}

/* ───────────── Eventos ───────────── */
document.addEventListener('click', e => {
  const el = sel => e.target.closest(sel);
  let x;
  if ((x = el('[data-tab]'))) return irTab(x.dataset.tab);
  if ((x = el('[data-cerrar-modal]')) || e.target.id === 'modal') return cerrarModal();
  if ((x = el('[data-foto]'))) return abrirFoto(+x.dataset.foto);
  if ((x = el('[data-grupo]'))) { S.panelGrupo = !S.panelGrupo; return render(); }
  if ((x = el('[data-cerrar-grupo]'))) { S.panelGrupo = false; return render(); }
  if ((x = el('[data-ir-listado]'))) { S.panelGrupo = false; S.vista = 'listado'; if (S.tab === 'detalle') S.tab = 'listado'; return render(); }
  if ((x = el('[data-ver]'))) { S.vista = 'detalle'; S.ref = x.dataset.ver; S.refAmbiente = S.ambiente; if (S.tab === 'listado') S.tab = 'detalle'; window.scrollTo(0, 0); return render(); }
  if ((x = el('[data-copiar]'))) return toast('Referencia copiada', S.ref);
  if ((x = el('[data-ambiente]'))) {
    const v = x.dataset.ambiente; if (v === S.ambiente) return;
    S.ambiente = v; S.pagina = 0; S.carga = 'normal';
    if (S.vista === 'listado') S.tab = v === 'pruebas' ? 'pruebas' : 'listado';
    render();
    return v === 'pruebas' ? toast('Cambiaste a Pruebas', 'Las pantallas de Validación de fotos leen la base de pruebas hasta que cierres sesión.', 'pruebas') : toast('Volviste a Producción', 'Ves de nuevo las activaciones reales.');
  }
  if ((x = el('[data-pag]'))) { S.pagina = +x.dataset.pag; return render(); }
  if ((x = el('#btn-buscar'))) {
    S.filtros = { doc: document.getElementById('f-doc').value.trim(), desde: document.getElementById('f-desde').value, hasta: document.getElementById('f-hasta').value, estado: document.getElementById('f-estado').value };
    S.carga = 'cargando'; S.pagina = 0; render();
    return setTimeout(() => { S.aplicados = Object.assign({}, S.filtros); S.carga = 'normal'; render(); }, 700);
  }
  if ((x = el('[data-reintentar]'))) { S.carga = 'cargando'; render(); return setTimeout(() => { S.carga = 'normal'; render(); }, 700); }
  // Panel del mockup
  if ((x = el('[data-permiso]'))) { S.permiso = x.dataset.permiso === 'si'; if (!S.permiso) S.ambiente = 'prod'; if (!S.permiso && S.tab === 'pruebas') S.tab = 'listado'; return render(); }
  if ((x = el('[data-carga]'))) { S.carga = x.dataset.carga; S.vista = 'listado'; if (S.tab === 'detalle') S.tab = 'listado'; return render(); }
  if ((x = el('[data-caso]'))) {
    S.ambiente = 'prod'; S.vista = 'detalle'; S.tab = 'detalle';
    S.ref = x.dataset.caso === 'noexiste' ? '00000000-0000-4000-a000-000000000000' : DATOS.prod.find(r => r.caso === x.dataset.caso).ref; S.refAmbiente = 'prod';
    return render();
  }
  if ((x = el('#panel-plegar'))) { document.getElementById('panel-cuerpo').classList.toggle('hidden'); }
});
document.addEventListener('change', e => { if (e.target.id === 'por-pagina') { S.porPagina = +e.target.value; S.pagina = 0; render(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { cerrarModal(); if (S.panelGrupo) { S.panelGrupo = false; render(); } }
  if (e.key === 'Enter' && e.target.id === 'f-doc') document.getElementById('btn-buscar').click();
});
render();
</script>
</body>
</html>
