function render(){
  document.querySelectorAll('[data-pant]').forEach(b=>b.classList.toggle('on',b.dataset.pant===est.pant));
  document.querySelectorAll('[data-lst]').forEach(b=>b.classList.toggle('on',b.dataset.lst===est.lst));
  document.querySelectorAll('[data-caso]').forEach(b=>b.classList.toggle('on',b.dataset.caso===est.caso));
  document.querySelectorAll('[data-perm]').forEach(b=>b.classList.toggle('on',est.permCorreo));document.querySelectorAll('[data-perm-txt]').forEach(b=>b.textContent=est.permCorreo?'sí':'no');
  document.querySelectorAll('[data-s]').forEach(b=>b.classList.toggle('on',b.dataset.s===est.s&&!est.conf));
  document.querySelectorAll('.mk-btn[data-conf]').forEach(b=>b.classList.toggle('on',b.dataset.conf===est.conf));
  $('#vista').innerHTML=(est.pant==='listado'?vistaListado():vistaDetalle())+modal();
  pintarIconos($('#vista'));
}
document.addEventListener('click',e=>{
  if(e.target.matches('[data-enviar]')){est.enviar=e.target.checked;return;}
  if(e.target.closest('[data-perm]')){est.permCorreo=!est.permCorreo;est.enviar=false;render();return;}
  const t=e.target.closest('[data-pant],[data-lst],[data-caso],[data-tab],[data-ver],[data-volver],[data-s],[data-conf],[data-cerrar]');
  if(!t)return;
  if(t.dataset.pant)est.pant=t.dataset.pant;
  if(t.dataset.lst){est.lst=t.dataset.lst;est.pant='listado';}
  if(t.dataset.caso){est.caso=t.dataset.caso;est.pant='detalle';}
  if(t.dataset.tab)est.tab=t.dataset.tab;
  if(t.dataset.ver){const id=+t.dataset.ver;est.caso=id===761942?'errorcargado':(DOCS.find(x=>x.id===id).pdf?'completo':'sinpdf');est.pant='detalle';}
  if(t.hasAttribute('data-volver'))est.pant='listado';
  if(t.dataset.s){const n=t.dataset.s;if(n!=='creado')est.enviar=false;est.s=n;est.conf=null;est.pant='listado';est.lst='sindoc';if(n==='creado'||n==='yaexiste'){est.lst='datos';est.tab='sincargar';}else est.tab='todos';}
  if(t.dataset.conf){if(!t.classList.contains('mk-btn')||true){est.conf=t.dataset.conf;if(t.classList.contains('mk-btn')){est.s=t.dataset.conf==='viejo'?'viejo':'reciente';est.enviar=false;}est.pant='listado';est.lst='sindoc';}}
  if(t.hasAttribute('data-cerrar'))est.conf=null;
  render();
});
pintarIconos(document);render();
