// ═══ Helpers de formato (formatCurrency / formatoPesos / pctCumplimiento / fechaCorta reales) ═══
const pesos  = n => n === null || n === undefined ? '—' : (n < 0 ? '−' : '') + '$ ' + Math.abs(Math.round(n)).toLocaleString('es-CO');
const signo  = n => !n ? '—' : (n < 0 ? '−' : '+') + '$ ' + Math.abs(Math.round(n)).toLocaleString('es-CO');
const entero = n => n === null || n === undefined ? '—' : Math.round(n).toLocaleString('es-CO');
const dec2   = n => n === null || n === undefined ? '—' : n.toLocaleString('es-CO', { minimumFractionDigits:2, maximumFractionDigits:2 });
const pct1   = n => n === null || n === undefined ? '—' : n.toLocaleString('es-CO', { minimumFractionDigits:1, maximumFractionDigits:1 }) + ' %';
const pctEnt = n => n === null || n === undefined ? '—' : Math.round(n) + '%';   // pctCumplimiento.ts (ADR-011)
const MESES  = ['ene','feb','mar','abr','may','jun','jul','ago','sept','oct','nov','dic'];
const fechaDia = f => { const [,m,d] = f.split('-'); return `${parseInt(d)} ${MESES[parseInt(m)-1]}`; };          // fechaDiariaVista
const fechaDe  = f => { const [,m,d] = f.split('-'); return `${parseInt(d)} de ${MESES[parseInt(m)-1]}`; };      // «1 de sept»
const iniciales = n => { const p = n.trim().split(/\s+/); return (p[0][0] + p[p.length-1][0]).toUpperCase(); };

// Badge de cumplimiento (paleta ADR-006): ≥100 esmeralda · 80–99 negro · <80 rosa. Sin meta: pastilla «Sin meta».
function badgeClase(p) { if (p === null || p === undefined) return null; return p >= 100 ? 'bg-emerald-600' : p >= 80 ? 'bg-slate-900' : 'bg-rose-500'; }
function badge(p, extra) {
  const c = badgeClase(p);
  if (!c) return `<span class="rounded-full border border-slate-200 bg-slate-100 px-2 py-0.5 text-[11px] font-medium text-slate-400">Sin meta</span>`;
  return `<span class="inline-block min-w-[46px] rounded px-1.5 py-0.5 text-xs font-bold text-white tnum ${c} ${extra||''}">${pctEnt(p)}</span>`;
}

};

// ═══ Cálculo de la fila y del bono del rol (lo que hará el evaluador reutilizable, D12) ═══
function derivar(r) {
  const fac = r.total - r.tie - r.dev - r.webV;
  const cump = r.meta ? r.total / r.meta * 100 : null;                    // confirmada (facturado + pagado sin factura)
  const cumpFirme = r.meta ? (r.total - r.webV) / r.meta * 100 : null;    // solo facturado
  const vpt = r.nped ? (fac + r.webV) / r.nped : null;
  const upt = r.nped ? r.unid / r.nped : null;
  // D7/D8: cumple con el % redondeado al entero; firme si lo facturado alcanza, provisional si solo con web.
  const gana = p => p !== null && Math.round(p) >= UMBRAL;
  const veredicto = r.meta === null ? 'sin_meta' : gana(cumpFirme) ? 'firme' : gana(cump) ? 'provisional' : 'no';
  return { ...r, fac, cump, cumpFirme, vpt, upt, veredicto };
}

function celdaBono(rol, d, arriba) {
  const pos = arriba ? 'tip-arriba tip-fin' : 'tip-fin';
  const guion = tip => `<span class="tip ${pos}" data-tip="${tip}"><span class="tip-t text-slate-300">—</span></span>`;
  if (rol.bono === 'cero') return guion('Sin bono configurado para este rol (monto 0 en Comisiones · Configuración).');
  if (rol.bono === 'sin_configurar') return guion('Sin bono configurado para este rol.');
  if (d.veredicto === 'sin_meta') return guion('Día sin reparto de meta: no evalúa bono.');
  const pctTxt = `Partición 12 de 12 · ${pctEnt(d.cump)}`;
  if (d.veredicto === 'no') return guion(`No cumple: venta del día ${pctEnt(d.cump)} de la meta (umbral ${UMBRAL} %). ${pctTxt}.`);
  if (d.veredicto === 'firme') {
    return `<span class="tip ${pos}" data-tip="En firme: lo facturado alcanza el ${UMBRAL} % de la meta del día. ${pctTxt}.">
      <span class="tip-t inline-flex items-center gap-1 whitespace-nowrap rounded-full bg-emerald-50 px-2 py-0.5 text-[11px] font-semibold text-emerald-700">${ICO.check}${pesos(BONO_SUPERVISOR)}</span></span>`;
  }
  // Provisional: única excepción de ámbar (GW-148 D16).
  return `<span class="tip ${pos}" data-tip="Provisional · pendiente de factura del ERP. Cuenta pedidos pagados que aún no se facturan: solo con lo facturado el día va en ${pctEnt(d.cumpFirme)}. Si la factura llega por menos, el bono se retira.">
    <span class="tip-t inline-flex items-center gap-1 whitespace-nowrap rounded-full border border-amber-200 bg-amber-50 px-2 py-0.5 text-[11px] font-semibold text-amber-700">${ICO.clock}${pesos(BONO_SUPERVISOR)}</span></span>`;
}

// Resumen del bono del rol en el rango (mismo dato para la tarjeta D9 y la fila de totales D15).
function resumenBono(rol, filas) {
  if (rol.bono !== 'configurado') return { texto:'—', firmes:0, prov:0, total:0 };
  const firmes = filas.filter(d => d.veredicto === 'firme').length;
  const prov = filas.filter(d => d.veredicto === 'provisional').length;
  const dias = firmes + prov;
  return { texto: dias ? `${dias} ${dias === 1 ? 'día' : 'días'} · ${pesos(dias * BONO_SUPERVISOR)}` : '—', firmes, prov, total: dias * BONO_SUPERVISOR };
}

function totales(filas) {
  const meta = filas.some(d => d.meta !== null) ? filas.reduce((s, d) => s + (d.meta || 0), 0) : null;
  const sum = k => filas.reduce((s, d) => s + d[k], 0);
  const conArchivo = filas.filter(d => d.tcv !== null);
  const nped = sum('nped');
  return {
    meta, webV: sum('webV'), webN: sum('webN'), fac: sum('fac'), tie: sum('tie'), dev: sum('dev'), total: sum('total'),
    cump: meta ? sum('total') / meta * 100 : null, nped,
    vpt: nped ? (sum('fac') + sum('webV')) / nped : null, upt: nped ? sum('unid') / nped : null,
    tcv: conArchivo.length ? conArchivo.reduce((s, d) => s + d.tcv * d.nped, 0) / conArchivo.reduce((s, d) => s + d.nped, 0) : null,
    diasArchivo: conArchivo.length,
  };
}

  document.getElementById('ind-header').classList.toggle('border-slate-100', !plegado);

  const filas = e.filas.map(derivar);
  const cols = columnas();
  const rb = resumenBono(ROLES[1], filas);
  resumen.textContent = e.cargando ? '' : `${filas.length} ${filas.length === 1 ? 'día' : 'días'} · Bono supervisor ${rb.texto}`;
  resumen.classList.toggle('hidden', !plegado || e.cargando);

  if (plegado) { cuerpo.innerHTML = ''; return; }

  if (e.cargando) {
    cuerpo.innerHTML = `<div class="space-y-3 p-5" aria-label="Cargando indicadores diarios">${'<div class="skeleton h-12 rounded-xl"></div>'.repeat(4)}</div>`;
    return;
  }

  const t = totales(filas);
  const th = cols.map(c => `<th scope="col" class="px-1.5 pt-3 pb-2 text-[11px] leading-tight whitespace-nowrap align-bottom ${claseCol(c)} ${c.k === 'total' ? 'text-slate-900' : ''}" style="${estiloCol(c)}">
      <span class="tip ${c.fija ? 'tip-ini' : c.k.startsWith('b_') || c.k === 'tcv' ? 'tip-fin' : ''}" data-tip="${c.tip}"><span class="tip-p">${c.t}</span></span></th>`).join('');
  const tr = filas.map((d, i) => `<tr class="group border-b border-slate-50 tnum last:border-0">${cols.map(c => {
      const fondo = (c.fija || !c.banda) ? (d.hoy ? 'bg-emerald-50' : 'bg-white group-hover:bg-slate-50') : '';
      return `<td class="px-1.5 py-2.5 whitespace-nowrap ${claseCol(c)} ${fondo}" style="${estiloCol(c)}">${celda(c, d, i, filas.length)}</td>`;
    }).join('')}</tr>`).join('');
  const tf = `<tr class="border-t border-slate-200 bg-slate-50 tnum">${cols.map(c =>
      `<td class="px-1.5 py-2.5 whitespace-nowrap ${claseCol(c)} ${c.banda ? '' : 'bg-slate-50'}" style="${estiloCol(c)}${c.fija ? ';background:#f8fafc' : ''}">${celdaTotal(c, t, filas)}</td>`).join('')}</tr>`;

  const avisoSinReparto = filas.some(d => d.sinReparto)
    ? `<div class="mx-5 mt-4 flex items-center gap-2.5 rounded-md border border-slate-200 bg-slate-50 px-3 py-2.5 text-[12px] text-slate-600">
        <span class="text-slate-400">${ICO.info}</span>Día sin reparto de meta: no evalúa bono. La venta del día cuenta para el rango, la meta queda en «—».</div>`
    : '';

  cuerpo.innerHTML = `${avisoSinReparto}
    <div class="overflow-x-clip ${avisoSinReparto ? 'mt-3' : ''}">
      <table class="w-full text-[12px]">
        <caption class="sr-only">Indicadores diarios del canal con el bono de cada rol</caption>
        <thead class="border-b border-slate-100"><tr class="font-semibold text-slate-600">${th}</tr></thead>
        <tbody>${tr}</tbody>
        <tfoot>${tf}</tfoot>
      </table>
    </div>
    <div class="space-y-1.5 rounded-b-2xl border-t border-slate-100 px-5 py-3 text-[11px] text-slate-400">
      <p>La <strong>banda gris</strong> marca las columnas que suman al <strong>Total venta</strong>. Meta, venta y % del día son de <strong>todos los asesores de la tienda</strong>; cada celda de bono se evalúa con la venta y la meta de la <strong>partición de su rol</strong>. Si la partición del rol no cubre toda la tienda, la celda muestra su propio % en el tooltip (ej. «Partición 8 de 12 · 131 %»).</p>
      <p>Meta del día del rol = Σ metas del día de su partición · Bono en firme = solo facturado · Provisional = facturado + pagado sin factura · Cumple con el % redondeado al entero (ADR-011).</p>
    </div>`;
}

// ─── Orquestación ───
function render() {
  const e = ESTADOS[estado];
  const filas = e.filas.map(derivar);
  renderSelector(e);
  renderEquipo(e, filas);
  renderIndicadores(e);
}

document.getElementById('ctrl-estados').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  estado = b.dataset.estado;
  document.querySelectorAll('#ctrl-estados button').forEach(x => x.className = 'rounded px-2 py-0.5 ' + (x === b ? 'bg-emerald-600' : 'bg-slate-700 hover:bg-slate-600'));
  render();
});
document.getElementById('ctrl-permiso').addEventListener('change', ev => { sinPermiso = ev.target.checked; render(); });
document.getElementById('ind-toggle').addEventListener('click', () => { plegado = !plegado; renderIndicadores(ESTADOS[estado]); });

// Abrir directo en una variante: #A · #B · #C · #D
const inicial = (location.hash || '').replace('#', '').toUpperCase();
if (ESTADOS[inicial]) {
  estado = inicial;
  document.querySelectorAll('#ctrl-estados button').forEach(x => x.className = 'rounded px-2 py-0.5 ' + (x.dataset.estado === estado ? 'bg-emerald-600' : 'bg-slate-700 hover:bg-slate-600'));
}
renderLofi();
render();
</script>
</body>
</html>
