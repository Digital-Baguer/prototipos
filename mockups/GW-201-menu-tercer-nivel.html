<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GW-201 · Menú de get: tercer nivel con panel al lado</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{--bg:#18181b;--border:#27272a;--hover:rgba(255,255,255,.05);--module:#a1a1aa;--module-current:#fafafa;--screen:#a1a1aa;--icon:#71717a;--active-bg:rgba(255,255,255,.10);--active-fg:#fff;--accent:#34d399;--guide:#3f3f46}
  body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}
  .side{background:var(--bg);color:var(--module)}
  .row{display:flex;align-items:center;gap:10px;margin:1px 8px;padding:8px 10px;border-radius:6px;cursor:pointer;position:relative;user-select:none}
  .row:hover{background:var(--hover)}
  .row svg{width:18px;height:18px;flex-shrink:0;color:var(--icon)}
  .row .chev{margin-left:auto;width:16px;height:16px;transition:transform .2s}
  .row.open>.chev{transform:rotate(90deg)}
  .row.current{color:var(--module-current);font-weight:600}.row.current>svg{color:var(--accent)}
  .sub{margin:4px 0 6px 25px;border-left:1px solid var(--guide);padding-left:4px}
  .scr,.grp{display:flex;align-items:center;gap:12px;padding:7px 10px;margin:1px 8px 1px 6px;border-radius:6px;color:var(--screen);cursor:pointer;position:relative}
  .scr:hover,.grp:hover{background:var(--hover)}
  .scr svg,.grp svg{width:16px;height:16px;color:var(--icon);flex-shrink:0}
  .scr.active{background:var(--active-bg);color:var(--active-fg);font-weight:500}
  .scr.active svg{color:var(--accent)}
  .scr.active::before,.grp.current::before,.row.active::before{content:"";position:absolute;left:0;top:50%;height:16px;width:2px;margin-top:-8px;border-radius:2px;background:var(--accent)}
  .grp .n{margin-left:auto;font-size:11px;color:#71717a;background:#27272a;border-radius:9px;padding:0 7px}
  .grp .chev{width:14px;height:14px;margin-left:4px;transition:transform .2s}
  .grp.inline-open .chev{transform:rotate(90deg)}
  .grp.current{background:var(--active-bg);color:var(--active-fg);font-weight:500}
  .grp.current svg{color:var(--accent)}
  .grp.opened{background:#27272a;color:#fafafa}
  .sub3{margin:2px 0 4px 22px;border-left:1px solid var(--guide);padding-left:2px}
  .pi{padding:10px 16px;border-top:1px solid var(--border);cursor:pointer;position:relative}
  .pi:hover{background:var(--hover)}
  .pi .t{color:#e4e4e7;font-weight:500}
  .pi .d{color:#71717a;font-size:12.5px;margin-top:2px}
  .pi.active{background:var(--active-bg)}
  .pi.active .t{color:#fff}
  .pi.active::before{content:"";position:absolute;left:0;top:12px;height:18px;width:3px;border-radius:2px;background:var(--accent)}
  .scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:#3f3f46;border-radius:3px}
  mark{background:rgba(52,211,153,.25);color:inherit;border-radius:2px}
  .ri{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--icon);position:relative}
  .ri:hover{background:var(--hover);color:#d4d4d8}
  .ri.current{color:var(--accent)}
  .ri svg{width:18px;height:18px}
  .dd{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px;min-width:208px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .dd .lbl{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--icon);padding:4px 8px 8px;border-bottom:1px solid var(--border);margin-bottom:6px}
  .dd .lbl svg{width:16px;height:16px;color:var(--accent)}
  .dd .it{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;color:var(--screen);cursor:pointer;font-size:14px;position:relative}
  .dd .it:hover{background:var(--hover)}
  .dd .it svg{width:16px;height:16px;color:var(--icon)}
  .dd .it.active{background:var(--active-bg);color:#fff}
  .dd .it.active svg{color:var(--accent)}
  .dd .it.opened{background:#27272a;color:#fafafa}
  .dd .it .chev{margin-left:auto;width:14px;height:14px}
</style>
</head>
<body class="bg-zinc-100 text-zinc-900">

<header class="bg-white border-b border-zinc-200 sticky top-0 z-30">
  <div class="px-6 pt-4 pb-2 flex items-baseline gap-3">
    <h1 class="text-lg font-semibold">GW-201 · Menú de get: tercer nivel que se abre en un panel al lado</h1>
    <span class="text-xs text-zinc-500">Mockup · 2026-10-22 · grupos de ejemplo: PVAL, App, Entregas, Comisiones</span>
  </div>
  <nav class="px-6 flex gap-1 text-sm" id="tabs"></nav>
</header>

<main class="p-6 flex gap-6 items-start flex-wrap" id="stage"></main>

<!-- modales (sin alert/confirm del navegador) -->
<div id="modal" class="hidden fixed inset-0 z-40 bg-black/40 flex items-center justify-center"></div>

<script>
const I = {
  dash:'<path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"/>',
  cart:'<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2 2h3l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  pct:'<path d="M19 5 5 19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>',
  mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  userplus:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/>',
  bag:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/>',
  chart:'<path d="M3 3v18h18M7 16v-4M11 16V8M15 16v-6M19 16v-9"/>',
  truck:'<path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2M15 18H9M19 18h2a1 1 0 0 0 1-1v-3.6a1 1 0 0 0-.2-.6l-3.5-4.4A1 1 0 0 0 17.5 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/>',
  bike:'<circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM12 17.5V14l-3-3 4-3 2 3h2"/>',
  eye:'<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',
  dollar:'<path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
  cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',
  card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/>',
  calc:'<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/>',
  phone:'<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/>',
  mega:'<path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  key:'<circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"/>',
  nav:'<path d="m3 11 19-9-9 19-2-8-8-2z"/>',
  chev:'<path d="m9 18 6-6-6-6"/>',
  back:'<path d="M19 12H5M12 19l-7-7 7-7"/>',
  folder:'<path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"/>',
  home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
  panel:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M16 15l-3-3 3-3"/>',
  menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  trash:'<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',
  reset:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
  save:'<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  pencil:'<path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/>',
  palette:'<circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><circle cx="6.5" cy="12.5" r="1.5"/><path d="M12 2a10 10 0 0 0 0 20c1 0 1.7-.8 1.7-1.7 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.9.8-1.7 1.7-1.7H16a6 6 0 0 0 6-6c0-4.9-4.5-8.4-10-8.4z"/>',
};
const svg = (n, cls='') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;

/* Árbol de ejemplo: menús visibles reales de PROD (get.menu, 2026-10-22) con 4 grupos de ejemplo.
   Un hijo con `items` es un GRUPO (2º nivel que solo agrupa, D5). */
let MENU = [
  {id:1, t:'Dashboard', i:'dash', href:true},
  {id:2, t:'Pedidos', i:'cart', items:[{id:201,t:'Consultar', i:'list', d:''}]},
  {id:3, t:'Descuentos', i:'pct', items:[{id:301,t:'Promociones', i:'pct', d:'Crear y editar promociones y su vigencia'},{id:302,t:'Newsletter', i:'mail', d:''}]},
  {id:5, t:'Venta asistida', i:'bag', items:[
    {id:56,t:'Asignar clientes', i:'userplus', d:''},
    {id:55,t:'Gestión de ventas', i:'chart', d:''},
    {id:52,t:'Mis ventas', i:'cart', d:''},
    {id:57,t:'Productos visitados', i:'eye', d:''},
    {id:901,t:'Entregas', i:'truck', grupo:true, d:'', items:[
      {id:53,t:'Gestión entregas', i:'truck', d:'Despachos pendientes y en curso'},
      {id:54,t:'Mis Entregas', i:'bike', d:'Entregas asignadas al mensajero'}]},
    {id:902,t:'Comisiones', i:'dollar', grupo:true, d:'', items:[
      {id:67,t:'Configuración comisiones', i:'pct', d:'Porcentajes y reglas por equipo'},
      {id:70,t:'Liquidación de comisiones', i:'dollar', d:'Cálculo del pago por período'},
      {id:72,t:'Cierre de períodos', i:'cal', d:'Cerrar el período para liquidar'},
      {id:78,t:'Equipos de venta', i:'users', d:''}]}]},
  {id:6, t:'Devoluciones', i:'undo', items:[{id:601,t:'Consultar devoluciones', i:'list', d:''}]},
  {id:7, t:'QUAC', i:'card', items:[
    {id:903,t:'PVAL', i:'folder', grupo:true, d:'', items:[
      {id:58,t:'Cortes PVAL', i:'mail', d:'Cortes enviados y su resultado'},
      {id:59,t:'Consulta PVAL', i:'search', d:'Buscar un cliente en PVAL'}]},
    {id:60,t:'Consulta de Planes', i:'file', d:''},
    {id:73,t:'Simulador compras', i:'calc', d:''},
    {id:904,t:'App', i:'phone', grupo:true, d:'', items:[
      {id:79,t:'Menu App', i:'phone', d:'Opciones del menú de la app'},
      {id:81,t:'Avisos de la app', i:'mega', d:'Mensajes que ve el cliente en la app'},
      {id:82,t:'Versión de la app', i:'phone', d:''}]}]},
  {id:8, t:'Configuración', i:'gear', items:[
    {id:801,t:'Usuarios', i:'users', d:''},{id:802,t:'Roles', i:'key', d:''},{id:803,t:'Permisos de Navegación', i:'nav', d:''}]},
];

const S = {
  tab:'esc', active:'Consulta PVAL',
  open:new Set([5,7]), fly:null, closedBy:'',
  q:'', ddMod:null, ddGrp:null,
  mOpen:new Set([7]), mInline:new Set([903]), mq:'',
};

/* ---------- utilidades del árbol ---------- */
const leaves = m => (m.items||[]).flatMap(x => x.items ? x.items : [x]);
const pathOf = name => {
  for (const m of MENU){ if (m.t===name) return [m.t];
    for (const x of (m.items||[])){ if (x.t===name) return [m.t,x.t];
      for (const y of (x.items||[])) if (y.t===name) return [m.t,x.t,y.t]; } }
  return [name];
};
const modHasActive = m => leaves(m).some(s => s.t===S.active);
const grpHasActive = g => g.items.some(s => s.t===S.active);
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const hl = (t,q) => { if(!q) return t; const i = norm(t).indexOf(norm(q)); return i<0 ? t : t.slice(0,i)+'<mark>'+t.slice(i,i+q.length)+'</mark>'+t.slice(i+q.length); };
const findGrp = id => { for (const m of MENU) for (const x of (m.items||[])) if (x.id===id) return [m,x]; return [null,null]; };

/* filtro de 3 niveles: módulo que coincide → completo; grupo que coincide → completo; si no, solo las pantallas que coinciden */
function filtrar(q){
  if (!q.trim()) return MENU;
  const ok = t => norm(t).includes(norm(q.trim()));
  return MENU.map(m => {
    if (ok(m.t)) return m;
    if (!m.items) return null;
    const items = m.items.map(x => {
      if (x.items){ if (ok(x.t)) return x; const h = x.items.filter(s => ok(s.t)); return h.length ? {...x, items:h} : null; }
      return ok(x.t) ? x : null;
    }).filter(Boolean);
    return items.length ? {...m, items} : null;
  }).filter(Boolean);
}

/* ---------- lateral expandido (escritorio) ---------- */
function scrRow(s,q){ return `<div class="scr ${s.t===S.active?'active':''}" data-go="${s.t}">${svg(s.i)}<span>${hl(s.t,q)}</span></div>`; }
function lateral({mobile=false}={}){
  const q = mobile ? S.mq : S.q, buscando = q.trim().length>0;
  const openSet = mobile ? S.mOpen : S.open;
  return filtrar(q).map(m => {
    if (!m.items) return `<div class="row ${S.active===m.t?'active current':''}" data-go="${m.t}">${svg(m.i)}<span>${hl(m.t,q)}</span></div>`;
    const open = openSet.has(m.id) || buscando;
    const body = m.items.map(x => {
      if (!x.items) return scrRow(x,q);
      const cur = grpHasActive(x);
      // En escritorio sin búsqueda: fila con contador y panel al lado (D1). Con búsqueda o en móvil: en línea (D10, D12).
      if (!mobile && !buscando)
        return `<div class="grp ${cur?'current':''} ${S.fly===x.id?'opened':''}" data-fly="${x.id}">${svg(x.i)}<span>${x.t}</span><span class="n">${x.items.length}</span>${svg('chev','chev')}</div>`;
      const inl = buscando || S.mInline.has(x.id);
      return `<div class="grp ${cur&&!inl?'current':''} ${inl?'inline-open':''}" data-inline="${x.id}">${svg(x.i)}<span>${hl(x.t,q)}</span><span class="n">${x.items.length}</span>${svg('chev','chev')}</div>`
        + (inl ? `<div class="sub3">${x.items.map(s=>scrRow(s,q)).join('')}</div>` : '');
    }).join('');
    return `<div class="row ${open?'open':''} ${modHasActive(m)?'current':''}" data-tog="${m.id}" data-mobile="${mobile?1:''}">${svg(m.i)}<span>${hl(m.t,q)}</span>${svg('chev','chev')}</div>`
      + (open ? `<div class="sub">${body}</div>` : '');
  }).join('') || `<div class="px-5 py-6 text-sm text-zinc-500">Ningún menú coincide con «${q}».</div>`;
}

function marca(){ return `<div class="h-14 flex items-center gap-2 px-4 border-b border-[color:var(--border)] text-zinc-50 font-bold text-xl"><span class="w-8 h-8 rounded-lg bg-zinc-50 text-zinc-900 flex items-center justify-center text-xs">get</span>get<span class="ml-auto text-zinc-500">${svg('panel','w-5 h-5')}</span></div>`; }

function contenido(){
  const p = ['Dashboard',...pathOf(S.active)];
  return `<div class="flex-1 min-w-0 flex flex-col">
    <div class="h-14 bg-white border-b border-zinc-200 flex items-center px-6">
      <label class="flex items-center gap-2 border border-zinc-200 rounded-lg px-3 py-1.5 w-72 text-sm text-zinc-500">${svg('search','w-4 h-4')}
        <input id="q" class="outline-none flex-1 bg-transparent text-zinc-900" placeholder="Filtrar menú…" value="${S.q}"></label>
    </div>
    <div class="px-6 py-3 bg-white border-b border-zinc-100 text-sm text-zinc-500 flex items-center gap-2">${svg('home','w-4 h-4')} ${p.map((x,i)=> i===p.length-1?`<span class="text-zinc-900">${x}</span>`:x).join(' <span class="text-zinc-300">›</span> ')}</div>
    <div class="p-6"><h2 class="text-2xl font-bold mb-4">${S.active}</h2>
      <div class="h-28 rounded-xl bg-white border border-dashed border-zinc-300 mb-4 flex items-center justify-center text-zinc-400 text-sm">Contenido de la pantalla</div>
      <div class="h-28 rounded-xl bg-white border border-dashed border-zinc-300 flex items-center justify-center text-zinc-400 text-sm">Contenido de la pantalla</div></div>
  </div>`;
}

function panel(){
  if (!S.fly) return '';
  const [m,g] = findGrp(S.fly);
  return `<div class="absolute inset-y-0 left-[272px] right-0 z-10 bg-black/10" data-cerrar="clic afuera"></div>
  <aside class="absolute inset-y-0 left-[272px] w-[300px] z-20 bg-[#1f1f23] border-l border-[color:var(--border)] shadow-[8px_0_24px_rgba(0,0,0,.25)] flex flex-col">
    <div class="flex items-center justify-between px-4 pt-4 pb-1 text-zinc-50 text-lg font-semibold"><span>${g.t}</span>
      <button class="text-zinc-500 hover:text-zinc-50 p-1" data-cerrar="flecha ←" title="Cerrar (Esc)">${svg('back','w-5 h-5')}</button></div>
    <div class="px-4 pb-3 text-xs text-zinc-500">${m.t} › ${g.t}</div>
    <div class="scroll overflow-y-auto">${g.items.map(s => `<div class="pi ${s.t===S.active?'active':''}" data-go="${s.t}"><div class="t">${s.t}</div>${s.d?`<div class="d">${s.d}</div>`:''}</div>`).join('')}<div class="border-t border-[color:var(--border)]"></div></div>
  </aside>`;
}

/* ---------- pestañas ---------- */
const TABS = [
  ['esc','1 · Escritorio: panel del grupo'],
  ['bus','2 · Buscar en el menú'],
  ['con','3 · Lateral contraído'],
  ['mov','4 · Móvil'],
  ['per','5 · Permisos de Navegación'],
  ['rol','6 · Roles'],
];

function nota(html){ return `<aside class="w-[340px] bg-white rounded-xl border border-zinc-200 p-5 text-sm text-zinc-700 space-y-2">${html}</aside>`; }

function vistaEscritorio(){
  return `<div class="relative flex h-[760px] w-[980px] rounded-xl overflow-hidden shadow-xl bg-zinc-50">
    <aside class="side w-[272px] flex flex-col shrink-0">${marca()}<div class="scroll overflow-y-auto flex-1 py-2">${lateral()}</div></aside>
    ${contenido()}${panel()}
  </div>` + nota(`
    <h3 class="font-semibold text-base text-zinc-900">Escritorio, lateral expandido</h3>
    <p>Un grupo (PVAL, App, Entregas, Comisiones) es una fila con su número de pantallas y <b>›</b>. Al hacer clic se abre el panel al lado, <b>flotando sobre el contenido</b>.</p>
    <p class="font-medium text-zinc-900">El panel se cierra de cuatro formas:</p>
    <ul class="list-disc pl-5 space-y-1">
      <li>al <b>elegir una pantalla</b> (navega y cierra);</li>

/* ---------- Permisos de Navegación ---------- */
const P = { edits:{}, err:'', toast:'' };
function filasPermisos(){
  const rows = [];
  MENU.forEach(m => {
    rows.push({n:m, nivel:0, padre:null});
    (m.items||[]).forEach(x => {
      rows.push({n:x, nivel:1, padre:m});
      (x.items||[]).forEach(y => rows.push({n:y, nivel:2, padre:x, abuelo:m}));
    });
  });
  return rows;
}
function opcionesUbicacion(r){
  // D6: un grupo solo puede ir en un módulo; una pantalla en un módulo o en un grupo.
  const ops = [];
  MENU.filter(m => m.items).forEach(m => {
    ops.push([m.id, m.t]);
    if (!r.n.items) (m.items||[]).filter(x => x.items).forEach(g => ops.push([g.id, `${m.t} › ${g.t}`]));
  });
  return ops;
}

  const ta = document.getElementById('desc-txt'); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
}
function modalBorrar(id){
  const [m,g] = findGrp(id);
  modal(`<div class="bg-white rounded-xl w-[400px] p-6 shadow-2xl"><h3 class="text-lg font-semibold mb-2">¿Borrar el grupo «${g.t}»?</h3>
    <p class="text-sm text-zinc-600">Está vacío. Se quita de ${m.t} y de los permisos de todos los roles.</p>
    <div class="flex justify-end gap-2 mt-6"><button class="h-9 px-4 rounded-md border border-zinc-200 text-sm" data-mcerrar>Cancelar</button><button class="h-9 px-4 rounded-md bg-rose-600 text-white text-sm" data-confborrar="${id}">Borrar grupo</button></div></div>`);
}

/* ---------- render y eventos ---------- */
function render(){
  document.getElementById('tabs').innerHTML = TABS.map(([k,t]) => `<button data-tab="${k}" class="px-3 py-2 border-b-2 ${S.tab===k?'border-zinc-900 text-zinc-900 font-medium':'border-transparent text-zinc-500 hover:text-zinc-800'}">${t}</button>`).join('');
  const v = {esc:vistaEscritorio, bus:vistaBusqueda, con:vistaContraido, mov:vistaMovil, per:vistaPermisos, rol:vistaRoles}[S.tab]();
  document.getElementById('stage').innerHTML = v;
  document.querySelectorAll('[data-ind]').forEach(e => e.indeterminate = true);
}
function foco(id){ const el = document.getElementById(id); if (el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }

document.addEventListener('input', e => {
  if (e.target.id==='q'){ S.q = e.target.value; S.fly = null; render(); foco('q'); }
  if (e.target.id==='desc-txt'){ const v = e.target.value; document.getElementById('desc-cnt').textContent = `${v.length}/${MAX_DESC}`; document.getElementById('desc-prev').textContent = v || 'Sin descripción: solo el nombre'; }
  if (e.target.id==='mq'){ S.mq = e.target.value; render(); foco('mq'); }
});
document.addEventListener('keydown', e => {
  if (e.key!=='Escape') return;
  if (!document.getElementById('modal').classList.contains('hidden')) { modal(''); return; }
  if (S.fly){ S.fly = null; S.closedBy = 'tecla Esc'; render(); }
  if (S.ddMod){ S.ddMod = null; S.ddGrp = null; render(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.mover){
    const id = +t.dataset.mover, dest = +t.value;
    // sacar el nodo de su padre actual
    let nodo = null;
    MENU.forEach(m => (m.items||[]).forEach((x,i,arr) => {
      if (x.id===id){ nodo = x; arr.splice(i,1); }
      else (x.items||[]).forEach((y,j,a2) => { if (y.id===id){ nodo = y; a2.splice(j,1); } });
    }));
    const destMod = MENU.find(m => m.id===dest), [,destGrp] = findGrp(dest);
    (destMod || destGrp).items.push(nodo);
    P.edits[id] = true; P.toast = ''; render();
  }
  if (t.dataset.rtog){
    const ids = t.dataset.rtog.split(',').map(Number), todos = ids.every(i => R.sel.has(i));
    ids.forEach(i => todos ? R.sel.delete(i) : R.sel.add(i)); render();
  }
});
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-tog],[data-go],[data-fly],[data-cerrar],[data-inline],[data-dd],[data-ddg],[data-ddclose],[data-nuevo],[data-crear],[data-mcerrar],[data-borrar],[data-confborrar],[data-guardar],[data-revertir],[data-revertir-todo],[data-desc],[data-desc-ok],[data-desc-quitar]');
  if (!t) return;
  const d = t.dataset;
  if (d.tab){ S.tab = d.tab; S.fly = null; S.ddMod = null; S.ddGrp = null; if (d.tab==='esc') S.q = ''; if (d.tab==='bus') S.q = 'pval'; }
  else if (d.tog){ const set = d.mobile ? S.mOpen : S.open, k = +d.tog; set.has(k) ? set.delete(k) : set.add(k); S.fly = null; }
  else if (d.go){ S.active = d.go; if (S.fly) S.closedBy = 'elegir una pantalla'; S.fly = null; S.ddMod = null; S.ddGrp = null; }
  else if (d.fly){ const k = +d.fly; if (S.fly===k){ S.fly = null; S.closedBy = 'clic otra vez en el grupo'; } else S.fly = k; }
  else if (d.cerrar){ S.fly = null; S.closedBy = d.cerrar; }
  else if (d.inline){ const k = +d.inline; S.mInline.has(k) ? S.mInline.delete(k) : S.mInline.add(k); }
  else if (d.dd){ const k = +d.dd, m = MENU.find(x => x.id===k); if (!m.items){ S.active = m.t; S.ddMod = null; } else { S.ddMod = S.ddMod===k ? null : k; } S.ddGrp = null; }
  else if (d.ddg){ const k = +d.ddg; S.ddGrp = S.ddGrp===k ? null : k; }
  else if ('ddclose' in d){ S.ddMod = null; S.ddGrp = null; }
  else if ('nuevo' in d){ modalNuevo(); return; }
  else if ('mcerrar' in d){ modal(''); return; }
  else if ('crear' in d){
    const nom = document.getElementById('ng-nom').value.trim(), mod = MENU.find(m => m.id===+document.getElementById('ng-mod').value);
    if (!nom) { modalNuevo('Escribe un nombre.'); return; }
    if (mod.items.some(x => norm(x.t)===norm(nom))) { modalNuevo(`Ya hay un ítem «${nom}» en ${mod.t}.`); return; }
    const id = Date.now()%100000;
    mod.items.push({id, t:nom, i:'folder', grupo:true, d:'', items:[]});
    modal(''); P.toast = `Grupo «${nom}» creado en ${mod.t}. Está vacío: muévele pantallas con «Ubicación». Mientras esté vacío no se ve en el lateral.`;
  }
  else if (d.desc){ modalDesc(+d.desc); return; }
  else if (d.descOk || d.descQuitar){ const id = +(d.descOk||d.descQuitar), [n] = buscarNodo(id), v = d.descOk ? document.getElementById('desc-txt').value.trim() : '';
    if (v !== (n.d||'')){ n.d = v; P.edits[id] = true; } modal(''); P.toast = ''; }
  else if (d.borrar){ modalBorrar(+d.borrar); return; }
  else if (d.confborrar){ const [m,g] = findGrp(+d.confborrar); m.items.splice(m.items.indexOf(g),1); modal(''); P.toast = `Grupo «${g.t}» borrado.`; }
  else if ('guardar' in d){ if (!Object.keys(P.edits).length) return; P.edits = {}; P.toast = 'Menus actualizados exitosamente.'; }
  else if (d.revertir || 'revertirTodo' in d){ P.toast = 'En el mockup, restablecer solo quita la marca de cambio.'; if (d.revertir) delete P.edits[d.revertir]; else P.edits = {}; }
  render();
});
render();
</script>
</body>
</html>
