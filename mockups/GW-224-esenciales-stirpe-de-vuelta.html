function tags(p, enEsenciales=true){
  const t = [];

  return t.length ? `<div class="absolute top-2 left-2 flex flex-col items-start gap-1">${t.join('')}</div>` : '';
}

        <div class="grid grid-cols-2 text-[14px]">${[['After the game',0],['Casual',0],['Esenciales',1],['Jeans wear',0],['Local culture',0],['Mundial',0],['Peanuts',0],['Pima',0],['Premiun',0]].map(([x,on])=>`<div class="flex items-center gap-2 px-4 py-4 border-b ${on?'bg-gray-100':''}"><span class="w-5 h-5 border border-[#293148] flex items-center justify-center">${on?'✓':''}</span>${x}${x==='Esenciales'?' <span class="nota text-[11px] ml-1 px-1.5 py-0.5 rounded bg-emerald-600 text-white">nuevo</span>':''}</div>`).join('')}</div>
        <div class="flex gap-2 p-4"><button class="flex-1 border border-[#293148] py-2.5 text-[14px] font-medium">Borrar filtros</button><button class="flex-1 bg-[#1f2433] text-white py-2.5 text-[14px] font-medium">Ver resultados</button></div>
      </div></div>`
  },
  tipo: {
    t:'5 · /hombre-esenciales-chaquetas',
    n:'Página por tipo de prenda con la URL del Word (D8). Ruta de navegación completa: Inicio › Hombre › Esenciales › Chaquetas. H1 y texto propios.',
    r:()=>`<div class="bg-white max-w-[1440px] mx-auto">${header()}${catHeader('Chaquetas esenciales hombre',['Inicio','Hombre','Esenciales','Chaquetas'],['Ver todo esenciales'],'Colecciones (1)')}
      <div class="grid grid-cols-4 gap-x-0.5">${CHAQ.map(p=>card(p)).join('')}</div>${seo(TXT.h1Chaq,TXT.textoChaq)}</div>`
  },
  vacia: {
    t:'6 · Página sin productos',
    n:'Si un tipo se queda sin productos, la página sigue publicada con el mensaje de catálogo vacío y un enlace a Esenciales Hombre (D4). El mensaje se calca del que tiene hoy la tienda; aquí va de ejemplo.',
    r:()=>`<div class="bg-white max-w-[1440px] mx-auto">${header()}${catHeader('Buzos esenciales hombre',['Inicio','Hombre','Esenciales','Buzos'],['Ver todo esenciales'],'Colecciones (1)')}
      <div class="py-24 text-center"><div class="text-[20px] font-bold">Por ahora no hay buzos esenciales</div><div class="text-[16px] mt-2">Mira todos los esenciales de hombre.</div><button class="mt-6 bg-[#1f2433] text-white px-6 py-2.5 text-[14px]">Ver Esenciales Hombre</button></div>
      ${seo('Buzos esenciales hombre','Buzos básicos para hombre que combinan con todo, y los favoritos que volvieron. Los esenciales de STIRPE para tu día a día.')}</div>`
  },
  fuera: {
    t:'7 · «De vuelta» fuera de Esenciales',
    n:'La etiqueta sale en cualquier listado y en la ficha del producto (D3). Ejemplo: /hombre-polos, con polos De vuelta y de línea (los normales se ven como hoy, sin etiqueta). Solo en tiendas con Esenciales activo (D9): hoy, Stirpe.',
    r:()=>{const polos=POLOS; return `<div class="bg-white max-w-[1440px] mx-auto">${header()}${catHeader('Polos para hombre',[],['Ver todo','Ropa'],'Colecciones')}
      <div class="grid grid-cols-4 gap-x-0.5">${polos.map(p=>card(p)).join('')}</div></div>`}
  },
  carga: {
    t:'8 · Cargando',
    n:'Mientras llega el catálogo, la tienda muestra sus tarjetas en gris como hoy; la etiqueta aparece con la tarjeta.',
    r:()=>`<div class="bg-white max-w-[1440px] mx-auto">${header()}${catHeader('Esenciales Hombre',['Inicio','Hombre','Esenciales'],[],'Colecciones (1)')}
      <div class="grid grid-cols-4 gap-x-0.5">${Array(8).fill(0).map(()=>`<div><div class="skel aspect-[3/4]"></div><div class="skel h-4 m-2 w-3/4"></div><div class="skel h-4 mx-2 w-1/3 mb-5"></div></div>`).join('')}</div></div>`
  },
  error: {
    t:'9 · Error',
    n:'Si el catálogo no responde, se ve el error que la tienda ya tiene para cualquier listado; GW-224 no lo cambia.',
    r:()=>`<div class="bg-white max-w-[1440px] mx-auto">${header()}
      <div class="py-28 text-center"><div class="text-[20px] font-bold">No pudimos cargar los productos</div><div class="text-[16px] mt-2">Intenta de nuevo en unos minutos.</div><button class="mt-6 border border-[#293148] px-6 py-2.5 text-[14px]">Reintentar</button></div></div>`
  }
};

let cur='pagina', ver='D';
function render(){
  document.getElementById('root').className='st v-'+ver;
  document.getElementById('root').innerHTML=SCREENS[cur].r();
  document.getElementById('nota').textContent=SCREENS[cur].n;
  document.getElementById('tabs').innerHTML=Object.entries(SCREENS).map(([k,s])=>`<button data-k="${k}" class="px-2 py-0.5 rounded ${k===cur?'bg-emerald-600':'bg-gray-700 hover:bg-gray-600'}">${s.t}</button>`).join('');
  document.querySelectorAll('.vbtn').forEach(b=>b.className='vbtn px-2 py-0.5 rounded '+(b.dataset.v===ver?'bg-emerald-600':'bg-gray-700'));
}
document.addEventListener('click',e=>{
  const k=e.target.closest('[data-k]')?.dataset.k; if(k){cur=k;render();}
  const v=e.target.closest('[data-v]')?.dataset.v; if(v){ver=v;render();}
});
render();
</script>
</body>
</html>
