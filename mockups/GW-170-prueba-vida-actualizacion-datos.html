<script>
const C = { nombre:'Laura Marcela', apellidos:'Gómez Ríos', doc:'1.032.456.789', correo:'laura.gomez@gmail.com',
  celAct:'311 111 1111', celNue:'312 222 2222', fecha:'30/09/2026', sac:'312 460 5748',
  hrs:'Lunes a viernes de 7:00 a. m. a 6:00 p. m. Sábados de 8:00 a. m. a 12:00 m.' };

const ICO = {
  escudo:`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#7633ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3z"/><circle cx="12" cy="10" r="2.4"/><path d="M8.5 16c.8-1.7 2-2.5 3.5-2.5s2.7.8 3.5 2.5"/></svg>`,
  escudoAlerta:`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#7633ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3z"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg>`,
  reloj:`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#7633ff" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>`,
  check:`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
  wa:`<svg width="18" height="18" viewBox="0 0 24 24" fill="#25D366"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.6-.1 1.1z"/></svg>`,
  quac:`<svg width="30" height="30" viewBox="0 0 62.351 55.6" fill="currentColor"><path d="M31.2 0C14 0 0 11.8 0 26.4c0 7.6 3.8 14.4 9.9 19.2L7.4 55.6l11.4-5.9c3.8 1.4 8 2.2 12.4 2.2 17.2 0 31.2-11.8 31.2-26.4S48.4 0 31.2 0zm0 40.6c-7.8 0-14.2-6.3-14.2-14.2s6.3-14.2 14.2-14.2 14.2 6.3 14.2 14.2-6.4 14.2-14.2 14.2z"/></svg>`
};

/* ---------- Piezas calcadas del portal (origin/master) ---------- */
function perfil(o={}){
  const cel = o.cel || C.celAct;
  const chip = o.chip ? `<div class="chip-curso"><i></i>Cambio a ${C.celNue} en revisión desde el ${C.fecha}</div>` : '';
  const hCel = o.chip ? `<div class="h">Un operador está revisando tu solicitud. Te avisaremos por mensaje cuando quede lista.</div>`
                      : `<div class="h">Enviamos un código al celular nuevo y otro a tu correo actual.</div>`;
  return `
  <div class="container-layout">
    <div class="hdr">
      <div class="hdr-top">
        <div class="marca">${ICO.quac}<span>Quac</span></div>
        <div class="user-pill"><span class="avatar">LG</span>${C.nombre.split(' ')[0]}</div>
      </div>
      <div class="hdr-main">
        <div>
          <div class="saludo">Hola,<br><b>${C.nombre}</b></div>
          <div class="badge-nivel">Status QUAC · Oro</div>
          <div class="miembro">Miembro desde marzo de 2023</div>
        </div>
        <div class="clave"><div class="k2">Clave dinámica</div><div class="num">482 913</div><div style="font-size:11px;opacity:.8">Cambia en 38 s</div></div>
      </div>
    </div>
    <div class="nav"><span class="tab on">Mis datos</span><span class="tab">Mi crédito</span><span class="tab">Movimientos</span><span class="tab">Quac+</span></div>
    <div class="body-taps">
      <div class="blk-datos">
        <div class="sec-head"><div><h2 class="sec-t">Datos básicos</h2><p class="sec-d">Así aparecen tus datos en Quac.</p></div></div>
        <div class="campos">

let cur=0, vari={}, dev='desk';
function menu(){
  const grupos=[...new Set(S.map(s=>s.g))];
  document.getElementById('menu').innerHTML=grupos.map(g=>`<div><div class="text-[11px] font-bold uppercase tracking-wider text-slate-400 px-3 mb-1">${g}</div>
    ${S.map((s,i)=>s.g===g?`<button class="scr ${i===cur?'on':''}" data-i="${i}">${s.t}<small>${s.sub}</small></button>`:'').join('')}</div>`).join('');
  document.querySelectorAll('.scr').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;render();});
}
function render(){
  const s=S[cur], v=vari[cur]||0;
  document.getElementById('grupo').textContent=s.g;
  document.getElementById('titulo').textContent=s.t;
  document.getElementById('nota').innerHTML=typeof s.n==='function'?s.n(v):s.n;
  document.getElementById('variantes').style.display=s.v?'flex':'none';
  document.getElementById('variantes').innerHTML=(s.v||[]).map((x,i)=>`<button class="${i===v?'on':''}" data-v="${i}">${x}</button>`).join('');
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{vari[cur]=+b.dataset.v;render();});
  const app=document.getElementById('app'); app.className=s.k==='gw'?'':'app'; app.innerHTML=s.r(v);
  document.getElementById('frame').style.width=(dev==='mob'&&s.k!=='gw')?'390px':'100%';
  menu();
}
document.querySelectorAll('[data-dev]').forEach(b=>b.onclick=()=>{dev=b.dataset.dev;document.querySelectorAll('[data-dev]').forEach(x=>x.classList.toggle('on',x===b));render();});
document.addEventListener('keydown',e=>{if(e.key==='ArrowDown'&&cur<S.length-1){cur++;render();} if(e.key==='ArrowUp'&&cur>0){cur--;render();}});
render();
