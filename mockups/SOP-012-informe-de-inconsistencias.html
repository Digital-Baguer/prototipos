ICONOS['panel-left-close']=ICONOS['panel-left-close']||'<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m16 15-3-3 3-3"/>';
ICONOS['list-x']=ICONOS['list-x']||'<path d="M11 12H3"/><path d="M16 6H3"/><path d="M16 18H3"/><path d="m19 10-4 4"/><path d="m15 10 4 4"/>';

const est={ver:'con',usr:'ambos',pant:'informe',pan:'1'};
const CAT=[['612','Fecha 1ra cuota inconsistente','La fecha de primera cuota del plan no coincide con la de la transaccion.',1],['588','Nro. cuotas inconsistente','Las cuotas del plan de pago no coinciden con las registradas en la transaccion.',1],['471','Estrategia inconsistente','El tipo de interes del plan no coincide con la transaccion registrada.',1],['402','Transaccion no encontrada','No existe registro en transactions ni transactions_store para asociar el plan.',0],['309','Plan eliminado (404)','El plan ya no existe en el servicio de cartera. Fueron anulados o cancelados.',0],['46','Otro error','Error no clasificado.',0]];
const item=(ic,txt,act)=>act
 ?'<a class="relative flex h-8 items-center gap-3 rounded-lg bg-white/10 px-3 font-medium text-white"><span class="absolute left-0 top-[7px] h-[18px] w-[2px] rounded-sm bg-[#34d399]"></span><i data-i="'+ic+'" class="h-4 w-4 text-[#34d399]"></i><span class="truncate whitespace-nowrap font-medium">'+txt+'</span></a>'
 :'<a class="flex h-8 items-center gap-3 rounded-lg px-3 text-[#a1a1aa] hover:bg-white/5"><i data-i="'+ic+'" class="h-4 w-4 text-[#71717a]"></i><span class="truncate whitespace-nowrap font-medium">'+txt+'</span></a>';
const grupo=(ic,txt,n,abierto,act)=>'<button type="button" class="relative flex h-8 w-full items-center gap-3 rounded-lg px-3 text-left font-medium '+(act?'text-white':'text-[#a1a1aa] hover:bg-white/5')+'"><i data-i="'+ic+'" class="h-4 w-4 '+(act?'text-[#34d399]':'text-[#71717a]')+'"></i><span class="flex-1 truncate font-medium">'+txt+'</span><span class="ml-auto rounded-full bg-[#27272a] px-1.5 text-[11px] text-[#71717a]">'+n+'</span><i data-i="'+(abierto?'chevron-down':'chevron-right')+'" class="h-3.5 w-3.5 text-[#71717a]"></i></button>';
function menu(){
 const top=(ic,t,a)=>'<a class="relative mx-2 flex h-8 items-center gap-2 rounded-md px-2 '+(a?'font-semibold text-[#fafafa]':'text-[#a1a1aa]')+'"><i data-i="'+ic+'" class="h-4 w-4 '+(a?'text-[#34d399]':'text-[#71717a]')+'"></i>'+t+'<i data-i="'+(a?'chevron-down':'chevron-right')+'" class="ml-auto h-4 w-4 text-[#71717a]"></i></a>';
 const enInforme=est.pant==='informe', enDoc=est.pant==='detalle';
 let h=top('layout-dashboard','Dashboard')+top('package','Pedidos')+top('wallet','QUAC',1)+'<div class="mx-3.5 my-2 flex flex-col gap-1 border-l border-[#3f3f46] px-2.5 py-0.5 text-[13px]">';
 let items=[], grupoAct=false;
 if(est.ver==='hoy'){
  h+=item('file-text','Consulta de planes',enInforme)+grupo('scan-face','Validación de fotos',3)+grupo('credit-card','Pagos Portal/App',1);
  if(est.usr==='ambos'){ grupoAct=enDoc; h+=grupoBtn(1,grupoAct); items=[['Documentos digitales','Pagarés de los planes: estado, carga al CRM y PDF firmado.',enDoc]]; }
 } else {
  h+=grupo('scan-face','Validación de fotos',3)+grupo('credit-card','Pagos Portal/App',1);
  grupoAct=true; h+=grupoBtn(est.usr==='ambos'?2:1,true);
  if(est.usr==='ambos') items.push(['Documentos digitales','Pagarés de los planes: estado, carga al CRM y PDF firmado.',enDoc]);
  items.push(['Informe de inconsistencias','Planes cuyo pagaré no se generó porque no cuadran con el CRM: por tipo de error y cómo autorizarlos.',enInforme,1]);
 }
 h+='</div>'+top('settings','Configuración');
 document.getElementById('menu').innerHTML=h;
 const desc=est.ver==='con'?'Planes QUAC: los pagarés firmados, su carga al CRM y los planes con inconsistencias.':'Planes QUAC: los pagarés firmados y su carga al CRM.';
 document.getElementById('panel').innerHTML=(est.pan==='1'&&items.length)?'<div class="absolute inset-0 z-40 bg-black/10"></div><aside class="absolute left-0 top-0 bottom-0 z-50 flex w-[300px] flex-col border-l border-[#27272a] bg-[#1f1f23] shadow-[8px_0_24px_rgba(0,0,0,.25)]"><div class="flex items-center justify-between px-4 pt-4 pb-1 text-lg font-semibold text-white"><span>Planes</span><i data-i="undo-2" class="h-5 w-5 text-[#a1a1aa]"></i></div><div class="px-4 pb-3 text-xs text-[#a1a1aa]">QUAC › Planes</div><div class="border-t border-[#27272a]">'+items.map(x=>'<a class="relative block border-b border-[#27272a] px-4 py-2.5 '+(x[2]?'bg-white/10':'')+'">'+(x[2]?'<span class="absolute top-[12px] left-0 h-[18px] w-[3px] rounded-sm bg-[#34d399]"></span>':'')+'<div class="text-sm font-medium '+(x[2]?'text-white':'text-[#e4e4e7]')+'">'+x[0]+(x[3]?' <span class="ml-1 rounded bg-emerald-900/60 px-1.5 py-0.5 text-[10px] font-medium text-emerald-300">pasa aquí</span>':'')+'</div><div class="mt-0.5 text-[12.5px] text-[#a1a1aa]">'+x[1]+'</div></a>').join('')+'</div><p class="mx-4 mt-4 text-[11px] leading-snug text-[#71717a]">Descripción del grupo: «'+desc+'»</p></aside>':'';
 document.getElementById('nota').textContent= est.ver==='hoy'
  ?'Hoy: «Consulta de planes» cuelga directo de QUAC; el grupo Planes solo tiene Documentos digitales.'
  :(est.usr==='ambos'?'Con el cambio: la misma pantalla pasa al grupo Planes, segunda después de Documentos digitales. La dirección y el permiso no cambian.':'Quien tiene permiso solo para esta pantalla ve el grupo Planes con un solo ítem. Nadie gana ni pierde acceso.');
}
function grupoBtn(n,act){return grupo('file-text','Planes',n,false,act).replace('relative flex h-8 w-full','relative flex h-8 w-full '+(act?'bg-white/10':''));}
function migas(){
 const sep='<li><i data-i="chevron-right" class="h-3.5 w-3.5"></i></li>';
 let p=est.pant==='detalle'?['QUAC','Planes','Documentos digitales']:(est.ver==='hoy'?['QUAC','Consulta de Planes']:['QUAC','Planes','Informe de inconsistencias']);
 document.getElementById('migas').innerHTML='<li><i data-i="house" class="h-4 w-4"></i></li>'+p.map((x,i)=>sep+'<li class="'+(i===p.length-1?'font-normal text-foreground':'')+'">'+x+'</li>').join('');
}
function informe(){
 const t=est.ver==='hoy'?'Consulta de Planes QUAC':'Informe de inconsistencias';
 const cambio=est.ver==='con'?'<span class="ml-2 rounded-full bg-emerald-50 px-2 py-0.5 text-xs font-medium text-emerald-700 ring-1 ring-emerald-200">cambia el título</span>':'';
 let h='<section class="px-8 py-6 bg-white border-b border-gray-200"><div class="flex items-center"><h1 class="!mb-0 text-2xl font-semibold text-gray-900">'+t+'</h1>'+cambio+'</div><p class="text-base text-gray-600">Buscar, verificar y gestionar planes de pago</p></section>';
 h+='<div class="p-6 space-y-4"><div class="rounded-xl shadow-sm border border-gray-200 overflow-hidden"><div class="bg-slate-800 px-8 pt-6 pb-8 relative"><div class="mb-6"><p class="text-[11px] text-slate-400 uppercase tracking-[0.2em] font-medium">Estado de pagares</p><h2 class="text-xl font-bold mt-1 text-slate-100">Pagares con inconsistencias</h2></div><div class="flex items-end justify-between"><div><div class="text-7xl font-extrabold text-white leading-none tracking-tight">2428</div><div class="text-sm text-slate-400 mt-2">documentos pendientes con error</div></div><div class="flex gap-3">'+
 [['457','Autorizados','text-blue-300'],['150','Bloqueados','text-slate-300'],['1821','Pendientes','text-yellow-300']].map(c=>'<div class="bg-white/10 border border-white/10 rounded-lg px-5 py-3 text-center min-w-[80px]"><div class="text-2xl font-bold '+c[2]+'">'+c[0]+'</div><div class="text-[10px] text-slate-400 uppercase font-medium mt-0.5">'+c[1]+'</div></div>').join('')+
 '</div></div><div class="absolute bottom-0 left-0 right-0 h-1 bg-gradient-to-r from-red-500 via-orange-500 to-amber-500"></div></div><div class="bg-white px-8 py-6"><h3 class="text-[11px] font-semibold text-gray-400 uppercase tracking-[0.15em] mb-4">Detalle por tipo de error</h3><div class="space-y-2.5">'+
 CAT.map(c=>'<div class="flex items-center rounded-lg px-5 py-4 '+(c[3]?'bg-orange-50/40':'bg-gray-50/60')+'"><div class="w-1 h-12 rounded-full mr-4 '+(c[3]?'bg-orange-400':'bg-gray-300')+'"></div><span class="text-3xl font-extrabold text-slate-800 w-14 text-right tabular-nums">'+c[0]+'</span><div class="ml-5"><div class="text-sm font-semibold text-slate-800">'+c[1]+'</div><div class="text-xs text-gray-500 mt-0.5">'+c[2]+'</div></div></div>').join('')+
 '</div></div></div><div class="rounded-lg border bg-white p-4"><div class="flex flex-wrap items-end gap-4"><div class="flex-1 min-w-[180px] max-w-xs"><label class="mb-1 block text-xs font-medium">Nro de documento del cliente</label><input class="h-9 w-full rounded-md border border-input px-3 text-sm" placeholder="Ej: 0000321101"></div><div class="flex-1 min-w-[120px] max-w-[180px]"><label class="mb-1 block text-xs font-medium">Nro de plan</label><input class="h-9 w-full rounded-md border border-input px-3 text-sm" placeholder="Ej: 585116"></div><div class="min-w-[150px]"><label class="mb-1 block text-xs font-medium">Estado</label><select class="sel-nativo h-9 w-full rounded-md border border-input bg-white px-3 pr-8 text-sm"><option>Todos</option></select></div><button class="h-9 rounded-md bg-primary px-4 text-sm font-medium text-white">Consultar</button><button class="h-9 rounded-md border px-4 text-sm">Limpiar</button></div></div>'+
 '<p class="rounded-md border border-dashed border-gray-300 px-3 py-2 text-xs text-gray-500">Mockup: el contenido de la pantalla (indicadores, consulta, tabla, Excel, autorización, carga al CRM) no cambia. Por eso no hay estados nuevos de carga, error ni vacío.</p></div>';
 return h;
}
function detalle(){
 const destino=est.ver==='hoy'?'Consulta de Planes':'<span class="rounded bg-emerald-50 px-1 text-emerald-800 ring-1 ring-emerald-200">Informe de inconsistencias</span>';
 return '<div class="p-6"><div class="rounded-lg border border-gray-200 bg-white p-6"><div class="text-sm font-semibold text-gray-900">Plan 585116 · documento 0000321101</div><div class="mt-2"><span class="rounded-full bg-gray-100 px-2 py-0.5 text-xs font-medium text-gray-700">Sin cargar</span></div><p class="mt-3 text-sm text-gray-600">No hay PDF: el pagaré no se generó y por eso no se ha cargado al CRM. Los planes con error se revisan en '+destino+'.</p><p class="mt-4 rounded-md border border-dashed border-gray-300 px-3 py-2 text-xs text-gray-500">Mockup: solo cambia el nombre de la pantalla en esta frase; el resto del detalle de SOP-010 queda igual.</p></div></div>';
}
function pintar(){
 if(est.usr==='solo'&&est.pant==='detalle') est.pant='informe';
 document.querySelectorAll('[data-ver]').forEach(b=>b.classList.toggle('on',b.dataset.ver===est.ver));
 document.querySelectorAll('[data-pan]').forEach(b=>b.classList.toggle('on',b.dataset.pan===est.pan));
 document.querySelectorAll('[data-usr]').forEach(b=>{b.classList.toggle('on',b.dataset.usr===est.usr);});
 document.querySelectorAll('[data-pant]').forEach(b=>{b.classList.toggle('on',b.dataset.pant===est.pant);b.disabled=(est.usr==='solo'&&b.dataset.pant==='detalle');b.style.opacity=b.disabled?.4:1;});
 menu();migas();
 document.getElementById('vista').innerHTML=est.pant==='informe'?informe():detalle();
 document.querySelectorAll('[data-i]').forEach(e=>{const d=ICONOS[e.dataset.i]||'';e.outerHTML='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="'+e.getAttribute('class')+'">'+d+'</svg>';});
}
document.querySelectorAll('[data-pan]').forEach(b=>b.onclick=()=>{est.pan=b.dataset.pan;pintar();});
document.querySelectorAll('[data-ver]').forEach(b=>b.onclick=()=>{est.ver=b.dataset.ver;pintar();});
document.querySelectorAll('[data-usr]').forEach(b=>b.onclick=()=>{est.usr=b.dataset.usr;pintar();});
document.querySelectorAll('[data-pant]').forEach(b=>b.onclick=()=>{est.pant=b.dataset.pant;pintar();});
pintar();
</script>
