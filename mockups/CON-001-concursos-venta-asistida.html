<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CON-001 · Concursos de venta asistida · mockup</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body { font-family: ui-sans-serif, system-ui, sans-serif; }
  .card { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:16px; }
  .th { background:#f9fafb; font-size:14px; font-weight:500; color:#4b5563; text-align:left; padding:12px 16px; border-bottom:1px solid #f3f4f6; white-space:nowrap; vertical-align:top; }
  .td { padding:12px 16px; border-bottom:1px solid #f9fafb; font-size:14px; color:#374151; vertical-align:top; }
  table.t tbody tr:hover { background:#f9fafb; }
  .der { text-align:right; font-variant-numeric:tabular-nums; }
  .enl { font-weight:500; color:#171717; cursor:pointer; } .enl:hover { text-decoration:underline; }
  .sub { margin-top:2px; font-size:12px; color:#6b7280; }
  .idc { font-family:ui-monospace,monospace; font-size:12px; color:#6b7280; }
  .lista { overflow:hidden; border:1px solid #e5e7eb; border-radius:8px; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.05); }
  .menu { position:relative; display:inline-block; } .menu summary { list-style:none; cursor:pointer; } .menu summary::-webkit-details-marker { display:none; }
  .menu .ops { position:absolute; right:0; z-index:20; min-width:14rem; margin-top:4px; border:1px solid #e5e7eb; border-radius:8px; background:#fff; box-shadow:0 4px 12px rgba(0,0,0,.08); padding:4px; text-align:left; }
  .menu .ops a { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px; font-size:14px; cursor:pointer; } .menu .ops a:hover { background:#f3f4f6; }
  .menu .ops a.pel { color:#db2777; } .menu .ops a.pel:hover { background:#fdf2f8; }
  .chip { display:inline-flex; align-items:center; gap:6px; border-radius:9999px; border:1px solid; padding:2px 8px; font-size:12px; font-weight:500; white-space:nowrap; }
  .c-gris { background:#f9fafb; border-color:#e5e7eb; color:#4b5563; }
  .c-verde { background:#ecfdf5; border-color:#a7f3d0; color:#047857; }
  .c-negro { background:#18181b; border-color:#18181b; color:#fff; }
  .c-blanco { background:#fff; border-color:#d4d4d4; color:#737373; }
  .c-rosa { background:#fff1f2; border-color:#fecdd3; color:#be123c; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:36px; border-radius:8px; padding:0 14px; font-size:14px; font-weight:500; border:1px solid #e5e7eb; background:#fff; color:#111827; }
  .btn-p { background:#059669; border-color:#059669; color:#fff; }
  .btn[disabled] { background:#f3f4f6; border-color:#e5e7eb; color:#9ca3af; cursor:not-allowed; }
  .inp { width:100%; min-height:38px; border:1px solid #e5e7eb; border-radius:8px; padding:6px 10px; font-size:14px; background:#fff; }
  .inp[disabled], .bloq { background:#f3f4f6; color:#9ca3af; }
  .lbl { display:block; font-size:13px; font-weight:500; color:#374151; margin-bottom:4px; }
  .ayuda { font-size:12px; color:#6b7280; margin-top:4px; }
  .g2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .g4 { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .g3 { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .i { width:16px; height:16px; }
  /* Celular: marco de 390 px, una columna, tablas como tarjetas */
  .cel #marco { width:390px; margin:16px auto; border:1px solid #d1d5db; border-radius:24px; overflow:hidden; min-height:780px; }
  .cel aside, .cel .solo-esc { display:none !important; }
  .esc .solo-cel { display:none !important; }
  .cel .g2, .cel .g3, .cel .g4 { grid-template-columns:1fr; }
  .cel .g4.par { grid-template-columns:1fr 1fr; }
  .cel .btn { min-height:44px; } .cel .inp { min-height:44px; font-size:16px; }
  .cel table.t thead { display:none; }
  .cel table.t tr { display:block; border:1px solid #e5e7eb; border-radius:12px; margin-bottom:10px; background:#fff; padding:6px 0; }
  .cel .der { text-align:right; }
  .cel table.t td { display:flex; justify-content:space-between; gap:12px; border:0; padding:5px 12px; text-align:right; }
  .cel table.t td::before { content:attr(data-l); color:#6b7280; font-size:12px; text-align:left; }
  .cel .pie { position:sticky; bottom:0; background:#fff; border-top:1px solid #e5e7eb; padding:10px 12px; margin:16px -16px -16px; }
  .cel .pie .btn { flex:1; }
  .esq { background:#e5e7eb; border-radius:8px; animation:p 1.2s ease-in-out infinite; } @keyframes p { 50% { opacity:.5; } }
</style>
</head>
<body class="antialiased bg-gray-100 esc">

<!-- Barra del mockup (no es parte de GET) -->
<div class="sticky top-0 z-50 flex flex-wrap items-center gap-2 bg-black px-4 py-2 text-xs text-white">
  <span class="font-semibold">Mockup · CON-001 Concursos</span><span class="text-white/40">|</span>
  <span class="text-white/60">Pantalla:</span><span id="b-pant" class="flex flex-wrap gap-1"></span>
  <span class="text-white/40">|</span><span class="text-white/60">Estado:</span>
  <select id="b-est" class="rounded bg-white/10 px-2 py-1 text-white"></select>
  <span class="text-white/40">|</span>
  <span class="text-white/60">Tablero del asesor:</span>
  <button data-est="a" onclick="estilo('a')" class="est rounded px-2 py-1">Actual</button>
  <button data-est="p" onclick="estilo('p')" class="est rounded bg-white px-2 py-1 text-black">Propuesta</button>
  <span class="text-white/40">|</span>
  <button data-modo="esc" class="modo rounded px-2 py-1">Escritorio</button>
  <button data-modo="cel" class="modo rounded px-2 py-1">Celular</button>
</div>

<div id="marco" class="flex min-h-screen bg-white">
  <aside class="flex w-64 shrink-0 flex-col" style="background:#18181b;border-right:1px solid #27272a">
    <div class="flex h-16 items-center gap-2 px-5 text-white"><div class="flex h-8 w-8 items-center justify-center rounded-lg bg-white text-sm font-bold text-black">G</div><span class="font-semibold">GET</span></div>
    <nav class="flex-1 space-y-1 px-3 text-sm text-zinc-400">
      <a class="flex items-center gap-3 rounded-md px-3 py-2"><i data-lucide="house" class="i"></i> Inicio</a>
      <div class="px-3 pt-4 pb-1 text-[11px] uppercase tracking-wider text-zinc-500">Venta asistida</div>
      <a class="flex items-center gap-3 rounded-md px-3 py-2">Mis ventas</a>
      <a class="flex items-center gap-3 rounded-md px-3 py-2">Gestión de ventas</a>
      <a class="flex items-center gap-3 rounded-md px-3 py-2">Comisiones</a>
      <a class="flex items-center gap-3 rounded-md bg-zinc-800 px-3 py-2 text-white"><i data-lucide="trophy" class="i" style="color:#34d399"></i> Concursos</a>
      <div class="px-3 pt-4 pb-1 text-[11px] uppercase tracking-wider text-zinc-500">Pedidos</div>
      <a class="flex items-center gap-3 rounded-md px-3 py-2">Pedidos</a>
    </nav>
  </aside>
  <main class="min-w-0 flex-1 bg-white">
    <header class="flex min-h-16 items-center gap-2 border-b border-gray-200 px-4 py-3">
      <button class="solo-cel btn" style="padding:0 10px" aria-label="Menú"><i data-lucide="menu" class="i"></i></button>
      <input class="solo-esc h-9 w-full max-w-md rounded-md border border-gray-200 px-3 text-sm" placeholder="Buscar…" />
      <div class="ml-auto flex items-center gap-3 text-sm text-gray-700"><i data-lucide="bell" class="i"></i><div class="flex h-8 w-8 items-center justify-center rounded-full bg-gray-200 text-xs font-semibold" id="avatar">LG</div></div>
    </header>
    <div class="border-b border-gray-200 px-4 py-2 text-sm text-gray-500" id="miga"></div>
    <div id="c" class="min-h-[70vh] space-y-6 bg-gray-50 p-4 md:p-6"></div>
  </main>
</div>
<div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 p-4"></div>

<script>
const $ = n => '$ ' + Math.round(n).toLocaleString('es-CO');
const ic = n => `<i data-lucide="${n}" class="i"></i>`;
const chip = (t, c='gris') => `<span class="chip c-${c}">${t}</span>`;
const tabla = (cols, filas, cls='') => { const der = cols.map(c=>c[0]==='>'), nom = cols.map(c=>c.replace(/^>/,''));
  return `<div class="overflow-x-auto ${cls}"><table class="t w-full"><thead><tr>${nom.map((c,i)=>`<th class="th ${der[i]?'der':''}">${c}</th>`).join('')}</tr></thead><tbody>${filas.map(f=>`<tr class="${f.cls||''}">${(f.c||f).map((v,i)=>`<td class="td ${der[i]?'der':''}" data-l="${nom[i]}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`; };
// Piezas de un listado de GET: encabezado blanco con acción a la derecha, estado, creado, paginación
const cabeza = (t, sub, accion='') => `<section class="-mx-4 -mt-4 flex flex-wrap items-center gap-3 border-b border-gray-200 bg-white px-4 py-4 md:-mx-6 md:-mt-6 md:px-8 md:py-6"><div class="mr-auto"><h1 class="text-xl font-semibold text-gray-900">${t}</h1><p class="text-sm text-gray-600">${sub}</p></div>${accion}</section>`;
const ESTADO = {Activo:'verde', Programado:'negro', Borrador:'blanco', Finalizado:'gris', Cancelado:'rosa'};
const estado = e => chip(e, ESTADO[e]);
const creado = (f, u) => `${f}<div class="sub">${u}</div>`;
const pagina = (txt) => `<div class="flex items-center justify-between border-t border-gray-100 px-4 py-3 text-sm text-gray-500"><span>${txt}</span><span class="flex items-center gap-1 text-xs"><button class="rounded border border-gray-200 px-2.5 py-1 opacity-40">Anterior</button><button class="rounded bg-gray-900 px-2.5 py-1 font-medium text-white">1</button><button class="rounded border border-gray-200 px-2.5 py-1">2</button><button class="rounded border border-gray-200 px-2.5 py-1">Siguiente</button></span></div>`;
const filtros = (buscar, sels) => `<div class="flex flex-wrap items-end gap-3"><div class="min-w-[180px] flex-1"><input class="inp" placeholder="${buscar}"></div>${sels.map(x=>`<div class="min-w-[160px]"><label class="mb-1 block text-xs font-medium text-gray-600">${x[0]}</label><select class="inp">${x[1].map(o=>`<option>${o}</option>`).join('')}</select></div>`).join('')}<button class="btn btn-p">${ic('search')} Buscar</button></div>`;

/* ---------- Datos de ejemplo: «Sprint de noviembre», Stirpe, 10 al 30 nov 2026 ---------- */
const NIV = [[100,40],[90,20],[80,10]];           // Venta, cada día, solo el nivel más alto
const META_VPT = 594000, META_UPT = 2.2, META_PPT = 270000; // PPT = VPT ÷ UPT
// Días de Laura: [fecha, venta, meta, pedidos]  (meta 0 = descanso)
const DIAS = [['10 nov',5120000,4800000,8],['11 nov',4310000,4700000,8],['12 nov',4950000,4900000,8],['13 nov',0,0,0],['14 nov',5600000,5000000,9],['15 nov',3900000,4800000,7],
  ['16 nov',4750000,4700000,8],['17 nov',5010000,4900000,8],['18 nov',2900000,4800000,6],['19 nov',4900000,4800000,8],['20 nov',0,0,0],['21 nov',4420000,4900000,8],['22 nov',5230000,5000000,8],['23 nov',3610000,4400000,5]];
const ptsVenta = p => (NIV.find(n => p >= n[0]) || [0,0])[1];
const dia = d => { const [f,v,m,n] = d; if (!m) return {f, desc:true, tot:0, pv:0, pp:0};
  const p = Math.floor(v/m*100), vpt = n ? v/n : 0, pv = ptsVenta(p), pp = vpt >= META_VPT ? 15 : 0; return {f,v,m,p,vpt,pv,pp,tot:pv+pp}; };
const D = DIAS.map(dia), TR = D.filter(d=>!d.desc);
const L = { venta: TR.reduce((a,d)=>a+d.pv,0), vpt: TR.reduce((a,d)=>a+d.pp,0), conMeta: TR.filter(d=>d.p>=100).length,
  pctVenta: Math.floor(TR.reduce((a,d)=>a+d.v,0) / TR.reduce((a,d)=>a+d.m,0) * 100) };
L.tot = L.venta + L.vpt;
const HOY = D[D.length-1];
// Tabla en curso (día 14 de 21): puntos de los demás relativos a Laura para que ella vaya 2.ª
const CURSO = [['Marta Ruiz',L.tot+45,101,9],['Laura Gómez',L.tot,L.pctVenta,L.conMeta],['Pedro Salas',L.tot-25,93,7],['Diana Vera',L.tot-70,90,6],['Andrés Mora',L.tot-95,76,5],['Camila Ríos',L.tot-140,88,5],['Julián Paz',L.tot-180,84,4]];
// Tabla al cierre: [nombre, puntos, % venta, días con meta, nota]
const CIERRE = [['Marta Ruiz',905,102,15,''],['Andrés Mora',890,76,9,'Vendió menos del 80 %'],['Laura Gómez',880,96,13,''],['Pedro Salas',880,93,12,'Perdió el desempate con Laura: menor % de venta'],
  ['Diana Vera',760,91,10,''],['Camila Ríos',705,88,9,''],['Julián Paz',410,84,5,'Sin meta desde el 22 nov; conserva sus puntos']];
const GANA = CIERRE.filter(a=>a[2]>=80).slice(0,3);
const PREMIOS = [['1.er puesto','Dinero',$(500000)],['2.º puesto','Dinero',$(300000)],['3.er puesto','Regalo','Audífonos inalámbricos']];

/* ---------- Pantalla 1 · Asesor ---------- */
function asesor(e) {
  if (e==='vacio') return `<h1 class="text-xl font-semibold">Concursos</h1><div class="card py-12 text-center text-sm text-gray-500"><div class="mx-auto mb-3 flex h-10 w-10 items-center justify-center rounded-lg bg-gray-100">${ic('trophy')}</div><p class="font-medium text-gray-900">No tienes concursos activos</p><p>Cuando tu coordinación publique uno, lo verás aquí.</p></div>`;
  if (e==='carga') return `<div class="esq h-8 w-48"></div><div class="esq h-32"></div><div class="g4 par">${'<div class="esq h-24"></div>'.repeat(4)}</div><div class="esq h-64"></div>`;
  const cerrado = e!=='activo', canc = e==='cancelado', firme = e==='firme';
  const pos = cerrado ? 2 : 2, pts = canc ? 310 : cerrado ? 880 : L.tot;
  const franja = {prelim:`<div class="card flex gap-3 border-gray-300 bg-white text-sm">${ic('clock')}<div><b>Resultados preliminares.</b> Pueden cambiar por devoluciones o cancelaciones. Quedan en firme el 5 dic.</div></div>`,
    firme:`<div class="card flex gap-3 text-sm" style="background:#ecfdf5;border-color:#a7f3d0">${ic('circle-check')}<div><b>Resultados en firme.</b> Quedaste en el 2.º puesto y ganaste ${$(300000)}. Tu coordinación te confirma la entrega.</div></div>`,
    cancelado:`<div class="card flex gap-3 text-sm" style="background:#fff1f2;border-color:#fecdd3">${ic('circle-x')}<div><b>Este concurso se canceló el 18 nov.</b> Motivo: «Se cambió la fecha del evento; se publica uno nuevo». Llevabas 310 puntos. No hay ganadores ni premios.</div></div>`}[e] || '';
  const tarj = (t,v,s) => `<div><div class="text-xs text-gray-500">${t}</div><div class="text-2xl font-semibold">${v}</div><div class="text-xs text-gray-500">${s}</div></div>`;
  const fila = cerrado ? CIERRE : CURSO;
  const orden = cerrado ? [...CIERRE.filter(a=>a[2]>=80), ...CIERRE.filter(a=>a[2]<80)] : CURSO;
  return `
  <a class="flex cursor-pointer items-center gap-1 text-sm text-emerald-700" onclick="ir('mis')">${ic('chevron-left')} Mis concursos</a>
  <div class="flex items-center justify-center rounded-xl border border-emerald-200 bg-emerald-50 text-sm text-emerald-800" style="aspect-ratio:4/1">Imagen del concurso · 1600 × 400</div>
  ${franja}
  <div class="card"><div class="flex flex-wrap items-center gap-2"><h2 class="text-lg font-semibold">Sprint de noviembre</h2>${canc?chip('Cancelado','rosa'):cerrado?chip(firme?'En firme':'Preliminar', firme?'verde':'gris'):chip('Activo','verde')}<span class="text-sm text-gray-500">Stirpe · 10 al 30 nov</span></div>
    <div class="g4 par mt-3">${tarj(cerrado?'Terminó':'Faltan', cerrado?(canc?'18 nov':'30 nov'):'7 días', cerrado?'':'termina el 30 nov')}${tarj(canc?'Ibas en el puesto':'Tu puesto', canc?'5.º':pos+'.º','de 7 asesores')}${tarj('Tus puntos', pts, cerrado?'':'de 1.255 posibles')}${tarj(cerrado?'Venta del concurso':'Para el 1.er puesto', cerrado?(canc?'84 %':'96 %'):'45 pts', cerrado?'de tu meta':'te faltan')}</div></div>
  <details class="card" ${cerrado?'':'open'}><summary class="cursor-pointer font-semibold">¿Cómo funciona?</summary>
    <div class="g3 mt-3 text-sm">${[['1','Cumple tu meta del día','Si vendes el 100 % de tu meta, ganas 40 puntos. Ej.: meta $ 4.800.000, vendes $ 5.120.000 → 40 pts.'],['2','Sube tu ticket','Cada día que tu VPT llega a $ 594.000 ganas 15 puntos. UPT y PPT dan 50 puntos cada uno al cierre.'],['3','Queda en el podio','Los 3 primeros ganan premio si vendieron al menos el 80 % de su meta del concurso.']].map(p=>`<div class="rounded-lg bg-gray-50 p-3"><div class="mb-1 flex h-6 w-6 items-center justify-center rounded-full bg-emerald-600 text-xs font-semibold text-white">${p[0]}</div><b>${p[1]}</b><p class="text-gray-600">${p[2]}</p></div>`).join('')}</div>
    ${tabla(['Indicador','Se mide','Puntos','Máximo'],[['Venta','Cada día','80 % = 10 · 90 % = 20 · 100 % = 40','840'],['VPT','Cada día','100 % = 15','315'],['UPT','Todo el concurso','100 % = 50','50'],['PPT','Todo el concurso','100 % = 50','50']],'mt-3')}
    <p class="ayuda">Cuentan tus días con turno y tus pedidos pagados (incluye QUAC). Una devolución o cancelación descuenta los puntos del día de esa venta. La tabla se actualiza cada hora.</p></details>
  ${canc?'':`<div><h2 class="mb-2 font-semibold">${cerrado?'Tu resultado':'Tu avance de hoy'} <span class="text-xs font-normal text-gray-500">${cerrado?'':'actualizado 2:00 p. m.'}</span></h2><div class="g4 par">
    ${[['Venta', cerrado?'96 %':HOY.p+' %', cerrado?'Concurso':'Tú hoy '+$(HOY.v), cerrado?'':'Meta '+$(HOY.m), cerrado?'+560 pts':'+'+HOY.pv+' pts'],
       ['VPT', cerrado?'18 días':Math.floor(HOY.vpt/META_VPT*100)+' %', cerrado?'días en meta':'Tú hoy '+$(HOY.vpt), 'Meta '+$(META_VPT), cerrado?'+270 pts':'+'+HOY.pp+' pts'],
       ['UPT','104 %','Concurso 2,3','Meta 2,2', cerrado?'+50 pts':'Se evalúa al cierre'],
       ['PPT','97 %','Concurso '+$(262000),'Meta '+$(META_PPT), cerrado?'+0 pts':'Se evalúa al cierre']].map(k=>`<div class="card"><div class="flex items-center justify-between text-sm text-gray-500">${k[0]}<span class="chip ${k[4].startsWith('+')&&k[4]!=='+0 pts'?'c-verde':'c-gris'}">${k[4]}</span></div><div class="mt-1 text-2xl font-semibold">${k[1]}</div><div class="text-xs text-gray-600">${k[2]}</div><div class="text-xs text-gray-500">${k[3]}</div></div>`).join('')}</div></div>
  <div class="g2"><div class="card"><h2 class="mb-2 font-semibold">Tabla de posiciones</h2>
    <div class="mb-3 grid grid-cols-3 gap-2 text-center text-sm">${orden.slice(0,3).map((a,i)=>`<div class="rounded-lg ${a[0]==='Laura Gómez'?'bg-emerald-50 border border-emerald-200':'bg-gray-50'} p-2"><div class="text-xs text-gray-500">${i+1}.º</div><b>${a[0].split(' ')[0]}</b><div>${a[1]} pts</div></div>`).join('')}</div>
    ${tabla(['Puesto','Asesor','Puntos','Venta','Días con meta'], orden.slice(3).map((a,i)=>({c:[a[2]<80&&cerrado?'—':(i+4)+'.º',a[0]+(a[2]<80&&cerrado?' '+chip('Menos del 80 %','rosa'):''),a[1],a[2]+' %',a[3]]})))}</div>
    <div class="card"><h2 class="mb-2 font-semibold">Premios</h2>${PREMIOS.map((p,i)=>`<div class="flex items-center gap-3 border-b border-gray-100 py-2 text-sm"><div class="flex h-9 w-9 items-center justify-center rounded-lg bg-gray-100">${ic(p[1]==='Dinero'?'banknote':'gift')}</div><div><b>${p[0]}</b><div class="text-gray-600">${p[2]}</div></div>${firme?`<span class="ml-auto text-gray-700">${GANA[i][0]}</span>`:''}</div>`).join('')}<p class="ayuda">Para ganar debes vender al menos el 80 % de tu meta del concurso.</p></div></div>
  <div class="card"><h2 class="font-semibold">Tu resumen diario</h2><p class="mb-2 text-sm text-gray-600">${cerrado?'880 puntos: Venta 560 · VPT 270 · UPT 50 · PPT 0. Aquí se muestran los días 10 al 23 nov.':`${L.tot} puntos: Venta ${L.venta} · VPT ${L.vpt} · UPT y PPT se suman al cierre`}</p>
    ${tabla(['Día','Venta','Meta','% logrado','Pts venta','VPT','Pts VPT','Total'], D.map(d=>d.desc?{cls:'text-gray-400',c:[d.f,'Descanso','','','','','','']}:[d.f,$(d.v),$(d.m),d.p+' %',d.pv,$(d.vpt),d.pp,'<b>'+d.tot+'</b>']))}</div>`}`;
}
/* ---------- Pantalla 1b · Tablero del asesor, estilo propuesto: menos texto, secciones marcadas ---------- */
function asesor2(e) {
  if (e==='carga') return asesor(e);
  const cerrado = e!=='activo', canc = e==='cancelado', firme = e==='firme';
  const pts = canc ? 310 : cerrado ? 880 : L.tot;
  const orden = cerrado ? [...CIERRE.filter(a=>a[2]>=80), ...CIERRE.filter(a=>a[2]<80)] : CURSO;

  const franja = {prelim:[ 'clock','Resultados preliminares','Quedan en firme el 5 dic.','#fff','#d1d5db'], firme:['circle-check','Resultados en firme','Quedaste 2.ª y ganaste '+$(300000)+'.','#ecfdf5','#a7f3d0'],
    cancelado:['circle-x','Concurso cancelado el 18 nov','«Se cambió la fecha del evento; se publica uno nuevo». Llevabas 310 puntos.','#fff1f2','#fecdd3']}[e];

  const barra = (p, verde) => `<div class="mt-3 h-1.5 rounded bg-gray-100"><div class="h-1.5 rounded ${verde?'bg-emerald-500':'bg-gray-400'}" style="width:${Math.min(100,p)}%"></div></div>`;
  const ind = cerrado
    ? [['Venta',96,'del concurso','+560'],['VPT',103,'del concurso','+270'],['UPT',104,'2,3 de 2,2','+50'],['PPT',97,$(262000)+' de '+$(META_PPT),'+0']]
    : [['Venta',HOY.p,$(HOY.v)+' de '+$(HOY.m),'+'+HOY.pv],['VPT',Math.floor(HOY.vpt/META_VPT*100),$(HOY.vpt)+' de '+$(META_VPT),'+'+HOY.pp],['UPT',104,'2,3 de 2,2','al cierre'],['PPT',97,$(262000)+' de '+$(META_PPT),'al cierre']];
  const premio = i => !canc && i<3 ? PREMIOS[i][2] : '';
  const casilla = d => d.desc ? `<div class="rounded-lg border border-dashed border-gray-300 py-2 text-center text-gray-400"><div class="text-[11px]">${d.f.split(' ')[0]}</div><div class="text-xs">libre</div></div>`
    : `<div class="rounded-lg py-2 text-center ${d.p>=100?'bg-emerald-600 text-white':d.p>=80?'bg-emerald-100 text-emerald-900':'bg-gray-100 text-gray-500'}" title="${d.p} % de la meta"><div class="text-[11px] opacity-80">${d.f.split(' ')[0]}</div><div class="text-sm font-semibold">${d.tot}</div></div>`;
  return `
  <a class="flex cursor-pointer items-center gap-1 text-sm text-emerald-700" onclick="ir('mis')">${ic('chevron-left')} Mis concursos</a>
  <div class="overflow-hidden rounded-xl border border-gray-200 bg-white">
    <div class="flex items-center justify-center border-b border-emerald-100 bg-emerald-50 text-xs text-emerald-800" style="height:128px">Imagen del concurso · 1600 × 400</div>
    <div class="flex flex-wrap items-center gap-4 p-5">
      <div class="flex h-16 w-16 shrink-0 flex-col items-center justify-center rounded-full ${canc?'bg-gray-200 text-gray-600':'bg-emerald-600 text-white'}"><span class="text-2xl font-semibold leading-none">${canc?'5.º':'2.º'}</span><span class="text-[10px] opacity-80">de 7</span></div>
      <div class="mr-auto"><div class="flex flex-wrap items-center gap-2"><h1 class="text-xl font-semibold">Sprint de noviembre</h1>${canc?chip('Cancelado','rosa'):cerrado?chip(firme?'En firme':'Preliminar', firme?'verde':'gris'):chip('Activo','verde')}</div><p class="text-sm text-gray-500">Stirpe · 10 al 30 nov</p></div>
      <div class="flex divide-x divide-gray-200">${dato(pts,'puntos')}${cerrado?dato(canc?'84 %':'96 %','de tu meta'):dato('7 días','faltan')+dato('45 pts','para el 1.er puesto')}</div>
    </div>
    ${franja?`<div class="flex items-center gap-3 border-t px-5 py-3 text-sm" style="background:${franja[3]};border-color:${franja[4]}">${ic(franja[0])}<b>${franja[1]}</b><span class="text-gray-600">${franja[2]}</span></div>`:''}
  </div>
  ${canc?'':`<section>${sec('gauge', cerrado?'Tu resultado':'Tu avance de hoy', cerrado?'Todo el concurso':'Actualizado a las 2:00 p. m.')}
    <div class="g4 par">${ind.map(k=>`<div class="card"><div class="flex items-center justify-between"><span class="text-sm font-medium text-gray-500">${k[0]}</span><span class="chip ${k[3].startsWith('+')&&k[3]!=='+0'?'c-verde':'c-gris'}">${k[3]}${k[3].startsWith('+')?' pts':''}</span></div><div class="mt-2 text-3xl font-semibold ${k[1]>=100?'text-emerald-700':''}">${k[1]} %</div><div class="text-xs text-gray-500">${k[2]}</div>${barra(k[1],k[1]>=100)}</div>`).join('')}</div></section>`}
  <div class="g2">
    <section class="card">${sec('trophy','Posiciones', canc?'Como iban el 18 nov':'Gana quien venda al menos el 80 % de su meta')}
      <div class="space-y-1">${orden.map((a,i)=>{ const yo = a[0]==='Laura Gómez', fuera = cerrado && a[2]<80;
        return `<div class="flex items-center gap-3 rounded-lg px-2 py-2 ${yo?'bg-emerald-50':''}"><span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full text-xs font-semibold ${fuera?'bg-gray-100 text-gray-400':i<3?'bg-gray-900 text-white':'bg-gray-100 text-gray-600'}">${fuera?'–':i+1}</span>
          <div class="w-32 shrink-0"><div class="truncate text-sm font-medium">${a[0]}${yo?' (tú)':''}</div><div class="truncate text-xs text-gray-500">${fuera?'Menos del 80 %':premio(i)}</div></div>
          <div class="h-2 flex-1 rounded bg-gray-100"><div class="h-2 rounded ${yo?'bg-emerald-500':'bg-gray-300'}" style="width:${Math.round(a[1]/tope*100)}%"></div></div>
          <span class="w-12 shrink-0 text-right text-sm font-semibold">${a[1]}</span></div>`; }).join('')}</div></section>
    <section class="card">${sec('calendar-days','Tus días', canc?'':'Puntos que ganaste cada día')}
      <div class="grid grid-cols-7 gap-2">${D.map(casilla).join('')}</div>

      <div class="mt-3 flex flex-wrap gap-2">${(cerrado&&!canc?[['Venta',560],['VPT',270],['UPT',50],['PPT',0]]:[['Venta',L.venta],['VPT',L.vpt],['UPT','al cierre'],['PPT','al cierre']]).map(x=>chip(x[0]+' · '+x[1])).join('')}</div>
</section>
  </div>
  <details class="card"><summary class="flex cursor-pointer items-center gap-3"><div class="flex h-9 w-9 items-center justify-center rounded-lg bg-gray-100 text-gray-700">${ic('table-2')}</div><span class="font-semibold">Detalle de cada día</span><span class="text-sm text-gray-500">Venta, meta y puntos día por día</span><span class="ml-auto text-gray-400">${ic('chevron-down')}</span></summary>${tabla(['Día','Venta','Meta','%','Pts venta','VPT','Pts VPT','Total'], D.map(d=>d.desc?{cls:'text-gray-400',c:[d.f,'Descanso','','','','','','']}:[d.f,$(d.v),$(d.m),d.p+' %',d.pv,$(d.vpt),d.pp,'<b>'+d.tot+'</b>']),'mt-3')}</details>
  <details class="card"><summary class="flex cursor-pointer items-center gap-3"><div class="flex h-9 w-9 items-center justify-center rounded-lg bg-gray-100 text-gray-700">${ic('circle-help')}</div><span class="font-semibold">¿Cómo se ganan los puntos?</span><span class="ml-auto text-gray-400">${ic('chevron-down')}</span></summary>
    <div class="mt-4 space-y-2">${[['Venta','Cada día',['80 % → 10','90 % → 20','100 % → 40']],['VPT','Cada día',['100 % → 15']],['UPT','Todo el concurso',['100 % → 50']],['PPT','Todo el concurso',['100 % → 50']]].map(r=>`<div class="flex flex-wrap items-center gap-2 border-b border-gray-100 pb-2 text-sm"><b class="w-14">${r[0]}</b><span class="w-36 text-gray-500">${r[1]}</span>${r[2].map(x=>chip(x)).join('')}</div>`).join('')}</div>
    <p class="ayuda">Cuentan tus días con turno y tus pedidos pagados. Una devolución descuenta los puntos del día de esa venta. Se actualiza cada hora.</p></details>`;
}

/* ---------- Pantalla 1 · Asesor: mis concursos ---------- */
function mis(e) {
  const cab = cabeza('Concursos','Los concursos en los que participas o participaste');
  if (e==='vacio') return cab+`<div class="lista p-12 text-center"><div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-gray-100 text-gray-500">${ic('trophy')}</div><h3 class="mb-1 text-base">Todavía no estás en ningún concurso</h3><p class="text-sm text-gray-500">Cuando tu coordinación publique uno, lo verás aquí.</p></div>`;
  if (e==='carga') return cab+`<div class="esq h-10"></div><div class="esq h-72"></div>`;
  // [id, nombre, tienda, fechas, estado, puesto, puntos, resultado, creado, por, estado del tablero]
  const R = [[31,'Sprint de noviembre','Stirpe','10 nov → 30 nov','Activo','2.º de 7',L.tot,'Faltan 7 días','05 nov 2026','Ana Rojas','activo'],[33,'Reto VPT Black Friday','Stirpe','20 nov → 30 nov','Activo','5.º de 13',120,'Faltan 7 días','14 nov 2026','Ana Rojas','activo'],[34,'Navidad Stirpe','Stirpe','01 dic → 24 dic','Programado','—','—','Empieza el 1 dic','18 nov 2026','Carlos Peña',''],
    [27,'Madrugón de octubre','Stirpe','06 oct → 12 oct','Finalizado','1.º de 13',720,'Ganaste '+$(300000),'01 oct 2026','Ana Rojas','firme'],[24,'Cyber Septiembre','Stirpe','14 sep → 20 sep','Finalizado','4.º de 12',610,'Sin premio','09 sep 2026','Carlos Peña','firme'],[19,'Reto UPT de agosto','Stirpe','03 ago → 09 ago','Cancelado','—',120,'Sin ganadores','29 jul 2026','Ana Rojas','cancelado']];
  return cab+filtros('Buscar por nombre o número del concurso',[['Estado',['Todos','Activo','Programado','Finalizado','Cancelado']]])+`
  <div class="lista">${tabla(['ID','Concurso','Fechas','Estado','>Mi puesto','>Mis puntos','Resultado','Creado'], R.map(r=>[`<span class="idc">#${r[0]}</span>`,
    (r[10]?`<a class="enl" onclick="ir('asesor','${r[10]}')">${r[1]}</a>`:`<span class="font-medium text-neutral-900">${r[1]}</span>`)+`<div class="sub">${r[2]}</div>`,
    `<span class="text-xs text-gray-600">${r[3]}</span>`, estado(r[4]), r[5], r[6], r[7], creado(r[8],r[9])]))}${pagina('Mostrando 1–6 de 14')}</div>`;
}

/* ---------- Pantalla 2 · Concursos (inicio) ---------- */
function inicio(e) {
  const cab = cabeza('Concursos','Concursos de venta asistida de tus tiendas',`<button class="btn btn-p" onclick="ir('paso1')">${ic('plus')} Crear concurso</button>`);
  if (e==='vacio') return cab+`<div class="lista p-12 text-center"><div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-gray-100 text-gray-500">${ic('trophy')}</div><h3 class="mb-1 text-base">Todavía no hay concursos</h3><p class="text-sm text-gray-500">Crea el primero en 3 pasos.</p></div>`;
  if (e==='carga') return cab+`<div class="g4 par">${'<div class="esq h-20"></div>'.repeat(4)}</div><div class="esq h-72"></div>`;
  const menu = est => `<div class="flex justify-end"><details class="menu"><summary class="btn" style="border:0;padding:0 8px">${ic('ellipsis-vertical')}</summary><div class="ops">
    <a onclick="ir('resumen')">${ic('eye')} Ver resumen</a><a onclick="ir('paso1','editar')">${ic('pencil')} Editar</a><a>${ic('copy')} Duplicar</a>
    ${est==='Activo'||est==='Programado'?`<a class="pel" onclick="cancelar()">${ic('ban')} Cancelar concurso</a>`:est==='Borrador'?`<a class="pel">${ic('trash-2')} Eliminar borrador</a>`:`<a>${ic('archive')} Archivar</a>`}</div></details></div>`;
  // [id, nombre, tienda, fechas, estado, asesores, ganadores, premios, creado, por, destino]
  const R = [[31,'Sprint de noviembre','Stirpe','10 nov → 30 nov','Activo',7,'3 por puesto','—','05 nov 2026','Ana Rojas','activo'],[33,'Reto VPT Black Friday','Stirpe','20 nov → 30 nov','Activo',13,'Todos con 300 pts','—','14 nov 2026','Ana Rojas','activo'],[35,'Navidad Derek','Derek','01 dic → 24 dic','Programado',5,'2 por puesto','—','18 nov 2026','Carlos Peña','activo'],
    [27,'Madrugón de octubre','Stirpe','06 oct → 12 oct','Finalizado',13,'3 por puesto','1 de 3 entregados','01 oct 2026','Ana Rojas','firme'],[28,'Semana Derek','Derek','20 oct → 26 oct','Finalizado',4,'1 por puesto','1 de 1 entregados','15 oct 2026','Carlos Peña','firme'],[19,'Reto UPT de agosto','Stirpe','03 ago → 09 ago','Cancelado',12,'—','—','29 jul 2026','Ana Rojas','cancelado'],[36,'Concurso de diciembre','Stirpe · Derek','Sin fechas','Borrador','—','—','—','20 nov 2026','Ana Rojas','']];
  return cab+`
  <div class="g4 par">${[['Activos',2],['Programados',1],['Finalizados',2],['Premios por entregar',2]].map(k=>`<div class="card"><div class="text-xs text-gray-500">${k[0]}</div><div class="text-2xl font-semibold">${k[1]}</div></div>`).join('')}</div>
  <div class="card flex items-center gap-3 text-sm" style="background:#fff1f2;border-color:#fecdd3">${ic('gift')}<span><b>Hay 2 premios por entregar</b> de «Madrugón de octubre».</span><button class="btn ml-auto" onclick="ir('resumen','firme')">Ver</button></div>
  ${filtros('Buscar por nombre o número del concurso',[['Tienda',['Todas','Stirpe','Derek']],['Estado',['Todos','Borrador','Programado','Activo','Finalizado','Cancelado','Archivados']]])}
  <div class="lista">${tabla(['ID','Concurso','Fechas','Estado','>Asesores','Ganadores','Premios','Creado',''], R.map(r=>[`<span class="idc">#${r[0]}</span>`,
    `<a class="enl" onclick="ir('${r[10]?'resumen':'paso1'}','${r[10]}')">${r[1]}</a><div class="sub">${r[2]}</div>`,
    `<span class="text-xs ${r[3]==='Sin fechas'?'text-gray-400':'text-gray-600'}">${r[3]}</span>`, estado(r[4]), r[5], r[6], r[7], creado(r[8],r[9]), menu(r[4])]))}${pagina('Mostrando 1–7 de 23')}</div>`;
}
function cancelar() { modal('Cancelar «Sprint de noviembre»', `<p>El concurso deja de sumar puntos y no tendrá ganadores ni premios. Los asesores lo verán como cancelado con los puntos que llevaban. No se puede reactivar; lo puedes duplicar.</p><label class="lbl mt-3">Motivo (lo verán los asesores)</label><textarea class="inp" rows="3" placeholder="Escribe por qué se cancela"></textarea><p class="ayuda" style="color:#be123c">El motivo es obligatorio.</p>`, 'Cancelar concurso'); }

/* ---------- Pantalla 3 · Resumen ---------- */
function resumen(e) {
  const canc = e==='cancelado', cerr = e==='prelim'||e==='firme', firme = e==='firme';
  const est = canc?chip('Cancelado','rosa'):firme?chip('Finalizado · en firme','verde'):cerr?chip('Finalizado · preliminar'):chip('Activo','verde');
  const F = cerr ? CIERRE : CURSO.map(a=>[...a,'']);
  const elig = F.filter(a=>a[2]>=80), noElig = F.filter(a=>a[2]<80);
  const filas = [...elig.map((a,i)=>[(i+1)+'.º',a[0],a[1],a[2]+' %',chip('Cumple','verde'),a[3],cerr&&i<3?chip('Gana '+PREMIOS[i][0],'verde'):a[4]||'']), ...noElig.map(a=>['—',a[0],a[1],a[2]+' %',chip('No cumple','rosa'),a[3],cerr?a[4]:'Va por debajo del 80 %'])];
  return `
  <div class="flex flex-wrap items-center gap-2"><h1 class="text-xl font-semibold">Sprint de noviembre</h1>${est}<span class="mr-auto text-sm text-gray-500">Stirpe · 10 al 30 nov</span>
    <button class="btn">${ic('download')} Descargar resultados</button><button class="btn">${ic('copy')} Duplicar concurso</button></div>
  ${canc?`<div class="card flex gap-3 text-sm" style="background:#fff1f2;border-color:#fecdd3">${ic('circle-x')}<div><b>Cancelado por Ana Rojas el 18 nov.</b> Motivo: «Se cambió la fecha del evento; se publica uno nuevo». La tabla quedó como iba ese día. No hay ganadores ni premios.</div></div>`:''}
  ${e==='prelim'?`<div class="card flex gap-3 text-sm">${ic('clock')}<div><b>Resultados preliminares.</b> Las devoluciones y cancelaciones se siguen revisando. Quedan en firme el 5 dic.</div></div>`:''}
  ${e==='activo'?`<div class="card flex gap-3 text-sm">${ic('refresh-cw')}<div>Concurso en curso: día 14 de 21. Última actualización 2:00 p. m.</div></div>`:''}
  <div class="g4 par">${[['Asesores',7],['Cumplen el requisito 80 %',cerr?'6 de 7':'6 de 7'],['Puntos repartidos',cerr?'5.430':'2.610'],['Descontados por devoluciones',cerr?'−85':'−40']].map(k=>`<div class="card"><div class="text-xs text-gray-500">${k[0]}</div><div class="text-2xl font-semibold">${k[1]}</div></div>`).join('')}</div>
  ${cerr?`<div class="card"><h2 class="mb-2 font-semibold">Ganadores y premios</h2>${GANA.map((g,i)=>`<div class="flex flex-wrap items-center gap-3 border-b border-gray-100 py-2 text-sm"><div class="flex h-9 w-9 items-center justify-center rounded-lg bg-gray-100">${ic(PREMIOS[i][1]==='Dinero'?'banknote':'gift')}</div><div class="mr-auto"><b>${i+1}.º ${g[0]}</b><div class="text-gray-600">${PREMIOS[i][2]} · ${PREMIOS[i][1]}</div></div>${!firme?chip('Se entrega cuando quede en firme'):i===0?`<span class="text-gray-600">${ic('check')} Entregado por Ana Rojas el 6 dic</span>`:`<button class="btn btn-p" onclick="modal('Marcar como entregado','<p>Premio de ${g[0]}: ${PREMIOS[i][2]}. Queda registrado tu nombre y la fecha de hoy.</p>','Marcar como entregado')">Marcar como entregado</button>`}</div>`).join('')}<p class="ayuda">El premio en dinero también se marca aquí cuando se le paga al asesor. Si dos asesores siguen empatados después de todos los criterios, comparten el puesto y cada uno recibe el premio.</p></div>`:''}
  <div class="card"><h2 class="mb-2 font-semibold">Cumplimiento del equipo</h2><div class="g4 par text-sm">${[['Venta','93 %'],['VPT','98 %'],['UPT','101 %'],['PPT','96 %']].map(k=>`<div class="rounded-lg bg-gray-50 p-3"><div class="text-gray-500">${k[0]}</div><div class="text-xl font-semibold">${k[1]}</div><div class="mt-1 h-1.5 rounded bg-gray-200"><div class="h-1.5 rounded bg-emerald-500" style="width:${Math.min(100,parseInt(k[1]))}%"></div></div></div>`).join('')}</div></div>
  <div class="card p-0"><h2 class="p-4 pb-2 font-semibold">Tabla de posiciones</h2>${tabla(['Puesto','Asesor','Puntos','Venta del concurso','Requisito 80 %','Días con meta','Nota'], filas)}</div>`;
}

/* ---------- Pantallas 4 a 6 · Crear / editar ---------- */
const pasos = n => `<div class="flex items-center gap-2 text-sm">${['Información y participantes','Reglas de puntos','Premios y publicar'].map((t,i)=>`<span class="flex items-center gap-2 ${i+1===n?'font-semibold text-gray-900':'text-gray-400'}"><span class="flex h-6 w-6 items-center justify-center rounded-full text-xs ${i+1<=n?'bg-emerald-600 text-white':'bg-gray-200'}">${i+1}</span><span class="${i+1===n?'':'solo-esc'}">${t}</span></span>${i<2?'<span class="h-px w-6 bg-gray-300"></span>':''}`).join('')}</div>`;
const avisoEd = ed => ed ? `<div class="card flex gap-3 text-sm">${ic('lock')}<div><b>El concurso ya empezó.</b> Solo puedes cambiar los textos, la imagen y los premios. Para cambiar fechas, participantes o puntos: cancela el concurso y duplícalo.</div></div>` : '';
const pie = (ant, sig, extra='') => `<div class="pie flex gap-2 pt-2">${ant?`<button class="btn" onclick="ir('${ant}',EST)">Atrás</button>`:''}<button class="btn">Guardar borrador</button><span class="solo-esc flex-1"></span>${extra||`<button class="btn btn-p" onclick="ir('${sig}',EST)">Siguiente</button>`}</div>`;
const campo = (l, h, a='') => `<div><label class="lbl">${l}</label>${h}${a?`<p class="ayuda">${a}</p>`:''}</div>`;

function paso1(e) { const ed = e==='editar', b = ed?'disabled':'';
  return `<h1 class="text-xl font-semibold">${ed?'Editar concurso':'Crear concurso'}</h1>${pasos(1)}${avisoEd(ed)}

    ${campo('Cómo funciona','<textarea class="inp" rows="3">Cada día que cumples tu meta de venta ganas puntos…</textarea>','El asesor lo ve tal cual. En el paso 3 lo puedes armar con las reglas del concurso.')}
    ${campo('Imagen (opcional)',`<div class="flex items-center justify-center rounded-lg border border-dashed border-gray-300 bg-gray-50 py-6 text-sm text-gray-500">${ic('image')}&nbsp;JPG o PNG de 1600 × 400 px</div>`,'Se muestra arriba del concurso en la pantalla del asesor. Deja el texto importante en el centro.')}</div>
  <div class="card space-y-4"><h2 class="font-semibold">Duración</h2><div class="g3">
    ${campo('Empieza',`<input class="inp" type="date" value="2026-11-10" ${b}>`)}${campo('Termina',`<input class="inp" type="date" value="2026-11-30" ${b}>`,'Las ventas del día cuentan hasta las 11:59 p. m.')}${campo('Visible desde',`<input class="inp" type="date" value="2026-11-07" ${b}>`,'Igual o antes de la fecha de inicio.')}</div></div>
  <div class="card space-y-4"><h2 class="font-semibold">Participantes</h2>
    ${campo('Tiendas',`<div class="flex flex-wrap gap-2 ${ed?'opacity-50':''}"><label class="chip c-verde"><input type="checkbox" checked ${b}> Stirpe · 13 asesores</label><label class="chip c-gris"><input type="checkbox" ${b}> Derek · 5 asesores</label></div>`,'Solo aparecen las tiendas con venta asistida a las que tienes acceso. Si eliges varias, compiten en una sola tabla.')}
    ${campo('Asesores',`<select class="inp" ${b}><option>Todos los de la tienda (13)</option><option>Elegir uno por uno</option></select>`)}
    ${campo('Asesor que entra después',`<select class="inp" ${b}><option>Participa desde su primer día con meta</option><option>No participa</option></select>`)}</div>
  ${pie('', 'paso2')}`; }

function paso2(e) { const ed = e==='editar', b = ed?'disabled':'';
  const ind = (n, mide, niv, max, calc) => `<div class="ind rounded-lg border border-gray-200 p-3 ${ed?'bloq':''}" oninput="recalc()" onchange="recalc()"><div class="flex flex-wrap items-center gap-2"><b class="text-gray-900">${n}</b><span class="text-xs text-gray-500">${calc}</span><button class="btn ml-auto" style="padding:0 8px" ${b} title="Quitar">${ic('trash-2')}</button></div>
    <div class="g3 mt-2"><div><label class="lbl">Se mide</label><select class="inp mide" ${b}><option>${mide}</option><option>${mide==='Cada día'?'Todo el concurso':'Cada día'}</option></select></div>
    <div><label class="lbl">Niveles (% mínimo → puntos)</label><div class="space-y-1">${niv.map(x=>`<div class="flex items-center gap-1 text-sm"><span class="text-gray-500">Desde</span><input class="inp" style="width:64px" value="${x[0]}" ${b}><span>%</span><span class="text-gray-500">da</span><input class="inp pt" type="number" style="width:64px" value="${x[1]}" ${b}><span>pts</span><button class="btn" style="padding:0 6px;min-height:30px" ${b} title="Quitar nivel">${ic('x')}</button></div>`).join('')}<button class="btn" style="min-height:30px" ${b}>${ic('plus')} Agregar nivel</button></div><label class="mt-2 flex items-center gap-2 text-xs text-gray-600"><input type="checkbox" checked ${b}> Solo el nivel más alto</label></div>
    <div><label class="lbl">Máximo posible</label><div class="text-lg font-semibold text-gray-900"><span class="mx">${max}</span> pts</div></div></div></div>`;
  return `<h1 class="text-xl font-semibold">${ed?'Editar concurso':'Crear concurso'}</h1>${pasos(2)}${avisoEd(ed)}
  <div class="card space-y-3"><h2 class="font-semibold">Indicadores y puntos</h2><p class="text-sm text-gray-600">Aquí defines cuántos puntos da cada indicador. Por cada uno escribes los niveles: desde qué % de cumplimiento y cuántos puntos da. Los valores de abajo son un ejemplo ya diligenciado; un concurso nuevo empieza con Venta y un nivel vacío.</p>
    ${ind('Venta','Cada día',[[80,10],[90,20],[100,40]],'840','Venta ÷ meta de venta')}
    ${ind('VPT','Cada día',[[100,15]],'315','Venta ÷ pedidos, contra la meta de la tienda')}
    ${ind('UPT','Todo el concurso',[[100,50]],'50','Unidades ÷ pedidos')}
    ${ind('PPT','Todo el concurso',[[100,50]],'50','Venta ÷ unidades; la meta es VPT ÷ UPT')}
    <button class="btn" ${b}>${ic('plus')} Agregar indicador</button>
    <p class="text-sm"><b>Total: hasta <span id="tot-pts">1.255</span> puntos</b> si el asesor trabaja los 21 días. Con días de descanso el máximo de cada asesor baja.</p></div>
  <div class="card space-y-4"><h2 class="font-semibold">Ganadores</h2><div class="g2">
    ${campo('Quién gana',`<select class="inp" ${b}><option>Por puesto</option><option>Todos los que lleguen a un puntaje</option></select>`)}
    ${campo('Cantidad de ganadores',`<input class="inp" type="number" value="3" ${b}>`,'De 1 a 13 (asesores del concurso).')}
    ${campo('Requisito mínimo para ganar',`<div class="flex items-center gap-2"><span class="text-sm">Venta del concurso igual o mayor a</span><input class="inp" style="width:80px" value="80" ${b}><span>%</span></div>`,'Venta de los días del concurso ÷ meta de esos mismos días.')}
    ${campo('Desempate',`<select class="inp" ${b}><option>Mayor % de venta</option><option>Más días con meta</option></select>`,'Si siguen empatados: mayor % de venta, más días con meta y mayor venta en pesos. Si aún empatan, comparten el puesto y cada uno recibe el premio.')}</div></div>
  <div class="card"><h2 class="mb-2 font-semibold">Reglas que aplican a todos los concursos</h2><ul class="space-y-1 text-sm text-gray-700">${['Las metas son las que ya están cargadas en GET.','Cuentan solo los días con turno del asesor (días con meta de venta).','Cuentan los pedidos pagados, incluido QUAC. El contraentrega cuenta cuando se paga.','Una devolución o cancelación recalcula el día de esa venta, hasta 5 días después del cierre.','La tabla de posiciones se actualiza cada hora.','Cuando el concurso empieza solo se pueden cambiar textos, imagen y premios.'].map(t=>`<li class="flex gap-2">${ic('check')}<span>${t}</span></li>`).join('')}</ul></div>
  ${pie('paso1','paso3')}`; }

function paso3(e) { const ed = e==='editar', falta = e==='falta', err = e==='error';
  const val = [['Hay al menos un indicador',1],['Los premios están completos',1],['Stirpe tiene cargado el presupuesto de noviembre, con VPT y UPT',falta?0:1]];
  return `<h1 class="text-xl font-semibold">${ed?'Editar concurso':'Crear concurso'}</h1>${pasos(3)}${avisoEd(ed)}
  ${err?`<div class="card flex gap-3 text-sm" style="background:#fff1f2;border-color:#fecdd3">${ic('circle-alert')}<div><b>No se pudo guardar.</b> Revisa tu conexión e inténtalo de nuevo. Lo que escribiste sigue aquí.</div></div>`:''}
  <div class="card space-y-4"><h2 class="font-semibold">Premios</h2>
    ${campo('Modo','<select class="inp" id="modo" onchange="pinta()"><option value="p">Un premio por puesto</option><option value="u">Un solo premio para todos los ganadores</option></select>','')}
    <div id="premios"></div>
    <div class="flex justify-between border-t border-gray-100 pt-3 text-sm"><span>Total en dinero</span><b>${$(800000)}</b></div></div>
  <div class="card space-y-2"><h2 class="font-semibold">Cómo funciona</h2><p class="text-sm text-gray-600">Arma el texto que ve el asesor con los indicadores, puntos, ganadores y premios que configuraste. Lo puedes editar después.</p><button class="btn">${ic('wand-sparkles')} Armar «Cómo funciona» con las reglas</button></div>
  ${ed?'':`<div class="card space-y-2"><h2 class="font-semibold">Antes de publicar</h2>${val.map(v=>`<div class="flex items-center gap-2 text-sm">${v[1]?chip('Listo','verde'):chip('Falta','rosa')}<span>${v[0]}</span></div>`).join('')}
    ${falta?`<p class="ayuda" style="color:#be123c">Carga el presupuesto de noviembre de Stirpe en Comisiones › Presupuesto para poder publicar.</p>`:''}
    <div class="flex items-center gap-2 text-sm">${chip('Aviso')}<span>Las fechas se cruzan con «Reto VPT Black Friday» de Stirpe. Puedes publicar: los asesores verán los dos.</span></div></div>`}
  ${pie('paso2','', ed?`<button class="btn btn-p">Guardar cambios</button>`:`<button class="btn btn-p" ${falta?'disabled':''} onclick="modal('Publicar «Sprint de noviembre»','<p>Los 13 asesores de Stirpe lo verán desde el 7 nov. Empieza el 10 nov y termina el 30 nov. Cuando empiece solo podrás cambiar textos, imagen y premios.</p>','Publicar')">Publicar</button>`)}`; }
function pinta() { const el = document.getElementById('premios'); if (!el) return; const u = document.getElementById('modo').value==='u';
  const fila = (t, tipo, v) => `<div class="g3 border-b border-gray-100 py-2"><div class="self-center text-sm font-medium">${t}</div><select class="inp"><option ${tipo==='Dinero'?'selected':''}>Dinero</option><option ${tipo==='Regalo'?'selected':''}>Regalo</option>${u?'<option>Rifa</option>':''}</select><input class="inp" value="${v}"></div>`;
  el.innerHTML = u ? fila('Todos los ganadores','Dinero','$ 100.000') + `<p class="ayuda">Con «Rifa» escribes el premio mayor; se sortea entre los ganadores en la oficina y aquí solo se marca entregado.</p>` : PREMIOS.map(p=>fila(p[0],p[1],p[2])).join('') + `<p class="ayuda">Dinero pide el valor; Regalo pide la descripción. Hay una fila por cada ganador del paso 2.</p>`; }

/* ---------- Navegación del mockup ---------- */
const P = { mis:{t:'1 · Asesor: mis concursos', f:mis, m:'Venta asistida › Concursos', u:'LG', e:[['lista','Con concursos'],['vacio','Sin concursos'],['carga','Cargando']]},
  asesor:{t:'1b · Asesor: tablero', f:e=>ESTILO==='p'?asesor2(e):asesor(e), m:'Venta asistida › Concursos › Sprint de noviembre', u:'LG', e:[['activo','Activo'],['prelim','Resultados preliminares'],['firme','Resultados en firme'],['cancelado','Cancelado'],['carga','Cargando']]},
  inicio:{t:'2 · Inicio', f:inicio, m:'Venta asistida › Concursos', u:'AR', e:[['lista','Con concursos'],['vacio','Vacío'],['carga','Cargando']]},
  resumen:{t:'3 · Resumen', f:resumen, m:'Venta asistida › Concursos › Sprint de noviembre', u:'AR', e:[['activo','Activo'],['prelim','Preliminares'],['firme','En firme'],['cancelado','Cancelado']]},
  paso1:{t:'4 · Paso 1', f:paso1, m:'Venta asistida › Concursos › Crear', u:'AR', e:[['nuevo','Nuevo'],['editar','Editar ya iniciado']]},
  paso2:{t:'5 · Paso 2', f:paso2, m:'Venta asistida › Concursos › Crear', u:'AR', e:[['nuevo','Nuevo'],['editar','Editar ya iniciado']]},
  paso3:{t:'6 · Paso 3', f:paso3, m:'Venta asistida › Concursos › Crear', u:'AR', e:[['nuevo','Listo para publicar'],['falta','Falta una validación'],['error','Error al guardar'],['editar','Editar ya iniciado']]} };
let PANT = 'mis', EST = 'lista', ESTILO = 'p';
function estilo(x) { ESTILO = x; document.querySelectorAll('.est').forEach(b=>{ b.classList.toggle('bg-white', b.dataset.est===x); b.classList.toggle('text-black', b.dataset.est===x); }); ir('asesor', EST); }
function ir(p, e) { PANT = p; const es = P[p].e.map(x=>x[0]); EST = es.includes(e) ? e : es[0];
  document.getElementById('b-pant').innerHTML = Object.entries(P).map(([k,v])=>`<button onclick="ir('${k}')" class="rounded px-2 py-1 ${k===p?'bg-white text-black':''}">${v.t}</button>`).join('');
  document.getElementById('b-est').innerHTML = P[p].e.map(x=>`<option value="${x[0]}" ${x[0]===EST?'selected':''}>${x[1]}</option>`).join('');
  document.getElementById('miga').textContent = P[p].m; document.getElementById('avatar').textContent = P[p].u;
  document.getElementById('c').innerHTML = P[p].f(EST); pinta(); lucide.createIcons(); window.scrollTo(0,0); }
function modal(t, cuerpo, ok) { const m = document.getElementById('modal'); m.className = m.className.replace('hidden','flex');
  m.innerHTML = `<div class="w-full max-w-md rounded-xl bg-white p-5 text-sm"><h3 class="mb-2 text-base font-semibold">${t}</h3>${cuerpo}<div class="mt-4 flex justify-end gap-2"><button class="btn" onclick="cerrar()">Volver</button><button class="btn btn-p" onclick="cerrar()">${ok}</button></div></div>`; }
function cerrar() { const m = document.getElementById('modal'); m.className = m.className.replace('flex','hidden'); }
document.getElementById('b-est').onchange = e => ir(PANT, e.target.value);
document.querySelectorAll('.modo').forEach(b => b.onclick = () => { document.body.classList.remove('esc','cel'); document.body.classList.add(b.dataset.modo); document.querySelectorAll('.modo').forEach(x=>{ x.classList.toggle('bg-white', x===b); x.classList.toggle('text-black', x===b); }); });
function recalc() { let t = 0; document.querySelectorAll('.ind').forEach(d => { const m = Math.max(0, ...[...d.querySelectorAll('.pt')].map(i=>+i.value||0)) * (d.querySelector('.mide').value==='Cada día'?21:1); d.querySelector('.mx').textContent = m.toLocaleString('es-CO'); t += m; }); const el = document.getElementById('tot-pts'); if (el) el.textContent = t.toLocaleString('es-CO'); }
document.querySelector('.modo').click(); const H = location.hash.slice(1).split('/'); ir(P[H[0]] ? H[0] : 'mis', H[1]);
</script>
</body>
</html>
