// ═══ Cálculo de la fila (lo que hará el servicio: sumar lo que FilaDetalleDiario compone) ═══
function derivarAsesor(a, sinDesglose) {
  const total = a.webV + a.facV + a.tie + a.dev;
  const nped  = a.webN + a.facN;
  const meta  = a.meta;
  const cump  = meta > 0 ? total / meta * 100 : null;
  const falta = p => meta > 0 ? Math.max(0, meta * p / 100 - total) : null;
  const pedTc = a.conv > 0 ? Math.round(a.conv * META_TCV / 100) : null;
  return {
    a, total, nped, meta, cump,
    pc80: falta(80), pc90: falta(90), pc100: falta(100),
    bonoMonto: (a.verde + a.amar) * BONO_DIA, bonoProv: a.amar, bonoDias: a.verde + a.amar,
    vpt: nped > 0 ? (a.facV + a.webV) / nped : null,
    upt: nped > 0 ? a.unid / nped : null,
    ppt: a.unid > 0 ? (a.facV + a.webV) / a.unid : null,
    itemsUpt: nped > 0 ? Math.max(0, Math.ceil(META_UPT * nped) - a.unid) : null,
    pedTc, pedFaltan: pedTc === null ? null : pedTc - nped,
    comision: Math.round(total > 0 ? total * 0.0067 : 0),   // ilustrativa
    pendiente: PENDIENTE[a.cod] ?? 0,
    sinDesglose,
  };
}

  ptc:   'Pedidos que debería llevar para cumplir la meta de tasa de conversión: tráfico atendido × meta de TC.',
  pfal:  'Ped. para TC menos los pedidos hechos. «Cumple» si ya los superó.',
  com:   'Comisión proyectada: sobre lo facturado más lo pagado sin factura, con la escala vigente.',
  ctot:  'Comisión proyectada + Bono acumulado.',
};

// Columnas de la tabla de asesores (21). fija: no se puede ocultar (variante A).
const COLS_TABLA = [
  { k:'nombre', t:'Nombre',            al:'text-left',   fija:true, sticky:'izq' },
  { k:'meta',   t:'Meta',              al:'text-right',  fija:true, tip:TIPS.meta },
  { k:'web',    t:'Pedidos web',       al:'text-right',  bg:BANDA.web,   tip:TIPS.web },
  { k:'fac',    t:'Facturado',         al:'text-right',  bg:BANDA.fac,   tip:TIPS.fac },
  { k:'dev',    t:'Devoluciones',      al:'text-right',  bg:BANDA.dev,   tip:TIPS.dev },
  { k:'tie',    t:'Tienda física',     al:'text-right',  bg:BANDA.tie,   tip:TIPS.tie },
  { k:'total',  t:'Total venta',       al:'text-right',  bg:BANDA.total, fija:true, tip:TIPS.total, th:'text-gray-900' },
  { k:'cumpl',  t:'Cumplimiento',      al:'text-center', fija:true, tip:TIPS.cumpl },
  { k:'pc80',   t:'Por cumplir 80%',   al:'text-right',  tip:TIPS.pc },
  { k:'pc90',   t:'Por cumplir 90%',   al:'text-right',  tip:TIPS.pc },
  { k:'pc100',  t:'Por cumplir 100%',  al:'text-right',  tip:TIPS.pc },
  { k:'bono',   t:'Bono acumulado',    al:'text-right',  tip:TIPS.bono },
  { k:'nped',   t:'Nro pedidos',       al:'text-right',  tip:TIPS.nped },
  { k:'vpt',    t:'VPT',               al:'text-right',  tip:TIPS.vpt },
  { k:'iupt',   t:'Ítems UPT',         al:'text-right',  tip:TIPS.iupt },
  { k:'upt',    t:'UPT',               al:'text-right',  tip:TIPS.upt },
  { k:'ppt',    t:'PPT',               al:'text-right',  tip:TIPS.ppt },
  { k:'ptc',    t:'Ped. para TC',      al:'text-right',  tip:TIPS.ptc },
  { k:'pfal',   t:'Ped. que faltan',   al:'text-right',  tip:TIPS.pfal },
  { k:'com',    t:'Comisión proy.',    al:'text-right',  tip:TIPS.com },
  { k:'ctot',   t:'Comisión total proy.', al:'text-right', fija:true, sticky:'der', tip:TIPS.ctot },
];
const CLAVE_PREF = 'gw156.columnas.ocultas.mockup';
const OCULTAS = new Set(JSON.parse(localStorage.getItem(CLAVE_PREF) || '[]'));
const guardarPref = () => localStorage.setItem(CLAVE_PREF, JSON.stringify([...OCULTAS]));

function celdaPorCumplir(cump, umbral, monto) {
  if (cump === null) return '<span class="text-gray-300">—</span>';
  if (cump >= 100 && umbral === 100) return '<span class="inline-block rounded bg-emerald-100 px-1.5 py-0.5 text-[11px] font-semibold text-emerald-700">Cumple</span>';
  if (monto === null || monto <= 0) return '<span class="text-gray-400">N/A</span>';
  const color = umbral === 80 ? 'text-red-600' : umbral === 90 ? 'text-orange-600' : 'text-emerald-700';
  return `<span class="${color}">${pesos(monto)}</span>`;
}
function celdaSemaforo(valor, meta, fmt) {
  if (valor === null) return '<span class="text-gray-300">—</span>';
  const b = banda(meta > 0 ? valor / meta * 100 : null);
  return `<span class="inline-block rounded px-1.5 py-0.5 font-semibold ${b ? FONDO[b] : 'text-gray-800'}">${fmt(valor)}</span>`;
}
function celdaBono(x) {
  if (!x.bonoDias) return '<span class="text-gray-300">—</span>';
  const prov = x.bonoProv
    ? ` <span class="tip tip-arriba tip-fin inline-block align-middle" data-tip="Aún no se ha facturado: ${x.bonoProv} de estos bonos cuentan pedidos pagados que el ERP todavía no factura. Si la factura llega por menos y el día baja del 100 %, el bono se retira."><span class="inline-flex items-center gap-1 rounded-full border border-amber-200 bg-amber-50 px-1.5 py-0.5 text-[10px] font-semibold text-amber-700" style="border-bottom-style:solid">${ICO.clock}${x.bonoProv} prov.</span></span>`
    : '';
  return `<span class="font-semibold text-gray-800">${pesos(x.bonoMonto)}</span> <span class="text-[11px] text-gray-400">(${x.bonoDias})</span>${prov}`;
}

function celda(c, x) {
  const sd = x.sinDesglose;
  const gris = '<span class="text-gray-300">—</span>';
  switch (c.k) {
    case 'nombre': return `<span class="inline-flex items-center gap-2"><span class="inline-flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-[10px] font-bold text-white ${AVATARES[x.i % AVATARES.length]}">${iniciales(x.a.n)}</span><span class="font-medium text-gray-800" title="${x.a.n}">${x.a.n.split(' ').slice(0,2).join(' ')}</span>${x.a.meta === null ? '<span class="tip inline-block" data-tip="Sin presupuesto asignado en el período"><span class="text-[10px] font-semibold text-gray-400" style="border:0">sin meta</span></span>' : ''}</span>`;
    case 'meta':  return x.meta === null ? gris : pesos(x.meta);
    case 'web':   return sd ? gris : conNum(x.a.webV, x.a.webN);
    case 'fac':   return sd ? gris : conNum(x.a.facV, x.a.facN);
    case 'dev':   return sd ? gris : `<span class="${x.a.dev ? 'text-red-600' : 'text-gray-400'}">${signo(x.a.dev)}</span>`;
    case 'tie':   return sd ? gris : `<span class="${x.a.tie ? 'text-emerald-700' : 'text-gray-400'}">${signo(x.a.tie)}</span>`;
    case 'total': return `<span class="font-bold ${x.total < 0 ? 'text-red-600' : 'text-gray-900'}">${pesos(x.total)}</span>`;
    case 'cumpl': { const b = banda(x.cump); return b ? `<span class="inline-block min-w-[46px] rounded ${BADGE[b]} px-1.5 py-0.5 text-xs font-bold text-white">${pctTxt(x.cump)}</span>` : gris; }
    case 'pc80':  return celdaPorCumplir(x.cump, 80,  x.pc80);
    case 'pc90':  return celdaPorCumplir(x.cump, 90,  x.pc90);
    case 'pc100': return celdaPorCumplir(x.cump, 100, x.pc100);
    case 'bono':  return celdaBono(x);
    case 'nped':  return sd ? gris : (x.nped ? entero(x.nped) : gris);
    case 'vpt':   return sd ? gris : celdaSemaforo(x.vpt, META_VPT, pesos);
    case 'iupt':  return sd || x.itemsUpt === null ? gris : (x.itemsUpt === 0 ? '<span class="inline-block rounded bg-emerald-100 px-1.5 py-0.5 text-[11px] font-semibold text-emerald-700">Cumple</span>' : entero(x.itemsUpt));
    case 'upt':   return sd ? gris : celdaSemaforo(x.upt, META_UPT, dec2);
    case 'ppt':   return sd || x.ppt === null ? gris : `<span class="font-semibold text-gray-800">${pesos(x.ppt)}</span>`;
    case 'ptc':   return x.pedTc === null ? gris : entero(x.pedTc);
    case 'pfal':  return x.pedFaltan === null ? gris : (x.pedFaltan <= 0 ? '<span class="inline-block rounded bg-emerald-100 px-1.5 py-0.5 text-[11px] font-semibold text-emerald-700">Cumple</span>' : entero(x.pedFaltan));
    case 'com':   return x.comision ? `<span class="text-gray-500">${pesos(x.comision)}</span>` : gris;
    case 'ctot':  return (x.comision + x.bonoMonto) ? `<span class="font-semibold text-emerald-700">${pesos(x.comision + x.bonoMonto)}</span>` : gris;
  }
}

function claseSticky(c, pos) {
  if (c.sticky === 'izq') return `sticky left-0 z-10 bg-white shadow-[2px_0_0_0_#e5e7eb] ${pos === 'th' ? '' : 'group-hover:bg-gray-50'}`;
  if (c.sticky === 'der') return `sticky right-0 z-10 ${pos === 'th' ? 'bg-emerald-50 text-emerald-700' : 'bg-emerald-50 group-hover:bg-emerald-100'} shadow-[-2px_0_0_0_#e5e7eb]`;
  return '';
}

function tablaAsesores(estado, ancho) {
  const vis = COLS_TABLA.filter(c => ancho === 'B' || !OCULTAS.has(c.k));
  const sinDesglose = estado === 'antescorte';
  const filas = estado === 'vacio' ? [] : ASESORES.map((a, i) => ({ ...derivarAsesor(a, sinDesglose), i })).sort((p, q) => q.total - p.total);

  const th = vis.map((c, i) => {
    const tipCls = c.tip ? ` tip${i === 0 ? ' tip-ini' : (i >= vis.length - 3 ? ' tip-fin' : '')}` : '';
    const st = c.bg ? ` style="background:${c.bg}"` : '';
    return `<th class="whitespace-nowrap px-3 py-2 font-medium ${c.al} ${claseSticky(c,'th')} ${c.th || ''}${tipCls}"${c.tip ? ` data-tip="${c.tip}"` : ''}${st}><span>${c.t}</span></th>`;
  }).join('');

  let cuerpo;
  if (estado === 'cargando') {
    cuerpo = [0,1,2,3,4].map(() => `<tr><td colspan="${vis.length}" class="px-3 py-2"><div class="skeleton h-8 rounded"></div></td></tr>`).join('');
  } else if (estado === 'error') {
    cuerpo = `<tr><td colspan="${vis.length}" class="px-5 py-10 text-center text-xs text-red-800"><div class="mx-auto max-w-md rounded-xl border border-red-200 bg-red-50 p-6">No pudimos cargar la tabla de asesores.<button class="ml-2 rounded-lg border border-red-300 bg-white px-2 py-1 text-[11px] font-medium text-red-700">Reintentar</button></div></td></tr>`;
  } else if (!filas.length) {
    cuerpo = `<tr><td colspan="${vis.length}" class="px-5 py-12 text-center text-xs text-gray-400">No hay asesores en este período.</td></tr>`;
  } else {
    cuerpo = filas.map(x => `
      <tr class="group cifra cursor-pointer border-b border-gray-50 hover:bg-gray-50" data-abrir-asesor="${x.a.cod}" title="Ver el detalle del asesor">
        ${vis.map(c => `<td class="whitespace-nowrap px-3 py-2 ${c.al} ${claseSticky(c,'td')}"${c.bg ? ` style="background:${c.bg}"` : ''}>${celda(c, x)}</td>`).join('')}
      </tr>`).join('');
  }

  // tfoot: Meta, banda (5), Cumplimiento (Σ total / Σ meta), Bono, Nro pedidos, Comisión proy., Comisión total. Ratios sin total.
  const S = k => filas.reduce((s, x) => s + (x[k] ?? 0), 0);
  const SA = k => filas.reduce((s, x) => s + (x.a[k] ?? 0), 0);
  const tMeta = S('meta'), tTotal = S('total');
  const tCump = tMeta > 0 ? tTotal / tMeta * 100 : null;
  const tProv = SA('amar');
  const totalCelda = c => {
    const gris = '<span class="text-gray-300">—</span>';
    switch (c.k) {
      case 'nombre': return 'Total';
      case 'meta':   return pesos(tMeta);
      case 'web':    return sinDesglose ? gris : conNum(SA('webV'), SA('webN'));
      case 'fac':    return sinDesglose ? gris : conNum(SA('facV'), SA('facN'));
      case 'dev':    return sinDesglose ? gris : `<span class="text-red-600">${signo(SA('dev'))}</span>`;
      case 'tie':    return sinDesglose ? gris : `<span class="text-emerald-700">${signo(SA('tie'))}</span>`;
      case 'total':  return `<span class="font-bold text-gray-900">${pesos(tTotal)}</span>`;
      case 'cumpl':  { const b = banda(tCump); return b ? `<span class="inline-block min-w-[46px] rounded ${BADGE[b]} px-1.5 py-0.5 text-xs font-bold text-white">${pctTxt(tCump)}</span>` : gris; }
      case 'bono':   return `<span class="font-semibold">${pesos(S('bonoMonto'))}</span>${tProv ? `<div class="text-[10px] font-normal text-amber-700">${tProv} provisionales</div>` : ''}`;
      case 'nped':   return sinDesglose ? gris : entero(S('nped'));
      case 'com':    return pesos(S('comision'));
      case 'ctot':   return `<span class="font-semibold text-emerald-700">${pesos(S('comision') + S('bonoMonto'))}</span>`;
      default:       return '';
    }
  };
  const tfoot = filas.length && estado === 'normal' || estado === 'antescorte' ? `
    <tfoot>
      <tr class="cifra border-t border-gray-200 bg-gray-50 text-[13px] font-semibold text-gray-700">
        ${vis.map(c => `<td class="whitespace-nowrap px-3 py-2 ${c.al} ${c.sticky === 'izq' ? 'sticky left-0 z-10 bg-gray-50 shadow-[2px_0_0_0_#e5e7eb]' : c.sticky === 'der' ? 'sticky right-0 z-10 bg-emerald-100 shadow-[-2px_0_0_0_#e5e7eb]' : ''}"${c.bg ? ` style="background:${c.bg}"` : ''}>${totalCelda(c)}</td>`).join('')}
      </tr>
    </tfoot>` : '';

  return `
  <table class="w-full text-[13px] tabular-nums">
    <thead><tr class="border-b border-gray-100 text-[11px] tracking-wide text-gray-400 uppercase">${th}</tr></thead>
    <tbody>${cuerpo}</tbody>
    ${tfoot}
  </table>`;
}

function panelColumnas() {
  const ops = COLS_TABLA.filter(c => !c.fija);
  const n = ops.filter(c => OCULTAS.has(c.k)).length;
  return `
  <details class="relative" id="panel-cols">
    <summary class="flex cursor-pointer list-none items-center gap-1.5 rounded-md border border-gray-200 px-2.5 py-1 text-[12px] font-medium text-gray-600 hover:bg-gray-50">
      ${ICO.cols} Columnas${n ? ` <span class="rounded bg-gray-800 px-1.5 text-[10px] font-semibold text-white">${ops.length - n}/${ops.length}</span>` : ''}<span class="text-gray-400">▾</span>
    </summary>
    <div class="absolute right-0 z-40 mt-1.5 w-60 rounded-lg border border-gray-200 bg-white p-2 shadow-lg">
      ${ops.map(c => `<label class="flex cursor-pointer items-center gap-2 rounded px-2 py-1.5 text-[12px] text-gray-700 hover:bg-gray-50"><input type="checkbox" data-col="${c.k}" ${OCULTAS.has(c.k) ? '' : 'checked'} class="h-3.5 w-3.5 rounded border-gray-300 accent-gray-800">${c.t}</label>`).join('')}
      <button id="cols-reset" class="mt-1 w-full rounded px-2 py-1.5 text-left text-[12px] text-gray-500 hover:bg-gray-50">Mostrarlas todas</button>
    </div>
  </details>`;
}

// ─── Gauges (mismo path que gauge.ts: R 52, CX 70, CY 64, cap 110 %) ───
function arco(pct) {
  const ang = (Math.min(Math.max(pct, 0), 110) / 110) * 180;
  const rad = ((180 - ang) * Math.PI) / 180;
  return `M 18 64 A 52 52 0 0 1 ${(70 + 52 * Math.cos(rad)).toFixed(1)} ${(64 - 52 * Math.sin(rad)).toFixed(1)}`;
}
function gaugeSvg(pct, techo, texto) {
  const b = banda(pct ?? 0) || 'rojo';
  return `<svg viewBox="0 0 140 74" class="mx-auto w-full max-w-[190px]">
    <path d="${arco(110)}" fill="none" stroke="#f1f5f9" stroke-width="11" stroke-linecap="round"/>
    ${techo !== null && techo > pct ? `<path d="${arco(techo)}" fill="none" stroke="${HEX[b]}44" stroke-width="11" stroke-linecap="round"/>` : ''}
    <path d="${arco(pct ?? 0)}" fill="none" stroke="${HEX[b]}" stroke-width="11" stroke-linecap="round"/>
    <text x="70" y="58" text-anchor="middle" style="font-size:23px;font-weight:800;fill:#0f172a">${texto}</text>
  </svg>`;
}
const cajaKpi = (titulo, valor, sub, borde, color) => `
  <div class="rounded-md border border-l-4 bg-white px-3 py-2 ${borde}">
    <p class="text-[10px] font-semibold tracking-wide text-gray-400 uppercase">${titulo}</p>
    <p class="cifra text-xl leading-tight font-extrabold ${color || 'text-gray-900'}">${valor}</p>
    ${sub ? `<p class="cifra text-[10px] text-gray-400">${sub}</p>` : ''}
  </div>`;

function tableroKpis(estado) {
  if (estado === 'cargando') return `<div class="grid grid-cols-1 gap-4 md:grid-cols-3">${[0,1,2].map(() => '<div class="rounded-2xl border bg-white p-4 shadow-sm"><div class="skeleton mb-3 h-3 w-40 rounded"></div><div class="skeleton h-28 rounded-xl"></div></div>').join('')}</div>`;
  if (estado === 'error') return `<div class="grid grid-cols-1 gap-4 md:grid-cols-3">${[0,1,2].map(() => '<div class="rounded-2xl border bg-white p-4 shadow-sm"><div class="rounded-xl border border-red-200 bg-red-50 p-4 text-center text-xs text-red-800">No pudimos cargar este bloque.<button class="ml-2 rounded-lg border border-red-300 bg-white px-2 py-1 text-[11px] font-medium text-red-700">Reintentar</button></div></div>').join('')}</div>`;
  const filas = ASESORES.map(a => derivarAsesor(a, false));
  const meta = filas.reduce((s,x) => s + (x.meta ?? 0), 0);
  const total = filas.reduce((s,x) => s + x.total, 0);
  const pend = filas.reduce((s,x) => s + x.pendiente, 0);
  const pctRec = meta > 0 ? total / meta * 100 : null;
  const pctConf = meta > 0 ? (total + pend) / meta * 100 : null;
  const nped = filas.reduce((s,x) => s + x.nped, 0);
  const pedEsp = Math.round(meta / META_VPT);
  const pedPct = pedEsp ? nped / pedEsp * 100 : null;
  const conv = ASESORES.reduce((s,a) => s + a.conv, 0), cconf = ASESORES.reduce((s,a) => s + a.cconf, 0);
  const tc = conv ? cconf / conv * 100 : null;
  const porVender = meta - total;
  const bRec = banda(pctRec), bPed = banda(pedPct);
  const BORDE = { verde:'border-l-emerald-600', ambar:'border-l-amber-500', rojo:'border-l-red-500' };
  const sinPagar = ASESORES.reduce((s,a) => s + (PENDIENTE[a.cod] ? 1 : 0), 0) * 3; // ilustrativo
  return `
  <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
    <div class="rounded-2xl border bg-white p-4 shadow-sm">
      <h2 class="mb-1 text-[11px] font-bold tracking-wide text-gray-500 uppercase">% Cump. presupuesto neto</h2>
      <div class="flex items-center gap-3">
        <div class="w-[46%] shrink-0">
          ${gaugeSvg(pctRec, pctConf, pctTxt(pctRec))}
          <p class="-mt-1 text-center text-[11px] text-gray-500 tabular-nums">llegaría a <span class="font-semibold">${pct1(pctConf)}</span> si recibe los pagos pendientes</p>
          <p class="mt-0.5 text-center text-[11px] text-gray-400">Meta ${pesos(meta)}</p>
        </div>
        <div class="flex-1 space-y-2">
          ${cajaKpi('Venta recaudada', pesos(total), `(${pesos(pend)} confirmada por recaudar)`, BORDE[bRec])}
          ${cajaKpi('Por vender y recaudar', pesos(porVender), '', porVender > 0 ? 'border-l-red-500' : 'border-l-emerald-600', porVender > 0 ? 'text-red-600' : 'text-emerald-700')}
        </div>
      </div>
    </div>
    <div class="rounded-2xl border bg-white p-4 shadow-sm">
      <h2 class="mb-1 text-[11px] font-bold tracking-wide text-gray-500 uppercase">% Pedidos esperados</h2>
      <div class="flex items-center gap-3">
        <div class="w-[46%] shrink-0">
          ${gaugeSvg(pedPct, null, pctTxt(pedPct))}
          <p class="text-center text-[11px] text-gray-400">${entero(pedEsp)} esperados</p>
        </div>
        <div class="flex-1 space-y-2">
          ${cajaKpi('Pedidos realizados', entero(nped), `+ ${sinPagar} confirmados sin pagar`, BORDE[bPed])}
          ${cajaKpi('Pedidos por realizar', entero(Math.max(0, pedEsp - nped)), '', 'border-l-red-500', 'text-red-600')}
        </div>
      </div>
    </div>
    <div class="flex flex-col rounded-2xl border bg-white p-4 shadow-sm">
      <h2 class="text-[11px] font-bold tracking-wide text-gray-500 uppercase">Tasa de conversión</h2>
      <div class="mt-2 flex flex-1 flex-col items-center justify-center rounded-md py-3 ${tc >= META_TCV ? 'bg-emerald-50' : 'bg-gray-50'}">
        <p class="cifra text-4xl font-extrabold ${tc >= META_TCV ? 'text-emerald-700' : 'text-gray-700'}">${pct1(tc)}</p>
        <div class="mt-1 flex items-center gap-1 text-xs font-semibold text-emerald-700">${ICO.up}<span class="tabular-nums">1,8</span> pts vs período anterior</div>
        <p class="mt-1 text-[11px] text-gray-400">meta del mes: ${META_TCV}%</p>
      </div>
      <div class="mt-2 space-y-1.5 border-t pt-2 text-sm">
        <div class="flex justify-between"><span class="text-gray-500">Tráfico atendido</span><span class="cifra font-semibold">${entero(conv)}</span></div>
        <div class="flex justify-between"><span class="text-gray-500">Carritos pagados</span><span class="cifra font-semibold">${entero(cconf)}</span></div>
        <p class="text-right text-[10px] text-gray-400">en los días con archivo: los mismos que se dividen</p>
      </div>
    </div>
  </div>`;
}

function consolidado(estado) {
  if (estado === 'cargando') return `<section class="mb-5 rounded-2xl border border-gray-200 bg-white shadow-sm"><header class="border-b border-gray-100 px-5 py-3"><h2 class="text-[13px] font-bold tracking-wide text-gray-500 uppercase">Consolidado · STIRPE</h2></header><div class="p-5"><div class="skeleton h-10 rounded"></div></div></section>`;
  if (estado === 'error') return `<section class="mb-5 rounded-2xl border border-gray-200 bg-white shadow-sm"><header class="border-b border-gray-100 px-5 py-3"><h2 class="text-[13px] font-bold tracking-wide text-gray-500 uppercase">Consolidado · STIRPE</h2></header><div class="p-5 text-center text-xs text-red-800"><div class="mx-auto max-w-md rounded-xl border border-red-200 bg-red-50 p-4">No pudimos cargar el consolidado.<button class="ml-2 rounded-lg border border-red-300 bg-white px-2 py-1 text-[11px] font-medium text-red-700">Reintentar</button></div></div></section>`;
  const filas = ASESORES.map(a => derivarAsesor(a, false));
  const meta = filas.reduce((s,x) => s + (x.meta ?? 0), 0);
  const total = filas.reduce((s,x) => s + x.total, 0);
  const pend = filas.reduce((s,x) => s + x.pendiente, 0);
  const nped = filas.reduce((s,x) => s + x.nped, 0);
  const unid = ASESORES.reduce((s,a) => s + a.unid, 0);

function cuerpoDia(estado) {

  const PAGO = { facturado:'bg-emerald-800 text-white', pagado:'bg-emerald-600 text-white', pendiente:'bg-slate-400 text-white', archivado:'bg-gray-300 text-gray-700' };
  const ICO_ARCH = '<svg class="h-3.5 w-3.5" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg>';

  const accion = c => c.pago === 'archivado'
    ? `<button class="inline-flex items-center gap-1 rounded-md border border-gray-300 px-2 py-1 text-[11px] font-medium text-gray-700 hover:bg-gray-50" title="Desarchivar">${ICO_DESARCH} Desarchivar</button>`
    : c.pago === 'pendiente'

  const tabla = `
  <div class="overflow-x-auto rounded-xl border border-gray-200">

      </tr></thead>
      <tbody class="divide-y divide-gray-100">${CARRITOS_3SEP.map(c => `

          <td class="max-w-56 px-4 py-3 text-xs"><p class="font-medium text-gray-800">${c.cliente}</p><p class="mt-0.5 text-[11px] text-gray-400">${c.cel} · ${c.ciudad}</p>${c.archivado ? `<p class="mt-0.5 text-[11px] text-gray-500">${c.archivado.autoria}</p><p class="mt-0.5 text-[11px] text-gray-400">«${c.archivado.nota}»</p>` : ''}</td>
          <td class="whitespace-nowrap px-4 py-3"><span class="rounded px-2 py-1 text-[11px] font-semibold ${c.origen === 'WhatsApp' ? 'bg-gray-100 text-gray-600' : 'bg-gray-900 text-white'}">${c.origen}</span></td>
          <td class="px-4 py-3 text-xs"><p class="text-gray-700">${c.msj}</p></td>

          <td class="whitespace-nowrap px-4 py-3 text-xs">${c.factura ? `<p class="text-gray-700">${c.factura}</p>` : '<span class="text-gray-300">—</span>'}</td>
          <td class="px-4 py-3 text-right text-xs tabular-nums text-gray-700">${c.items}</td>
          <td class="whitespace-nowrap px-4 py-3 text-right text-xs font-semibold tabular-nums ${c.pago === 'archivado' ? 'text-gray-400 line-through' : 'text-gray-800'}">${pesos(c.total)}</td>
          <td class="whitespace-nowrap px-4 py-3 text-right"><div class="flex justify-end gap-1.5"><span class="inline-flex rounded-md border border-gray-200 p-1.5 text-gray-500" title="Abrir para editar">${ICO.link}</span>${accion(c)}</div></td>
        </tr>`).join('')}

    </table>
  </div>`;
  const grupos = TIENDA_3SEP;
  const todas = grupos.flatMap(g => g.filas);
  const neto = todas.reduce((a,f) => a + f.valor, 0), devuelto = todas.filter(f => f.valor < 0).reduce((a,f) => a + f.valor, 0), comprado = todas.filter(f => f.valor > 0).reduce((a,f) => a + f.valor, 0);
  const bloque = `

        <tbody>${grupos.map((g, gi) => { const netoG = g.filas.reduce((a,f) => a + f.valor, 0); return g.filas.map((f, i) => `

            <td class="px-4 py-3">${f.tipo === 'devolucion' ? '<span class="inline-block rounded bg-red-50 px-2 py-0.5 text-[11px] font-semibold text-red-700">Devolución</span>' : '<span class="inline-block rounded bg-emerald-50 px-2 py-0.5 text-[11px] font-semibold text-emerald-700">Compra</span>'}</td>
            <td class="px-4 py-3 text-gray-600">#${f.factura}</td>
            <td class="px-4 py-3 text-right text-gray-500">${g.bodega}</td>
            <td class="px-4 py-3 text-right font-semibold ${f.valor < 0 ? 'text-red-600' : 'text-emerald-700'}">${pesos(f.valor)}</td>
          </tr>`).join('') + (g.filas.length > 1 ? `<tr class="cifra border-b border-gray-50 bg-gray-50/40"><td class="px-4 py-2" colspan="4"><span class="text-[11px] text-gray-500">Neto de este cliente</span></td><td class="px-4 py-2 text-right text-[13px] font-bold ${netoG > 0 ? 'text-emerald-700' : netoG < 0 ? 'text-red-600' : 'text-gray-600'}">${netoG > 0 ? '+' : ''}${pesos(netoG)}</td></tr>` : ''); }).join('')}
        </tbody>

}
const resumenDia = () => { const act = CARRITOS_3SEP.filter(c => !c.archivado); const arc = CARRITOS_3SEP.length - act.length; return `${act.length} confirmados · ${pesos(act.reduce((s,c) => s + c.total, 0))}${arc ? ` · ${arc} archivado` : ''}`; };

// ═══ Modales (variantes) ═══
function modalAsesorHtml(estado, vistaDia, apertura) {

function modalDiaEncimaHtml(estado) {

// ═══ Render ═══
let vistaDia = false;
function render() {
  const pantalla = document.getElementById('pantalla').value;
  const estado = document.getElementById('estado').value;
  const ancho = document.getElementById('ancho').value;
  const apertura = document.getElementById('apertura').value;
  document.getElementById('ancho-wrap').style.visibility = pantalla === 'tabla' ? '' : 'hidden';
  document.getElementById('apertura-wrap').style.visibility = pantalla === 'dia' ? '' : 'hidden';
  const estadoTabla = estado;
  const estadoModal = estado === 'antescorte' ? 'normal' : estado;
  let html = pantallaTabla(pantalla === 'tabla' ? estadoTabla : 'normal', ancho);
  if (pantalla === 'modal') html += modalAsesorHtml(estadoModal, false, apertura);
  if (pantalla === 'dia') {
    vistaDia = true;
    html += modalAsesorHtml(estadoModal, true, apertura);
    if (apertura === 'B') html += modalDiaEncimaHtml(estadoModal);
  }
  document.getElementById('app').innerHTML = html;
  document.body.style.overflow = pantalla === 'tabla' ? '' : 'hidden';
}
['pantalla','estado','ancho','apertura'].forEach(id => document.getElementById(id).addEventListener('change', () => { tabActiva = 'dash'; render(); }));

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-abrir-asesor],[data-abrir-dia],[data-volver],[data-cerrar],[data-cerrar-dia],#cols-reset,#cols-dia-reset');
  if (!t) return;
  const sel = document.getElementById('pantalla');
  if (t.dataset.tab) { tabActiva = t.dataset.tab; render(); return; }
  if (t.dataset.abrirAsesor !== undefined) { sel.value = 'modal'; render(); return; }
  if (t.dataset.abrirDia !== undefined) { sel.value = 'dia'; render(); return; }
  if (t.dataset.volver !== undefined || t.dataset.cerrarDia !== undefined) { sel.value = 'modal'; render(); return; }
  if (t.dataset.cerrar !== undefined) { sel.value = 'tabla'; render(); return; }
  if (t.id === 'cols-reset') { e.preventDefault(); OCULTAS.clear(); guardarPref(); render(); return; }
  if (t.id === 'cols-dia-reset') { e.preventDefault(); OCULTAS_DIA.clear(); localStorage.setItem(CLAVE_PREF_DIA, '[]'); render(); return; }
});
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.col;
  const kd = e.target.dataset && e.target.dataset.colDia;
  if (k) { e.target.checked ? OCULTAS.delete(k) : OCULTAS.add(k); guardarPref(); document.getElementById('tabla-slot').innerHTML = tablaAsesores(document.getElementById('estado').value, 'A'); refrescarSummary('panel-cols', panelColumnas()); }
  if (kd) { e.target.checked ? OCULTAS_DIA.delete(kd) : OCULTAS_DIA.add(kd); localStorage.setItem(CLAVE_PREF_DIA, JSON.stringify([...OCULTAS_DIA])); document.getElementById('tabla-dia-slot').innerHTML = tablaDiaria('normal'); refrescarSummary('panel-cols-dia', panelColumnasDia()); }
});
function refrescarSummary(id, html) { const tmp = document.createElement('div'); tmp.innerHTML = html; document.querySelector(`#${id} summary`).innerHTML = tmp.querySelector('summary').innerHTML; }
// Parámetros de URL (para revisar una pantalla concreta): ?pantalla=dia&estado=normal&ancho=A&apertura=B&tab=dash
const qs = new URLSearchParams(location.search);
['pantalla','estado','ancho','apertura'].forEach(id => { if (qs.get(id)) document.getElementById(id).value = qs.get(id); });
if (qs.get('tab')) tabActiva = qs.get('tab');
render();
</script>
