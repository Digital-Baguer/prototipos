const dsp = (sid, y, m) => dias(y, m) * SEDE[sid].h;
function estado(y, m) {
  if (y < HOY.y || (y === HOY.y && m < HOY.m)) return 'cerrado';
  if (y === HOY.y && m === HOY.m) return 'curso';
  return 'venta';
}
function agg(sids, y, meses) {
  let o = 0, d = 0;
  for (const s of sids) for (const m of meses) { o += occ(s, y, m); d += dsp(s, y, m); }
  return { o, d, p: d ? o / d * 100 : null };
}
const cerrados = y => MESES12.filter(m => estado(y, m) === 'cerrado');

function kpis(y) {
  const ms = cerrados(y);
  if (!ms.length) return null;
  const prom = agg(IDS, y, ms);
  const porMes = ms.map(m => ({ m, ...agg(IDS, y, [m]) }));
  let mejor = porMes[0], peor = porMes[0];
  porMes.forEach(x => { if (r1(x.p) > r1(mejor.p)) mejor = x; if (r1(x.p) < r1(peor.p)) peor = x; });
  const sedes = SEDES.map(s => ({ s, ...agg([s.id], y, ms) }));
  let mejorSede = sedes[0];
  sedes.forEach(x => { if (r1(x.p) > r1(mejorSede.p)) mejorSede = x; });
  return { ms, prom, mejor, peor, mejorSede };
}

const Q = new URLSearchParams(location.search);
const S = {
  tema: Q.get('tema') === 'oscuro' ? 'oscuro' : 'claro',
  comparar: Q.get('comparar') === '1',
  estado: Q.get('estado') || 'datos',
  ancho: Q.get('ancho') === '390' || (!Q.get('ancho') && window.innerWidth < 600) ? 390 : 1440,
  anio: +(Q.get('anio') || 2026),
  celda: Q.get('celda') || null,
  menuMovil: false, toast: null, cargando: false,
};
const USUARIOS = { con: ['FL', 'Francisco L.'], sin: ['SQ', 'Shirley Tatiana Briceño Quintero'] };
const sinPermiso = () => S.estado === 'sinpermiso';
const movil = () => S.ancho === 390;
const simulado = () => movil() && window.innerWidth > 600;
const POS = () => simulado() ? 'absolute' : 'fixed';

/* =====================================================================
   Barra del mockup
   ===================================================================== */
function seg(items, activo, act) {
  return items.map(([v, t]) => `<button data-act="${act}" data-v="${v}" class="rounded px-2.5 py-1 text-[11.5px] font-medium ${String(v) === String(activo) ? 'bg-white text-neutral-900' : 'text-neutral-300 hover:text-white'}">${t}</button>`).join('');
}
function pintarBarra() {
  document.getElementById('mk-tema').innerHTML = seg([['claro', 'Claro'], ['oscuro', 'Oscuro']], S.tema, 'mk-tema');
  document.getElementById('mk-comp').innerHTML = seg([['0', 'No'], ['1', 'Sí']], S.comparar ? '1' : '0', 'mk-comp');
  document.getElementById('mk-ancho').innerHTML = seg([['1440', '1440 px'], ['390', '390 px']], S.ancho, 'mk-ancho');
  const est = [['datos', 'Con datos'], ['carga', 'Cargando'], ['vacio', 'Año sin datos'], ['error', 'Error de carga'], ['sinpermiso', 'Sin permiso del módulo 79']];
  document.getElementById('mk-estados').innerHTML = est.map(([v, t]) =>
    `<button data-act="mk-est" data-v="${v}" class="rounded-full border px-2.5 py-0.5 text-[11.5px] ${S.estado === v ? 'border-white bg-white text-neutral-900' : 'border-neutral-600 text-neutral-300 hover:border-neutral-400'}">${t}</button>`).join('');
  document.getElementById('mk-nota').textContent = sinPermiso()
    ? 'Usuario de rol 5 (sin el módulo 79): saludo simple, sin tarjetas (D11).'
    : 'Hoy: miércoles 21 de octubre de 2026 · cifras reales de PROD · clic en una celda abre el detalle.';
}

  if (d == null) return '';
  const v = r1(d);
  const t = v === 0 ? '= 0,0' : (v > 0 ? '▲ ' : '▼ ') + p1(Math.abs(v));
  return t + (conPp ? ' pp' : '');
};
const deltaCls = d => r1(d) > 0 ? 'text-primary' : 'text-muted-foreground';

    ${linComp(r1(k.prom.p) - r1(ant?.p ?? 0), `vs. ${rg} ${y - 1} (${pct(ant?.p)})`)}

  const mAnt = comp ? agg(IDS, y - 1, [k.mejor.m]) : null, pAnt = comp ? agg(IDS, y - 1, [k.peor.m]) : null;
  const c2 = `<p class="text-3xl font-bold leading-none tabular-nums">${pct(k.mejor.p)}</p>

    ${linComp(r1(k.mejor.p) - r1(mAnt?.p ?? 0), `vs. ${MESES[k.mejor.m - 1]} ${y - 1} (${pct(mAnt?.p)})`)}
    <div class="mt-3"></div>
    <div class="mt-auto border-t pt-3">
      <p class="text-[10.5px] font-semibold uppercase tracking-wide text-muted-foreground">Peor mes</p>
      <p class="mt-1 flex flex-wrap items-baseline gap-x-2 text-sm"><span class="font-semibold">${cap(MESES[k.peor.m - 1])}</span><span class="font-semibold tabular-nums">${pct(k.peor.p)}</span>
      <span class="text-xs tabular-nums text-muted-foreground">${nf(k.peor.o)} de ${nf(k.peor.d)}</span>
      ${comp ? `<span class="text-xs font-semibold tabular-nums ${deltaCls(r1(k.peor.p) - r1(pAnt.p))}">${delta(r1(k.peor.p) - r1(pAnt.p))}</span>` : ''}</p>
    </div>`;

  const s = k.mejorSede, sAnt = comp ? agg([s.s.id], y - 1, k.ms) : null;
  const c3 = `<p class="text-3xl font-bold leading-none tabular-nums">${pct(s.p)}</p>

    ${linComp(r1(s.p) - r1(sAnt?.p ?? 0), `vs. ${s.s.n} ${rg} ${y - 1} (${pct(sAnt?.p)})`)}
    <div class="mt-3"></div>

  return `<div class="grid ${grid} gap-4">${tarjeta('Promedio del año', 'percent', c1)}${tarjeta('Mejor mes', 'trendUp', c2)}${tarjeta('Mejor sede', 'hotel', c3)}</div>`;

function dibujarLinea() {
  const box = document.getElementById('linea');
  if (!box) return;
  const w = Math.max(280, box.clientWidth - 24);
  const h = movil() ? 220 : 250;
  const y = S.anio, comp = S.comparar && hayAnterior(y);
  const ancho = w >= 600;
  const L = 34, R = 8, T = 26, B = ancho ? 38 : 26, iw = w - L - R, ih = h - T - B;
  const cur = MESES12.map(m => ({ m, ...agg(IDS, y, [m]), e: estado(y, m) }));
  const ant = comp ? MESES12.map(m => ({ m, ...agg(IDS, y - 1, [m]) })) : null;
  const maxV = Math.max(...cur.map(c => c.p), ...(ant ? ant.map(a => a.p) : [0]));
  const yMax = Math.max(50, Math.ceil(maxV / 10) * 10);
  const paso = yMax > 60 ? 20 : 10;
  const bw = iw / 12, X = i => L + (i + 0.5) * bw, Y = v => T + ih - (v / yMax) * ih;
  let g = '';
  // trama de meses en venta
  const iv = cur.findIndex(c => c.e === 'venta');
  if (iv >= 0) g += `<rect x="${L + iv * bw}" y="${T - 14}" width="${(12 - iv) * bw}" height="${ih + 14}" fill="url(#trama)"/>
    <text x="${L + iv * bw + (12 - iv) * bw / 2}" y="${T - 3}" text-anchor="middle" class="fill-muted-foreground" font-size="10.5">en venta</text>`;
  for (let v = 0; v <= yMax; v += paso) g += `<line x1="${L}" x2="${w - R}" y1="${Y(v)}" y2="${Y(v)}" class="stroke-border" stroke-width="1" ${v ? 'stroke-dasharray="3 3"' : ''}/>
    <text x="${L - 6}" y="${Y(v) + 3.5}" text-anchor="end" class="fill-muted-foreground" font-size="10.5">${v} %</text>`;
  cur.forEach((c, i) => g += `<text x="${X(i)}" y="${h - B + 18}" text-anchor="middle" class="${c.e === 'curso' ? 'fill-foreground font-semibold' : 'fill-muted-foreground'}" font-size="11">${ancho ? M3[i] : M3[i][0].toUpperCase()}</text>`);
  const path = pts => pts.map((p, j) => `${j ? 'L' : 'M'}${X(p.m - 1).toFixed(1)},${Y(p.p).toFixed(1)}`).join('');
  if (ant) {
    g += `<path d="${path(ant)}" fill="none" class="stroke-muted-foreground/45" stroke-width="2" stroke-linejoin="round"/>`;
    ant.forEach(a => g += `<circle cx="${X(a.m - 1)}" cy="${Y(a.p)}" r="2.5" class="fill-muted-foreground/45"/>`);
  }
  const firmes = cur.filter(c => c.e !== 'venta');
  const venta = cur.filter(c => c.e === 'venta');
  if (venta.length) {
    const tramoV = firmes.length ? [firmes[firmes.length - 1], ...venta] : venta;
    g += `<path d="${path(tramoV)}" fill="none" class="stroke-primary/60" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>`;
  }
  if (firmes.length) g += `<path d="${path(firmes)}" fill="none" class="stroke-primary" stroke-width="2.5" stroke-linejoin="round"/>`;
  firmes.forEach(c => {
    const i = c.m - 1;
    if (c.e === 'curso') g += `<circle cx="${X(i)}" cy="${Y(c.p)}" r="4.5" class="fill-card stroke-primary" stroke-width="2"/>`;
    else g += `<circle cx="${X(i)}" cy="${Y(c.p)}" r="3.5" class="fill-primary stroke-card" stroke-width="1.5"/>`;
    if (ancho) {
      const prev = cur[i - 1], next = cur[i + 1];
      const minimo = (!prev || c.p < prev.p) && (!next || c.p < next.p);
      const encima = ant ? c.p >= ant[i].p : !minimo;
      g += `<text x="${X(i)}" y="${encima ? Y(c.p) - 9 : Y(c.p) + 17}" text-anchor="middle" class="fill-foreground font-medium" font-size="11">${p1(c.p)}</text>`;
    }
  });
  if (ancho) {
    const ic2 = cur.findIndex(c => c.e === 'curso');
    if (ic2 >= 0) g += `<text x="${X(ic2)}" y="${h - B + 31}" text-anchor="middle" class="fill-primary font-semibold" font-size="9.5" letter-spacing=".04em">EN CURSO</text>`;
  }
  // franjas de hover
  cur.forEach((c, i) => {
    const t = `<b>${cap(MESES[i])} ${y}</b>${c.e === 'curso' ? ' · en curso' : c.e === 'venta' ? ' · en venta' : ''}<br>${pct(c.p)} · ${nf(c.o)} / ${nf(c.d)} noches-habitación${ant ? `<br><span class=&quot;text-muted-foreground&quot;>${cap(MESES[i])} ${y - 1}: ${pct(ant[i].p)} · ${nf(ant[i].o)} / ${nf(ant[i].d)}</span>` : ''}`;
    g += `<rect x="${L + i * bw}" y="${T - 14}" width="${bw}" height="${ih + 14}" fill="transparent" class="hover:fill-muted-foreground/5" data-tip="${t}"/>`;
  });
  box.innerHTML = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Ocupación mensual ${y}" class="mx-auto block">
    <defs><pattern id="trama" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="7" class="fill-muted-foreground/10"/></pattern></defs>${g}</svg>`;
}

/* --- Heatmap sedes × meses (D8) --- */
function celdaHtml(sid, m, alto = 'h-11') {
  const y = S.anio, e = estado(y, m), c = agg([sid], y, [m]);
  const comp = S.comparar && hayAnterior(y);
  const a = comp ? agg([sid], y - 1, [m]) : null;
  const s = SEDE[sid];
  const marca = e === 'curso' ? ' · en curso' : e === 'venta' ? ' · en venta' : '';
  const tip = `<b>${s.n} · ${MESES[m - 1]} ${y}</b>${marca}<br>${nf(c.o)} / ${nf(c.d)} noches-habitación · ${pct(c.p)}${a ? `<br>${MESES[m - 1]} ${y - 1}: ${nf(a.o)} / ${nf(a.d)} · ${pct(a.p)}` : ''}`;
  const cls = e === 'venta' ? 'hm-venta text-muted-foreground' : TRAMO[tramo(c.p)] + (e === 'curso' ? ' hm-curso' : '');
  const d = a && e !== 'venta' ? `<span class="text-[10.5px] font-medium leading-none opacity-80">${delta(r1(c.p) - r1(a.p), false)}</span>` : '';
  return `<td class="p-0"><button type="button" data-act="celda" data-v="${sid}-${y}-${m}" data-tip="${esc(tip)}"
    class="flex ${alto} w-full flex-col items-center justify-center gap-1 rounded-md text-[13px] font-medium tabular-nums leading-none transition-shadow hover:ring-2 hover:ring-primary/50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring ${cls}">${pct(c.p).replace(' %', '')}${d}</button></td>`;
}
function resumenHtml(sids, meses, y, extra = '') {
  const c = agg(sids, y, meses), comp = S.comparar && hayAnterior(y);
  const a = comp ? agg(sids, y - 1, meses) : null;
  const vacio = !meses.length;
  return { c, a, html: vacio ? `<div class="flex h-11 items-center justify-center rounded-md text-[13px] text-muted-foreground ${extra}">—</div>`
    : `<div class="flex h-11 w-full flex-col items-center justify-center gap-1 rounded-md text-[13px] tabular-nums leading-none ${TRAMO[tramo(c.p)]} ${extra}">${p1(c.p)}${a ? `<span class="text-[10.5px] font-medium leading-none opacity-80">${delta(r1(c.p) - r1(a.p), false)}</span>` : ''}</div>` };
}
function heatmapCard() {
  const y = S.anio, ms = cerrados(y), comp = S.comparar && hayAnterior(y);

  const head = MESES12.map(m => {

  }).join('');

    return `<tr>
      <th scope="row" class="hm-sticky ${colSede} bg-card pr-2 text-left text-sm font-medium"><span class="block truncate">${s.n}</span><span class="block text-[11px] font-normal text-muted-foreground">${s.h} habitaciones</span></th>
      ${MESES12.map(m => celdaHtml(s.id, m)).join('')}
      <td class="min-w-[66px] border-l pl-1.5 p-0" data-tip="${esc(tip)}">${r.html}</td>
    </tr>`;
  }).join('');
  const tot = MESES12.map(m => {
    const e = estado(y, m), c = agg(IDS, y, [m]), a = comp ? agg(IDS, y - 1, [m]) : null;
    const cls = e === 'venta' ? 'hm-venta text-muted-foreground' : TRAMO[tramo(c.p)] + (e === 'curso' ? ' hm-curso' : '');
    const tip = `<b>Todas las sedes · ${MESES[m - 1]} ${y}</b><br>${nf(c.o)} / ${nf(c.d)} noches-habitación · ${pct(c.p)}${a ? `<br>${MESES[m - 1]} ${y - 1}: ${pct(a.p)}` : ''}`;
    return `<td class="p-0" data-tip="${esc(tip)}"><div class="flex h-11 w-full flex-col items-center justify-center gap-1 rounded-md text-[13px] font-semibold tabular-nums leading-none ${cls}">${p1(c.p)}${a && e !== 'venta' ? `<span class="text-[10.5px] font-medium leading-none opacity-80">${delta(r1(c.p) - r1(a.p), false)}</span>` : ''}</div></td>`;
  }).join('');
  const rt = resumenHtml(IDS, ms, y, 'font-bold');
  const leyenda = `<div class="mt-3 flex flex-wrap items-center gap-x-4 gap-y-2 text-xs text-muted-foreground">
      <span class="font-medium text-foreground">Ocupación</span>
      ${TRAMO.map((c, i) => `<span class="inline-flex items-center gap-1.5"><span class="inline-block h-3.5 w-5 rounded-[3px] ring-1 ring-inset ring-black/5 dark:ring-white/10 ${c}"></span>${TRAMO_TXT[i]}</span>`).join('')}
      <span class="inline-flex items-center gap-1.5"><span class="hm-curso inline-block h-3.5 w-5 rounded-[3px] bg-[#bccfee] text-[#16346a] dark:bg-[#1d365f] dark:text-[#d6e2f7]" style="outline-offset:-2px;outline-width:1px"></span>en curso</span>
      <span class="inline-flex items-center gap-1.5"><span class="hm-venta inline-block h-3.5 w-5 rounded-[3px]"></span>en venta</span>
      ${comp ? `<span class="inline-flex items-center gap-1.5"><span class="font-semibold text-foreground">▲ ▼</span>puntos frente a ${y - 1}</span>` : ''}
    </div>`;
  return `<section class="rounded-xl border bg-card text-card-foreground shadow-sm">
    <div class="px-5 pt-5">
      <h2 class="text-base font-semibold leading-none tracking-tight">Ocupación por sede y mes</h2>
      <p class="mt-1.5 text-sm text-muted-foreground">Porcentaje de noches-habitación ocupadas. Clic en una celda para ver sus reservas.</p>
    </div>
    <div class="px-5 pb-5 pt-3">
      <div id="hm-scroll" class="overflow-x-auto">
        <table class="w-full border-separate border-spacing-[3px] text-sm">
          <thead><tr><th scope="col" class="hm-sticky ${colSede} bg-card pb-1 text-left align-bottom text-xs font-medium text-muted-foreground">Sede</th>${head}
            <th scope="col" class="min-w-[66px] border-l pb-1 pl-1.5 text-center align-bottom text-xs font-semibold text-foreground" data-tip="${esc(tipAnio)}">Año<span class="block text-[10px] font-normal text-muted-foreground">${ms.length ? rango(ms) : '—'}</span></th></tr></thead>
          <tbody>${filas}
            <tr><th scope="row" class="hm-sticky ${colSede} border-t bg-card pr-2 pt-1 text-left text-sm font-semibold">Total<span class="block text-[11px] font-normal text-muted-foreground">${HAB_TOTAL} habitaciones</span></th>${tot}
            <td class="min-w-[66px] border-l pl-1.5 p-0" data-tip="${esc(rt.c.d ? `<b>Todas las sedes · ${rango(ms)} ${y}</b><br>${nf(rt.c.o)} / ${nf(rt.c.d)} noches-habitación · ${pct(rt.c.p)}` : tipAnio)}">${rt.html}</td></tr>
          </tbody>
        </table>
      </div>
      ${leyenda}
    </div>
  </section>`;
}

/* --- Estados --- */
function cargaHtml() {
  const grid = movil() ? 'grid-cols-1' : 'grid-cols-3';
  const card = `<div class="rounded-xl border bg-card p-5">${sk('h-3 w-28')}${sk('mt-4 h-8 w-24')}${sk('mt-3 h-3.5 w-32')}${sk('mt-2 h-3 w-44')}<div class="mt-5 border-t pt-3">${sk('h-3 w-full')}</div></div>`;
  return `${encabezado(true)}
    <div class="grid ${grid} gap-4" aria-busy="true" aria-label="Cargando la ocupación">${card}${card}${card}</div>
    <div class="rounded-xl border bg-card p-5">${sk('h-4 w-40')}${sk('mt-2 h-3.5 w-64')}${sk('mt-5 h-[200px] w-full')}</div>
    <div class="rounded-xl border bg-card p-5">${sk('h-4 w-48')}${sk('mt-2 h-3.5 w-72')}
      <div class="mt-5 space-y-[3px]">${Array.from({ length: 7 }, () => `<div class="flex gap-[3px]">${sk('h-11 w-[150px] shrink-0')}${Array.from({ length: movil() ? 4 : 13 }, () => sk('h-11 flex-1')).join('')}</div>`).join('')}</div></div>`;
}
function vacioHtml() {
  return `${encabezado(false)}
    <section class="flex flex-1 flex-col items-center justify-center rounded-xl border border-dashed bg-card px-6 py-16 text-center">
      <span class="grid size-12 place-items-center rounded-full bg-muted text-muted-foreground">${ic('calX', 'size-6')}</span>
      <h2 class="mt-4 text-base font-semibold">${S.anio} no tiene noches ocupadas</h2>
      <p class="mt-1 max-w-md text-sm text-muted-foreground">Ninguna reserva confirmada con pago ocupa habitaciones de las sedes visibles en ese año. Elige otro año.</p>
    </section>`;
}
function errorHtml() {
  return `${encabezado(false)}
    <section role="alert" class="flex flex-1 flex-col items-center justify-center rounded-xl border border-rose-200 bg-card px-6 py-16 text-center dark:border-rose-900/60">
      <span class="grid size-12 place-items-center rounded-full bg-rose-50 text-rose-600 dark:bg-rose-950/50 dark:text-rose-400">${ic('alert', 'size-6')}</span>
      <h2 class="mt-4 text-base font-semibold">No se pudo cargar la ocupación</h2>
      <p class="mt-1 max-w-md text-sm text-muted-foreground">La consulta no respondió. Intenta de nuevo; si vuelve a fallar, avisa a soporte.</p>
      <button type="button" data-act="reintentar" class="mt-5 inline-flex h-9 items-center justify-center gap-2 whitespace-nowrap rounded-md border border-input bg-background px-4 py-2 text-sm font-medium shadow-sm transition-colors hover:bg-accent hover:text-accent-foreground">${ic('refresh')}Reintentar</button>
    </section>`;
}
function sinPermisoHtml() {
  return `<div class="pt-2">
    <h1 class="text-2xl font-bold tracking-tight">Hola, ${esc(USUARIOS.sin[1])}</h1>
    <p class="mt-1 text-muted-foreground">Usa el menú para entrar al módulo con el que vas a trabajar.</p>
  </div>`;
}
function pagina() {
  if (sinPermiso()) return sinPermisoHtml();
  if (S.estado === 'carga' || S.cargando) return cargaHtml();
  if (S.estado === 'vacio') return vacioHtml();
  if (S.estado === 'error') return errorHtml();
  return `${encabezado(false)}${kpisHtml()}${lineaCard()}${heatmapCard()}`;
}

/* =====================================================================
   Capas: panel lateral (Sheet) del detalle, menú móvil, toast
   ===================================================================== */
const fCorta = (iso, yRef) => { const [y, m, d] = iso.split('-').map(Number); return `${d} ${M3[m - 1]}${y !== yRef ? ' ' + y : ''}`; };
const diasEntre = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);
function panelDetalle() {
  const [sid, y, m] = S.celda.split('-').map(Number);
  const s = SEDE[sid], c = agg([sid], y, [m]), e = estado(y, m);
  const filas = DET[S.celda] || [];
  const conDetalle = y >= 2025;
  const ini = `${y}-${String(m).padStart(2, '0')}-01`;
  const sig = m === 12 ? `${y + 1}-01-01` : `${y}-${String(m + 1).padStart(2, '0')}-01`;
  const suma = filas.reduce((a, f) => a + f[6], 0);
  const chipE = e === 'curso' ? '<span class="rounded-full bg-neutral-900 px-2 py-0.5 text-[11px] font-semibold text-white dark:bg-white dark:text-neutral-900">en curso</span>'
    : e === 'venta' ? '<span class="rounded-full bg-muted px-2 py-0.5 text-[11px] font-semibold text-muted-foreground ring-1 ring-inset ring-border">en venta</span>' : '';
  const cruce = f => {
    const n = [];
    if (f[3] < ini) n.push(`llegó en ${MESES[(m + 10) % 12]}`);
    if (f[4] > sig) n.push(`sigue en ${MESES[m % 12]}`);
    return n.length ? `<span class="mt-0.5 block text-[11px] text-muted-foreground">${n.join(' · ')}</span>` : '';
  };
  const link = f => `<a href="/reservas/${f[0]}" data-act="ficha" data-v="${f[1]}|${f[0]}" class="font-semibold tabular-nums text-primary underline-offset-4 hover:underline" data-tip="Abre la ficha de la reserva en el admin nuevo: /reservas/${f[0]}">${f[1]}</a>`;
  let cuerpo;
  if (!conDetalle) cuerpo = `<div class="rounded-lg border border-dashed px-4 py-8 text-center text-sm text-muted-foreground">El mockup trae el detalle real solo de 2025 a 2027.</div>`;
  else if (!filas.length) cuerpo = `<div class="rounded-lg border border-dashed px-4 py-10 text-center"><p class="text-sm font-medium">Ninguna reserva ocupó noches en este mes.</p><p class="mt-1 text-sm text-muted-foreground">La celda queda en 0 %.</p></div>`;
  else if (movil()) cuerpo = `<ul class="divide-y rounded-lg border">${filas.map(f => `<li class="px-3 py-2.5">
      <div class="flex items-baseline justify-between gap-3">${link(f)}<span class="text-sm font-semibold tabular-nums">${f[6]} <span class="text-xs font-normal text-muted-foreground">noches-hab.</span></span></div>
      <p class="mt-0.5 text-sm">${esc(f[2])}</p>
      <p class="mt-0.5 text-xs tabular-nums text-muted-foreground">${fCorta(f[3], y)} → ${fCorta(f[4], y)} · ${diasEntre(f[3], f[4])} noche${diasEntre(f[3], f[4]) === 1 ? "" : "s"} · ${f[5]} hab.</p>${cruce(f)}
    </li>`).join('')}
    <li class="flex items-baseline justify-between bg-muted/50 px-3 py-2.5 text-sm font-semibold"><span>Total ${MESES[m - 1]}</span><span class="tabular-nums">${nf(suma)} noches-hab.</span></li></ul>`;
  else cuerpo = `<div class="overflow-hidden rounded-lg border"><table class="w-full text-left text-sm">
      <thead class="bg-muted/50 text-xs text-muted-foreground"><tr>
        <th class="px-3 py-2 font-medium">Consecutivo</th><th class="px-3 py-2 font-medium">Cliente</th><th class="px-3 py-2 font-medium">Check-in → check-out</th>
        <th class="px-3 py-2 text-right font-medium">Hab.</th><th class="px-3 py-2 text-right font-medium" title="Noches-habitación que aporta a ${MESES[m - 1]}">Noches-hab.<span class="block font-normal">en ${M3[m - 1]}</span></th></tr></thead>
      <tbody class="divide-y">${filas.map(f => `<tr class="align-top">
        <td class="px-3 py-2.5">${link(f)}</td>
        <td class="px-3 py-2.5">${esc(f[2])}</td>
        <td class="whitespace-nowrap px-3 py-2.5 tabular-nums">${fCorta(f[3], y)} → ${fCorta(f[4], y)}<span class="block text-[11px] text-muted-foreground">${diasEntre(f[3], f[4])} noche${diasEntre(f[3], f[4]) === 1 ? "" : "s"}</span>${cruce(f)}</td>
        <td class="px-3 py-2.5 text-right tabular-nums">${f[5]}</td>
        <td class="px-3 py-2.5 text-right font-semibold tabular-nums">${f[6]}</td></tr>`).join('')}</tbody>
      <tfoot class="border-t bg-muted/50"><tr><td colspan="4" class="px-3 py-2.5 text-sm font-semibold">Total ${MESES[m - 1]}</td><td class="px-3 py-2.5 text-right text-sm font-bold tabular-nums">${nf(suma)}</td></tr></tfoot>
    </table></div>`;
  const stat = (t, v, sub = '') => `<div class="rounded-lg border px-3 py-2"><p class="text-[10.5px] font-semibold uppercase tracking-wide text-muted-foreground">${t}</p><p class="mt-0.5 text-lg font-bold tabular-nums leading-tight">${v}</p>${sub ? `<p class="text-[11px] text-muted-foreground">${sub}</p>` : ''}</div>`;
  return `<div class="${POS()} inset-0 z-50 bg-black/80 animate-in fade-in-0" data-act="cerrar"></div>
    <div role="dialog" aria-modal="true" aria-labelledby="sh-t" class="${POS()} inset-y-0 z-50 flex h-full flex-col gap-4 border-l bg-background p-6 shadow-lg animate-in slide-in-from-right duration-500 ${movil() ? 'left-0 w-[390px] max-w-full' : 'right-0 w-full max-w-xl'}">
      <div class="flex flex-col gap-y-2 pr-6 text-left">
        <div class="flex flex-wrap items-center gap-2"><h2 id="sh-t" class="text-lg font-semibold text-foreground">${s.n} · ${MESES[m - 1]} ${y}</h2>${chipE}</div>
        <p class="text-sm text-muted-foreground">Reservas confirmadas con pago que ocupan noches de ${MESES[m - 1]}. Cada una suma solo las noches de este mes.</p>
      </div>
      <div class="grid grid-cols-3 gap-2">${stat('Ocupación', pct(c.p))}${stat('Ocupadas', nf(c.o), 'noches-hab.')}${stat('Disponibles', nf(c.d), `${dias(y, m)} días × ${s.h} hab.`)}</div>
      <div class="-mx-6 min-h-0 flex-1 overflow-y-auto px-6 pb-2">${cuerpo}
        ${conDetalle && filas.length ? `<p class="mt-3 flex items-start gap-2 text-xs text-muted-foreground">${ic('info', 'mk-ic mt-px size-3.5')}<span>${filas.length} reserva${filas.length === 1 ? '' : 's'} · la suma (${nf(suma)}) es la cifra de la celda${suma === c.o ? '' : ' — NO CUADRA'}.</span></p>` : ''}
      </div>
      <button data-act="cerrar" class="absolute right-4 top-4 rounded-sm opacity-70 ring-offset-background transition-opacity hover:opacity-100 focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2" aria-label="Cerrar">${ic('x', 'size-4 text-muted-foreground')}</button>
    </div>`;
}
function overlays() {
  const ov = document.getElementById('ov');
  if (!ov) return;
  let h = '';
  if (S.menuMovil) h += `<div class="${POS()} inset-0 z-50 bg-black/80 animate-in fade-in-0" data-act="menu-cerrar"></div>
    <div class="${POS()} inset-y-0 left-0 z-50 flex h-full w-[18rem] bg-sidebar shadow-lg animate-in slide-in-from-left duration-300">${sidebarHtml('w-full')}</div>`;
  if (S.celda) h += panelDetalle();
  if (S.toast) h += `<div role="status" class="${POS()} bottom-6 ${movil() ? 'left-4 w-[358px]' : 'right-6 max-w-[320px]'} z-[65] rounded-lg bg-neutral-900 px-4 py-3 text-sm text-white shadow-lg animate-in fade-in-0 slide-in-from-bottom-2 dark:bg-white dark:text-neutral-900">${S.toast}</div>`;
  ov.innerHTML = h;
}
let toastT;
function toast(t) { S.toast = t; overlays(); clearTimeout(toastT); toastT = setTimeout(() => { S.toast = null; overlays(); }, 3200); }

/* =====================================================================
   Render
   ===================================================================== */
function render() {
  document.documentElement.classList.toggle('dark', S.tema === 'oscuro');
  pintarBarra();
  const angosta = movil() && !simulado();
  document.querySelectorAll('.mk-in').forEach(x => { x.classList.toggle('max-w-[390px]', angosta); x.classList.toggle('!mx-0', angosta); x.classList.toggle('max-w-[1440px]', !angosta); });
  const stage = document.getElementById('stage');
  const prevScroll = document.getElementById('scroller')?.scrollTop || 0;
  const hmScroll = document.getElementById('hm-scroll')?.scrollLeft || 0;
  const mv = movil();
  const app = mv
    ? `<div class="flex w-[390px] max-w-full ${simulado() ? 'min-h-full' : 'min-h-screen'} flex-col bg-background">
        <main class="relative flex min-w-0 flex-1 flex-col bg-background">${headerHtml()}<div class="flex flex-1 flex-col gap-4 p-4">${pagina()}</div></main></div>`
    : `<div class="mx-auto flex min-h-screen max-w-[1440px] bg-sidebar">${sidebarHtml('sticky')}
        <main class="relative my-2 mr-2 flex min-h-[calc(100vh-102px)] min-w-0 flex-1 flex-col rounded-xl bg-background shadow">${headerHtml()}<div class="flex flex-1 flex-col gap-4 p-4">${pagina()}</div></main></div>`;
  stage.innerHTML = simulado()
    ? `<div class="relative mx-auto my-6 h-[844px] w-[402px] overflow-hidden rounded-[2.2rem] border-[6px] border-neutral-800 bg-background shadow-2xl"><div id="scroller" class="no-scrollbar h-full overflow-y-auto">${app}</div><div id="ov"></div></div>`
    : `${app}<div id="ov"></div>`;
  if (document.getElementById('scroller')) document.getElementById('scroller').scrollTop = prevScroll;
  if (document.getElementById('hm-scroll')) document.getElementById('hm-scroll').scrollLeft = hmScroll;
  ajustarAside();
  dibujarLinea();
  sombraSticky();
  overlays();
}
function ajustarAside() {
  const a = document.querySelector('#stage #aside.sticky');
  if (!a) return;
  const h = document.querySelector('.mk-bar').offsetHeight;
  a.style.top = h + 'px'; a.style.height = `calc(100vh - ${h}px)`;
}
function sombraSticky() {
  const sc = document.getElementById('hm-scroll');
  if (!sc) return;
  const f = () => sc.querySelectorAll('.hm-sticky').forEach(x => x.classList.toggle('hm-sombra', sc.scrollLeft > 2));
  sc.addEventListener('scroll', f); f();
}

/* CSV de la grilla (D7) */
function exportarCsv() {
  const y = S.anio, ms = cerrados(y), comp = S.comparar && hayAnterior(y);
  const n = v => v == null ? '' : p1(v);
  const filas = [['Sede', ...M3.map(cap), `Año (${ms.length ? rango(ms) : 'sin meses cerrados'})`]];
  const fila = (nombre, sids, yy) => [nombre, ...MESES12.map(m => n(agg(sids, yy, [m]).p)), ms.length ? n(agg(sids, yy, ms).p) : ''];
  SEDES.forEach(s => filas.push(fila(s.n, [s.id], y)));
  filas.push(fila('Total', IDS, y));
  filas.push(['Estado', ...MESES12.map(m => ({ cerrado: 'cerrado', curso: 'en curso', venta: 'en venta' })[estado(y, m)]), '']);
  if (comp) { filas.push([]); filas.push([`${y - 1}`]); SEDES.forEach(s => filas.push(fila(s.n, [s.id], y - 1))); filas.push(fila('Total', IDS, y - 1)); }
  const csv = '﻿' + filas.map(r => r.join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `ocupacion-sedes-${y}${comp ? '-vs-' + (y - 1) : ''}.csv`;
  a.click();
  toast(`Se descargó ${a.download}`);
}

/* =====================================================================
   Eventos
   ===================================================================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const v = el.dataset.v;
  switch (el.dataset.act) {
    case 'mk-tema': S.tema = v; render(); break;
    case 'mk-comp': S.comparar = v === '1'; render(); break;
    case 'mk-ancho': S.ancho = +v; S.menuMovil = false; render(); break;
    case 'mk-est': S.estado = v; S.celda = null; S.cargando = false; render(); break;
    case 'comparar': if (hayAnterior(S.anio)) { S.comparar = !S.comparar; render(); } break;
    case 'csv': exportarCsv(); break;
    case 'celda': S.celda = v; overlays(); break;
    case 'cerrar': S.celda = null; overlays(); break;
    case 'trigger': if (movil()) { S.menuMovil = true; overlays(); } break;
    case 'menu-cerrar': S.menuMovil = false; overlays(); break;
    case 'ficha': e.preventDefault(); { const [c, id] = v.split('|'); toast(`Abre la ficha de la reserva ${c} (/reservas/${id}) en el admin nuevo.`); } break;
    case 'reintentar': S.estado = 'datos'; S.cargando = true; render(); setTimeout(() => { S.cargando = false; render(); }, 900); break;
  }
});
document.addEventListener('change', e => {
  if (e.target.dataset.chg === 'anio') {
    S.anio = +e.target.value; S.cargando = true; render();
    setTimeout(() => { S.cargando = false; render(); }, 600);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && (S.celda || S.menuMovil)) { S.celda = null; S.menuMovil = false; overlays(); } });
const tip = document.getElementById('tip');
document.addEventListener('mouseover', e => {
  const el = e.target.closest('[data-tip]');
  if (!el) { tip.classList.add('hidden'); return; }
  tip.innerHTML = el.dataset.tip; tip.classList.remove('hidden');
  const r = el.getBoundingClientRect(), tw = tip.offsetWidth;
  tip.style.left = Math.min(window.innerWidth - tw - 8, Math.max(8, r.left + r.width / 2 - tw / 2)) + 'px';
  const abajo = r.bottom + 8 + tip.offsetHeight < window.innerHeight;
  tip.style.top = (abajo ? r.bottom + 6 : r.top - tip.offsetHeight - 6) + 'px';
});
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { ajustarAside(); dibujarLinea(); }, 80); });
document.fonts?.ready.then(() => dibujarLinea());
render();
</script>
</body>
</html>
