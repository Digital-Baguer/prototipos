/* Calendario de octubre (días 1–20). C completado · E empezado · R obligada sin checklist · P obligada con checklist sin respuestas
   G sin huéspedes · c/e hecho sin huéspedes (sin obligación) */
const OCT = {
  frances: 'CCCCCCCCCECCCCRCCCCC',
  tintipan: 'GCCCCGGCCCCCCECCCCCE',
  crystal: 'CCCCCCRCCCCCCCCPCCCC',
  joya: 'GGCCCGGGCCCCCCCCECCC',
  paraiso: 'GGCCCGGGGCCCGGGCCCRC',
  sunset: 'GGCCGGGGGCCCGGGGCcGG',
};
const OCUP = { frances: 0.85, tintipan: 0.75, crystal: 0.7, joya: 0.65, paraiso: 0.55, sunset: 0.15 };
function codigo(sid, d) {
  if (d > HOY) return 'F';
  if (d < PRIMER_DIA) return 'N';
  if (d.getFullYear() === 2026 && d.getMonth() === 9) return OCT[sid][d.getDate() - 1];
  const wd = d.getDay(), fin = wd === 5 || wd === 6 || wd === 0, k = sid + iso(d);
  const obl = hs(k) < (fin ? Math.min(0.97, OCUP[sid] + 0.3) : OCUP[sid] - 0.2);
  const h2 = hs('r' + k);
  if (obl) return h2 < 0.38 ? 'C' : h2 < 0.88 ? 'E' : 'R';
  return h2 < 0.05 ? 'e' : 'G';
}
const esFormato2 = d => d.getFullYear() === 2026 && d.getMonth() === 9;
function noCumplen(sid, d) {
  if (!esFormato2(d)) return 0;
  if (sid === 'frances' && d.getDate() === 14) return 3;
  const k = sid + iso(d);
  return hs('nc' + k) < 0.74 ? 0 : 1 + Math.floor(hs('nc2' + k) * 2.4);
}

function phStyle(seed) {
  const t = TONOS[Math.floor(hs(seed) * TONOS.length)], a = Math.floor(hs(seed + 'a') * 360);
  const hz = 45 + Math.floor(hs(seed + 'h') * 25);

}

/* Genera el checklist de una sede en un día */
function checklist(sid, d, op = {}) {
  let c = codigo(sid, d);
  if (op.codigo && 'CEPce'.includes(c)) c = c === c.toUpperCase() ? op.codigo : op.codigo.toLowerCase();
  if (!'CEPce'.includes(c)) return null;
  const s = SEDE[sid], k = sid + iso(d), f2 = esFormato2(d) && !op.f1;
  const estado = c.toUpperCase() === 'C' ? 'completado' : c.toUpperCase() === 'E' ? 'empezado' : 'sinrespuestas';
  const inicio = 6 * 60 + 35 + Math.floor(hs('i' + k) * 85);
  const coord = (sid === 'crystal' || sid === 'joya') && hs('p' + k) < 0.3;
  const responsable = coord ? 'Rosa Elena Contreras' : s.resp;
  let areas = [];
  if (f2) {
    CAT.filter(a => a.activo && a.sedes.includes(sid) && a.items.some(i => i.activo)).sort((a, b) => a.orden - b.orden).forEach(a => {
      const base = { area: a.id, icono: a.icono };
      if (a.dinamica) s.habs.forEach(h => areas.push({ ...base, key: a.id + h, nombre: 'Habitación ' + h, items: a.items.filter(i => i.activo).map(i => ({ ...i })) }));
      else areas.push({ ...base, key: a.id, nombre: a.nombre, items: a.items.filter(i => i.activo).map(i => ({ ...i })) });
    });
  } else {
    [['apertura', 'Apertura general', 'wb_sunny'], ['piscina', 'Piscina', 'pool'], ['cocina', 'Cocina', 'kitchen'], ['sala', 'Sala', 'living'], ['comedor', 'Comedor', 'restaurant']]
      .forEach(([id, n, icn]) => areas.push({ area: id, key: id, nombre: n, icono: icn, fotos: [] }));
    s.habs.forEach(h => areas.push({ area: 'habitacion', key: 'hab' + h, nombre: 'Habitación ' + h, icono: 'bed', fotos: [] }));
  }
  // Hasta dónde llegó
  const total = areas.length;
  let hasta = total, parcial = -1;
  if (estado === 'empezado') { hasta = Math.max(1, Math.floor(total * (0.5 + 0.3 * hs('h' + k)))); parcial = hasta; }
  if (estado === 'sinrespuestas') hasta = 0;
  let t = inicio, nFotos = 0;
  const quien = (i) => (coord && i % 3 === 0) ? s.resp : responsable;
  areas.forEach((a, ai) => {
    if (f2) {
      const lim = ai < hasta ? a.items.length : ai === parcial ? Math.floor(a.items.length * 0.45) : 0;
      a.items.forEach((x, ii) => {
        if (ii < lim) {
          t += 0.35 + hs(k + a.key + ii) * 0.5;
          x.resp = /si aplica/.test(x.texto) && hs('na' + k + a.key + ii) < 0.6 ? 'na' : 'cumple';
          x.hora = hora(t); x.quien = quien(ai);
          x.fotos = x.foto && x.resp !== 'na' ? Array.from({ length: x.min + (hs('f' + k + a.key + ii) < 0.25 ? 1 : 0) }, (_, n) => ({ seed: k + a.key + ii + n, hora: hora(t) })) : [];
        } else { x.resp = 'pend'; x.fotos = []; }
      });
    } else {
      const n = ai < hasta ? 2 + Math.floor(hs('nf' + k + a.key) * 3) : 0;
      for (let j = 0; j < n; j++) { t += 1.5 + hs(k + a.key + j) * 3; a.fotos.push({ seed: k + a.key + j, hora: hora(t), quien: responsable }); }
    }
  });
  // No cumplen
  const nc = f2 ? Math.max(noCumplen(sid, d), op.codigo === 'E' ? 1 : 0) : 0;
  let puestos = 0;
  for (let j = 0; j < POOL_NC.length && puestos < nc; j++) {
    const p = POOL_NC[(Math.floor(hs('pool' + k) * POOL_NC.length) + j) % POOL_NC.length];
    const cand = areas.filter(a => a.area === p.area);
    if (!cand.length) continue;
    const a = cand[Math.floor(hs('room' + k + j) * cand.length)];
    const x = a.items.find(i => i.texto === p.texto);
    if (!x || x.resp === 'pend' || x.resp === 'nocumple') continue;
    x.resp = 'nocumple'; x.com = p.com;
    if (!x.fotos.length) x.fotos = [{ seed: k + a.key + p.texto, hora: x.hora }];
    puestos++;
  }
  // Estadísticas
  let completas = 0, itemsResp = 0, itemsTot = 0, ultima = inicio;
  areas.forEach(a => {
    if (f2) {
      a.resp = a.items.filter(x => x.resp !== 'pend').length; a.tot = a.items.length;
      a.nc = a.items.filter(x => x.resp === 'nocumple').length;
      a.nfotos = a.items.reduce((s2, x) => s2 + x.fotos.length, 0);
      a.completa = a.items.every(x => x.resp !== 'pend' && (!x.foto || x.resp === 'na' || x.fotos.length >= x.min));
      itemsResp += a.resp; itemsTot += a.tot;
    } else {
      a.nfotos = a.fotos.length; a.completa = a.fotos.length > 0;
    }
    if (a.completa) completas++;
    nFotos += a.nfotos;
  });
  if (estado !== 'sinrespuestas') ultima = t;
  return { sid, fecha: d, formato: f2 ? 2 : 1, estado, obligada: c === c.toUpperCase(), responsable, inicio: hora(inicio), ultima: estado === 'sinrespuestas' ? null : hora(ultima),
    areas, completas, total: areas.length, fotos: nFotos, nc: puestos, itemsResp, itemsTot };
}

      ['<span class="grid size-3.5 place-items-center rounded bg-neutral-100 ring-1 ring-inset ring-neutral-200"><span class="size-1.5 rounded-full bg-emerald-500"></span></span>', 'Lo hizo sin tener huéspedes'],
      ['<span class="grid size-3.5 place-items-center rounded bg-emerald-500 text-[9px] font-bold text-white">2</span>', 'Ítems que no cumplen'],
    ];
    cuerpo = `<div class="border-b px-5 py-3 text-sm text-muted-foreground">${esFormato2(S.mes) ? '' : '<span class="mr-2 inline-flex items-center rounded-md border px-1.5 py-0.5 text-xs font-medium text-foreground/80">Formato anterior: por área, sin ítems</span>'}
        En ${MESES[m]}${y === HOY.getFullYear() && m === HOY.getMonth() ? ', hasta hoy' : ''}: <b class="text-foreground">${tK} de ${tO}</b> noches con huéspedes tuvieron el checklist completo.</div>
      <div class="overflow-x-auto px-5 py-4">
        <table class="cal w-full border-separate border-spacing-[3px]">
          <thead><tr><th class="w-[140px]"></th>${head}<th class="w-[168px] pb-1.5 pl-4 text-left align-bottom text-xs font-semibold uppercase tracking-wide text-muted-foreground">Cumplió</th></tr></thead>
          <tbody>${filas}</tbody>
          <tfoot><tr><th class="pr-3 pt-1 text-left text-[11px] font-normal text-muted-foreground">Sedes al día</th>${pie}<td></td></tr></tfoot>
        </table>
      </div>
      <div class="flex flex-wrap items-center gap-x-5 gap-y-2 border-t px-5 py-3 text-xs text-muted-foreground">
        ${leyenda.map(([sw, t]) => `<span class="inline-flex items-center gap-1.5">${sw}${t}</span>`).join('')}
        <span class="ml-auto">Una sede está obligada la noche que tiene huéspedes.</span>
      </div>`;
  }
  return cabecera('Lo que cada sede revisó en su recorrido diario: si lo terminó, qué no cumple y las fotos.') +
    `<section class="overflow-hidden rounded-xl border bg-card">
      <div class="flex flex-wrap items-center justify-between gap-3 border-b bg-muted/30 px-5 py-3">${nav}
        <span class="text-xs text-muted-foreground">Hoy es ${fLarga(HOY)}</span></div>
      ${cuerpo}
    </section>`;
}

/* =====================================================================
   Vista 2 · Sedes del día
   ===================================================================== */
function vistaDia() {
  const d = deIso(S.dia), est = S.est.dia;
  const prev = new Date(d); prev.setDate(d.getDate() - 1);
  const next = new Date(d); next.setDate(d.getDate() + 1);
  const ctrl = `<div class="flex flex-wrap items-center gap-2">
      <button data-act="dia-mover" data-v="-1" ${prev < PRIMER_DIA ? 'disabled' : ''} class="inline-flex h-9 w-9 items-center justify-center rounded-md border hover:bg-muted disabled:opacity-40" aria-label="Día anterior">${ic('chevL')}</button>
      <input id="f-dia" type="date" value="${S.dia}" min="${iso(PRIMER_DIA)}" max="${iso(HOY)}" class="h-9 rounded-md border bg-background px-2 py-1.5 text-sm" aria-label="Fecha">
      <button data-act="dia-mover" data-v="1" ${next > HOY ? 'disabled' : ''} class="inline-flex h-9 w-9 items-center justify-center rounded-md border hover:bg-muted disabled:opacity-40" aria-label="Día siguiente">${ic('chevR')}</button>
      <div class="ml-1 flex gap-1">
        <button data-act="dia-atajo" data-v="hoy" class="rounded border px-1.5 py-0.5 text-xs hover:bg-muted">hoy</button>
        <button data-act="dia-atajo" data-v="ayer" class="rounded border px-1.5 py-0.5 text-xs hover:bg-muted">ayer</button>
      </div>
      <span class="ml-2 text-sm font-semibold">${cap(fLarga(d))}</span>
    </div>`;
  let cuerpo;
  if (est === 'carga') {
    cuerpo = `${sk('mb-4 h-16 w-full')}<div class="grid gap-4 md:grid-cols-2 xl:grid-cols-3">${SEDES.map(() => sk('h-[214px] w-full rounded-xl')).join('')}</div>`;
  } else {
    const datos = SEDES.map(s => {
      let c = codigo(s.id, d);
      if (est === 'vacio') c = 'CEP'.includes(c) || c === 'R' ? 'R' : 'G';
      return { s, c, ck: est === 'vacio' ? null : checklist(s.id, d) };
    });
    const obl = datos.filter(x => 'CERP'.includes(x.c)), ok = obl.filter(x => x.c === 'C');
    const emp = obl.filter(x => x.c === 'E'), falta = obl.filter(x => 'RP'.includes(x.c)), libres = datos.filter(x => !'CERP'.includes(x.c));
    const barra = obl.map(x => `<span class="h-2 flex-1 rounded-full ${x.c === 'C' ? 'bg-emerald-500' : x.c === 'E' ? 'bg-neutral-900' : 'bg-rose-400'}"></span>`).join('');
    const nombres = a => a.map(x => x.s.nombre).join(', ').replace(/, ([^,]*)$/, ' y $1');
    const titular = est === 'vacio'
      ? `Ninguna sede hizo el checklist ese día`
      : `${ok.length} de ${obl.length} sedes con huéspedes cumplieron`;
    const banner = `<div class="mb-4 flex flex-wrap items-center gap-x-6 gap-y-3 rounded-xl border ${falta.length ? 'border-rose-200' : ''} bg-card px-5 py-4">
        <div class="min-w-[260px]"><p class="text-lg font-bold tracking-tight">${titular}</p>
          <p class="mt-0.5 text-sm text-muted-foreground">${[
            emp.length ? `${nombres(emp)} ${emp.length > 1 ? 'van' : 'va'} en curso` : '',
            falta.length ? `<span class="font-semibold text-rose-600">${nombres(falta)} no ${falta.length > 1 ? 'lo hicieron' : 'lo hizo'}</span>` : '',
            libres.length ? `${nombres(libres)} sin huéspedes` : ''].filter(Boolean).join(' · ')}</p></div>
        <div class="flex min-w-[200px] flex-1 gap-1.5">${barra}</div>
      </div>`;
    const tarjetas = datos.map(({ s, c, ck }) => tarjetaSede(s, c, ck, d)).join('');
    cuerpo = banner + `<div class="grid gap-4 md:grid-cols-2 xl:grid-cols-3">${tarjetas}</div>`;
  }
  return cabecera('Lo que cada sede revisó en su recorrido diario: si lo terminó, qué no cumple y las fotos.') +
    `<div class="mb-4 rounded-xl border bg-card px-4 py-3">${ctrl}</div>${cuerpo}`;
}
function tarjetaSede(s, c, ck, d) {
  const conHuespedes = 'CERP'.includes(c);
  const estado = c === 'C' || c === 'c' ? 'completado' : c === 'E' || c === 'e' ? 'empezado' : c === 'P' ? 'sinrespuestas' : c === 'R' ? 'sinchecklist' : 'sinhuespedes';
  const marco = estado === 'sinchecklist' || estado === 'sinrespuestas' ? 'border-rose-200' : '';
  const sub = conHuespedes ? `Con huéspedes · ${s.habs.length} habitaciones` : 'Sin huéspedes esa noche';
  let cuerpo;
  if (!ck) {
    cuerpo = `<div class="px-5 py-5 text-sm ${conHuespedes ? 'text-rose-700' : 'text-muted-foreground'}">${conHuespedes ? 'Tenía huéspedes y no se abrió el checklist en la app.' : 'No le tocaba hacer el checklist.'}</div>`;
  } else {
    const pct = ck.total ? ck.completas / ck.total : 0;
    cuerpo = `<dl class="grid grid-cols-2 gap-x-4 gap-y-3 px-5 py-4 text-sm">
      <div class="col-span-2"><dt class="text-xs text-muted-foreground">Responsable</dt><dd class="font-medium">${ck.responsable}</dd></div>
      <div class="col-span-2"><dt class="text-xs text-muted-foreground">Inicio → última respuesta</dt><dd class="font-medium tabular-nums">${ck.ultima ? `${ck.inicio} → ${ck.ultima}` : `Abierto a las ${ck.inicio}, sin respuestas`}</dd></div>
      <div class="col-span-2"><dt class="flex justify-between text-xs text-muted-foreground"><span>Áreas completas</span><span class="font-semibold tabular-nums text-foreground">${ck.completas} de ${ck.total}</span></dt>
        <dd class="mt-1.5 h-1.5 overflow-hidden rounded-full bg-muted"><div class="h-full rounded-full ${pct === 1 ? 'bg-emerald-500' : 'bg-neutral-900'}" style="width:${Math.round(pct * 100)}%"></div></dd></div>
      <div><dt class="text-xs text-muted-foreground">Fotos</dt><dd class="font-medium tabular-nums">${ck.fotos}</dd></div>
      <div><dt class="text-xs text-muted-foreground">No cumplen</dt><dd class="tabular-nums ${ck.nc ? 'font-semibold text-rose-600' : 'font-medium'}">${ck.formato === 1 ? '<span class="font-normal text-muted-foreground">No aplica (formato anterior)</span>' : ck.nc ? `${ck.nc} ${ck.nc > 1 ? 'ítems' : 'ítem'}` : 'Ninguno'}</dd></div>
    </dl>`;
  }
  const pie = c === 'G' ? '' : `<footer class="mt-auto border-t px-5 py-2.5"><button data-act="abrir-det" data-v="${s.id}|${iso(d)}|dia" class="text-sm font-semibold text-primary hover:underline">${ck ? 'Ver checklist' : 'Ver detalle'}</button></footer>`;
  return `<article class="flex flex-col rounded-xl border bg-card ${marco} ${c === 'G' ? 'bg-muted/30' : ''}">
    <header class="flex items-start justify-between gap-3 px-5 pt-4"><div><h3 class="text-base font-bold ${c === 'G' ? 'text-muted-foreground' : ''}">${s.nombre}</h3><p class="text-xs text-muted-foreground">${sub}</p></div>${chip(estado)}</header>
    ${cuerpo}${pie}</article>`;
}

/* =====================================================================
   Vista 3 · Detalle sede + día
   ===================================================================== */
function vistaDetalle() {
  const { sid, fecha, desde } = S.det, d = deIso(fecha), s = SEDE[sid], est = S.est.detalle;
  const volver = desde === 'dia' ? `Sedes del ${fMedia(d)}` : `Calendario de ${MESES[d.getMonth()]}`;
  const prev = new Date(d); prev.setDate(d.getDate() - 1);
  const next = new Date(d); next.setDate(d.getDate() + 1);
  const top = `<div class="mb-4 flex flex-wrap items-center justify-between gap-3">
      <a data-act="volver" class="inline-flex cursor-pointer items-center gap-1.5 text-[13px] text-muted-foreground hover:text-foreground">${ic('arrowL')}Volver a ${volver}</a>
      <div class="flex items-center gap-1.5">
        <select data-act-change="det-sede" class="h-8 rounded-md border bg-background px-2 text-sm" aria-label="Sede">${SEDES.map(x => `<option value="${x.id}" ${x.id === sid ? 'selected' : ''}>${x.nombre}</option>`).join('')}</select>
        <button data-act="det-mover" data-v="-1" ${prev < PRIMER_DIA ? 'disabled' : ''} class="inline-flex h-8 items-center gap-1 rounded-md border px-2 text-sm hover:bg-muted disabled:opacity-40">${ic('chevL')}Día anterior</button>
        <button data-act="det-mover" data-v="1" ${next > HOY ? 'disabled' : ''} class="inline-flex h-8 items-center gap-1 rounded-md border px-2 text-sm hover:bg-muted disabled:opacity-40">Día siguiente${ic('chevR')}</button>
      </div></div>`;
  if (est === 'carga') return top + `${sk('h-[132px] w-full rounded-xl')}<div class="mt-4 space-y-3">${sk('h-28 w-full rounded-xl')}${sk('h-14 w-full rounded-xl')}${sk('h-14 w-full rounded-xl')}${sk('h-14 w-full rounded-xl')}</div>`;
  const c = codigo(sid, d);
  const C = est === 'vacio' ? null : checklist(sid, d, { f1: est === 'f1', codigo: est === 'empezado' ? 'E' : null });
  const ck = C;
  if (!ck) {
    const oblig = est === 'vacio' || 'RP'.includes(c);
    return top + `<section class="rounded-xl border ${oblig ? 'border-rose-200' : ''} bg-card px-6 py-12 text-center">
        <div class="mx-auto mb-3 grid size-10 place-items-center rounded-full ${oblig ? 'bg-rose-50 text-rose-600' : 'bg-muted text-muted-foreground'}">${ic(oblig ? 'alert' : 'calendar', 'size-5')}</div>
        <p class="text-lg font-bold">${s.nombre} no tiene checklist el ${fLarga(d)}</p>
        <p class="mt-1 text-sm text-muted-foreground">${oblig ? 'Tenía huéspedes esa noche, así que le tocaba hacerlo. Nadie lo abrió en la app.' : 'No tenía huéspedes esa noche: no le tocaba hacerlo.'}</p>
        <div class="mt-4 flex justify-center gap-2">${btnSm('Ver las sedes de ese día', 'ir-dia', fecha)}</div>
      </section>`;
  }
  S.fotos = [];
  const reg = (f, ctx) => { S.fotos.push({ ...f, ctx }); return S.fotos.length - 1; };
  const estadoK = C.estado;
  const hechos = [
    ['Responsable', C.responsable],
    ['Inicio → última respuesta', C.ultima ? `${C.inicio} → ${C.ultima}` : `Abierto a las ${C.inicio}`],
    ['Áreas completas', `${C.completas} de ${C.total}`],
    C.formato === 2 ? ['Ítems respondidos', `${C.itemsResp} de ${C.itemsTot}`] : ['Ítems', 'No tiene (formato anterior)'],
    ['Fotos', String(C.fotos)],
    C.formato === 2 ? ['No cumplen', C.nc ? `<span class="font-semibold text-rose-600">${C.nc} ${C.nc > 1 ? 'ítems' : 'ítem'}</span>` : 'Ninguno'] : null,
  ].filter(Boolean);
  const head = `<section class="rounded-xl border bg-card">
      <div class="flex flex-wrap items-start justify-between gap-4 px-6 pt-5">
        <div><div class="flex flex-wrap items-center gap-2.5"><h1 class="text-2xl font-bold tracking-tight">${s.nombre}</h1>${chip(estadoK)}
          ${C.formato === 1 ? '<span class="inline-flex items-center gap-1.5 rounded-md border px-2 py-0.5 text-xs font-medium text-foreground/80">' + ic('info', 'size-3.5') + 'Formato anterior: por área, sin ítems</span>' : ''}
          ${!C.obligada ? '<span class="inline-flex items-center rounded-md border px-2 py-0.5 text-xs text-muted-foreground">Sin huéspedes esa noche: lo hizo sin estar obligada</span>' : ''}</div>
          <p class="mt-1 text-[15px] text-muted-foreground">${cap(fLarga(C.fecha))}${C.obligada ? ' · con huéspedes' : ''}</p></div>
      </div>
      <dl class="mt-4 grid grid-cols-2 border-t md:grid-cols-3 xl:grid-cols-6">
        ${hechos.map(([k, v]) => `<div class="border-b border-r px-5 py-3 last:border-r-0 xl:border-b-0"><dt class="text-xs text-muted-foreground">${k}</dt><dd class="mt-0.5 whitespace-nowrap text-sm font-medium tabular-nums">${v}</dd></div>`).join('')}
      </dl>
      ${C.formato === 1 ? `<p class="border-t px-6 py-2.5 text-xs text-muted-foreground">Este checklist se hizo antes de los ítems: quien hizo el recorrido solo subió fotos por área. Un área cuenta como completa cuando tiene al menos una foto.</p>` : ''}
    </section>`;

  if (S.abiertas === null) {
    const conNc = C.formato === 2 ? C.areas.find(a => a.nc) : null;
    S.abiertas = new Set([(conNc || C.areas[0]).key]);
  }
  let bloqueNc = '';
  if (C.formato === 2) {
    const lista = [];
    C.areas.forEach(a => a.items.forEach(x => { if (x.resp === 'nocumple') lista.push({ a, x }); }));
    bloqueNc = lista.length ? `<section class="mt-4 overflow-hidden rounded-xl border border-rose-200 bg-card">
        <header class="flex items-center gap-2 border-b border-rose-200 bg-rose-50/70 px-5 py-3"><h2 class="text-base font-bold text-rose-800">No cumplen</h2><span class="rounded-full bg-rose-600 px-2 py-0.5 text-xs font-bold text-white tabular-nums">${lista.length}</span>
          <span class="ml-auto text-xs text-rose-800/80">Lo que el recorrido encontró mal, con el comentario y las fotos de quien lo marcó.</span></header>
        <ul class="divide-y">${lista.map(({ a, x }) => `<li class="grid gap-4 px-5 py-3.5 md:grid-cols-[minmax(0,1.1fr)_minmax(0,1.4fr)_auto]">
            <div><p class="font-semibold">${x.texto}</p><p class="mt-0.5 text-xs text-muted-foreground"><button data-act="ir-area" data-v="${a.key}" class="font-medium text-primary hover:underline">${a.nombre}</button> · ${x.quien} · ${x.hora}</p></div>
            <p class="text-sm">${esc(x.com)}</p>
            <div class="flex gap-1.5">${x.fotos.map(f => foto(f, reg(f, `${a.nombre} · ${x.texto}`), 'h-14 w-20')).join('')}</div></li>`).join('')}</ul>
      </section>` : `<div class="mt-4 flex items-center gap-2 rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800">${ic('check', 'size-4')}Ningún ítem quedó en «No cumple».</div>`;
  }
  const filasArea = C.areas.map(a => areaDetalle(a, C, reg)).join('');
  const resumenAreas = C.formato === 2 ? `${C.areas.filter(a => a.area === 'habitacion').length} habitaciones: el área Habitación se repite por cada una.` : '';
  return top + head + bloqueNc + `<div class="mb-2 mt-6 flex items-end justify-between gap-3"><h2 class="text-base font-bold">Áreas <span class="font-normal text-muted-foreground">(${C.total})</span></h2>
      <div class="flex items-center gap-3 text-xs text-muted-foreground">${resumenAreas}
      <button data-act="areas-todas" data-v="abrir" class="font-medium text-primary hover:underline">Abrir todas</button><button data-act="areas-todas" data-v="cerrar" class="font-medium text-primary hover:underline">Cerrar todas</button></div></div>
    <div class="space-y-2.5">${filasArea}</div>`;
}
function areaDetalle(a, C, reg) {
  const abierta = S.abiertas.has(a.key);
  const meta = C.formato === 2 ? `${a.resp} de ${a.tot} ítems · ${a.nfotos} ${a.nfotos === 1 ? 'foto' : 'fotos'}` : `${a.nfotos} ${a.nfotos === 1 ? 'foto' : 'fotos'}`;
  const estado = a.completa ? '<span class="rounded-full bg-emerald-50 px-2 py-0.5 text-xs font-semibold text-emerald-700">Completa</span>'
    : (C.formato === 2 ? a.resp : a.nfotos) ? '<span class="rounded-full bg-neutral-900 px-2 py-0.5 text-xs font-semibold text-white">Empezada</span>'
      : '<span class="rounded-full border border-dashed border-neutral-300 px-2 py-0.5 text-xs font-semibold text-neutral-500">Sin empezar</span>';
  let cuerpo = '';
  if (abierta) {
    if (C.formato === 2) {
      cuerpo = `<div class="border-t"><table class="w-full text-left text-sm">
        <thead class="border-b bg-muted/40 text-xs uppercase tracking-wide text-muted-foreground"><tr>
          <th class="w-10 px-4 py-2.5 font-semibold">#</th><th class="px-4 py-2.5 font-semibold">Ítem</th><th class="px-4 py-2.5 font-semibold">Respuesta</th>
          <th class="px-4 py-2.5 font-semibold">Comentario</th><th class="px-4 py-2.5 font-semibold">Fotos</th><th class="px-4 py-2.5 font-semibold">Respondió</th></tr></thead>
        <tbody class="divide-y">${a.items.map((x, i) => `<tr class="${x.resp === 'nocumple' ? 'bg-rose-50/50' : 'hover:bg-muted/40'}">
          <td class="px-4 py-2.5 align-top text-xs tabular-nums text-muted-foreground">${i + 1}</td>
          <td class="px-4 py-2.5 align-top"><p class="font-medium">${x.texto}</p>${x.foto ? `<p class="mt-0.5 inline-flex items-center gap-1 text-xs text-muted-foreground">${ic('camera', 'size-3.5')}Exige foto · mínimo ${x.min} ${x.min > 1 ? 'fotos' : 'foto'}</p>` : ''}</td>
          <td class="px-4 py-2.5 align-top">${chipR(x.resp)}</td>
          <td class="max-w-[280px] px-4 py-2.5 align-top text-sm ${x.com ? '' : 'text-muted-foreground'}">${x.com ? esc(x.com) : '—'}</td>
          <td class="px-4 py-2.5 align-top"><div class="flex gap-1.5">${x.fotos.length ? x.fotos.map(f => foto(f, reg(f, `${a.nombre} · ${x.texto}`))).join('') : (x.foto && x.resp === 'pend' ? `<span class="text-xs text-muted-foreground">Falta ${x.min} ${x.min > 1 ? 'fotos' : 'foto'}</span>` : '<span class="text-muted-foreground">—</span>')}</div></td>
          <td class="whitespace-nowrap px-4 py-2.5 align-top text-xs text-muted-foreground">${x.hora ? `<span class="tabular-nums text-foreground">${x.hora}</span>${x.quien !== C.responsable ? '<br>' + x.quien : ''}` : '—'}</td></tr>`).join('')}</tbody></table></div>`;
    } else {
      cuerpo = `<div class="border-t px-5 py-4">${a.fotos.length ? `<div class="grid grid-cols-[repeat(auto-fill,minmax(150px,1fr))] gap-3">${a.fotos.map(f => `<div class="relative">${foto(f, reg(f, a.nombre), 'block aspect-[4/3] w-full')}<span class="pointer-events-none absolute bottom-1.5 left-1.5 rounded bg-black/65 px-1.5 py-0.5 text-[11px] text-white tabular-nums">${f.hora}</span></div>`).join('')}</div>`
        : '<p class="text-sm text-muted-foreground">No se subieron fotos de esta área.</p>'}</div>`;
    }
  }
  return `<section id="area-${a.key}" class="overflow-hidden rounded-xl border bg-card">
    <button data-act="area-toggle" data-v="${a.key}" aria-expanded="${abierta}" class="flex w-full items-center gap-3 px-5 py-3 text-left hover:bg-muted/40">
      <span class="grid size-9 shrink-0 place-items-center rounded-lg bg-muted text-foreground/80">${mat(a.icono)}</span>
      <span class="min-w-0 flex-1"><span class="block font-semibold">${a.nombre}</span><span class="block text-xs text-muted-foreground tabular-nums">${meta}</span></span>
      ${a.nc ? `<span class="rounded-full bg-rose-50 px-2 py-0.5 text-xs font-semibold text-rose-700 ring-1 ring-inset ring-rose-200">${a.nc} no ${a.nc > 1 ? 'cumplen' : 'cumple'}</span>` : ''}
      ${estado}${ic('chevD', 'mk-ic text-muted-foreground transition-transform ' + (abierta ? 'rotate-180' : ''))}
    </button>${cuerpo}</section>`;
}

/* =====================================================================
   Vista 4 · Catálogo (variantes A y B) + Áreas por sede
   ===================================================================== */
const D11 = 'Los cambios aplican desde el próximo checklist de cada sede; el de hoy que ya empezó no cambia.';
const activos = a => a.items.filter(i => i.activo).length;
const ordenadas = () => [...CAT].sort((a, b) => (b.activo - a.activo) || a.orden - b.orden);

        <button data-act="sheet-cerrar" class="absolute right-4 top-4 rounded-sm opacity-70 hover:opacity-100" aria-label="Cerrar">${ic('x', 'size-4 text-muted-foreground')}</button>
        <div class="flex-1 overflow-y-auto p-6">
          <div class="mb-5 flex flex-col gap-y-2 pr-8"><h2 class="text-lg font-semibold">${a ? 'Editar área' : 'Nueva área'}</h2><p class="text-sm text-muted-foreground">${D11}</p></div>
          ${a ? `<div class="mb-5">${cabArea(a, true)}</div>` : ''}
          <section class="rounded-xl border p-4"><div class="mb-3 flex items-center justify-between"><h3 class="text-[13px] font-bold uppercase tracking-wider text-muted-foreground">Datos del área</h3>
            ${a ? btnSm(a.activo ? 'Desactivar área' : 'Reactivar área', 'confirmar', 'area|' + a.id, a.activo ? 'outline' : 'default') : ''}</div>
            ${formArea(a)}
            <div class="mt-4 flex justify-end gap-2">${btn('Cancelar', 'sheet-cerrar', '', 'outline')}${btn(a ? 'Guardar área' : 'Crear área', 'area-guardar', a ? a.id : 'nueva')}</div></section>
          ${a ? `<section class="mt-5">${listaItems(a)}</section>` : '<p class="mt-4 text-sm text-muted-foreground">Después de crear el área, agrégale ítems: sin ítems activos no sale en la app.</p>'}
        </div>
      </div>`;
  }
  if (S.areaForm) {
    const a = S.areaForm === 'nueva' ? null : AREA(S.areaForm);
    h += `<div class="fixed inset-0 z-50 bg-black/80 animate-in fade-in-0" data-act="area-cerrar"></div>
      <div role="dialog" aria-modal="true" class="fixed left-1/2 top-1/2 z-50 grid max-h-[92vh] w-full max-w-xl -translate-x-1/2 -translate-y-1/2 gap-4 overflow-y-auto border bg-background p-6 shadow-lg animate-in fade-in-0 zoom-in-95 sm:rounded-lg">
        <button data-act="area-cerrar" class="absolute right-4 top-4 rounded-sm opacity-70 hover:opacity-100" aria-label="Cerrar">${ic('x', 'size-4')}</button>
        <div class="flex flex-col gap-y-1.5"><h2 class="text-lg font-semibold leading-none tracking-tight">${a ? `Editar ${a.nombre}` : 'Nueva área'}</h2><p class="text-sm text-muted-foreground">${D11}</p></div>
        ${formArea(a)}
        <div class="mt-2 flex justify-end gap-2.5">${btn('Cancelar', 'area-cerrar', '', 'outline')}${btn(a ? 'Guardar área' : 'Crear área', 'area-guardar', a ? a.id : 'nueva')}</div>
      </div>`;
  }
  if (S.confirm) {
    const [tipo, id] = S.confirm.split('|');
    let titulo, desc, accion;
    if (tipo === 'area') {
      const a = AREA(id);
      accion = a.activo ? 'Desactivar' : 'Reactivar';
      titulo = `¿${accion} el área ${a.nombre}?`;
      desc = a.activo ? `Deja de salir en la app en ${a.sedes.length} ${a.sedes.length === 1 ? 'sede' : 'sedes'} y en los checklists nuevos, con sus ${activos(a)} ítems. Los checklists pasados la conservan. Puedes reactivarla cuando quieras.`
        : `Vuelve a salir en la app desde el próximo checklist de cada sede${a.items.length ? '' : ', pero primero necesita ítems activos'}. Revisa en qué sedes se hace.`;
    } else {
      const a = CAT.find(z => z.items.some(i => i.id === +id)), x = a.items.find(i => i.id === +id);
      accion = x.activo ? 'Desactivar' : 'Reactivar';
      titulo = `¿${accion} el ítem «${x.texto}»?`;
      desc = x.activo ? `Deja de salir en ${a.nombre} desde el próximo checklist de cada sede. Los checklists pasados lo conservan con sus respuestas y fotos. Puedes reactivarlo cuando quieras.`
        : `Vuelve a salir en ${a.nombre}, al final de la lista, desde el próximo checklist de cada sede.`;
    }
    h += `<div class="fixed inset-0 z-[55] bg-black/80 animate-in fade-in-0" data-act="confirm-no"></div>
      <div role="alertdialog" aria-modal="true" class="fixed left-1/2 top-1/2 z-[55] grid w-full max-w-lg -translate-x-1/2 -translate-y-1/2 gap-4 border bg-background p-6 shadow-lg animate-in fade-in-0 zoom-in-95 sm:rounded-lg">
        <div class="flex flex-col gap-y-1.5"><h2 class="text-lg font-semibold leading-snug tracking-tight">${esc(titulo)}</h2><p class="text-sm text-muted-foreground">${desc}</p></div>
        ${S.est.catalogo === 'error' ? '<p class="text-xs text-muted-foreground">(Con «Guardar falla» activo, esta acción también falla.)</p>' : ''}
        <div class="mt-2 flex justify-end gap-2.5">${btn('Cancelar', 'confirm-no', '', 'outline')}${btn(accion, 'confirm-si', '', accion === 'Desactivar' ? 'rosa' : 'default')}</div>
      </div>`;
  }
  if (S.foto !== null && S.fotos[S.foto]) {
    const f = S.fotos[S.foto], n = S.fotos.length;
    h += `<div class="fixed inset-0 z-[60] flex flex-col items-center justify-center bg-black/90 animate-in fade-in-0" data-act="foto-cerrar">
      <button data-act="foto-cerrar" class="absolute right-6 top-5 rounded-full p-2 text-white/80 hover:bg-white/10 hover:text-white" aria-label="Cerrar">${ic('x', 'size-6')}</button>
      <button data-act="foto-mover" data-v="-1" ${S.foto === 0 ? 'disabled' : ''} class="absolute left-[2.5vw] top-1/2 grid size-12 -translate-y-1/2 place-items-center rounded-full bg-white/10 text-white hover:bg-white/25 disabled:opacity-25" aria-label="Foto anterior">${ic('chevL', 'size-6')}</button>
      <button data-act="foto-mover" data-v="1" ${S.foto === n - 1 ? 'disabled' : ''} class="absolute right-[2.5vw] top-1/2 grid size-12 -translate-y-1/2 place-items-center rounded-full bg-white/10 text-white hover:bg-white/25 disabled:opacity-25" aria-label="Foto siguiente">${ic('chevR', 'size-6')}</button>
      <div class="ph aspect-[4/3] w-[min(78vw,1000px)] max-h-[74vh] rounded-md" style="${phStyle(f.seed)}" data-act="nada"><div class="absolute inset-0 grid place-items-center text-white/50">${ic('image', 'size-16')}</div></div>
      <p class="mt-4 text-center text-sm text-white">${esc(f.ctx)}</p>
      <p class="mt-0.5 text-center text-xs text-white/60">${f.hora}${f.quien ? ' · ' + f.quien : ''} · ${S.foto + 1} de ${n}</p>
    </div>`;
  }
  if (S.toast) h += `<div role="status" class="fixed bottom-6 right-6 z-[65] flex items-start gap-2 rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800 shadow-lg animate-in fade-in-0 slide-in-from-bottom-2">${ic('check', 'mt-0.5 size-4 shrink-0')}<span>${S.toast}</span></div>`;
  document.getElementById('ov').innerHTML = h;
}
let toastT;
function toast(t) { S.toast = t; clearTimeout(toastT); toastT = setTimeout(() => { S.toast = null; overlays(); }, 3200); }

/* =====================================================================
   Render y eventos
   ===================================================================== */
function render() {
  if (S.rol !== 'editar' && S.vista === 'catalogo') S.vista = 'calendario';
  pintarBarra(); pintarMenu(); if (document.getElementById('aside').style.top) ajustarAside();
  const p = document.getElementById('page');
  const raiz = ['Checklist de sede', 'vista', 'calendario'];
  if (S.vista === 'calendario') { migas([raiz, ['Calendario']]); p.innerHTML = vistaCalendario(); }
  else if (S.vista === 'dia') { migas([raiz, ['Sedes del día']]); p.innerHTML = vistaDia(); }
  else if (S.vista === 'detalle') {
    const d = deIso(S.det.fecha);
    migas([raiz, S.det.desde === 'dia' ? ['Sedes del día', 'vista', 'dia'] : ['Calendario', 'vista', 'calendario'], [`${SEDE[S.det.sid].nombre} · ${fCorta(d)}`]]);
    p.innerHTML = vistaDetalle();
  } else { migas([raiz, ['Catálogo']]); p.innerHTML = vistaCatalogo(); }
  overlays();
}
function limpiarForm() { S.borrador = null; S.errorForm = null; S.errTexto = false; S.errArea = null; }
function abrirDetalle(sid, fecha, desde) { S.det = { sid, fecha, desde }; S.abiertas = null; S.vista = 'detalle'; S.est.detalle = desde === 'dia' && S.est.dia === 'vacio' ? 'vacio' : 'datos'; render(); window.scrollTo(0, 0); }
function leerItem() { return { texto: document.getElementById('i-texto').value.trim(), foto: document.getElementById('i-foto').checked, min: Math.max(1, Math.min(5, +(document.getElementById('i-min')?.value || 1))) }; }
function leerArea() { return { nombre: document.getElementById('a-nombre').value.trim(), icono: S.borrador?.icono ?? (S.areaForm && S.areaForm !== 'nueva' ? AREA(S.areaForm).icono : S.sheet && S.sheet !== 'nueva' ? AREA(S.sheet).icono : ''), orden: +document.getElementById('a-orden').value || 1, sedes: [...document.querySelectorAll('input[name=a-sede]:checked')].map(x => x.value) }; }
const falla = () => S.est.catalogo === 'error';

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act, v = el.dataset.v;
  if (act === 'nada') { e.stopPropagation(); return; }
  switch (act) {
    case 'mk-vista': S.vista = v; limpiarForm(); S.editItem = null; S.nuevoItem = false; render(); break;
    case 'mk-rol': S.rol = v; render(); break;
    case 'mk-var': S.variante = v; S.sheet = null; S.areaForm = null; limpiarForm(); S.editItem = null; S.nuevoItem = false; render(); break;
    case 'mk-est':
      S.est[S.vista] = v;
      if (S.vista === 'calendario') { S.mes = v === 'vacio' ? new Date(2026, 1, 1) : (S.mes < PRIMER_DIA ? new Date(2026, 9, 1) : S.mes); }
      if (S.vista === 'detalle') S.abiertas = null;
      if (S.vista === 'catalogo' && v === 'vacio') { S.sel = 'sala'; S.catTab = 'areas'; if (S.variante === 'B') S.sheet = 'sala'; }
      render(); break;
    case 'vista': S.vista = v; limpiarForm(); render(); break;
    case 'mes':
      if (v === 'hoy') S.mes = new Date(2026, 9, 1);
      else if (v === 'primero') { S.mes = new Date(2026, 2, 1); S.est.calendario = 'datos'; }
      else S.mes = new Date(S.mes.getFullYear(), S.mes.getMonth() + (+v), 1);
      if (v !== 'primero' && S.est.calendario === 'vacio') S.est.calendario = 'datos';
      render(); break;
    case 'celda': { const [sid, f] = v.split('|'); abrirDetalle(sid, f, 'calendario'); break; }
    case 'ir-dia': S.dia = v; S.vista = 'dia'; render(); window.scrollTo(0, 0); break;
    case 'dia-mover': { const d = deIso(S.dia); d.setDate(d.getDate() + (+v)); S.dia = iso(d); render(); break; }
    case 'dia-atajo': { const d = new Date(HOY); if (v === 'ayer') d.setDate(d.getDate() - 1); S.dia = iso(d); render(); break; }
    case 'abrir-det': { const [sid, f, desde] = v.split('|'); abrirDetalle(sid, f, desde); break; }
    case 'volver': S.vista = S.det.desde === 'dia' ? 'dia' : 'calendario'; if (S.vista === 'dia') S.dia = S.det.fecha; else S.mes = new Date(deIso(S.det.fecha).getFullYear(), deIso(S.det.fecha).getMonth(), 1); render(); break;
    case 'det-mover': { const d = deIso(S.det.fecha); d.setDate(d.getDate() + (+v)); S.det.fecha = iso(d); S.abiertas = null; render(); break; }
    case 'area-toggle': S.abiertas.has(v) ? S.abiertas.delete(v) : S.abiertas.add(v); render(); break;
    case 'areas-todas': {
      S.abiertas = new Set(v === 'abrir' ? [...document.querySelectorAll('[data-act=area-toggle]')].map(b => b.dataset.v) : []);
      render(); break;
    }
    case 'ir-area': S.abiertas.add(v); render(); document.getElementById('area-' + v)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
    case 'foto': S.foto = +v; overlays(); break;
    case 'foto-mover': e.stopPropagation(); S.foto = Math.max(0, Math.min(S.fotos.length - 1, S.foto + (+v))); overlays(); break;
    case 'foto-cerrar': S.foto = null; overlays(); break;
    // Catálogo
    case 'cat-tab': S.catTab = v; limpiarForm(); render(); break;
    case 'area-sel': S.sel = v; S.editItem = null; S.nuevoItem = false; limpiarForm(); render(); break;
    case 'sheet': S.sheet = v; S.sel = v; S.editItem = null; S.nuevoItem = false; limpiarForm(); render(); break;
    case 'sheet-cerrar': S.sheet = null; S.editItem = null; S.nuevoItem = false; limpiarForm(); render(); break;
    case 'area-nueva': limpiarForm(); if (S.variante === 'A') S.areaForm = 'nueva'; else S.sheet = 'nueva'; render(); break;
    case 'area-editar': limpiarForm(); S.areaForm = v; render(); break;
    case 'area-cerrar': S.areaForm = null; limpiarForm(); render(); break;
    case 'icono': { const b = document.getElementById('a-nombre') ? leerArea() : {}; S.borrador = { ...b, icono: v }; render(); break; }
    case 'area-guardar': {
      const b = leerArea(); S.borrador = b;
      const err = { nombre: !b.nombre, icono: !b.icono, sedes: !b.sedes.length };
      if (err.nombre || err.icono || err.sedes) { S.errArea = err; S.errorForm = null; render(); break; }
      S.errArea = null;
      if (falla()) { S.errorForm = true; render(); break; }
      if (v === 'nueva') {
        const id = 'n' + Date.now();
        CAT.push({ id, nombre: b.nombre, icono: b.icono, orden: b.orden, activo: true, dinamica: false, sedes: b.sedes, items: [] });
        S.sel = id; if (S.variante === 'B') S.sheet = id; else S.areaForm = null;
        toast(`Área «${esc(b.nombre)}» creada. Agrégale ítems para que salga en la app.`);
      } else {
        Object.assign(AREA(v), { nombre: b.nombre, icono: b.icono, orden: b.orden, sedes: b.sedes });
        S.areaForm = null; S.matriz = null; toast('Área guardada. Aplica desde el próximo checklist de cada sede.');
      }
      limpiarForm(); render(); break;
    }
    case 'item-nuevo': limpiarForm(); S.editItem = null; S.nuevoItem = true; render(); document.getElementById('i-texto')?.focus(); break;
    case 'item-editar': limpiarForm(); S.nuevoItem = false; S.editItem = +v; render(); document.getElementById('i-texto')?.focus(); break;
    case 'item-cancelar': S.editItem = null; S.nuevoItem = false; limpiarForm(); render(); break;
    case 'item-guardar': {
      const b = leerItem(); S.borrador = b;
      if (!b.texto) { S.errTexto = true; S.errorForm = null; render(); break; }
      S.errTexto = false;
      if (falla()) { S.errorForm = true; render(); break; }
      const a = AREA(S.sheet && S.sheet !== 'nueva' ? S.sheet : S.sel);
      if (v === 'nuevo') { const x = it(b.texto, b.foto); x.min = b.min; const k = a.items.filter(i => i.activo).length; a.items.splice(k, 0, x); toast('Ítem agregado al final de ' + esc(a.nombre) + '.'); }
      else { Object.assign(a.items.find(i => i.id === +v), b); toast('Ítem guardado.'); }
      S.editItem = null; S.nuevoItem = false; limpiarForm(); render(); break;
    }
    case 'item-mover': {
      const [id, dir] = v.split('|').map(Number);
      if (falla()) { S.errorForm = true; render(); break; }
      const a = CAT.find(z => z.items.some(i => i.id === id)), i = a.items.findIndex(x => x.id === id), j = i + dir;
      if (j < 0 || j >= a.items.length || !a.items[j].activo) break;
      [a.items[i], a.items[j]] = [a.items[j], a.items[i]];
      toast('Orden guardado.'); render(); break;
    }
    case 'confirmar': S.confirm = v; overlays(); break;
    case 'confirm-no': S.confirm = null; overlays(); break;
    case 'confirm-si': {
      const [tipo, id] = S.confirm.split('|'); S.confirm = null;
      if (falla()) { S.errorForm = true; render(); break; }
      if (tipo === 'area') { const a = AREA(id); a.activo = !a.activo; if (a.activo && !a.sedes.length) a.sedes = [...TODAS]; if (a.activo) a.orden = Math.max(...CAT.filter(z => z.activo && z !== a).map(z => z.orden)) + 1; S.matriz = null; toast(`Área ${esc(a.nombre)} ${a.activo ? 'reactivada' : 'desactivada'}.`); }
      else {
        const a = CAT.find(z => z.items.some(i => i.id === +id)), x = a.items.find(i => i.id === +id);
        x.activo = !x.activo; a.items.splice(a.items.indexOf(x), 1);
        a.items.splice(x.activo ? a.items.filter(i => i.activo).length : a.items.length, 0, x);
        toast(`Ítem ${x.activo ? 'reactivado' : 'desactivado'}.`);
      }
      render(); break;
    }
    case 'matriz': { const [aid, sid] = v.split('|'); const l = S.matriz[aid]; const k = l.indexOf(sid); k >= 0 ? l.splice(k, 1) : l.push(sid); render(); break; }
    case 'matriz-descartar': S.matriz = null; limpiarForm(); render(); break;
    case 'matriz-guardar':
      if (falla()) { S.errorForm = true; render(); break; }
      CAT.forEach(a => { a.sedes = [...S.matriz[a.id]]; }); S.matriz = null; limpiarForm(); toast('Áreas por sede guardadas. Aplican desde el próximo checklist de cada sede.'); render(); break;
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'f-dia') {
    if (!el.value) return;
    let d = deIso(el.value); if (d > HOY) d = new Date(HOY); if (d < PRIMER_DIA) d = new Date(PRIMER_DIA);
    S.dia = iso(d); render();
  } else if (el.dataset.actChange === 'det-sede') { S.det.sid = el.value; S.abiertas = null; render(); }
  else if (el.dataset.actChange === 'tipo') { S.borrador = leerItem(); render(); }
});
document.addEventListener('keydown', e => {
  if (S.foto !== null) {
    if (e.key === 'Escape') { S.foto = null; overlays(); }
    if (e.key === 'ArrowLeft' && S.foto > 0) { S.foto--; overlays(); }
    if (e.key === 'ArrowRight' && S.foto < S.fotos.length - 1) { S.foto++; overlays(); }
  } else if (e.key === 'Escape') {
    if (S.confirm) S.confirm = null; else if (S.areaForm) { S.areaForm = null; limpiarForm(); } else if (S.sheet) { S.sheet = null; limpiarForm(); }
    render();
  }
});
const tip = document.getElementById('tip');
document.addEventListener('mouseover', e => {
  const el = e.target.closest('[data-tip]');
  if (!el) { tip.classList.add('hidden'); return; }
  tip.innerHTML = el.dataset.tip; tip.classList.remove('hidden');
  const r = el.getBoundingClientRect();
  tip.style.left = Math.min(window.innerWidth - 270, Math.max(8, r.left + r.width / 2 - 100)) + 'px';
  tip.style.top = (r.bottom + 8) + 'px';
});
function ajustarAside() { const h = document.querySelector('.mk-bar').offsetHeight; const a = document.getElementById('aside'); a.style.top = h + 'px'; a.style.height = `calc(100vh - ${h}px)`; }
window.addEventListener('resize', ajustarAside);
render(); ajustarAside();
</script>
