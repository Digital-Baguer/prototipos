ransition focus:border-[#2258B5] focus:ring-2 focus:ring-[#2258B5]/20"><button type="button" onclick="togglePassword(this)" aria-label="Mostrar contraseña" class="absolute right-0 top-0 flex h-12 w-12 items-center justify-center rounded-lg focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#2258B5]"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="h-5 w-5" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div><p id="error" role="alert" class="hidden rounded-lg border border-red-400/40 bg-red-500/10 p-3 text-sm text-red-600">El usuario o la contraseña no son correctos. Inténtalo de nuevo.</p><button id="submit" class="flex h-12 w-full items-center justify-center gap-3 rounded-lg bg-[#2258B5] text-base font-semibold text-white transition hover:bg-[#194895] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#2258B5] disabled:opacity-60">Iniciar sesión <span aria-hidden="true">→</span></button><p id="demo" role="status" class="text-xs leading-relaxed opacity-60">Vista previa de diseño. No valida credenciales.</p></form></div></div><footer class="relative px-7 py-6 text-xs text-[#9db4ce] sm:px-12">Quinta del Mar · Sistema de reservas</footer></section></template><script>
function choose(v){document.querySelector('#screen').innerHTML=document.querySelector('#'+v).innerHTML;document.querySelectorAll('[data-choice]').forEach(b=>{b.style.background=b.dataset.choice===v?'#2258B5':'transparent';b.setAttribute('aria-pressed',b.dataset.choice===v)});history.replaceState(null,'','#'+v)}
function togglePassword(b){const p=document.querySelector('#password');p.type=p.type==='password'?'text':'password';b.setAttribute('aria-label',p.type==='password'?'Mostrar contraseña':'Ocultar contraseña')}
function submitDemo(e){e.preventDefault();const b=document.querySelector('#submit');b.disabled=true;b.textContent='Ingresando…';setTimeout(()=>{b.disabled=false;b.innerHTML='Iniciar sesión <span aria-hidden="true">→</span>';document.querySelector('#error').classList.remove('hidden')},900)}

choose(location.hash==='#b'?'b':'a');
</script></body></html>
