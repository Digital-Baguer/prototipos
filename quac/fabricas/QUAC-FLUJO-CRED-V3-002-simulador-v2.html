<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador v2 — Fábricas de Crédito QUAC</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
 :root{--violet:#7C3AED}
 body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
 .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
 .spinner{width:22px;height:22px;border:3px solid #E9D5FF;border-top-color:#7C3AED;border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
 .spinner-lg{width:42px;height:42px;border-width:4px}
 @keyframes spin{to{transform:rotate(360deg)}}
 .otp{width:42px;height:52px;text-align:center;border:1.5px solid #CBD5E1;border-radius:10px;font-size:22px;font-family:ui-monospace,monospace}
 .otp:focus{outline:2px solid #7C3AED;border-color:#7C3AED}
 .esp{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;font-family:ui-monospace,monospace}
 .esp .d{width:6px;height:6px;border-radius:50%;background:currentColor}
 .esp-g{background:#DCFCE7;color:#15803D}.esp-a{background:#FEF3C7;color:#B45309}.esp-r{background:#FEE2E2;color:#B91C1C}.esp-b{background:#DBEAFE;color:#1D4ED8}
 .tcard{transition:box-shadow .15s}
 .tcard.click:hover{box-shadow:0 4px 16px rgba(124,58,237,.14);cursor:pointer}
 .drawer{transition:transform .25s ease}
 dialog::backdrop{background:rgba(15,15,35,.45)}
 input,select{transition:border-color .12s,box-shadow .12s}
 input:focus,select:focus{outline:none;border-color:#7C3AED;box-shadow:0 0 0 3px rgba(124,58,237,.14)}
 .err-input{border-color:#DC2626!important;box-shadow:0 0 0 3px rgba(220,38,38,.10)!important}
</style>
</head>
<body class="bg-[#EEF0FA] text-slate-800 text-[13.5px]">

<div class="flex min-h-screen">
 <!-- ══════════ SHELL · SIDEBAR ══════════ -->
 <aside class="w-60 bg-white border-r border-slate-200 shrink-0 hidden lg:block">
  <div class="px-5 py-5 text-[22px] font-extrabold text-indigo-950">Quac</div>
  <nav class="px-3 pb-6 text-[13px]" id="sidenav"></nav>
 </aside>

 <!-- ══════════ MAIN ══════════ -->
 <main class="flex-1 min-w-0">
  <div class="bg-white/70 backdrop-blur border-b border-slate-200 px-6 py-3 flex items-center gap-2 sticky top-0 z-20">
   <h1 class="text-[17px] font-bold text-indigo-950" id="titlebar">Mesa de estudios</h1>
   <div class="flex-1"></div>
   <div id="tabsbar" class="flex items-center gap-1.5 overflow-x-auto"></div>
  </div>
  <div id="content" class="p-6"></div>
 </main>
</div>

<!-- Drawer de sucesos -->
<div id="drawer" class="drawer fixed top-0 right-0 h-full w-[380px] bg-white shadow-2xl z-40 translate-x-full flex flex-col">
 <div class="px-5 py-4 border-b border-slate-200 flex items-center">
  <h3 class="font-bold text-[15px]">Sucesos</h3><div class="flex-1"></div>
  <button class="text-slate-400 hover:text-slate-700 text-lg" onclick="toggleDrawer(false)">✕</button>
 </div>
 <div id="drawer-body" class="flex-1 overflow-y-auto p-5"></div>
</div>

<!-- Modal -->
<div id="modal-bg" class="fixed inset-0 bg-[rgba(15,15,35,.45)] z-50 hidden items-center justify-center p-4">
 <div id="modal" class="bg-white rounded-2xl shadow-2xl w-[600px] max-w-full max-h-[88vh] overflow-y-auto p-7"></div>
</div>

<div id="toasts" class="fixed bottom-5 right-5 z-[60] flex flex-col gap-2"></div>
<input type="file" id="file-pick" class="hidden" accept="image/*">

 cupo_activo:{tono:'ok',titulo:'Cupo ya activo',msg:'El cliente ya tiene cupo QUAC disponible de '+CUPO_PREVIO+'. Puede comprar en caja sin solicitar de nuevo.'},

const BADGE={

 PAUSADO:['Pausado','bg-slate-200 text-slate-600'],

 {id:'S-099',nombre:'María Fernanda Gil',doc:'52.114.998',estado:'RECHAZADO',fase:'Estudio',paso:'Evaluación de riesgo',asesor:'A-1015',cupo:'—',min:0,ult:'ayer 16:05',interv:false}

const EST={};

/* ════════════════ HELPERS ════════════════ */
const $=id=>document.getElementById(id);
function badge(k){const b=BADGE[k]||['?','bg-slate-100'];return '<span class="px-2.5 py-0.5 rounded-full text-[11.5px] font-semibold '+b[1]+'">'+b[0]+'</span>'}
function esp(min,label){if(min<=0)return '<span class="mono text-slate-400">—</span>';const c=min<5?'esp-g':min<15?'esp-a':'esp-r';return '<span class="esp '+c+'"><span class="d"></span>'+min+' min'+(label?' '+label:'')+'</span>'}
function mins(t0){return Math.max(0,Math.floor((Date.now()-t0)/60000))}
function hora(){const d=new Date();return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')}
function toast(t){const c=$('toasts');const d=document.createElement('div');d.className='bg-indigo-950 text-white text-[12.5px] px-4 py-2.5 rounded-xl shadow-lg';d.textContent=t;c.appendChild(d);setTimeout(()=>d.remove(),4000)}
function modal(html,w){const m=$('modal');m.className='bg-white rounded-2xl shadow-2xl '+(w||'w-[600px]')+' max-w-full max-h-[88vh] overflow-y-auto p-7';m.innerHTML=html;$('modal-bg').classList.remove('hidden');$('modal-bg').classList.add('flex')}
function closeModal(){$('modal-bg').classList.add('hidden');$('modal-bg').classList.remove('flex')}
function toggleDrawer(open){S.drawerOpen=open;$('drawer').style.transform=open?'translateX(0)':'translateX(100%)';if(open)renderDrawer()}
function log(e,tono,txt){e.sucesos.unshift({t:hora(),tono,txt});if(S.drawerOpen)renderDrawer()}
function fillOtp(id,code){const b=$(id);if(!b)return;[...b.querySelectorAll('input')].forEach((el,i)=>el.value=code[i]||'')}
function invalid(id,msg){const el=$(id);if(!el)return;el.classList.add('err-input');let m=el.parentElement.querySelector('.err-msg');
 if(!m){m=document.createElement('p');m.className='err-msg text-red-600 text-[11.5px] mt-1.5 font-semibold';el.parentElement.appendChild(m)}
 m.textContent=msg;el.focus();
 el.addEventListener('input',()=>{el.classList.remove('err-input');const x=el.parentElement.querySelector('.err-msg');if(x)x.remove()},{once:true})}
function otpRow(id,accion){return '<div id="'+id+'" class="flex gap-2 justify-center my-4">'+[0,1,2,3,4,5].map(()=>'<input class="otp" maxlength="1"'+(accion?' onkeydown="if(event.key===\'Enter\'){'+accion+'}"':'')+'>').join('')+'</div>'}
const btnP='class="bg-violet-600 hover:bg-violet-700 text-white font-semibold px-4 py-2 rounded-lg text-[13px]"';
const btnO='class="border border-slate-300 hover:bg-slate-50 font-semibold px-4 py-2 rounded-lg text-[13px]"';
const btnG='class="text-slate-500 hover:text-slate-800 font-semibold px-3 py-2 text-[13px]"';
function resBox(tono,titulo,msg){const m={ok:['bg-green-50 border-green-200 text-green-800','✓'],err:['bg-red-50 border-red-200 text-red-800','✕'],warn:['bg-amber-50 border-amber-200 text-amber-800','!'],info:['bg-blue-50 border-blue-200 text-blue-800','ⓘ'],tok:['bg-violet-50 border-violet-200 text-violet-800','✦']}[tono];

function field(label,val,id,type,extra){return '<div><label class="block text-[12px] font-semibold text-slate-600 mb-1.5">'+label+'</label><input id="'+(id||'')+'" type="'+(type||'text')+'" value="'+(val||'')+'" '+(extra||'')+' class="w-full h-[42px] border border-slate-300 rounded-lg px-3.5 text-[13.5px] bg-white"></div>'}

function onDepto(sel,cid){const c=$(cid);if(c)c.innerHTML=(DEPTOS[sel.value]||['—']).map(x=>'<option>'+x+'</option>').join('')}
function fieldDate(label,val,id){

 '<input type="date" id="'+id+'-pk" value="'+(val||'')+'" class="absolute inset-0 w-full h-full opacity-0 pointer-events-none" tabindex="-1" onchange="$(\''+id+'\').value=this.value">'+
 '<button type="button" title="Abrir calendario" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-violet-600" onclick="(function(p,t){p.value=t.value||\'\';try{p.showPicker()}catch(err){p.click()}})($(\''+id+'-pk\'),$(\''+id+'\'))">'+I('calendar','w-4 h-4')+'</button></div></div>';
}

/* ════════════════ SIDEBAR ════════════════ */

  sec('DIAGNÓSTICO')+['Bot Ubica','Validación identidad asesor','Diagnósticos OTP'].map(t=>item(t)).join('');
}

/* ════════════════ TABS ════════════════ */
function renderTabs(){
 const tabs=S.tabs.map(id=>{const e=EST[id];const on=S.view==='est'&&S.active===id;
  return '<button class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-[12px] font-semibold whitespace-nowrap '+(on?'bg-violet-600 text-white':'bg-slate-100 text-slate-600 hover:bg-slate-200')+'" onclick="showEst(\''+id+'\')">'+id+' · '+(e.nombre?e.nombre.split(' ')[0]:'Sin datos')+'<span class="opacity-60 hover:opacity-100" onclick="event.stopPropagation();cerrarTab(\''+id+'\')">✕</span></button>'}).join('');
 $('tabsbar').innerHTML=tabs;
}
function showMesa(){S.view='mesa';S.active=null;render()}
function showEst(id){S.view='est';S.active=id;render()}
function cerrarTab(id){S.tabs=S.tabs.filter(t=>t!==id);if(S.active===id){S.view='mesa';S.active=null}render()}

/* ════════════════ MESA ════════════════ */
function filas(){
 let rows=MESA.slice();
 const f=S.filtros;
 if(f.estado)rows=rows.filter(r=>r.estado===f.estado);
 if(f.interv)rows=rows.filter(r=>r.interv);
 if(f.busq){const q=f.busq.toLowerCase();rows=rows.filter(r=>(r.nombre+' '+r.doc+' '+r.id).toLowerCase().includes(q))}
 return rows;
}

 list:'<svg class="w-[17px] h-[17px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.01 6h.01M3.01 12h.01M3.01 18h.01"/></svg>',
 grid:'<svg class="w-[17px] h-[17px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1.5"/><rect x="14" y="3.5" width="6.5" height="6.5" rx="1.5"/><rect x="3.5" y="14" width="6.5" height="6.5" rx="1.5"/><rect x="14" y="14" width="6.5" height="6.5" rx="1.5"/></svg>'
};
function vBtn(v,ico,tit){const on=S.vista===v;return '<button title="'+tit+'" class="px-2.5 py-1.5 rounded-lg '+(on?'bg-violet-100 text-violet-700':'text-slate-400 hover:text-slate-600')+'" onclick="S.vista=\''+v+'\';render()">'+ico+'</button>'}
const P={
 camera:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>',

 card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',

 mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
 check:'<path d="M20 6 9 17l-5-5"/>',
 refresh:'<path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/>',

};
function I(n,cls){return '<svg class="'+(cls||'w-4 h-4')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+P[n]+'</svg>'}
function listaHTML(){
 const rows=filas();
 if(!rows.length)return '<div class="bg-white border border-slate-200 rounded-xl py-14 text-center text-slate-400 text-[13px]">Sin resultados para los filtros aplicados.</div>';
 if(S.vista==='tabla')return '<div class="bg-white border border-slate-200 rounded-xl overflow-hidden"><table class="w-full text-[12.5px]"><thead class="bg-slate-50 text-slate-500 text-[11px] uppercase tracking-wide"><tr>'+
  ['ID','Cliente','Estado','Fase / Paso','Espera','Asesor','Cupo preap.','Última actividad'].map(h=>'<th class="text-left font-bold px-4 py-3">'+h+'</th>').join('')+'</tr></thead><tbody>'+

 return '<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">'+rows.map(r=>
  '<div class="bg-white border border-slate-200 rounded-xl p-4 tcard click" onclick="retomar(\''+r.id+'\')">'+

 '<details class="mt-4 bg-slate-50 border border-slate-200 rounded-xl px-4 py-3"><summary class="text-[12px] font-bold text-slate-500 cursor-pointer">Documentos de prueba</summary>'+

 Object.entries({'1000000002':'Re-estudio','1000000003':'Cierre reciente','1000000010':'Cupo ya activo','1000000011':'No aplica por mora','1000000012':'Desbloqueo','1000000013':'Reactivación','1000000017':'Expirada','cualquier otro':'Cliente nuevo'}).map(([k,v])=>'<div>'+k+' → '+v+'</div>').join('')+'</div></details>'+
 '<div class="flex justify-end gap-2 mt-6"><button '+btnG+' onclick="closeModal()">Cancelar</button><button '+btnP+' onclick="altaConsultar()">Consultar</button></div>');

function altaConsultar(){
 const num=$('alta-num').value.trim(), tipo=$('alta-tipo').value, ase=$('alta-ase').value.trim();
 if(!num){invalid('alta-num','Este campo es obligatorio — digite el documento del cliente');return}
 modal('<div class="text-center py-10"><div class="spinner spinner-lg mx-auto"></div><h3 class="font-bold mt-4">Consultando…</h3><p class="text-slate-500 text-[12.5px] mt-1">Clasificando la atención del documento '+tipo+' '+num+'</p></div>');
 setTimeout(()=>{
  const res=SEMILLAS[num]||'cliente_nuevo';
  if(FINALES[res])return mFinal(res,tipo,num,ase);
  if(res==='desbloqueo')return abrirEstudio('desb',tipo,num,ase);
  if(res==='reactivacion')return abrirEstudio('react',tipo,num,ase);
  if(res==='re_estudio')return abrirEstudio('re',tipo,num,ase);
  abrirEstudio('nuevo',tipo,num,ase);
 },1100);
}
function mFinal(res,tipo,num,ase){

 resBox(f.tono,f.titulo,f.msg)+
 '<div class="flex justify-end gap-2 mt-6">'+extra+'<button '+(extra?btnG:btnP)+' onclick="closeModal()">Finalizar consulta</button></div>');
}

function abrirEstudio(tipo,docTipo,docNum,ase){
 closeModal();
 const id='S-'+(S.seq++);
 const re=tipo==='re', mini=tipo==='desb'||tipo==='react';
 const e={id,tipo,docTipo:docTipo||'CC',docNum:docNum||'—',nombre:null,estado:'EN_PROCESO',gestion:'Asistida',
  asesor:ase?('A-'+ase.replace(/^A-?/,'')):'A-1956',asesorNombre:ase?(ASESORES[ase.replace(/^A-?/,'')]||'Asesor externo'):ASESORES['1956'],asesorOk:true,rostroOk:false,rostroPend:false,autogestion:false,
  caja:'Caja 01',t0:Date.now(),sol:null,cupoPre:null,direccion:null,
  contacto:{cel:CLIENTE.cel,mail:CLIENTE.correo,celOk:false,mailOk:false},
  re:{sms:false,ivr:false},envios:[],canalSel:'SMS',
  fotos:{f:false,r:false,ocr:false},
  ident:{gestos:false,live:false,frontal:null,reverso:null,fase:null},
  est:{fase:null,t0:null,llamada:false},
  t:mini?(tipo==='desb'?{riesgo:'pend',ident:'bloq'}:{tyc:'pend',ident:'bloq'})
        :{creacion:'pend',asesor:'pend',tyc:'bloq',riesgo:'bloq',dir:'bloq',ident:'bloq',cupo:'bloq'},
  pasoActual:mini?(tipo==='desb'?'riesgo':'tyc'):'creacion',
  fin:null,sucesos:[]};
 if(re){e.nombre=CLIENTE.nombre+' '+CLIENTE.apellido;e.datosPrevios=true}
 if(mini){e.nombre=tipo==='desb'?'Andrés Quintero':CLIENTE.nombre+' '+CLIENTE.apellido;e.cupoPrevio=CUPO_PREVIO;e.ident.frontal='vig';e.ident.reverso='vig'}
 EST[id]=e;S.tabs.push(id);
 log(e,'sys',tipo==='desb'?'Atención abierta — aplica desbloqueo express (C-02)':tipo==='react'?'Atención abierta — aplica reactivación (C-02)':re?'Atención abierta — re-estudio (C-02)':'Atención abierta — cliente nuevo (C-02)');
 if(ase)log(e,'sys','Código de asesor capturado en el alta — '+e.asesor);
 showEst(id);
}
function retomar(rowId){
 if(EST[rowId]){showEst(rowId);return}
 const r=MESA.find(x=>x.id===rowId);if(!r)return;
 const e={id:r.id,tipo:'retomar',ultBase:r.ult,docTipo:'CC',docNum:r.doc,nombre:r.nombre==='—'?null:r.nombre,estado:r.estado,gestion:r.estado==='AUTOGESTION'?'Autogestión':'Asistida',
  asesor:r.asesor,asesorNombre:ASESORES[r.asesor.replace(/^A-/,'')]||'Asesor externo',asesorOk:true,rostroOk:true,rostroPend:false,autogestion:r.estado==='AUTOGESTION',caja:'Caja 01',t0:Date.now()-r.min*60000,sol:'#10'+r.id.slice(2),cupoPre:r.cupo==='—'?null:r.cupo,direccion:null,
  contacto:{cel:CLIENTE.cel,mail:CLIENTE.correo,celOk:true,mailOk:true},re:{sms:false,ivr:false},envios:[],canalSel:'SMS',fotos:{f:true,r:true,ocr:true},
  ident:{gestos:false,live:false,frontal:'ok',reverso:'ok',fase:r.paso==='Validación de identidad'?'revision':null},
  est:{fase:null,t0:null,llamada:false},fin:null,sucesos:[{t:r.ult,tono:'sys',txt:'Solicitud retomada desde la Mesa'}]};
 const orden=['creacion','asesor','tyc','riesgo','dir','ident','cupo'];
 const pasoKey=Object.keys(FASES).find(k=>FASES[k][1]===r.paso)||'creacion';
 e.t={};orden.forEach(k=>{const i=orden.indexOf(k),j=orden.indexOf(pasoKey);e.t[k]=i<j?'ok':i===j?'pend':'bloq'});
 if(r.estado==='ESCALADO'){e.t.ident='proc';e.ident.fase='fabrica'}
 if(r.paso==='Evaluación de riesgo'&&r.estado==='EN_PROCESO'){e.t.riesgo='proc';e.est.fase='llamada';e.est.t0=Date.now()-r.min*60000;e.t.dir='pend';e.t.ident='pend'}
 e.pasoActual=pasoKey;
 EST[r.id]=e;S.tabs.push(r.id);showEst(r.id);
}

 if(k==='asesor'&&e.t[k]==='ok'&&e.rostroPend)return '<div class="mt-2 text-[11.5px] text-amber-600 font-semibold">Rostro pendiente</div>';

function tarjeta(e,k,num,nombre,wide){

 (st==='ok'?(function(){e.done=e.done||{};if(!e.done[k])e.done[k]=(e.ultBase||('hoy · '+hora()));return '<div class="mt-3.5 text-[12.5px] text-slate-400 mono">'+e.done[k]+'</div>'})():'')+
 (sub?'<div class="mt-2">'+sub+'</div>':'')+hint+accionTarjeta(e,k)+'</div>';

   :(mini||e.fin?'':'<button class="mt-3 w-full border border-slate-200 hover:border-violet-300 hover:text-violet-700 font-bold rounded-lg py-2 text-[12px] text-slate-500" onclick="mAutogestion(\''+e.id+'\')">Continuar en autogestión</button>')));
 const canEdit=e.nombre&&!mini&&!e.autogestion&&!e.fin&&e.t.creacion==='ok';
 const cliente=card('user','CLIENTE'+(canEdit?'<span class="flex-1"></span><button class="flex items-center gap-1 text-[11px] font-bold text-violet-600 hover:underline" onclick="mEditarCliente(\''+e.id+'\')">'+I('pencil','w-3 h-3')+'Editar</button>':''),
  kv('Documento','<span class="mono">'+e.docTipo+' '+e.docNum+'</span>')+
  kv('Nombre',e.nombre)+
  (e.nombre&&!mini?kv('Nacimiento','<span class="mono">'+CLIENTE.nac+' · '+CLIENTE.ciudadNac+'</span>')+kv('Expedición','<span class="mono">'+CLIENTE.expFecha+' · '+CLIENTE.ciudadExp+'</span>'):'')+
  kv('Celular',(e.nombre||mini)?'<span class="mono">'+e.contacto.cel+'</span>'+(e.contacto.celOk?' <span class="text-green-600">✓</span>':''):null)+
  kv('Correo',(e.nombre||mini)?'<span class="text-[11.5px]">'+e.contacto.mail+'</span>'+(e.contacto.mailOk?' <span class="text-green-600">✓</span>':''):null)+
  (mini?'':kv('Dirección',e.direccion?'<span class="text-[11.5px]">'+e.direccion+'</span> <button class="text-violet-600 align-middle" title="Editar dirección" onclick="mT5(\''+e.id+'\')">'+I('pencil','w-3 h-3 inline')+'</button>':null)));
 const credito=mini
  ?card('card','CRÉDITO',kv('Cupo previo','<span class="mono">'+e.cupoPrevio+'</span>')+kv('Estado',e.fin&&e.fin.tono==='ok'?'<span class="text-green-600 font-bold">Activo ✓</span>':'Bloqueado'))
  :card('card','CRÉDITO',

   kv('Validación de contacto',e.t.riesgo==='ok'?(e.est.llamada?'Confirmada por llamada ✓':'Datos consistentes ✓'):e.est.fase==='contacto'?'<span class="text-blue-600">Validando…</span>':e.est.fase==='llamada'?'<span class="text-amber-600">Esperando llamada</span>':null)+

 const sop=(ico,l,v)=>'<div class="flex items-center gap-2.5 py-[7px] border-b border-slate-100 last:border-0"><span class="w-7 h-7 rounded-lg bg-slate-100 text-slate-500 flex items-center justify-center shrink-0">'+I(ico,'w-3.5 h-3.5')+'</span><span class="flex-1 text-slate-500 text-[12px]">'+l+'</span><span class="text-[11.5px] font-bold '+(v?'text-green-600':'text-slate-300')+'">'+(v||'—')+'</span></div>';

  :sop('idcard','Doc. frontal',(e.fotos.f||hayDoc(e.ident.frontal))?(e.ident.frontal==='ok'?'validada':e.ident.fase==='revision'?'en revisión':'cargada'):e.ident.frontal==='rej'?'✗ re-captura':null)+
   sop('refresh','Doc. reverso',(e.fotos.r||hayDoc(e.ident.reverso))?(e.ident.reverso==='ok'?'validada':e.ident.fase==='revision'?'en revisión':'cargada'):e.ident.reverso==='rej'?'✗ re-captura':null)+

 return solicitud+cliente+credito+soportes;
}

/* ════════════════ RUTEO DE TARJETAS ════════════════ */
function abrirTarjeta(id,k){
 const e=EST[id];if(!e)return;
 if(e.autogestion&&e.t[k]!=='ok'){toast('El estudio está en autogestión — el cliente lo continúa desde su celular');return}
 if(k==='creacion')return mT1(id,0);
 if(k==='asesor')return mT2(id);
 if(k==='tyc')return e.tipo==='react'?mTycMini(id,0):mT3(id,0);
 if(k==='riesgo')return e.tipo==='desb'?mRiesgoMini(id):mT4(id);
 if(k==='dir')return mT5(id);
 if(k==='ident')return mT6(id);
 if(k==='cupo')return mT7(id,0);
}
function completar(e,k,paso){e.t[k]='ok';const orden=Object.keys(e.t);const sig=orden.find(x=>e.t[x]==='pend'||e.t[x]==='proc'||e.t[x]==='warn');if(sig)e.pasoActual=sig;render()}

/* ════════ T1 · Creación / Actualización (D-v2-12) ════════ */

 if(e.tipo!=='re'&&ph===0)return modal('<h2 class="text-[18px] font-bold text-indigo-950">'+tit+'</h2><p class="text-slate-500 text-[12.5px] mt-0.5 mb-5">¿Cómo quiere capturar los datos del cliente?</p>'+
  '<div class="grid grid-cols-2 gap-4">'+
  '<div class="border-2 border-slate-200 hover:border-violet-400 rounded-xl p-6 text-center cursor-pointer" onclick="mT1(\''+id+'\',1)"><div class="mx-auto w-10 h-10 flex items-center justify-center text-violet-600">'+I('camera','w-7 h-7')+'</div><h4 class="font-bold mt-2 text-indigo-950">Mediante OCR</h4><p class="text-[12px] text-slate-500 mt-1">Captura del documento y extracción automática</p></div>'+
  '<div class="border-2 border-slate-200 hover:border-violet-400 rounded-xl p-6 text-center cursor-pointer" onclick="mT1(\''+id+'\',3)"><div class="mx-auto w-10 h-10 flex items-center justify-center text-violet-600">'+I('keyboard','w-7 h-7')+'</div><h4 class="font-bold mt-2 text-indigo-950">Manual</h4><p class="text-[12px] text-slate-500 mt-1">Ingreso manual de los datos</p></div></div>'+
  '<div class="flex justify-end mt-5"><button '+btnG+' onclick="closeModal()">Cancelar</button></div>');
 if(ph===1)return modal('<h2 class="text-[18px] font-bold text-indigo-950">'+tit+' — Fotos del documento</h2><p class="text-slate-500 text-[12.5px] mt-0.5 mb-4">Cargue las dos caras del documento para procesar con OCR.</p>'+
  '<div class="grid grid-cols-2 gap-4">'+[['f','Cara frontal','Foto, datos personales y número'],['r','Cara posterior','Huella dactilar y código de barras']].map(c=>
  '<div class="border-2 border-dashed '+(e.fotos[c[0]]?'border-green-300 bg-green-50':'border-slate-300')+' rounded-xl p-5 text-center cursor-pointer" onclick="e=EST[\''+id+'\'];e.fotos.'+c[0]+'=true;mT1(\''+id+'\',1)"><div class="mx-auto w-9 h-9 flex items-center justify-center '+(e.fotos[c[0]]?'text-green-600':'text-slate-400')+'">'+(e.fotos[c[0]]?I('check','w-6 h-6'):I('idcard','w-6 h-6'))+'</div><h4 class="font-bold mt-1 text-[13px] text-indigo-950">'+c[1]+'</h4><p class="text-[11.5px] text-slate-500 mt-0.5">'+c[2]+'</p><div class="text-[11px] font-bold mt-1.5 '+(e.fotos[c[0]]?'text-green-600':'text-slate-400')+'">'+(e.fotos[c[0]]?'Cargada':'Pendiente')+'</div></div>').join('')+'</div>'+
  '<div class="flex justify-end gap-2 mt-5"><button '+btnG+' onclick="mT1(\''+id+'\',0)">← Volver</button><button '+btnP+' '+(e.fotos.f&&e.fotos.r?'':'disabled style="opacity:.4"')+' onclick="mT1(\''+id+'\',2)">Procesar con OCR ▶</button></div>');
 if(ph===2){e.fotos.ocr=true;log(e,'sys','OCR en proceso — extrayendo datos del documento');
  setTimeout(()=>{log(e,'sys','OCR completado — datos extraídos');mT1(id,3)},1700);
  return modal('<div class="text-center py-10"><div class="spinner spinner-lg mx-auto"></div><h3 class="font-bold mt-4">Procesando con OCR…</h3><p class="text-slate-500 text-[12px] mt-1">Leyendo nombres, fechas, lugar de nacimiento y de expedición · ubicando por código DANE</p></div>')}
 const edit=e.editando, ocr=e.fotos.ocr, pre=ocr||e.tipo==='re'||edit, preC=edit||e.tipo==='re';
 modal('<h2 class="text-[18px] font-bold text-indigo-950">'+(edit?'Editar datos del cliente':e.tipo==='re'?'Verificar y actualizar datos':tit)+'</h2>'+
 (edit&&e.sol?'<div class="mt-3">'+resBox('warn','La edición invalida la firma electrónica','Al guardar los cambios, el cliente deberá aceptar de nuevo los T&C y firmar con un token (la tarjeta 3 vuelve a quedar pendiente).')+'</div>':'')+
 (!edit&&ocr?'<div class="mt-3">'+resBox('info','Datos leídos del documento','El OCR leyó MEDELLÍN (nacimiento) y BUCARAMANGA (expedición) y los ubicó por código DANE. Verifique y ajuste antes de guardar.')+'</div>':'')+
 (!edit&&e.tipo==='re'?'<div class="mt-3">'+resBox('info','Cliente existente','Formulario prellenado con la historia. Verifique y actualice lo que haya cambiado.')+'</div>':'')+
 '<div class="grid grid-cols-2 gap-4 mt-5">'+field('Nombres',pre?CLIENTE.nombre:'','t1-nom')+field('Apellidos',pre?CLIENTE.apellido:'','t1-ape')+'</div>'+
 '<div class="text-[11px] font-bold text-violet-700 mt-6 mb-2 tracking-wide">LUGAR Y FECHA DE NACIMIENTO</div>'+
 '<div class="grid grid-cols-3 gap-4">'+fieldDate('Fecha',pre?CLIENTE.nac:'','t1-fnac')+selDepto('Departamento','t1-dnac','t1-cnac',pre?CLIENTE.deptoNac:'')+selCiudad('Ciudad','t1-cnac',pre?CLIENTE.deptoNac:'',pre?CLIENTE.ciudadNac:'')+'</div>'+
 '<div class="text-[11px] font-bold text-violet-700 mt-6 mb-2 tracking-wide">EXPEDICIÓN DEL DOCUMENTO</div>'+
 '<div class="grid grid-cols-3 gap-4">'+fieldDate('Fecha',pre?CLIENTE.expFecha:'','t1-fexp')+selDepto('Departamento','t1-dexp','t1-cexp',pre?CLIENTE.deptoExp:'')+selCiudad('Ciudad','t1-cexp',pre?CLIENTE.deptoExp:'',pre?CLIENTE.ciudadExp:'')+'</div>'+
 '<div class="text-[11px] font-bold text-violet-700 mt-6 mb-2 tracking-wide">DATOS DE CONTACTO</div>'+
 '<div class="grid grid-cols-2 gap-4">'+
 '<div><label class="block text-[12px] font-semibold text-slate-600 mb-1.5">Celular</label><input id="t1-cel" value="'+(preC?CLIENTE.cel:'')+'" placeholder="Celular del cliente" class="w-full h-[42px] border border-slate-300 rounded-lg px-3.5 text-[13.5px] bg-white" onkeydown="if(event.key===\'Enter\')this.blur()" oninput="EST[\''+id+'\'].contacto.celOk=false" onblur="if(this.value.trim()&&!EST[\''+id+'\'].contacto.celOk)valContacto(\''+id+'\',\'cel\')"><div class="mt-1.5" id="v-cel">'+vLinks(id,'cel',e.contacto.celOk)+'</div></div>'+
 '<div><label class="block text-[12px] font-semibold text-slate-600 mb-1.5">Correo electrónico</label><input id="t1-mail" value="'+(preC?CLIENTE.correo:'')+'" placeholder="correo@ejemplo.com" class="w-full h-[42px] border border-slate-300 rounded-lg px-3.5 text-[13.5px] bg-white" onkeydown="if(event.key===\'Enter\')this.blur()" oninput="EST[\''+id+'\'].contacto.mailOk=false" onblur="if(this.value.trim()&&!EST[\''+id+'\'].contacto.mailOk)valContacto(\''+id+'\',\'mail\')"><div class="mt-1.5" id="v-mail">'+vLinks(id,'mail',e.contacto.mailOk)+'</div></div></div>'+
 '<div class="flex items-center justify-end gap-2 mt-6">'+((e.contacto.celOk&&e.contacto.mailOk)?'':'<span id="t1-hint" class="text-[11.5px] text-slate-400 mr-auto">«Guardar» se habilita al validar la disponibilidad de celular y correo</span>')+'<button '+btnG+' onclick="closeModal()">Cancelar</button>'+
 '<button id="t1-save" '+btnP+' '+(e.contacto.celOk&&e.contacto.mailOk?'':'disabled style="opacity:.4"')+' onclick="guardarT1(\''+id+'\')">'+(edit?'Guardar cambios →':e.tipo==='re'?'Confirmar datos →':'Guardar cliente →')+'</button></div>','w-[780px]');
 setTimeout(()=>{const x=EST[id],i=$('t1-cel');if(x&&!x.contacto.celOk&&i&&i.value.trim())valContacto(id,'cel')},300);
 setTimeout(()=>{const x=EST[id],i=$('t1-mail');if(x&&!x.contacto.mailOk&&i&&i.value.trim())valContacto(id,'mail')},600);
}
function vLinks(id,cual,ok){
 if(ok)return '<span class="text-green-600 text-[12px] font-bold">✓ Disponible</span>';
 return '<span class="text-[11.5px] text-slate-400">Validación automática de disponibilidad</span>'+
 '<span class="text-slate-300 mx-1.5">·</span><button class="text-[11.5px] text-slate-400 hover:text-slate-600 underline decoration-dotted" onclick="valContacto(\''+id+'\',\''+cual+'\',true)">Simular no disponible</button>';
}
function valContacto(id,cual,forzar){
 const e=EST[id];const box=$('v-'+cual);const inp=$(cual==='cel'?'t1-cel':'t1-mail');
 box.innerHTML='<span class="text-[12px] text-blue-600 flex items-center gap-1.5"><span class="spinner" style="width:12px;height:12px;border-width:2px"></span>Validando disponibilidad…</span>';
 setTimeout(()=>{
  if(forzar){
   if(cual==='cel')e.contacto.celOk=false;else e.contacto.mailOk=false;
   if(inp)inp.classList.add('err-input');
   log(e,'err',(cual==='cel'?'Celular':'Correo')+' no disponible — asociado a otro documento con cupo activo o solicitud en curso');
   box.innerHTML='<div class="text-red-600 text-[12px] font-semibold">✗ No disponible — está asociado a otro documento con cupo activo o solicitud en curso.</div>'+
   '<div class="text-[11.5px] text-slate-500 mt-1">Solicite al cliente otro '+(cual==='cel'?'celular':'correo')+' y corríjalo en el campo — la disponibilidad se validará automáticamente.</div>';
   const b=$('t1-save');if(b){b.disabled=true;b.style.opacity=.4}
   return}
  if(inp)inp.classList.remove('err-input');
  if(cual==='cel')e.contacto.celOk=true;else e.contacto.mailOk=true;
  log(e,'ok',(cual==='cel'?'Celular':'Correo')+' validado — disponible, sin cupo activo ni solicitud en curso');
  box.innerHTML='<span class="text-green-600 text-[12px] font-bold">✓ Disponible</span>';
  if(e.contacto.celOk&&e.contacto.mailOk){const b=$('t1-save');if(b){b.disabled=false;b.style.opacity=1}const h=$('t1-hint');if(h)h.remove()}},900);
}
function guardarT1(id){
 const e=EST[id];e.nombre=($('t1-nom').value||CLIENTE.nombre)+' '+($('t1-ape').value||CLIENTE.apellido).split(' ')[0]+'.';
 if(e.editando){e.editando=false;
  if(e.sol){e.t.tyc='pend';log(e,'warn','Datos del cliente editados — la firma electrónica quedó invalidada; se requiere aceptar T&C y re-tokenizar');toast('Firma invalidada — se requiere re-tokenizar')}
  else{log(e,'sys','Datos del cliente editados');toast('Datos actualizados')}
  closeModal();render();return}
 log(e,'ok','Cliente '+(e.tipo==='re'?'actualizado':'creado')+' — contacto validado ✓');
 e.t.creacion='ok';if(e.t.tyc==='bloq')e.t.tyc='pend';e.pasoActual='asesor';
 closeModal();render();toast('Cliente '+(e.tipo==='re'?'actualizado':'creado'));
}

  :'<p class="text-[11.5px] text-slate-400 mt-2">El código puede cambiarse mientras no se valide el rostro; el nombre se consulta automáticamente. Códigos demo: 1956 · 2998 · 1015 · 5299 · 10010 (validación facial vigente).</p>')+'</div>'+
  (e.t.asesor==='ok'

 const fila=(lbl,st)=>'<div class="flex items-center gap-3 border border-slate-200 rounded-xl px-4 py-3"><span class="flex-1 font-semibold text-[13px]">'+lbl+'</span><span class="text-[11.5px] font-bold text-right '+st[1]+'">'+st[0]+'</span></div>';
 modal('<h2 class="text-[18px] font-bold text-indigo-950">Validación de identidad</h2>'+
 '<p class="text-slate-500 text-[12.5px] mt-0.5 mb-4">Proceso independiente: consulta su estado y solicita únicamente lo que falta.</p>'+
 '<div class="space-y-2.5">'+
 fila('Gestos de seguridad + prueba de vida',i.live?['✓ Superada','text-green-600']:['Pendiente','text-slate-400'])+
 fila('Documento frontal',est(i.frontal))+
 fila('Documento reverso',est(i.reverso))+'</div>'+
 '<div class="flex justify-between items-center mt-6"><button class="text-[12.5px] font-bold text-blue-600 hover:underline" onclick="identRemoto(\''+id+'\')">Enviar enlace al cliente</button>'+
 '<div class="flex gap-2"><button '+btnG+' onclick="closeModal()">Cancelar</button><button '+btnP+' onclick="mVida(\''+id+'\',\'ident\',0)">Iniciar validación →</button></div></div>');
}
function mT6PostLive(id){
 const e=EST[id];
 modal('<h2 class="text-[18px] font-bold text-indigo-950">Validación de identidad</h2>'+
 '<div class="mt-3">'+resBox('info','Validando documentos precargados','La prueba de vida fue superada. El proceso valida automáticamente el frontal y el reverso ya existentes — no se le solicitan al cliente.')+'</div>'+
 '<p class="text-[11px] font-bold text-slate-400 mt-4 mb-1.5 tracking-wide">SIMULAR RESULTADO</p>'+
 '<div class="flex gap-2 flex-wrap"><button '+btnP+' onclick="preIdentOk(\''+id+'\')">✓ Documentos validados</button><button '+btnO+' onclick="preIdentRech(\''+id+'\')">Frontal rechazado — recapturar</button></div>'+
 '<div class="flex justify-end mt-5"><button '+btnG+' onclick="closeModal()">Volver</button></div>');
}
function preIdentOk(id){const e=EST[id];e.ident.frontal='ok';e.ident.reverso='ok';
 log(e,'ok','Documentos precargados validados automáticamente — frontal y reverso');enviarIdent(id)}
function preIdentRech(id){const e=EST[id];e.ident.frontal='rej';e.ident.reverso='ok';
 log(e,'warn','Documento frontal rechazado — se solicita re-captura SOLO del frontal');mT6(id)}
function mT6Doc(id,cara){
 const e=EST[id];const rej=e.ident[cara]==='rej';
 modal('<h2 class="text-[18px] font-bold text-indigo-950">Validación de identidad — '+(cara==='frontal'?'Documento frontal':'Documento reverso')+'</h2>'+
 (rej?'<div class="mt-3">'+resBox('warn','Re-captura requerida','El documento '+cara+' anterior fue rechazado por la validación (legibilidad / OCR). Capture una nueva foto — solo se solicita esta cara.')+'</div>':'')+
 '<div class="border-2 border-dashed border-slate-300 rounded-xl p-6 text-center mt-4"><div class="mx-auto w-9 h-9 flex items-center justify-center text-slate-400">'+I('idcard','w-7 h-7')+'</div><h4 class="font-bold mt-1 text-[13px] text-indigo-950">'+(cara==='frontal'?'Cara frontal — foto, datos personales y número':'Cara posterior — huella dactilar y código de barras')+'</h4></div>'+
 '<div class="flex justify-end gap-2 mt-5"><button '+btnG+' onclick="closeModal()">Cancelar</button><button '+btnP+' onclick="cargaDoc(\''+id+'\',\''+cara+'\')">Capturar y validar →</button></div>');
}
function cargaDoc(id,cara){
 const e=EST[id];
 modal('<div class="text-center py-10"><div class="spinner spinner-lg mx-auto"></div><h3 class="font-bold mt-4">Validando '+(cara==='frontal'?'documento frontal':'documento reverso')+'…</h3><p class="text-slate-500 text-[12px] mt-1">Etiquetas · OCR'+(cara==='frontal'?' · comparación con la selfie':'')+'</p></div>');
 setTimeout(()=>{e.ident[cara]='ok';log(e,'ok','Documento '+cara+' validado ✓');mT6(id)},1400);
}
function identRemoto(id){const e=EST[id];e.ident.fase='remoto';e.t.ident='proc';log(e,'sys','Enlace de validación enviado por WhatsApp — ••• '+e.contacto.cel.slice(-4));closeModal();render()}
function enviarIdent(id){
 const e=EST[id];e.ident.fase='revision';e.t.ident='proc';
 log(e,'sys','Verificación de identidad enviada — selfie + frontal + reverso');
 closeModal();render();toast('Verificación enviada — en revisión');
}
function mT6Revision(id){
 modal('<h2 class="text-[18px] font-bold text-indigo-950">Validación de identidad</h2>'+
 '<div class="mt-3">'+resBox('info','En revisión','La verificación fue enviada y está siendo procesada. El resultado llega solo.')+'</div>'+
 '<p class="text-[11.5px] text-slate-400 mt-3 mb-1 font-bold">SIMULAR RESULTADO</p>'+
 '<div class="grid grid-cols-2 gap-2">'+
 '<button '+btnP+' onclick="identOk(\''+id+'\')">✓ Verificado</button>'+
 '<button '+btnO+' onclick="identDifiere(\''+id+'\')">Nombre difiere</button>'+
 '<button '+btnO+' onclick="identFraude(\''+id+'\')">Fraude / inconsistencia</button>'+
 '<button '+btnO+' onclick="identFabrica(\''+id+'\')">A fábrica de soporte</button></div>'+
 '<div class="flex justify-end mt-5"><button '+btnG+' onclick="closeModal()">Volver</button></div>');
}
function identOk(id){const e=EST[id];e.t.ident='ok';e.ident.fase=null;log(e,'ok','Soportes verificados por el sistema ✓');promoverCupo(e);cierreIdent(e)}
function identDifiere(id){const e=EST[id];e.t.ident='ok';e.ident.fase=null;
 log(e,'info','Verificación documental — el nombre difiere; datos actualizados con la información del documento');
 log(e,'ok','Viabilidad re-evaluada — continúa');promoverCupo(e);cierreIdent(e)}
function identFraude(id){const e=EST[id];e.estado='RECHAZADO';e.t.ident='warn';
 e.fin={tono:'err',titulo:'Fraude / inconsistencia',msg:'El tipo y número del documento no coinciden con la verificación. La solicitud finaliza.'};
 log(e,'err','Verificación documental — tipo y número no coinciden; la solicitud finaliza');closeModal();render()}
function identFabrica(id){const e=EST[id];e.ident.fase='fabrica';e.estado='ESCALADO';
 log(e,'warn','Validación de identidad — escalada a fábrica de soporte');closeModal();render()}
function mT6Fabrica(id){
 modal('<h2 class="text-[18px] font-bold text-indigo-950">Validación de identidad</h2>'+
 '<div class="mt-3">'+resBox('warn','En revisión manual — Fábrica de soporte','La verificación está siendo revisada por el equipo de soporte. La solicitud queda activa y retomará aquí.')+'</div>'+
 '<div class="flex gap-2 mt-4"><button '+btnP+' onclick="fabricaDesatasque(\''+id+'\')">Desatasque — aprobada</button><button '+btnO+' onclick="fabricaFreno(\''+id+'\')">Freno — devuelta con motivo</button></div>'+
 '<div class="flex justify-end mt-5"><button '+btnG+' onclick="closeModal()">Volver a la solicitud</button></div>');
}
function fabricaDesatasque(id){const e=EST[id];e.estado='EN_PROCESO';e.t.ident='ok';e.ident.fase=null;
 log(e,'ok','Fábrica de soporte — desatasque: verificación aprobada');toast('Desatasque — la solicitud continúa');promoverCupo(e);cierreIdent(e)}
function fabricaFreno(id){const e=EST[id];e.estado='DEVUELTO';e.t.ident='warn';e.ident.fase=null;e.ident.gestos=false;e.ident.live=false;e.ident.frontal=e.fotos.ocr?'pre':'req';e.ident.reverso=e.fotos.ocr?'pre':'req';
 log(e,'err','Fábrica de soporte — freno: DEVUELTO_POR_FABRICA · Documento ilegible, solicitar nueva captura');
 modal('<h2 class="text-[18px] font-bold text-indigo-950">Validación de identidad</h2><div class="mt-3">'+resBox('err','Devuelto por fábrica','Motivo: <b>Documento ilegible — solicitar nueva captura de fotos y prueba de vida.</b>')+'</div>'+
 '<div class="flex justify-end gap-2 mt-5"><button '+btnG+' onclick="closeModal();render()">Volver a la mesa</button><button '+btnP+' onclick="EST[\''+id+'\'].t.ident=\'pend\';EST[\''+id+'\'].estado=\'EN_PROCESO\';log(EST[\''+id+'\'],\'info\',\'Reintentando validación de identidad — nueva captura solicitada\');mT6(\''+id+'\')">Reintentar validación →</button></div>')}
function cierreIdent(e){
 if(e.tipo==='desb'||e.tipo==='react')return;
 closeModal();render();
}

/* ════════ T7 · Decisión de cupo (D-v2-18) ════════ */
function mT7(id,ph){
 const e=EST[id];
 if(e.t.riesgo!=='ok')return modal('<h2 class="text-[18px] font-bold text-indigo-950">Decisión de cupo</h2>'+
 '<div class="mt-3">'+resBox('info','Esperando definición UBICA','La evaluación de riesgo aún está corriendo. El envío del token se habilita cuando llegue el resultado.')+'</div>'+
 '<div class="flex justify-end mt-5"><button '+btnG+' onclick="closeModal()">Volver</button></div>');
 if(ph===0)return modal('<h2 class="text-[18px] font-bold text-indigo-950">Decisión de cupo</h2>'+
 '<p class="text-slate-500 text-[13px] mt-2">El contacto del cliente ya fue validado en el estudio. Para activar el cupo, se verifica el <b>correo</b> del cliente con un token — el celular ya fue verificado con la firma.</p>'+
 '<div class="mt-3">'+resBox('tok','Tokenización de correo electrónico','Se enviará un token de 6 dígitos a <b>'+e.contacto.mail+'</b>.')+'</div>'+
 '<div class="flex justify-end gap-2 mt-5"><button '+btnG+' onclick="closeModal()">Cancelar</button><button '+btnP+' onclick="log(EST[\''+id+'\'],\'sys\',\'Token enviado al correo — '+e.contacto.mail+'\');mT7(\''+id+'\',1)">Enviar token al correo ▶</button></div>');
 if(ph===1)return modal('<h2 class="text-[18px] font-bold text-indigo-950">Confirmación de correo y activación</h2>'+
 '<div class="mt-3">'+resBox('tok','Token enviado a '+e.contacto.mail,'Solicite el código al cliente y digítelo a continuación.')+'</div>'+otpRow('otp-mail','activar(\''+id+'\')')+
 '<div class="flex items-center justify-center gap-3 text-[12px]"><button class="font-bold text-slate-500 hover:text-slate-800" onclick="fillOtp(\'otp-mail\',\'835172\')">Llenar demo</button><span class="text-slate-300">·</span><button class="font-bold text-violet-600" onclick="log(EST[\''+id+'\'],\'sys\',\'Token de correo reenviado\');toast(\'Token reenviado al correo\')">Reenviar</button>'+
 '<span class="text-slate-300">·</span><button class="font-bold text-amber-600" onclick="ubicaCall(\''+id+'\')">Simular: UBICA no concluyente</button></div>'+
 '<div class="flex justify-end gap-2 mt-6"><button '+btnG+' onclick="closeModal()">Cancelar</button><button '+btnP+' onclick="activar(\''+id+'\')">Verificar token ▶</button></div>');
}
function ubicaCall(id){
 const e=EST[id];e.t.cupo='warn';e.estado='PAUSADO';marcarInterv(e,true);
 log(e,'warn','Definición UBICA no concluyente — pasa para gestión manual en el call');
 closeModal();render();toast('Pasa para gestión manual en el call');
}
function activar(id){
 const e=EST[id];
 modal('<div class="text-center py-10"><div class="spinner spinner-lg mx-auto"></div><h3 class="font-bold mt-4">Verificando token y activando el cupo…</h3></div>');
 setTimeout(()=>{
  e.t.cupo='ok';e.estado='APROBADO';
  log(e,'ok','Cupo activado — '+CLIENTE.cupo+' · notificado por SMS y correo');
  e.fin={tono:'ok',titulo:'Cupo activado',monto:CLIENTE.cupo,msg:'Disponible de inmediato para pagar en caja · notificación enviada por SMS y correo.'};
  const r=MESA.find(x=>x.id===e.id);if(r){r.estado='APROBADO';r.cupo=CLIENTE.cupo}
  closeModal();render();toast('Cupo activado — '+CLIENTE.cupo);
 },1600);
}

/* ════════ Mini-flujos (D-v2-20) ════════ */
function mRiesgoMini(id){
 const e=EST[id];
 if(e.t.riesgo==='proc')return modal('<h2 class="text-[18px] font-bold text-indigo-950">Evaluación de riesgo</h2>'+
  '<div class="text-center py-8"><div class="spinner spinner-lg mx-auto"></div><h3 class="font-bold mt-3">Validación simplificada en curso…</h3><p class="text-slate-500 text-[12px] mt-1">El sistema revisa antecedentes y reportes negativos.</p></div>'+
  '<div class="flex gap-2 justify-center"><button '+btnP+' onclick="miniSupera(\''+id+'\')">Simular: supera</button><button '+btnO+' onclick="miniNoSupera(\''+id+'\')">Simular: no supera</button></div>'+
  '<div class="flex justify-end mt-4"><button '+btnG+' onclick="closeModal()">Volver</button></div>');
 modal('<h2 class="text-[18px] font-bold text-indigo-950">Evaluación de riesgo</h2>'+
 '<p class="text-slate-500 text-[13px] mt-2">Validación simplificada: el sistema revisa antecedentes y reportes negativos para habilitar el desbloqueo sin nuevo estudio.</p>'+
 '<div class="flex justify-end gap-2 mt-6"><button '+btnG+' onclick="closeModal()">Cancelar</button><button '+btnP+' onclick="EST[\''+id+'\'].t.riesgo=\'proc\';log(EST[\''+id+'\'],\'sys\',\'Desbloqueo express iniciado — validación simplificada\');render();mRiesgoMini(\''+id+'\')">Iniciar desbloqueo ▶</button></div>');
}
function miniSupera(id){const e=EST[id];e.t.riesgo='ok';e.t.ident='pend';e.pasoActual='ident';
 log(e,'ok','Validación simplificada superada');closeModal();render()}
function miniNoSupera(id){const e=EST[id];e.estado='RECHAZADO';
 e.fin={tono:'err',titulo:'No viable antecedentes',msg:'La validación simplificada no fue superada. El proceso finaliza y el cupo permanece bloqueado.'};
 log(e,'err','Validación simplificada no superada — no viable antecedentes');closeModal();render()}
function mTycMini(id,ph){
 const e=EST[id];
 if(ph===0)return modal('<h2 class="text-[18px] font-bold text-indigo-950">Aceptación T&C</h2>'+
 '<p class="text-slate-500 text-[13px] mt-2">Para reactivar el cupo, el cliente re-acepta los Términos y Condiciones con un token a su celular registrado.</p>'+
 '<div class="mt-3">'+resBox('tok','Token enviado al celular ••• '+e.contacto.cel.slice(-4),'Se envió un código de 6 dígitos. Solicite el código y digítelo.')+'</div>'+otpRow('otp-react','confirmarTycMini(\''+id+'\')')+
 '<div class="flex items-center justify-center gap-3 text-[12px]"><button class="font-bold text-slate-500" onclick="fillOtp(\'otp-react\',\'619042\')">Llenar demo</button><span class="text-slate-300">·</span><button class="font-bold text-violet-600" onclick="log(EST[\''+id+'\'],\'sys\',\'Token reenviado\');toast(\'Token reenviado\')">Reenviar</button><span class="text-slate-300">·</span><button class="font-bold text-amber-600" onclick="tokenInvalido(\''+id+'\')">Simular: token inválido</button></div>'+
 '<div class="flex justify-end gap-2 mt-6"><button '+btnG+' onclick="closeModal()">Cancelar</button><button '+btnP+' onclick="confirmarTycMini(\''+id+'\')">Verificar token ▶</button></div>');
}
function confirmarTycMini(id){const e=EST[id];e.t.tyc='ok';e.t.ident='pend';e.pasoActual='ident';e.estado='EN_PROCESO';log(e,'ok','Token validado — T&C aceptados');closeModal();render()}
function tokenInvalido(id){const e=EST[id];e.estado='PEND_CLIENTE';e.t.tyc='warn';
 log(e,'warn','Token inválido — estado Pendiente cliente previo');closeModal();render();toast('Pendiente cliente previo — puede reintentarse')}
function finMini(id,ok){
 const e=EST[id];closeModal();
 if(ok){e.t.ident='ok';e.estado=e.tipo==='desb'?'DESBLOQUEADO':'REACTIVADO';
  e.fin={tono:'ok',titulo:e.tipo==='desb'?'Cupo desbloqueado':'Cupo reactivado',monto:e.cupoPrevio,msg:'Disponible de inmediato para pagar en caja · sin nuevo estudio de crédito.'};
  log(e,'ok','Prueba de vida superada — cupo '+(e.tipo==='desb'?'desbloqueado':'reactivado'))}
 else{e.estado='ESCALADO';
  e.fin={tono:'warn',titulo:(e.tipo==='desb'?'Desbloqueo':'Reactivación')+' en fábrica de soporte',msg:'La prueba de vida no fue concluyente. El equipo de soporte revisará el caso y el cliente será notificado con la resolución.'};
  log(e,'warn','Prueba de vida no concluyente — escalado a fábrica de soporte')}
 render();
}

/* ════════ Tarjeta de identidad en minis: liveness directo ════════ */
const _abrirTarjeta=abrirTarjeta;
abrirTarjeta=function(id,k){
 const e=EST[id];
 if((e.tipo==='desb'||e.tipo==='react')&&k==='ident'){
  if(e.t.ident!=='pend'){toast('Complete primero el paso anterior');return}
  return modal('<h2 class="text-[18px] font-bold text-indigo-950">Validación de identidad</h2>'+
  '<div class="mt-3">'+resBox('ok','Soportes vigentes','No se requieren nuevas fotos del documento: la prueba de vida se compara con la selfie almacenada.')+'</div>'+
  '<div class="flex justify-end gap-2 mt-5"><button '+btnG+' onclick="closeModal()">Cancelar</button><button '+btnP+' onclick="mVida(\''+id+'\',\'mini\',0)">Iniciar prueba de vida ▶</button></div>');
 }
 _abrirTarjeta(id,k);
};

/* ════════════════ RENDER RAÍZ ════════════════ */
function render(){
 renderTabs();
 if(S.view==='mesa')renderMesa();else if(S.active&&EST[S.active])renderEst(EST[S.active]);
 if(S.drawerOpen)renderDrawer();
}
renderSidebar();render();
setInterval(()=>{if(S.view==='est')render()},30000);
</script>
</body>
</html>
