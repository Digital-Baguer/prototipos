<script>
const $ = (s) => document.querySelector(s);

/* ═══════════ estado ═══════════ */
const S = {

{ const q=new URLSearchParams(location.hash.slice(1)); for (const [k,v] of q) if (k in S) S[k]=v; }

/* ═══════════ datos ═══════════ */

/* ═══════════ piezas comunes ═══════════ */
const ic = (d, c='#7633FF', s=24, w=2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I = {
  info:  ic('<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>','#7633FF',28),
  phone: (c='#fff') => ic('<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',c,18),

  down:  ic('<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>','#7633FF',44),
  alert: ic('<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>','#7633FF',28),

          <span style="letter-spacing:4px">••••••</span>${ic('<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>','#A19EB5',20)}</div>

      <p class="mt-5 text-center link-app" style="color:#fff;text-decoration:underline">No soy ${D.nombre}</p>

  </div>`;
const modalAlgoPaso = (fondo, titulo, texto, botonHtml, cerrar=true, extra='') => `<div class="relative h-full">${fondo}
  <div class="velo"><div class="w-full bg-white rounded-[20px] p-6">
    <div class="flex items-center gap-2">${I.info}<p class="h3-app flex-1">${titulo}</p></div>
    <p class="body-app mt-4">${texto}</p>${extra}
    <div class="mt-6">${botonHtml}</div>
    ${cerrar?`<p class="mt-3 text-center link-app">Cerrar</p>`:''}</div></div></div>`;
const homeFalso = () => `<div class="h-full bg-white px-5 pt-16">
  <p class="font-display text-[22px] font-bold text-txt">Hola, ${D.nombre}</p>
  <div class="mt-4 h-32 rounded-2xl" style="background:linear-gradient(135deg,#7633FF,#321185)"></div>

  enviando:'Botón con rueda mientras el api responde. No se pide nada más al cliente.',

/* ═══════════ 2 · Validar identidad (única) ═══════════ */
const PIDE = {
  cel_correo:        { t:'Celular y correo', val:['celular','correo'] },
  cel:               { t:'Solo celular', val:['celular'] },
  correo:            { t:'Solo correo', val:['correo'] },
  cel_correo_selfie: { t:'Celular, correo y selfie', val:['celular','correo','selfie'] },
};
const NOMBRE_PASO = { celular:'Celular', correo:'Correo', selfie:'Selfie' };
function recorrido() {
  const v = PIDE[S.pide].val.slice();
  if (S.flujo==='registro') v.push('saludo','nacimiento','clave');
  v.push('listo');
  return v;
}
const ETQ = { celular:'Código del celular', correo:'Código del correo', selfie:'Selfie', saludo:'Saludo (con nombre del teléfono)', nacimiento:'Cumpleaños', clave:'Clave', listo:'Listo' };
const etq = (k) => k==='listo' && S.flujo==='autorizar' ? 'Éxito (con nombre del teléfono)' : ETQ[k];

/* ── ilustraciones de «Validar identidad» (SVG en línea) ── */
const ST = 'fill="none" stroke="#7633FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"';
const gT = (x,y,sc,inner) => `<g transform="translate(${x} ${y}) scale(${sc})">${inner}</g>`;
const phoneS = (x,y,sc) => gT(x,y,sc,`<rect x="-18" y="-32" width="36" height="64" rx="7" fill="#fff" ${ST}/><path d="M-5 -24H5" ${ST}/>`);
const bubbleS = (x,y,sc) => gT(x,y,sc,`<rect x="-22" y="-14" width="44" height="26" rx="7" fill="#fff" ${ST}/><path d="M-10 12V21L0 12" fill="#fff" ${ST}/><circle cx="-9" cy="-1" r="2.4" fill="#7633FF"/><circle cx="0" cy="-1" r="2.4" fill="#7633FF"/><circle cx="9" cy="-1" r="2.4" fill="#7633FF"/>`);
const shieldS = (x,y,sc) => gT(x,y,sc,`<path d="M0 -14L13 -9V2C13 11 7 16 0 19C-7 16 -13 11 -13 2V-9Z" fill="#fff" ${ST}/><path d="M-5 3L-1 7L6 -2" ${ST}/>`);
const envS = (x,y,sc) => gT(x,y,sc,`<rect x="-26" y="-18" width="52" height="36" rx="6" fill="#fff" ${ST}/><path d="M-24 -14L0 5L24 -14" ${ST}/>`);
const badgeS = (x,y,sc) => gT(x,y,sc,`<circle r="11" fill="#7633FF"/><path d="M-5 0L-1.5 3.5L5 -3.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`);
const faceS = (x,y,sc) => gT(x,y,sc,`<ellipse rx="15" ry="19" fill="#fff" ${ST}/><circle cx="-6" cy="-4" r="1.9" fill="#7633FF"/><circle cx="6" cy="-4" r="1.9" fill="#7633FF"/><path d="M-6 7Q0 12 6 7" ${ST}/>`);
const frameS = (x,y,sc) => gT(x,y,sc,`<path d="M-34 -22V-34H-22M22 -34H34V-22M34 22V34H22M-22 34H-34V22" ${ST}/>`);
const spark = (pts) => pts.map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#C5C5FF"/>`).join('');
const ILU_SVG = {
  A: {
    celular: `<circle r="56" fill="#E9E8F1"/>${phoneS(-4,2,1)}${shieldS(-4,6,.8)}${bubbleS(24,-30,.62)}`,
    correo:  `<circle r="56" fill="#E9E8F1"/>${envS(0,2,1.15)}${badgeS(26,22,1.05)}`,
    selfie:  `<circle r="56" fill="#E9E8F1"/>${frameS(0,0,1.0)}${faceS(0,0,1)}`,
  },
};
function ILU(k, w=150, est) {
  est = est || 'A';
  if (est==='hoy') {
    const f = {celular:'img-4.png', correo:'img-1.png', selfie:'img-card-selfie.png'}[k];

  return `<svg width="${w}" height="${w}" viewBox="-60 -60 120 120" aria-hidden="true">${ILU_SVG[est][k]}</svg>`;
}

const linea = (on) => `<span class="w-6 h-px ${on?'bg-aldia':'bg-lila'}"></span>`;
function chips(val, actual) {
  if (val.length < 2) return '';

/* Hoy: tres ruedas (CupertinoPicker) día · mes · año, 1900 hasta hoy */
function ruedaHoy(d, m, a) {
  const col = (items, idx, flex) => `<div style="flex:${flex};height:250px;position:relative;overflow:hidden">
    ${items.map((t,i)=>{ const o=i-idx; return `<div style="position:absolute;left:0;right:0;top:${105+o*40}px;height:40px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#140F26;opacity:${Math.max(.15,1-Math.abs(o)*.3)}">${t}</div>`; }).join('')}</div>`;
  const dias = Array.from({length:31},(_,i)=>String(i+1));
  const anios = Array.from({length:127},(_,i)=>String(1900+i));
  const win = (arr, idx) => arr.slice(Math.max(0,idx-3), idx+4);
  const c = (arr, idx, fl) => col(win(arr,idx), Math.min(3,idx), fl);
  return `<div class="relative flex mt-4" style="height:250px">${c(dias,d-1,1)}${c(MESES,m-1,2)}${c(anios,a-1900,1)}
    <div style="position:absolute;left:0;right:0;top:105px;height:40px;background:rgba(0,0,0,.06);border-top:1px solid #000;border-bottom:1px solid #000;pointer-events:none"></div></div>`;
}

      ? 'Vamos a confirmar que eres tú para crear tu cuenta.'
      : 'Este teléfono aún no está vinculado a tu cuenta. Para protegerla, confirmamos que eres tú.') : '';
  if (paso==='celular') return { titulo:'Validar identidad', intro, texto:`Hemos enviado un código a tu celular <b>${D.cel}</b>. Una vez lo recibas, ingrésalo.` };
  return { titulo:'Validar identidad', intro, texto:`Ingresa el código que te hemos enviado a tu correo electrónico <b>${D.correo}</b>` };
}

function pantallaValidar() {
  const val = PIDE[S.pide].val, r = recorrido();
  if (!r.includes(S.paso)) S.paso = r[0];
  const p = S.paso, reg = S.flujo==='registro';
  const ch = chips(val, p), conV = val[0]===p;
  let nuevo;
  if (p==='celular' || p==='correo') {
    const t = textosApi(p, val);
    nuevo = pantallaOtp({ ...t, chipsHtml:ch, esCorreo:p==='correo', sub:S.sub, conEnlaceCorreo:p==='correo' && S.sub!=='cargando', ayuda:true, conVolver:conV }) + hojaCorreo();
  }
  else if (p==='selfie') nuevo = pantallaSelfie(S.sub, ch, {volver:conV});
  else if (p==='saludo') nuevo = pantallaSaludo({nm:S.nm});
  else if (p==='nacimiento' || p==='clave') nuevo = pantallaRegistro(p,{nueva:true});
  else nuevo = pantallaListo({nm:S.nm});

  /* «Hoy» */
  let hoy;
  if (p==='listo') hoy = telefono('Hoy','hoy',pantallaListo({conNombre:false}));
  else if (p==='saludo') hoy = telefono('Hoy','hoy',pantallaSaludo({conNombre:false, volver:true}));
  else if (p==='nacimiento' || p==='clave') hoy = telefono('Hoy','hoy',pantallaRegistro(p,{volver:true}));
  else if (S.pide==='cel_correo' && (p==='celular' || p==='correo')) {
    const esC = p==='celular';
    hoy = telefono('Hoy','hoy',pantallaOtp({
      titulo: esC ? 'Autorizar dispositivo' : 'Validar identidad',
      intro: esC ? (reg ? 'Hemos enviado un código a tu celular. Una vez lo recibas ingrésalo.' : 'Este teléfono aún no está vinculado a tu cuenta. Para protegerla, lo validamos con un código a tu celular y otro a tu correo.') : '',
      texto: esC ? `Hemos enviado un código a tu celular <b>${D.cel}</b>. Una vez lo recibas, ingrésalo.` : `Ingresa el código que te hemos enviado a tu correo electrónico <b>${D.correo}</b>`,
      chipsHtml: chips(['celular','correo'], p), esCorreo:!esC, sub:S.sub, conEnlaceCorreo:false, esHoy:true }));
  } else if (S.pide==='cel_correo_selfie' && p==='selfie' && !reg) {
    hoy = telefono('Hoy','hoy',pantallaSelfie(S.sub, chips(['celular','correo','selfie'],'selfie'), {esHoy:true}));
  } else {
    hoy = vacio(reg && p==='selfie' ? 'Hoy el registro no puede pedir selfie.' : `Hoy el api siempre pide celular y luego correo. «${PIDE[S.pide].t}» no existe todavía.`);
  }
  return [hoy, telefono('Con el ajuste','nuevo',nuevo)];
}

  if (p==='validar') {
    const r = recorrido();
    return grupo('Flujo','flujo',[['autorizar','Autorizar este teléfono'],['registro','Registro']])
    + grupo('Lo que pide el api','pide',Object.entries(PIDE).map(([k,v])=>[k,v.t]))
    + `<div class="flex flex-wrap items-center gap-1.5"><span class="font-bold text-slate-700 w-[150px] shrink-0">Recorrido</span>`
      + r.map((k,i)=>`<button data-go="paso=${k}" class="px-2.5 py-1 rounded-lg border text-[11.5px] font-bold ${S.paso===k?'on':'off'}">${i+1}. ${ETQ[k]}</button>`).join('<span class="text-slate-300">›</span>') + `</div>`
    + (['celular','correo','selfie'].includes(S.paso) ? grupo('Estado','sub',[['ingresar','Escribiendo'],['cargando','Validando'],['incorrecto','Código incorrecto'],['ok','Éxito']]) : '')
    + (S.paso==='nacimiento' ? grupo('Estado','nst',NST_OPC) : '')
    + (S.paso==='clave' ? grupo('Estado','cst',CST_OPC) : '')
    + (S.paso==='correo' ? grupo('Hoja «¿No reconoces este correo?»','hoja',[['cerrada','Cerrada'],['abierta','Abierta'],['coincide','Coincide'],['nocoincide','No coincide']]) : '')
    + ((S.paso==='saludo' || (S.paso==='listo' && S.flujo==='autorizar')) ? grupo('Hoja del nombre','nm',NM_OPC) + grupo('Teléfono','os',[['ios','iPhone'],['android','Android']]) : '');
  }
  if (p==='nombre') return grupo('Teléfono','os',[['ios','iPhone'],['android','Android']]) + `<p class="text-[11px] text-slate-500">Secuencia completa de la hoja, en los dos casos. Si el cliente deja el campo vacío y guarda, queda el nombre sugerido.</p>`;
  if (p==='error') return grupo('Aviso','er',[['espera','Ingreso bloqueado un rato'],['asesor','Selfie no superada']])
    + grupo('Número en la ayuda','sac',[['igual','El mismo de hoy'],['otro','Otro número (ejemplo)']]);
  return `<p class="text-slate-500">Esta pantalla no tiene variantes: es la que ya se ve hoy.</p>`;
}

function notaFecha() {
  const caja = (t, h) => `<div class="rounded-xl bg-white p-4 shadow-sm text-[13px] leading-relaxed"><p class="font-display font-bold text-txt text-[14px] mb-1">${t}</p>${h}</div>`;
  if (S.paso==='nacimiento') return caja('Cumpleaños', `<p>Queda como hoy: tres ruedas de deslizar (día, mes y año, de 1900 hasta hoy), una etiqueta con la edad («36 años») y «CONTINUAR» apagado si es menor de 18, con el aviso «${MSG_MENOR}».</p>
      <p class="mt-2 text-slate-500">Solo cambia que ya no tiene «Volver»: el celular ya quedó validado. No lleva la barra «Paso N de 8», que cambia según lo que pida el api.</p>`);
  if (S.paso==='clave') return caja('Reglas de la clave (AQ-008-1)', `<p>6 dígitos; al menos 4 números diferentes; sin serie seguida (123456 o 654321); y no puede ser la fecha de nacimiento (DDMMAA o AAMMDD). Por eso esta pantalla va después de la del cumpleaños y no se une a ella.</p>
      <p class="mt-2 text-slate-500">El campo se pone verde con chulo cuando la clave es válida; «CREAR CUENTA» solo se enciende con las dos claves iguales.</p>`);
  return '';
}
function notas() {
  const caja = (t, h) => `<div class="rounded-xl bg-white p-4 shadow-sm text-[13px] leading-relaxed"><p class="font-display font-bold text-txt text-[14px] mb-1">${t}</p>${h}</div>`;
  const p = S.scr;
  if (p==='recorrido') return caja('Cuándo sale el nombre del teléfono', `<p>El nombre no es un paso aparte. Se muestra una sola vez por teléfono, con el nombre sugerido, en una pantalla que ya existe: el saludo del registro o el aviso «Dispositivo autorizado». Ahí el cliente puede tocar «Renombrar» y guardarlo.</p>
      <p class="mt-2 text-slate-500">Desde el código del correo en adelante no hay «Volver»: el celular ya quedó validado.</p>`);
  if (p==='login') return caja('Qué cambia', `<p>Nada que el cliente vea: la pantalla es la misma. Si el teléfono no tiene guardado el tipo de documento, la app envía documento y clave sin tipo, y hoy eso termina en un aviso que no explica nada.</p>
      <p class="mt-2 text-slate-500">${notaLogin[S.lg]||'Pantalla de login de siempre, sin preguntas nuevas.'}</p>`)
    + caja('Qué decide el api', `<p>Si el teléfono no tiene guardado el tipo de documento, el api lo busca por el número y lo devuelve al entrar; la app lo guarda. El cliente no ve nada distinto.</p>`);
  if (p==='validar') return notaFecha() + caja('Qué decide el api', `<p>En cada respuesta el api dice cuál es el paso que sigue: código del celular, código del correo, selfie, datos o listo, en cualquier orden. La app solo obedece y dibuja ese paso.</p>
      <p class="mt-2">Así, un cliente de riesgo bajo valida solo con el celular y uno de riesgo alto con correo y selfie, sin otra versión de la app.</p>
      <p class="mt-2 text-slate-500">Título, ayuda de cada paso y el texto pequeño de ayuda (letra pequeña, opcional, bajo «reenviar») también los manda el api. Por eso el registro deja de decir «Autorizar dispositivo».</p>`)
    + caja('Lo que no cambia', `<p>El registro conserva «Crear cuenta»: saludo, cumpleaños y clave. El api conserva sus dos flujos y sus reglas de códigos (tope de reenvíos en el registro, espera tras fallos al autorizar).</p>
      <p class="mt-2 text-slate-500">Con el api de hoy la app se comporta como la 4.0.1: celular, luego correo.</p>`);
  if (p==='nombre') return caja('Qué cambia', `<p>No hay pantalla nueva: el saludo del registro y el aviso «Dispositivo autorizado» muestran el nombre del teléfono con el nombre sugerido y un enlace «Renombrar». Tocarlo abre una hoja inferior con el campo prellenado (máximo 30 caracteres), «Guardar» y «Cancelar». Al guardar, vuelve a la misma pantalla con el nombre nuevo y el aviso «Nombre guardado».</p>
      <p class="mt-2 text-slate-500">Nunca el modelo comercial («iPhone 17»): en iPhone «${NOMBRE_TEL.ios}», en Android «${NOMBRE_TEL.android}». Si lo deja vacío y guarda, queda el sugerido. Ya renombrado, debajo se ve pequeño el modelo y el sistema.</p>`)
    + caja('Qué decide el api', `<p>Si aparece el nombre del teléfono, el nombre sugerido y la etiqueta del enlace. «Renombrar» es el texto por defecto si el api no manda otra.</p>`)
    + caja('Qué muestra hoy', `<p>El saludo del registro: «¡Hola {primer nombre}!», «Bienvenido a Quac.», y la tarjeta con documento, nombres, apellidos y celular verificado. El aviso «Dispositivo autorizado»: fecha y hora y una sola fila DISPOSITIVO con modelo y sistema.</p>`);
  if (p==='paso') return caja('Qué cambia', `<p>Si el api pide un paso que esta versión no conoce, la app no falla: muestra el aviso con el título, el mensaje y el botón que manda el api, y el botón abre la tienda.</p>
      <p class="mt-2 text-slate-500">Hoy, en el registro la app termina en error y al autorizar toma cualquier paso desconocido como «selfie».</p>`)
    + caja('Qué decide el api', `<p>Título, mensaje, rótulo del botón y un texto de ayuda opcional, en letra pequeña. La app solo guarda un texto de respaldo por si el api no lo manda.</p>
      <p class="mt-2 text-slate-500">El aviso no tiene salida distinta de actualizar o volver atrás.</p>`);
  if (p==='error') return caja('Qué cambia', `<p>Cada aviso trae del api su título, su mensaje y los rótulos de los botones. El título, el mensaje y la ayuda en letra pequeña llegan del api: ya no hay un número fijo dentro de la app. La app solo pone «Cerrar».</p>
      <p class="mt-2 text-slate-500">Con «Otro número» se ve el efecto en el texto de ayuda: el cambio llega sin publicar una versión nueva.</p>`)
    + caja('Qué decide el api', `<p>Título, mensaje y un texto de ayuda opcional en letra pequeña. La app solo pone «Cerrar».</p>`);
  return caja('Para qué está aquí', `<p>Es la pantalla de actualización obligatoria que ya existe. Se muestra solo para recordar qué la activa: cuando esta versión esté aprobada en las dos tiendas, se sube la versión mínima y nadie sigue con la 4.0.1.</p>`)
    + caja('Qué decide el api', `<p>Ícono, título, mensaje y rótulo del botón, igual que hoy. El botón abre la ficha en la tienda; sin «Después» ni salida con el botón atrás.</p>`);
}

function render() {
  $('#nav').innerHTML = PANT.map(x=>`<button data-go="scr=${x.id}" class="nav-i ${S.scr===x.id?'on':'off'}">${x.n}<small>${x.s}</small></button>`).join('');
  const cur = PANT.find(x=>x.id===S.scr);
  $('#cabecera').innerHTML = `<p class="text-xs font-bold text-quac uppercase tracking-widest">${cur.t}</p>
    <h1 class="font-display font-bold text-lg leading-tight mt-1">${cur.n.replace(/^\d · /,'')}</h1>`;
  $('#controles').innerHTML = controles();
  $('#telefonos').innerHTML = cur.f().join('');
  $('#notas').innerHTML = notas();
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-go]'); if (!el) return;
  if (el.classList.contains('scrim') && e.target!==el) return;
  for (const par of el.dataset.go.split('&')) { const [k,v] = par.split('='); S[k]=v; }
  if (el.dataset.go.startsWith('scr=')) { S.hoja='cerrada'; S.nm = el.dataset.go.startsWith('scr=nombre') ? 'abierta' : 'cerrada'; }
  if (el.dataset.go.startsWith('paso=') || el.dataset.go.startsWith('pide=') || el.dataset.go.startsWith('flujo=')) { S.sub='ingresar'; S.hoja='cerrada'; S.nm='cerrada'; }
  if (el.dataset.go.startsWith('paso=')) { S.nst='listo'; S.cst='vacia'; }
  render();
});
render();
</script>
</body>
</html>
