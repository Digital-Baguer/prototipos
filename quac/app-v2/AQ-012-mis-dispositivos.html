<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AQ-012 · Mis dispositivos en el tab Más de la app QUAC v2</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script>
/* Colores de lib/core/theme/colors.dart (QuacColors) */
tailwind.config = { theme: { extend: {
  colors: { quac:'#7633FF', quacdark:'#321185', lavender:'#E9E8F1', lila:'#C5C5FF', fondo:'#F8F8F8',
            txt:'#140F26', muted:'#A19EB5', borde:'#A19EB5', aldia:'#06D6A0', ok:'#22C55E', err:'#FF6464', rosa:'#E5147E' },
  fontFamily: { display:['Poppins','sans-serif'], body:['"Nunito Sans"','sans-serif'] }
} } }
</script>
<style>
  body { font-family:'Nunito Sans', sans-serif; }
  .font-display { font-family:'Poppins', sans-serif; }
  .fade { animation: fade .22s ease-out; }
  @keyframes fade { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
  .sube { animation: sube .25s ease-out; }
  @keyframes sube { from{transform:translateY(40px);opacity:.4} to{transform:none;opacity:1} }
  .spin { animation: spin .9s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
  .pulso { animation: pulso 1.2s ease-in-out infinite; } @keyframes pulso { 50% { opacity:.45 } }
  .on { background:#7633FF; color:#fff; border-color:#7633FF; }
  .off { background:#fff; color:#475569; border-color:#e2e8f0; }
  .tab-on { background:#fff; color:#321185; box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .tab-off { color:#475569; }
  .tnum { font-variant-numeric: tabular-nums; }
  ::-webkit-scrollbar { width:0; }
  /* QuacButtonStyles.primary: alto 50, radio 10, Poppins 16 w700, letterSpacing 1.2 */
  .btn-quac { height:50px; border-radius:10px; width:100%; font-family:'Poppins',sans-serif; font-weight:700; font-size:16px; letter-spacing:1.2px; }
  .nuevo { outline:2px dashed #818cf8; outline-offset:4px; border-radius:16px; position:relative; }
  .nuevo::after { content:'nuevo en AQ-012'; position:absolute; top:-18px; right:0; font-size:10px; font-weight:700; color:#4f46e5; background:#eef2ff; padding:0 6px; border-radius:4px; }
</style>
</head>
<body class="bg-slate-100 min-h-screen">

<!-- ══ Barra de control del mockup (no es parte de la UI) ══ -->
<div class="sticky top-0 z-[80] border-b border-indigo-200 bg-indigo-50/95 px-4 py-2 backdrop-blur">
  <div class="mx-auto flex max-w-[1500px] flex-wrap items-center gap-x-5 gap-y-2 text-[12px]">
    <span class="font-bold text-indigo-900">AQ-012 · Mis dispositivos · mockup v1 para validación</span>
    <div class="flex gap-1 rounded-lg bg-indigo-100 p-1">
      <button data-t="A" class="nt px-3 py-1 rounded-md font-semibold">A · Tab Más</button>
      <button data-t="B" class="nt px-3 py-1 rounded-md font-semibold">B · Mis dispositivos</button>
      <button data-t="C" class="nt px-3 py-1 rounded-md font-semibold">C · Quitar un teléfono</button>
      <button data-t="D" class="nt px-3 py-1 rounded-md font-semibold">D · El teléfono quitado</button>
      <button data-t="E" class="nt px-3 py-1 rounded-md font-semibold">E · Correos</button>
    </div>
    <span class="text-indigo-700">Cliente de ejemplo: <b>Ana María Rojas</b> · CC 52.814.307 · abre la app desde su <b>iPhone</b></span>
  </div>
</div>

<div id="vistaApp" class="flex gap-6 p-6 max-w-[1400px] mx-auto items-start">

<!-- ── Panel lateral (cambia por pestaña) ── -->
<aside class="w-[440px] shrink-0 space-y-4 text-sm text-slate-600">
  <div>
    <p id="pTag" class="text-xs font-bold text-quac uppercase tracking-widest"></p>
    <h1 id="pTit" class="font-display font-bold text-lg leading-tight mt-1"></h1>
    <p id="pSub" class="text-xs text-slate-400 mt-1"></p>
  </div>
  <div id="pCtl" class="bg-white rounded-xl p-3 shadow-sm space-y-2 ring-2 ring-quac/30"></div>
  <div id="pReg" class="bg-white rounded-xl p-3 shadow-sm space-y-1 text-[11px] leading-relaxed"></div>
</aside>

<!-- ═════ TELÉFONO ═════ -->
<div id="telefono" class="relative bg-fondo rounded-[2.5rem] shadow-2xl ring-8 ring-slate-900 overflow-hidden flex flex-col" style="width:390px;height:844px;">
  <div id="statusbar" class="shrink-0 h-11 px-7 flex items-center justify-between text-[13px] font-semibold text-txt">
    <span class="tnum">9:41</span>
    <span class="flex items-center gap-1.5">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
      <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x=".5" y=".5" width="21" height="10" rx="3" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="16" height="7" rx="1.5" fill="currentColor"/><rect x="22.5" y="3.5" width="1.5" height="4" rx=".75" fill="currentColor" opacity=".4"/></svg>
    </span>
  </div>
  <div id="appHeader" class="shrink-0"></div>
  <div id="scroll" class="flex-1 overflow-y-auto"></div>
  <div id="appNav" class="shrink-0"></div>
  <div id="hoja" class="hidden"></div>
  <div id="capa" class="hidden"></div>
</div>

<!-- ═════ CORREOS (pestaña E) ═════ -->
<div id="correos" class="hidden flex-1 space-y-5"></div>
</div>

<script>
/* ═════════ Íconos (SVG inline, trazos lucide) ═════════ */
const I = {
  cupo:'<path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
  campana:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  ajustes:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
  candado:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  huella:'<path d="M2 12a10 10 0 0 1 18-6"/><path d="M5 12a7 7 0 0 1 12-5"/><path d="M8 12a4 4 0 0 1 8 0v2"/><path d="M12 12v6"/><path d="M15 15v3a2 2 0 0 1-4 0"/><path d="M19 12v3a7 7 0 0 1-2 5"/>',
  movil:'<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/>',
  chevron:'<path d="m9 18 6-6-6-6"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  error:'<circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/>',
  reloj:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  escudo:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  login:'<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5M15 12H3"/>',
  bolsa:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/>',
  ojo:'<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',
  correo:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/>',
};
const svg = (k, s=24, w=2, extra='') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${extra}>${I[k]}</svg>`;
const $ = s => document.querySelector(s);

/* ═════════ Datos de ejemplo: GET /v2/dispositivos de Ana María ═════════
   Solo los autorizados hoy (D4): verificado, < 90 días, formato válido.
   nombre = sistema + modelo técnico si existe (D6). */
const TODOS = [
  { id:'a1', actual:true,  nombre:'iPhone · iPhone15,2', autorizado:'3 sep 2026 · 10:42 a. m.', ingreso:'Hoy · 9:40 a. m.', compra:{ valor:'$350.000', tienda:'Stirpe Unicentro', fecha:'20 oct 2026' } },
  { id:'b2', actual:false, nombre:'Android · SM-A546E',  autorizado:'14 jul 2026 · 6:15 p. m.', ingreso:'12 oct 2026 · 8:03 p. m.', compra:{ valor:'$189.900', tienda:'Baguer Andino', fecha:'11 oct 2026' } },
  { id:'c3', actual:false, nombre:'Teléfono Android',    autorizado:'2 ago 2026 · 11:20 a. m.', ingreso:null, compra:null },
];

/* ═════════ Estado del mockup ═════════ */
let TAB='A', LISTA='varios', QUITAR='ok', PASO='clave', CLAVE='', INTENTOS=5, QUITADOS=[], VARIANTE_D='B', aviso='';

/* ═════════ Chrome del shell ═════════ */
function headerMas(){ return `
  <div class="bg-white px-5 pt-2 pb-3"><div class="flex items-center">
    <span class="font-display font-extrabold text-quac text-[28px] leading-[35px] tracking-tight">quac</span>
    <span class="flex-1"></span>
    <div class="relative w-10 h-10 flex items-center justify-center text-quacdark">${svg('campana',25,2)}
      <span class="absolute top-0.5 right-0.5 min-w-[16px] h-4 px-1 rounded-full bg-rosa text-white text-[9px] font-extrabold flex items-center justify-center tnum">2</span></div>
    <div class="w-10 h-10 flex items-center justify-center text-quacdark">${svg('info',25,2)}</div>
  </div></div>`; }
function navMas(){
  const t = (label, path, act) => `<div class="flex-1 flex flex-col items-center gap-0.5 pt-2 ${act?'text-quac font-bold':'text-black/45'}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${act?2.4:2}" stroke-linecap="round" stroke-linejoin="round">${path}</svg><span class="text-[11px]">${label}</span></div>`;
  return `<div class="bg-white shadow-[0_-2px_8px_rgba(0,0,0,.08)] flex pb-6">
    ${t('Inicio','<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>')}
    ${t('Movimientos','<path d="M7 3v18M3 7l4-4 4 4M17 21V3M21 17l-4 4-4-4"/>')}
    ${t('Pagar','<rect width="20" height="14" x="2" y="5" rx="2"/><path d="M2 10h20"/>')}
    ${t('Quac+','<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>')}
    ${t('Más','<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>', true)}
  </div>`; }
const sinShell = () => '<div class="h-6 flex items-end justify-center pb-1.5"><span class="w-32 h-1 rounded-full bg-txt/80"></span></div>';

/* ═════════ A · SCR-058 tab Más (MenuSeccionCard + MenuItemTile) ═════════ */
const SECC = [
  { titulo:'TU CRÉDITO', items:[{e:'Aumentar cupo',i:'cupo'}] },
  { titulo:'NOTIFICACIONES', items:[{e:'Bandeja de notificaciones',i:'campana'},{e:'Avisos en tu celular',i:'ajustes'}] },
  { titulo:'SEGURIDAD', items:[{e:'Cambiar contraseña',i:'candado'},{e:'Activar o desactivar Face ID',i:'huella'},{e:'Mis dispositivos',i:'movil',nuevo:true}] },
];
function tile(i){
  return `<button onclick="${i.nuevo?"irTab('B')":"toast('Ya existe en la app')"}" class="w-full h-14 flex items-center px-4 text-left active:bg-lavender/60 ${i.nuevo?'bg-quac/[.04]':''}">
    <span class="w-6 h-6 text-quacdark shrink-0">${svg(i.i,24,1.8)}</span>
    <span class="flex-1 ml-4 text-[14px] font-bold text-txt">${i.e}</span>
    <span class="text-muted">${svg('chevron',18,2.5)}</span></button>`;
}
function pintarMas(){
  return `<div class="px-5 pt-5 pb-6 fade">
    <h2 class="font-display font-extrabold text-[28px] leading-[1.1] text-quacdark">Más</h2>
    ${SECC.map(s=>`<div class="pt-[22px]">
      <p class="pl-1 pb-2 text-[11px] font-extrabold text-muted tracking-[1.2px]">${s.titulo}</p>
      <div class="bg-white rounded-2xl overflow-hidden ${s.titulo==='SEGURIDAD'?'nuevo':''}">${s.items.map((i,k)=>(k?'<div class="ml-14 h-px bg-fondo"></div>':'')+tile(i)).join('')}</div>
    </div>`).join('')}
    <button onclick="toast('Abre la hoja «Cerrar sesión»')" class="mt-[26px] w-full h-[50px] rounded-[10px] border-2 border-quac text-quac font-bold text-[16px]">Cerrar sesión</button>
    <p class="mt-3 text-center text-[11px] text-muted">QUAC · Versión 2.4.0</p>
  </div>`;
}

/* ═════════ B · Pantalla «Mis dispositivos» ═════════ */
function cabecera(){ return `
  <button onclick="irTab('A')" class="flex items-center gap-2.5 px-1 py-2 text-quac text-[16px]"><svg width="10" height="16" viewBox="0 0 10 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2 2 8l6 6"/></svg>Volver</button>
  <p class="mt-4 text-[16px] text-muted">SEGURIDAD</p>
  <h2 class="mt-2 font-display font-extrabold text-[28px] leading-[1.1] text-quacdark">Mis dispositivos</h2>
  <p class="mt-3 text-[14px] text-txt leading-snug">Estos son los teléfonos que pueden entrar a tu cuenta QUAC. Si no reconoces alguno, quítalo.</p>`; }

const dato = (ico, etq, val) => `<div class="flex items-start gap-2 text-[12.5px] leading-snug"><span class="mt-[1px] text-muted shrink-0">${svg(ico,15,2)}</span><span class="text-muted w-[92px] shrink-0">${etq}</span><span class="text-txt font-semibold">${val}</span></div>`;
function tarjeta(d){
  return `<div class="bg-white rounded-2xl p-4 fade ${d.actual?'ring-2 ring-quac/40':''}">
    <div class="flex items-center gap-3">
      <span class="w-10 h-10 rounded-full ${d.actual?'bg-quac/10 text-quac':'bg-lavender text-quacdark'} flex items-center justify-center shrink-0">${svg('movil',20,2)}</span>
      <div class="flex-1 min-w-0">
        <p class="text-[15px] font-extrabold text-txt truncate">${d.nombre}</p>
        ${d.actual?'<span class="inline-flex mt-0.5 items-center rounded-full bg-quac/10 text-quac px-2 py-0.5 text-[10.5px] font-extrabold tracking-wide">ESTE TELÉFONO</span>':''}
      </div>
    </div>
    <div class="mt-3 space-y-1.5">
      ${dato('escudo','Autorizado', d.autorizado)}
      ${dato('login','Último ingreso', d.ingreso || '<span class="font-normal text-muted">Sin ingresos registrados</span>')}
      ${d.compra ? dato('bolsa','Última compra', `${d.compra.valor} · ${d.compra.tienda}<br><span class="font-normal text-muted">${d.compra.fecha}</span>`) : ''}
    </div>
    ${d.actual
      ? '<p class="mt-3 text-[11.5px] text-muted leading-snug">Para salir de este teléfono usa «Cerrar sesión» en el menú Más.</p>'
      : `<button onclick="abrirQuitar('${d.id}')" class="mt-3 w-full h-11 rounded-[10px] border-2 border-err text-err font-display font-bold text-[14px] tracking-[.6px]">Quitar este teléfono</button>`}
  </div>`;
}
function esqueleto(){ return [0,1].map(()=>`<div class="bg-white rounded-2xl p-4 pulso"><div class="flex items-center gap-3"><span class="w-10 h-10 rounded-full bg-lavender"></span><span class="h-4 w-40 rounded bg-lavender"></span></div><div class="mt-4 space-y-2"><div class="h-3 w-56 rounded bg-lavender"></div><div class="h-3 w-48 rounded bg-lavender"></div><div class="h-3 w-52 rounded bg-lavender"></div></div></div>`).join(''); }
function ayuda(){ return `<div class="bg-lavender/70 rounded-2xl p-4 flex gap-3">
    <span class="text-quacdark shrink-0">${svg('info',20,2)}</span>
    <div class="text-[12.5px] leading-snug text-txt"><p class="font-extrabold">¿No reconoces un teléfono?</p>
    <p class="mt-1">Quítalo y cambia tu contraseña. Así nadie más puede entrar desde ese teléfono.</p>
    <button onclick="toast('Abre «Cambiar contraseña» (SCR-052)')" class="mt-2 font-bold text-quac underline">Cambiar contraseña</button></div>
  </div>`; }
function visibles(){
  const base = LISTA==='solo' ? TODOS.filter(d=>d.actual) : TODOS;
  return base.filter(d=>!QUITADOS.includes(d.id));
}
function pintarLista(){
  let cuerpo;
  if (LISTA==='carga') cuerpo = esqueleto();
  else if (LISTA==='error') cuerpo = `<div class="bg-white rounded-2xl px-5 py-8 text-center fade">
      <div class="w-16 h-16 mx-auto rounded-full bg-err/10 text-err flex items-center justify-center">${svg('error',30,2.5)}</div>
      <p class="mt-4 font-display font-bold text-[19px] leading-tight text-quacdark">No pudimos cargar tus dispositivos</p>
      <p class="mt-2 text-[13px] leading-[1.5] text-txt">Revisa tu conexión e inténtalo de nuevo.</p>
      <div class="mt-6"><button onclick="LISTA='varios';render()" class="btn-quac bg-quac text-white">Reintentar</button></div></div>`;
  else {
    const v = visibles(), otros = v.filter(d=>!d.actual);
    /* La ayuda «¿No reconoces un teléfono?» solo sale si hay otros teléfonos que quitar */
    cuerpo = v.map(tarjeta).join('') + (otros.length===0
      ? `<p class="text-center text-[12.5px] text-muted px-6 leading-snug">Tu cuenta solo está autorizada en este teléfono.</p>`
      : ayuda());
  }
  return `<div class="p-5 fade">${cabecera()}<div class="mt-5 space-y-3">${cuerpo}</div></div>`;
}

/* ═════════ C · Hoja «Quitar este teléfono» (patrón CerrarSesionSheet) ═════════ */
let OBJ = null;
function abrirQuitar(id){ OBJ = TODOS.find(d=>d.id===id); PASO='clave'; CLAVE=''; if (TAB!=='C') { TAB='C'; render(); } pintarHoja(); }
function campoClave(error){ return `
  <p class="mt-5 text-[14px] font-bold text-txt">Tu contraseña</p>
  <div class="mt-2 relative">
    <span class="absolute -top-2.5 left-3 px-2 bg-white text-[12px] text-muted rounded-[3px]">Tu contraseña</span>
    <div class="h-[52px] rounded-[10px] border ${error?'border-err':'border-borde'} bg-white flex items-center px-4">
      <input id="inClave" inputmode="numeric" maxlength="6" value="${CLAVE}" ${PASO==='quitando'||PASO==='limite'?'disabled':''} oninput="CLAVE=this.value.replace(/\\D/g,'');this.value=CLAVE;refrescarBoton()" type="password" placeholder="6 números" class="flex-1 outline-none text-[16px] tracking-[6px] bg-transparent placeholder:tracking-normal placeholder:text-muted disabled:opacity-50">
      <span class="text-muted">${svg('ojo',22,1.8)}</span>
    </div>
    ${error?`<p class="mt-1.5 text-[12.5px] text-err leading-snug">${error}</p>`:''}
  </div>`; }
function pintarHoja(){
  const h = $('#hoja');
  if (!OBJ){ h.className='hidden'; h.innerHTML=''; return; }
  let cont;
  if (PASO==='exito'){
    cont = `<div class="text-center py-2 fade">
      <div class="w-16 h-16 mx-auto rounded-full bg-aldia/15 text-aldia flex items-center justify-center">${svg('check',30,2.5)}</div>
      <p class="mt-4 font-display font-bold text-[19px] text-quacdark">Quitamos ${OBJ.nombre}</p>
      <p class="mt-2 text-[13px] leading-[1.5] text-txt">Ya no puede entrar a tu cuenta. Te enviamos un correo a <b>an***@gmail.com</b> con el detalle.</p>
      <button onclick="cerrarHoja(true)" class="btn-quac bg-quac text-white mt-6">Listo</button></div>`;
  } else {
    const err = PASO==='incorrecta' ? `La contraseña no es correcta. Te quedan ${INTENTOS} intentos.`
              : PASO==='limite' ? 'Superaste los intentos. Podrás intentarlo de nuevo en 15 minutos.'
              : PASO==='falla' ? '' : '';
    cont = `
      <p class="font-display font-bold text-[20px] leading-tight text-txt">¿Quitar ${OBJ.nombre}?</p>
      <ul class="mt-3 space-y-1.5 text-[13.5px] text-txt leading-snug">
        <li class="flex gap-2"><span class="text-quac mt-[2px]">${svg('check',15,2.6)}</span>Se cierra la sesión en ese teléfono.</li>
        <li class="flex gap-2"><span class="text-quac mt-[2px]">${svg('check',15,2.6)}</span>Deja de recibir avisos de QUAC y se apaga su Face ID.</li>
        <li class="flex gap-2"><span class="text-quac mt-[2px]">${svg('check',15,2.6)}</span>Para volver a entrar desde ahí tendrá que autorizarse de nuevo con un código.</li>
      </ul>
      ${campoClave(err)}
      ${PASO==='falla'?`<p class="mt-3 text-[12.5px] text-err">No pudimos quitar el teléfono. Inténtalo de nuevo.</p>`:''}
      <div class="mt-5">
        ${PASO==='quitando'
          ? `<button disabled class="btn-quac bg-quac/40 text-white flex items-center justify-center gap-2"><span class="spin w-4 h-4 rounded-full border-2 border-white/40 border-t-white inline-block"></span><span style="font-size:14px;letter-spacing:0">Quitando…</span></button>`
          : `<button id="btnQuitar" onclick="quitar()" class="btn-quac text-white"></button>`}
        <button onclick="cerrarHoja(false)" ${PASO==='quitando'?'disabled':''} class="w-full h-11 mt-1 text-quac font-semibold text-[15px] disabled:opacity-40">Cancelar</button>
      </div>`;
  }
  h.className='absolute inset-0 z-30 flex flex-col justify-end';
  h.innerHTML = `<div class="absolute inset-0 bg-black/40" onclick="if(PASO!=='quitando')cerrarHoja(PASO==='exito')"></div>
    <div class="relative bg-white rounded-t-[28px] px-5 pt-3 pb-8 sube">
      <div class="mx-auto mb-4 w-8 h-1 rounded-full bg-black/25"></div>${cont}</div>`;
  refrescarBoton();
}
function refrescarBoton(){
  const b = $('#btnQuitar'); if (!b) return;
  const ok = /^\d{6}$/.test(CLAVE) && PASO!=='limite';
  b.disabled = !ok; b.className = 'btn-quac text-white ' + (ok?'bg-quac':'bg-quac/40');
  b.textContent = 'Sí, quitar teléfono';
}
function quitar(){
  if (!/^\d{6}$/.test(CLAVE)) return;
  PASO='quitando'; pintarHoja();
  setTimeout(()=>{
    if (QUITAR==='ok'){ PASO='exito'; }
    else if (QUITAR==='incorrecta'){ INTENTOS=Math.max(INTENTOS-1,0); PASO = INTENTOS===0 ? 'limite' : 'incorrecta'; CLAVE=''; }
    else if (QUITAR==='limite'){ PASO='limite'; CLAVE=''; }
    else { PASO='falla'; }
    pintarHoja();
  }, 1100);
}
function cerrarHoja(quitado){
  if (quitado && OBJ) QUITADOS.push(OBJ.id);
  OBJ=null; pintarHoja(); render();
  if (quitado) toast('La lista ya no muestra el teléfono quitado');
}

/* ═════════ D · Lo que ve el teléfono quitado ═════════ */
function pintarQuitado(){
  const login = `<div class="px-6 pt-10 fade">
      <span class="font-display font-extrabold text-quac text-[34px] tracking-tight">quac</span>
      <p class="mt-8 font-display font-bold text-[24px] text-quacdark leading-tight">Ingresa a tu cuenta</p>
      <div class="mt-6 h-[52px] rounded-[10px] border border-borde bg-white flex items-center px-4 text-[16px] text-muted">Número de documento</div>
      <div class="mt-4 h-[52px] rounded-[10px] border border-borde bg-white flex items-center px-4 text-[16px] text-muted">Contraseña</div>
      <button class="btn-quac bg-quac text-white mt-6">Ingresar</button>
    </div>`;
  if (VARIANTE_D==='A') return login;
  return login + `<div class="absolute inset-0 z-30 flex items-center justify-center px-7">
      <div class="absolute inset-0 bg-black/40"></div>
      <div class="relative bg-white rounded-[20px] px-5 pt-8 pb-5 text-center fade">
        <div class="w-16 h-16 mx-auto rounded-full bg-lavender text-quacdark flex items-center justify-center">${svg('movil',30,2.2)}</div>
        <p class="mt-4 font-display font-bold text-[19px] leading-tight text-quacdark">Este teléfono ya no está autorizado</p>
        <p class="mt-2 text-[13.5px] leading-[1.5] text-txt">Se quitó de tu cuenta QUAC desde otro teléfono. Si fuiste tú, no tienes que hacer nada. Si quieres volver a usarlo, ingresa y autorízalo con un código.</p>
        <button onclick="toast('Cierra el aviso; queda el login')" class="btn-quac bg-quac text-white mt-6">Entendido</button>
      </div></div>`;
}

/* ═════════ E · Correos (D7 y D17) ═════════ */
function correo(asunto, cuerpo){ return `<div class="bg-white rounded-xl shadow-sm overflow-hidden max-w-[620px] fade">
    <div class="px-5 py-3 border-b text-[12px] text-slate-500 space-y-0.5"><p><b class="text-slate-700">De:</b> QUAC &lt;no-responder@quac.co&gt;</p><p><b class="text-slate-700">Para:</b> an***@gmail.com</p><p><b class="text-slate-700">Asunto:</b> ${asunto}</p></div>
    <div class="px-8 py-7"><img src="https://cdn.baguer.co/quac/logo-quac-morado.png" width="91" height="36" alt="QUAC" style="display:block">${cuerpo}
    <p class="mt-6 text-[12px] text-muted">Este correo se envía automáticamente. No respondas a esta dirección.</p></div></div>`; }
function pintarCorreos(){
  const tabla = filas => `<table class="mt-4 text-[14px]">${filas.map(([k,v])=>`<tr><td class="pr-6 py-1 text-muted">${k}</td><td class="py-1 font-semibold text-txt">${v}</td></tr>`).join('')}</table>`;
  $('#correos').innerHTML =
    correo('Quitaste un teléfono de tu cuenta QUAC', `
      <p class="mt-5 font-display font-bold text-[20px] text-quacdark">Quitaste un teléfono de tu cuenta</p>
      <p class="mt-3 text-[14px] text-txt leading-relaxed">Hola, Ana María. Desde tu ${TODOS[0].nombre} quitaste este teléfono de tu cuenta QUAC:</p>
      ${tabla([['Teléfono', TODOS[1].nombre],['Fecha y hora','20 oct 2026 · 9:44 a. m.']])}
      <p class="mt-4 text-[14px] text-txt leading-relaxed">Si no fuiste tú, cambia tu contraseña en la app (Más › Cambiar contraseña) o comunícate con nosotros.</p>`)
  + correo('Intentaron quitar un teléfono de tu cuenta QUAC', `
      <p class="mt-5 font-display font-bold text-[20px] text-quacdark">Intentaron quitar un teléfono de tu cuenta</p>
      <p class="mt-3 text-[14px] text-txt leading-relaxed">Hola, Ana María. Desde un teléfono con tu sesión abierta escribieron mal tu contraseña 5 veces al intentar quitar otro teléfono de tu cuenta.</p>
      ${tabla([['Desde', TODOS[1].nombre],['Fecha y hora','20 oct 2026 · 9:46 a. m.']])}
      <p class="mt-4 text-[14px] text-txt leading-relaxed">Si no fuiste tú, entra a la app, quita ese teléfono en Más › Mis dispositivos y cambia tu contraseña.</p>`);
}

/* ═════════ Panel lateral por pestaña ═════════ */
const PANEL = {
  A:{ tag:'Pantalla A · SCR-058 tab Más · app-quac-v2', tit:'«Mis dispositivos» entra en la sección SEGURIDAD',
      sub:'El menú sigue saliendo de <code>GET /v2/mas/menu</code>: el ítem se publica con <code>tipo = native</code> y <code>destino = mis_dispositivos</code>. La app conoce la ruta nueva <code>/mas/dispositivos</code> desde esta versión.',
      ctl:()=>`<p class="font-semibold text-quac">Toca «Mis dispositivos» en el teléfono</p><p class="text-[11px] text-slate-500">Abre la pantalla B.</p>`,
      reg:['La pantalla se suma a la lista fija de destinos de get-web (<code>config/quac_menu_app.php</code>) y el ítem se crea desde get-web › QUAC › Menú de la app, en la sección SEGURIDAD. No hay vista nueva en get-web (D14).','Una app sin AQ-012 no conoce el destino y no pinta el ítem (mismo patrón que AQ-007.6).'] },
  B:{ tag:'Pantalla B · ruta /mas/dispositivos · fuera del shell', tit:'Lista de los teléfonos autorizados hoy',
      sub:'<code>GET /v2/dispositivos</code>. Solo los que cumplen la regla del login de la v2: verificado, menos de 90 días y formato válido (D4). «Este teléfono» se reconoce por <code>X-Device-Id</code>.',
      ctl:()=>`<p class="font-semibold text-quac">Estado de la pantalla</p><div class="grid grid-cols-2 gap-1">
        ${[['varios','1 · Tres teléfonos'],['solo','2 · Solo este teléfono'],['carga','3 · Cargando'],['error','4 · Falla de carga']].map(([k,l])=>`<button onclick="LISTA='${k}';QUITADOS=[];render()" class="nl px-2 py-1.5 rounded-lg border text-[11px] font-bold text-left ${LISTA===k?'on':'off'}">${l}</button>`).join('')}</div>`,
      reg:['<b>Nombre</b> (D6): sistema + modelo técnico si AQ-008/AQ-009 lo guardaron; si no, «Teléfono Android» o «iPhone».','<b>Autorizado</b>: <code>devices.device_token_verified_date</code>, con fecha y hora.','<b>Último ingreso</b> (D8): último registro en <code>log_accesos</code> de ese <code>device_id</code>. Desde este REQ la v2 también escribe ahí. Sin registro: «Sin ingresos registrados».','<b>Última compra</b> (D9): la última solicitud aprobada cuyo aviso se abrió desde ese teléfono (<code>user_notification_devices</code>). Si no hay ninguna anotada, la línea no aparece: nunca se infiere.','<b>Orden</b>: «Este teléfono» primero; los demás por último ingreso, del más reciente al más viejo.','«Este teléfono» no tiene botón de quitar (D1); para salir está «Cerrar sesión».','La ayuda «¿No reconoces un teléfono?» solo aparece cuando hay otros teléfonos en la lista; con solo este teléfono se muestra «Tu cuenta solo está autorizada en este teléfono.»'] },
  C:{ tag:'Pantalla C · hoja inferior sobre la pantalla B', tit:'Quitar un teléfono pide la contraseña de 6 números',
      sub:'<code>POST /v2/dispositivos/{id}/quitar</code> con <code>{password}</code>. Mismo patrón visual que <code>CerrarSesionSheet</code> y el campo de <code>QuacPasswordField</code> de SCR-052.',
      ctl:()=>`<p class="font-semibold text-quac">Resultado al tocar «Sí, quitar teléfono»</p><div class="grid grid-cols-2 gap-1">
        ${[['ok','1 · Se quita (200)'],['incorrecta','2 · Contraseña incorrecta (803)'],['limite','3 · Sin intentos (802)'],['falla','4 · Falla de red o 5xx']].map(([k,l])=>`<button onclick="QUITAR='${k}';INTENTOS=5;render()" class="nq px-2 py-1.5 rounded-lg border text-[11px] font-bold text-left ${QUITAR===k?'on':'off'}">${l}</button>`).join('')}</div>
        <button onclick="abrirQuitar('b2')" class="w-full mt-1 px-2 py-1.5 rounded-lg border text-[11px] font-bold off">Abrir la hoja para el Samsung</button>
        <p class="text-[11px] text-slate-400">Escribe 6 números en el campo y toca el botón.</p>`,
      reg:['<b>Al quitar</b> (D12): <code>device_token_verified = 0</code>, <code>device_id_onesignal = NULL</code>, Face ID apagado y se revocan los tokens <code>app-quac-v2:{device_id}</code> de ese teléfono (D10). <code>status</code> no se toca.','<b>Intentos</b> (D16): 5 cada 15 minutos, contador propio por documento. Agotados: 802 y el campo queda deshabilitado. Al quinto fallo se envía el correo de intento fallido (D17).','<b>Correo</b> (D7): al quitar con éxito, ver pestaña E.','Mientras se quita, «Cancelar» y el gesto atrás no responden (<code>PopScope(canPop: false)</code>, como CerrarSesionSheet).','Quitar el teléfono actual no es posible: la API responde 422 si el <code>{id}</code> es el de <code>X-Device-Id</code>.'] },
  D:{ tag:'Pantalla D · el Samsung quitado, en su próxima petición', tit:'Qué ve el teléfono que se quitó',
      sub:'Su token ya está revocado: la próxima petición responde 401 y la app lo lleva al login. Para entrar tendrá que autorizar el teléfono otra vez (AQ-009).',
      ctl:()=>`<p class="font-semibold text-quac">Variante (decisión abierta)</p><div class="grid grid-cols-1 gap-1">
        <button onclick="VARIANTE_D='A';render()" class="px-2 py-1.5 rounded-lg border text-[11px] font-bold text-left ${VARIANTE_D==='A'?'on':'off'}">A · Solo el login, como una sesión vencida</button>
        <button onclick="VARIANTE_D='B';render()" class="px-2 py-1.5 rounded-lg border text-[11px] font-bold text-left ${VARIANTE_D==='B'?'on':'off'}">B · Login con el aviso «ya no está autorizado»</button></div>`,
      reg:['<b>A</b>: no cambia nada en la app; el 401 actual ya manda al login. El cliente no sabe por qué salió.','<b>B</b>: la API responde 401 con un escenario propio para tokens revocados por «quitar»; la app muestra el aviso una vez sobre el login. Suma un código de error en los dos repos.','El texto de B no dice desde qué teléfono se quitó: quien tiene el teléfono quitado puede no ser el dueño.'] },
  E:{ tag:'Pantalla E · correos al cliente', tit:'Aviso al quitar un teléfono y aviso al agotar los intentos',
      sub:'Los dos salen por un job propio de AQ-012, con el mismo canal de correo y el enmascarado de AQ-009. Correo enmascarado en pantalla; completo solo en el envío.',
      ctl:()=>`<p class="font-semibold text-quac">Dos correos</p><p class="text-[11px] text-slate-500">Arriba, el de D7 (teléfono quitado). Abajo, el de D17 (intentos agotados).</p>`,
      reg:['Logo: <code>https://cdn.baguer.co/quac/logo-quac-morado.png</code> (91 × 36), el mismo de los correos de QUAC en api-crontab; en PNG porque Gmail y Outlook no muestran SVG.','Plantillas Blade en api-quac-v2, como las de AQ-009 (<code>resources/views/emails/</code>).','Fecha y hora en hora de Colombia.','El nombre del teléfono es el mismo de la pantalla B (D6).'] },
};
function panel(){
  const p = PANEL[TAB];
  $('#pTag').innerHTML=p.tag; $('#pTit').innerHTML=p.tit; $('#pSub').innerHTML=p.sub;
  $('#pCtl').innerHTML=p.ctl();
  $('#pReg').innerHTML=`<p class="font-semibold text-slate-700 text-sm">Reglas que el mockup fija</p>`+p.reg.map(r=>`<p>· ${r}</p>`).join('')
    + `<p class="pt-2 mt-2 border-t font-semibold text-slate-700 text-sm">Fuera de este mockup</p><p>· Una vista de soporte en get-web (D14). · Cerrar la sesión de la app vieja en el teléfono quitado (D13). · Rechazar tokens usados desde otro teléfono (D11).</p>`;
}

/* ═════════ Capa de avisos del teléfono ═════════ */
function toast(t){ const c=$('#capa'); c.className='absolute inset-x-0 bottom-24 flex justify-center z-40 pointer-events-none'; c.innerHTML=`<div class="bg-txt text-white text-[12px] px-4 py-2.5 rounded-full shadow-lg fade">${t}</div>`; clearTimeout(toast.t); toast.t=setTimeout(()=>c.className='hidden',2200); }

/* ═════════ Render general ═════════ */
function irTab(t){ TAB=t; if (t!=='C'){ OBJ=null; } render(); if (t==='C' && !OBJ) abrirQuitar('b2'); window.scrollTo({top:0}); }
function render(){
  document.querySelectorAll('.nt').forEach(b=>{ b.classList.remove('tab-on','tab-off'); b.classList.add(b.dataset.t===TAB?'tab-on':'tab-off'); });
  panel();
  const esCorreo = TAB==='E';
  $('#telefono').classList.toggle('hidden', esCorreo);
  $('#correos').classList.toggle('hidden', !esCorreo);
  if (esCorreo){ pintarCorreos(); return; }
  if (TAB==='A'){
    $('#statusbar').className='shrink-0 h-11 px-7 flex items-center justify-between text-[13px] font-semibold text-txt bg-white';
    $('#appHeader').innerHTML=headerMas(); $('#appNav').innerHTML=navMas(); $('#scroll').innerHTML=pintarMas();
  } else {
    $('#statusbar').className='shrink-0 h-11 px-7 flex items-center justify-between text-[13px] font-semibold text-txt bg-fondo';
    $('#appHeader').innerHTML=''; $('#appNav').innerHTML=sinShell();
    $('#scroll').innerHTML = TAB==='D' ? pintarQuitado() : pintarLista();
    $('#scroll').classList.toggle('relative', TAB==='D');
  }
  if (TAB!=='C' && !OBJ) pintarHoja();
}
document.querySelectorAll('.nt').forEach(b=>b.onclick=()=>irTab(b.dataset.t));
/* #A…#E en la URL abre esa pestaña */
irTab(PANEL[location.hash.slice(1)] ? location.hash.slice(1) : 'A');
</script>
