<style>
  body { font-family:'Nunito Sans', sans-serif; }
  .fade { animation: fade .22s ease-out; } @keyframes fade { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
  .sube { animation: sube .26s cubic-bezier(.16,1,.3,1); } @keyframes sube { from{transform:translateY(100%)} to{transform:none} }

  .nav-i { display:block; width:100%; text-align:left; padding:8px 10px; border-radius:8px; font-size:12.5px; font-weight:600; color:#334155; }

        <div id="tel" class="relative w-full h-full rounded-[36px] overflow-hidden bg-fondo"></div>
      </div>
      <p class="text-center text-[11px] text-gray-500 mt-2">390 × 844 · app 4.1.0</p>
    </div>
    <div id="lado" class="flex-1 max-w-[560px] space-y-3"></div>

<script>
const S = { sw:'on', variante:'B', est:'abierta', sel:null };
const HOT = 'martha.ruiz@hotmail.com', OUT = 'martha.r@outlook.com';
const ESTADOS_ON = [
  ['abierta','Sin alterno: hoja abierta','el cliente escribe el correo'],
  ['enviando','Enviando','espera la respuesta'],
  ['enviado','Código enviado','vuelve a la pantalla del código'],
  ['retoma','Reenviar o volver a entrar','sigue en el alterno'],
  ['elegir','Con alterno: elegir correo','principal, alterno u otro'],
  ['otro','Escribe otro correo','reemplaza al alterno'],
  ['alprincipal','Elige el principal','el código vuelve a gmail'],
  ['guardado','Otro día, teléfono nuevo','alterno guardado, enmascarado'],
  ['sincambios','2 cambios usados','ya no hay «Otro correo»'],
  ['mismo','Mismo correo del sistema','compara como hoy'],
  ['enuso','Correo de otra cédula','rechazado, Portal'],
  ['formato','Correo mal escrito','se corrige en la hoja'],
  ['agotado','5 intentos usados','solo el Portal'],
  ['cupo','6 códigos en 30 min','aviso del flujo, como hoy'],
];
const ESTADOS_OFF = [
  ['abierta','Hoja abierta','como hoy'],
  ['mismo','Coincide','como hoy'],
  ['nocoincide','No coincide','como hoy, Portal'],
  ['agotado','5 intentos usados','como hoy'],
];
const P = '<span style="color:#A19EB5">';

function pantallaCodigo({destino, nuevo, cont}) {
  return `<div class="bg-register h-full px-5 pb-8 pt-11 fade">
    <div class="h-[26px]"></div>
    <div class="flex justify-center"><div class="w-[150px] h-[150px] rounded-full bg-lavender flex items-center justify-center">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#7633FF" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></div></div>
    <div class="h-2"></div>
    <p class="h1-app">Validar identidad</p>
    <div class="mt-3.5 flex items-center gap-2 text-[12px] font-bold">
      <span class="flex items-center gap-1.5 text-txt"><span class="w-5 h-5 rounded-full bg-aldia text-white flex items-center justify-center text-[11px]">✓</span>Celular</span>
      <span class="w-6 h-px bg-aldia"></span>
      <span class="flex items-center gap-1.5 text-quac"><span class="w-5 h-5 rounded-full bg-quac text-white flex items-center justify-center text-[11px]">2</span>Correo</span>
    </div>
    <div class="h-5"></div>
    <p class="body-app ${nuevo?'cambia':''}">Te enviamos un código a <b>${destino}</b>. Una vez lo recibas, ingrésalo.</p>
    ${nuevo ? `<p class="link-app mt-2 cambia" style="font-size:14px">Te enviamos el código a tu correo alterno</p>` : ''}
    <div class="h-5"></div>
    <p class="text-[16px] font-bold text-txt">Ingresa el código de verificación</p>
    <div class="h-3"></div>
    <div class="flex gap-2">${['','','','','',''].map(()=>'<div class="otp"></div>').join('')}</div>
    <div class="h-5"></div>
    <p class="text-center text-[14px]">¿No recibiste el código? Revisa también la carpeta de spam.</p>
    <p class="mt-1 text-center text-[14px] font-bold">Podrás reenviar el código en ${cont || (nuevo?'00:59':'00:47')}</p>
    <div class="text-center mt-1.5"><span class="link-app inline-block px-3 py-2 cursor-pointer" onclick="ir('abierta')">¿No reconoces este correo?</span></div>
    <div class="h-5"></div>
    <div class="btn-quac btn-disabled">Continuar</div>
  </div>`;
}

const campo = (v, err) => `<div class="campo ${err?'err':''}"><span class="et">Tu correo</span><span>${v||P+'nombre@correo.com</span>'}</span></div>`;
const hoja = (cuerpo) => `<div class="scrim"><div class="sheet sube"><div class="handle"></div><p class="h3-app">¿No reconoces este correo?</p>${cuerpo}</div></div>`;

function formulario(valor, {cargando=false, err=''}={}) {
  const on = S.sw==='on', B = on && S.variante==='B';
  const intro = B ? 'Escribe el correo donde quieres recibir el código' : 'Escribe tu correo y te decimos si es el que tenemos';
  const rotulo = B ? 'Enviar código' : 'Comparar';
  const sig = on ? 'enviando' : 'nocoincide';
  return `<p class="text-[14px] mt-3 ${B?'cambia':''}">${intro}</p>
    <div class="mt-5">${campo(valor, !!err)}</div>
    ${err ? `<p class="text-[12px] text-err mt-1.5 ml-3.5 cambia">${err}</p>` : ''}
    <div class="mt-5"><div class="sbtn ${B?'cambia':''}" onclick="ir('${sig}')">${cargando ? '<svg class="spin" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M12 3a9 9 0 1 0 9 9"/></svg>' : rotulo}</div></div>`;
}
function respuesta(msg, botones) {
  return `<p class="text-[14px] mt-3">${msg}</p><div class="mt-6 space-y-1">${botones}</div>`;
}
const bPortal = `<div class="sbtn">Ir al Portal Actualización de datos</div>`;
const bCerrar = `<div class="sbtn2" onclick="ir('cerrada')">Cerrar</div>`;
const bEntendido = `<div class="sbtn" onclick="ir('cerrada')">Entendido</div>`;

const op = (k, rot, correo, {aqui=false, extra=''}={}) => `<div class="op ${S.sel===k?'sel':''}" onclick="S.sel='${k}';ir(S.est==='otro'&&'${k}'!=='otro'?'elegir':('${k}'==='otro'&&S.est==='elegir'?'otro':S.est))"><span class="r"></span><span><small>${rot}</small>${correo}</span>${aqui?'<span class="aqui">código enviado aquí</span>':''}${extra}</div>`;
function hojaElegir({alterno, restantes, destino}) {
  const quedan = restantes===1 ? 'te queda 1 cambio' : `te quedan ${restantes} cambios`;
  const escribe = S.sel==='otro';
  const filaOtro = restantes<=0 ? '' : escribe
    ? op('otro', 'Otro correo · ' + quedan, 'Escribe tu nuevo correo alterno', {extra:
        `<div style="flex-basis:100%" onclick="event.stopPropagation()">
           <div class="campo mt-1" style="border-color:#7633FF"><span class="et" style="background:#F6F2FF;color:#7633FF">Nuevo correo alterno</span>
             <input type="email" value="${OUT}" placeholder="nombre@correo.com" style="width:100%;outline:none;background:transparent;font-size:16px"></div>
           <p class="text-[12px] mt-1.5" style="color:#6b6880">Reemplaza a ${alterno} cuando valides el código.</p>
         </div>`})
    : op('otro', 'Otro correo · ' + quedan, '<span style="color:#A19EB5">Toca para escribir otro correo</span>');
  return hoja(`<p class="text-[14px] mt-3 cambia">¿A cuál correo te enviamos el código?</p>
    <div class="mt-4 space-y-2 cambia">
      ${op('pri', 'Correo principal', 'ma•••@gmail.com', {aqui:destino==='pri'})}
      ${op('alt', 'Correo alterno', alterno, {aqui:destino==='alt'})}
      ${filaOtro}
    </div>
    <div class="mt-5"><div class="sbtn ${S.sel?'':'off2'}" onclick="ir(S.sel==='pri'?'alprincipal':'enviado')">Enviar código</div></div>
    ${restantes>0 ? '' : `<p class="text-[13px] mt-4 text-center cambia">Ya no puedes cambiar tu correo alterno. Para cambiar tu correo principal, entra al <span class="link-app" style="font-size:13px">Portal Actualización de datos</span>.</p>`}
    <div class="sbtn2" onclick="ir('cerrada')">Cerrar</div>`);
}

const PASO = {
  abierta: `{
  "correo_oculto": "ma•••@gmail.com",
  "acepta_correo_alterno": true,
  "correo_principal_oculto": "ma•••@gmail.com",
  "correo_alterno": null,
  "correo_destino": "principal",
  "cambios_restantes": 2,
  "portal_url": "https://clientes.quac.co"
}`,
  elegir: `{
  "correo_oculto": "martha.ruiz@hotmail.com",
  "acepta_correo_alterno": true,
  "correo_principal_oculto": "ma•••@gmail.com",
  "correo_alterno": "martha.ruiz@hotmail.com",
  "correo_destino": "alterno",
  "cambios_restantes": 2,
  "portal_url": "https://clientes.quac.co"
}`,
  guardado: `{
  "correo_oculto": "ma•••@gmail.com",
  "acepta_correo_alterno": true,
  "correo_principal_oculto": "ma•••@gmail.com",
  "correo_alterno": "ma•••@hotmail.com",
  "correo_destino": "principal",
  "cambios_restantes": 1,
  "portal_url": "https://clientes.quac.co"
}`,
  sincambios: `{
  "correo_oculto": "ma•••@gmail.com",
  "acepta_correo_alterno": true,
  "correo_principal_oculto": "ma•••@gmail.com",
  "correo_alterno": "ma•••@outlook.com",
  "correo_destino": "principal",
  "cambios_restantes": 0,
  "portal_url": "https://clientes.quac.co"
}`,
};
PASO.retoma = PASO.elegir; PASO.otro = PASO.elegir;

const API = {
  abierta: null,
  enviando: null,
  enviado: `{
  "coincide": false,
  "codigo_enviado": true,
  "correo_nuevo": true,
  "correo_destino": "alterno",
  "correo_oculto": "martha.ruiz@hotmail.com",
  "cambios_restantes": 2,
  "mensaje": "Te enviamos el código a tu correo alterno",
  "intentos_restantes": 4
}`,
  retoma: null,
  elegir: null,
  otro: `La app envía { "correo": "martha.r@outlook.com" } y recibe:
{
  "coincide": false,
  "codigo_enviado": true,
  "correo_nuevo": true,
  "correo_destino": "alterno",
  "correo_oculto": "martha.r@outlook.com",
  "cambios_restantes": 2,
  "mensaje": "Te enviamos el código a tu correo alterno",
  "intentos_restantes": 3
}`,
  alprincipal: `La app envía { "destino": "principal" } y recibe:
{
  "coincide": null,
  "codigo_enviado": true,
  "correo_nuevo": false,
  "correo_destino": "principal",
  "correo_oculto": "ma•••@gmail.com",
  "mensaje": "Te enviamos el código a tu correo principal",
  "intentos_restantes": 3
}`,
  guardado: `Si elige el alterno, la app envía { "destino": "alterno" } y recibe:
{
  "coincide": null,
  "codigo_enviado": true,
  "correo_nuevo": false,
  "correo_destino": "alterno",
  "correo_oculto": "ma•••@hotmail.com",
  "mensaje": "Te enviamos el código a tu correo alterno",
  "intentos_restantes": 4
}`,
  sincambios: `Si una app envía un correo nuevo con los cambios agotados:
{
  "coincide": false,
  "sin_cambios": true,
  "mensaje": "Ya no puedes cambiar tu correo alterno.",
  "intentos_restantes": 4
}`,
  mismo: `{
  "coincide": true,
  "mensaje": "Es el correo que tenemos. Revisa spam o promociones y toca Reenviar.",
  "intentos_restantes": 4
}`,
  enuso: `{
  "coincide": false,
  "correo_en_uso": true,
  "mensaje": "Este correo ya está registrado con otra cédula. Escribe otro o actualiza tus datos en el Portal Actualización de datos.",
  "intentos_restantes": 4,
  "portal_url": "https://clientes.quac.co"
}`,
  formato: `{
  "coincide": false,
  "correo_invalido": true,
  "mensaje": "Revisa el correo: debe verse como nombre@correo.com",
  "intentos_restantes": 5
}`,
  agotado: `{
  "coincide": null,
  "agotado": true,
  "mensaje": "Ya usaste los 5 intentos. Actualiza tu correo en el Portal Actualización de datos.",
  "portal_url": "https://clientes.quac.co"
}`,
  cupo: `Error 802, el mismo de hoy:
  canal "correo", minutos que faltan 18.
La hoja se cierra y la pantalla muestra el aviso del flujo.`,
  nocoincide: `{
  "coincide": false,
  "mensaje": "No es el correo que tenemos. Actualízalo en el Portal Actualización de datos; si ya lo hiciste, toca Reenviar.",
  "intentos_restantes": 4,
  "portal_url": "https://clientes.quac.co"
}`,
};

const QUE = {
  abierta: () => S.sw==='on'
    ? (S.variante==='B'
      ? 'La hoja dice desde el principio que el código va al correo escrito, y el botón dice «Enviar código». El api avisa que el interruptor está encendido en el paso del correo (<code>acepta_correo_alterno: true</code>).'
      : 'La hoja es igual que hoy. El cliente cree que va a comparar, y la respuesta le dice que el código salió al correo escrito.')
    : 'Igual que hoy: compara y no envía nada. También pasa esto si el cliente tiene riesgo y la variable <code>_RIESGO</code> está vacía.',
  enviando: () => 'El api valida el formato y que el correo no sea de otra cédula, gasta una comparación y uno de los 6 códigos, anula el código anterior y envía uno nuevo. Deja dos sucesos con el correo enmascarado: «el cliente agregó un correo nuevo» y «código enviado al correo alterno».',
  retoma: () => 'Mientras el intento siga vivo (24 horas en el registro, 60 minutos en la autorización), «Reenviar» y volver a entrar a la app siguen en el correo elegido. La pantalla muestra el alterno y el código que llegó ahí sigue valiendo. Un intento nuevo empieza otra vez en el principal.',
  elegir: () => 'Cuando ya hay un alterno (escrito en este intento o guardado en la cuenta), la hoja deja elegir. La fila del correo que tiene el código vigente lleva «código enviado aquí». Ninguna fila viene marcada: el botón se enciende al tocar una. Elegir no gasta cambio. Toca «Otro correo» para ver cómo se escribe.',
  otro: () => 'Al tocar «Otro correo» se abre el campo dentro de la fila. El correo escrito reemplaza al alterno solo cuando se valida su código; ahí se gasta el cambio. Un error de dedo no gasta cambio: lo frenan los 5 intentos y los 6 códigos de hoy.',
  alprincipal: () => 'Martha eligió «Correo principal» en la hoja: el código vuelve a gmail, el del alterno deja de valer y la pantalla ya no muestra el aviso del alterno. No se borra nada: el alterno escrito sigue disponible en la hoja.',
  guardado: () => 'Un mes después, en un teléfono nuevo. El código sale primero al principal, como siempre. La hoja ofrece el alterno que quedó guardado en la cuenta, enmascarado porque no se escribió en este intento. Elegirlo no gasta cambio. Le queda 1 de los 2 cambios.',
  sincambios: () => 'La cuenta ya validó 2 alternos (hotmail y luego outlook). Desaparece «Otro correo» en cualquier teléfono. Sigue pudiendo elegir entre el principal y el alterno. El Portal solo sirve para cambiar el correo principal.',
  enviado: () => 'La hoja se cierra sola. La pantalla del código muestra el correo alterno completo (Martha lo acaba de escribir), el texto «Te enviamos el código a tu correo alterno» y el contador de reenvío desde cero. Cuando valida el código, el correo queda como alterno de la cuenta y se gasta 1 de los 2 cambios; el principal y el CRM no cambian. En el registro, el alterno viaja al CRM en el atributo nuevo <code>correo_alterno</code> (comentado por ahora).',
  mismo: () => 'Escribió ma•••@gmail.com, que es el que ya está: compara como hoy, sin guardar un alterno ni crear un suceso nuevo, y el código ya enviado sigue valiendo.',
  enuso: () => 'El correo ya es el principal, el del CRM o el alterno de otra cédula: no se envía nada y queda un suceso. La app no cambia: muestra el mensaje, el Portal y «Cerrar». Para probar otro correo, el cliente vuelve a abrir la hoja.',
  formato: () => 'El api valida el formato como hoy (sin DNS). El mensaje se muestra debajo del campo y la hoja sigue abierta para corregirlo. No gasta comparación.',
  agotado: () => 'Igual que hoy: con las 5 comparaciones usadas en el intento, solo queda el botón del Portal.',
  cupo: () => 'Igual que hoy: ese teléfono ya pidió 6 códigos al correo en 30 min. La hoja se cierra y la pantalla muestra el aviso de espera del flujo. No hay tope nuevo.',
  nocoincide: () => 'Igual que hoy.',
};

function telefono() {
  const e = S.est, on = S.sw==='on';
  const enAlterno = ['enviado','retoma','elegir','otro'].includes(e);
  const base = enAlterno ? pantallaCodigo({destino:HOT, nuevo:true, cont: e==='retoma'?'00:00':null}) : pantallaCodigo({destino:'ma•••@gmail.com', nuevo:false});
  let capa = '';
  if (e==='abierta') capa = hoja(formulario(on ? 'martha.ruiz@hotmail.com' : 'martha.ruiz@hotmail.com'));
  if (e==='elegir' || e==='otro') { if (e==='otro') S.sel='otro'; capa = hojaElegir({alterno:HOT, restantes:2, destino:'alt'}); }
  if (e==='guardado') capa = hojaElegir({alterno:'ma•••@hotmail.com', restantes:1, destino:'pri'});
  if (e==='sincambios') { if (S.sel==='otro') S.sel=null; capa = hojaElegir({alterno:'ma•••@outlook.com', restantes:0, destino:'pri'}); }
  if (e==='enviando') capa = hoja(formulario('martha.ruiz@hotmail.com', {cargando:true}));
  if (e==='mismo') capa = hoja(respuesta('Es el correo que tenemos. Revisa spam o promociones y toca Reenviar.', bEntendido));
  if (e==='enuso') capa = hoja(respuesta('Este correo ya está registrado con otra cédula. Escribe otro o actualiza tus datos en el Portal Actualización de datos.', bPortal + bCerrar));
  if (e==='formato') capa = hoja(formulario('martha.ruiz@hotmail', {err:'Revisa el correo: debe verse como nombre@correo.com'}));
  if (e==='agotado') capa = hoja(respuesta('Ya usaste los 5 intentos. Actualiza tu correo en el Portal Actualización de datos.', bPortal));
  if (e==='nocoincide') capa = hoja(respuesta('No es el correo que tenemos. Actualízalo en el Portal Actualización de datos; si ya lo hiciste, toca Reenviar.', bPortal + bCerrar));
  if (e==='cupo') capa = `<div class="velo"><div class="bg-white rounded-[20px] p-6 w-full">
      <p class="h3-app">Espera un momento</p>
      <p class="text-[14px] mt-3">Ya enviamos varios códigos al correo desde este teléfono. Podrás pedir otro en 18 minutos.</p>
      <div class="mt-6"><div class="sbtn" onclick="ir('cerrada')">Cerrar</div></div></div></div>`;
  return base + capa;
}

function lado() {
  const e = S.est;
  const api = API[e];
  return `<div class="bg-white rounded-xl border border-gray-200 p-4">
      <p class="text-[11px] font-bold uppercase text-gray-500">Qué pasa</p>
      <p class="text-[14px] mt-1.5 leading-relaxed">${(QUE[e]||(()=>'—'))()}</p></div>
    ${api ? `<div class="bg-white rounded-xl border border-gray-200 p-4">
      <p class="text-[11px] font-bold uppercase text-gray-500">Qué responde el api al comparar</p>
      <pre class="text-[12px] mt-2 bg-gray-50 rounded-lg p-3 font-mono text-gray-800">${api}</pre></div>` : ''}
    ${S.sw==='on' && PASO[e] ? `<div class="bg-white rounded-xl border border-gray-200 p-4">
      <p class="text-[11px] font-bold uppercase text-gray-500">Qué manda el api en el paso del correo</p>
      <pre class="text-[12px] mt-2 bg-gray-50 rounded-lg p-3 font-mono text-gray-800">${PASO[e]}</pre></div>` : ''}
    <div class="bg-white rounded-xl border border-gray-200 p-4">
      <p class="text-[11px] font-bold uppercase text-gray-500">Los 2 cambios de la cuenta</p>
      <table class="w-full text-[12.5px] mt-2">
        <tr class="text-gray-500 text-left"><th class="py-1">Qué hace Martha</th><th>Alterno guardado</th><th>Le quedan</th></tr>
        <tr class="border-t"><td class="py-1.5">Escribe hotmail y no valida</td><td>ninguno</td><td>2</td></tr>
        <tr class="border-t"><td class="py-1.5">Valida el código de hotmail</td><td>hotmail</td><td>1</td></tr>
        <tr class="border-t"><td class="py-1.5">Otro día elige hotmail y valida</td><td>hotmail</td><td>1</td></tr>
        <tr class="border-t"><td class="py-1.5">Escribe outlook y valida</td><td>outlook</td><td>0</td></tr>
      </table></div>
    <div class="bg-white rounded-xl border border-gray-200 p-4">
      <p class="text-[11px] font-bold uppercase text-gray-500">Cuándo sale cada camino</p>
      <table class="w-full text-[12.5px] mt-2">
        <tr class="text-gray-500 text-left"><th class="py-1">Interruptor</th><th>Riesgo</th><th>Escribe</th><th>Resultado</th></tr>
        <tr class="border-t"><td class="py-1.5">vacío</td><td>—</td><td>hotmail</td><td>compara como hoy</td></tr>
        <tr class="border-t"><td class="py-1.5">si</td><td>no</td><td>hotmail</td><td><span class="px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-700 font-bold">código al alterno</span></td></tr>
        <tr class="border-t"><td class="py-1.5">si</td><td>no</td><td>gmail (el mismo)</td><td>coincide, como hoy</td></tr>
        <tr class="border-t"><td class="py-1.5">si</td><td>sí, <code>_RIESGO</code> vacía</td><td>hotmail</td><td>compara como hoy</td></tr>
        <tr class="border-t"><td class="py-1.5">si</td><td>sí, <code>_RIESGO</code> = si</td><td>hotmail</td><td><span class="px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-700 font-bold">código al alterno</span></td></tr>
        <tr class="border-t"><td class="py-1.5">si</td><td>—</td><td>correo de otra cédula</td><td><span class="px-1.5 py-0.5 rounded bg-rose-50 text-rose-700 font-bold">rechazado</span></td></tr>
      </table></div>`;
}

function nav() {
  const lista = S.sw==='on' ? ESTADOS_ON : ESTADOS_OFF;
  if (!lista.some(x=>x[0]===S.est) && S.est!=='cerrada') S.est = 'abierta';
  document.getElementById('nav').innerHTML = `<p class="text-[11px] font-bold uppercase text-gray-500 mb-1">Estados</p>` +
    lista.map(([k,t,s])=>`<button class="nav-i ${S.est===k?'on':''}" onclick="ir('${k}')">${t}<small>${s}</small></button>`).join('');
  document.getElementById('sw').innerHTML = [['on','Encendido (si)'],['off','Apagado (vacío)']].map(([k,t])=>`<button class="seg ${S.sw===k?'on':''}" onclick="S.sw='${k}';ir(S.est)">${t}</button>`).join('');
}
function ir(e) { if (e!==S.est && !(e==='otro'||(S.est==='otro'&&e==='elegir'))) S.sel = (e==='otro'?'otro':null); S.est = e; nav(); document.getElementById('tel').innerHTML = telefono(); document.getElementById('lado').innerHTML = lado(); }
ir('abierta');
</script>
</body>
</html>
